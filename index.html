re (rum, cola, lime); Paloma (tequila, grapefruit soda, lime, salt); Moscow Mule (vodka, ½ oz lime, ginger beer, copper mug); Dark 'n' Stormy (Gosling's dark rum + ginger beer + lime, trademarked); Mexican Mule; Kentucky Mule.","Collins: a sour topped with soda. Tom Collins is 2 oz gin, 1 oz lemon, ¾ oz simple, shaken, topped with soda, in a Collins glass. A Vodka Collins uses vodka.","Fizz: like a Collins but served without ice in a smaller glass, often with egg white. Gin Fizz; Ramos Gin Fizz adds cream, egg white and orange flower water, and gets a long shake.","Mojito: 2 oz white rum, 1 oz lime, ¾ oz simple, mint (gently pressed, not shredded), topped with soda over crushed or cracked ice.","Bloody Mary: vodka, tomato juice, lemon, Worcestershire, hot sauce, horseradish, celery salt, pepper. Roll it between tins; don't shake hard. Bloody Maria uses tequila. Michelada uses beer.","Keep the mixer cold, add it last, and stir gently once to keep the bubbles."],"c":[["Highball template?","Spirit + carbonated mixer, built over ice."],["Moscow Mule?","Vodka, lime, ginger beer, copper mug."],["Dark 'n' Stormy?","Gosling's dark rum, ginger beer, lime (trademarked)."],["Paloma?","Tequila, grapefruit soda, lime, pinch of salt."],["Cuba Libre?","Rum, cola, lime."],["Tom Collins spec?","2 oz gin, 1 oz lemon, ¾ oz simple, shaken, top soda, Collins glass."],["Collins vs Fizz?","Collins: tall with ice. Fizz: no ice, smaller glass, often egg white."],["Ramos Gin Fizz extras?","Cream, egg white, orange flower water, long shake."],["Mojito spec?","2 oz white rum, 1 oz lime, ¾ oz simple, mint, soda, crushed ice."],["How to mix a Bloody Mary?","Roll between tins — not a hard shake."]],"q":[["Collins vs. Fizz, correctly:","Fizz: no ice, smaller glass, often egg white; Collins: tall over ice","Fizz is stirred; Collins is shaken","Collins uses egg white; Fizz never does","They're the same drink","Same sour-plus-soda idea, different service."],["A guest wants a Mule but 'not vodka, something with character.' Best call:","A Kentucky Mule (bourbon) or Mexican Mule (tequila)","A Dark 'n' Stormy made with vodka","A Paloma","A Cuba Libre","Swap the base; keep lime and ginger beer."],["What makes a Dark 'n' Stormy a Dark 'n' Stormy?","Gosling's dark rum, ginger beer, lime (it's trademarked)","Any dark rum and cola","Spiced rum and ginger ale","Black rum and tonic","Gosling's holds the trademark on the name."],["A Ramos Gin Fizz needs which extras?","Cream, egg white, orange flower water and a long shake","Raspberry syrup and egg white","Champagne and bitters","Absinthe and cream","Plus both lemon and lime, topped with soda."],["A Japanese-style whisky highball should be:","Very cold, high carbonation, soda added gently","Built over crushed ice and stirred hard","Shaken with soda","Served neat with a soda back","Chilled glass, big clear ice, minimal stirring."],["Spec me a Tom Collins.","2 oz gin · 1 oz lemon · ¾ oz simple · top soda · over ice","2 oz gin · ¾ oz lime · ¾ oz simple · top tonic · over ice","1½ oz gin · ½ oz lemon · ½ oz simple · top Champagne","2 oz vodka · 1 oz lemon · 1 oz simple · no soda","Shaken, strained over ice, topped with soda."],["A Bloody Mary should be mixed by:","Rolling it between tins","A hard shake","Blending","Stirring in a mixing glass with no ice","Rolling chills it without making the tomato foamy."],["A guest wants a refreshing tequila highball, not a Margarita. Best pick:","A Paloma","A Tommy's Margarita","A Tequila Sunrise","A Siesta","Tequila, lime, grapefruit soda, pinch of salt."]],"pro":[["Your G&Ts keep going flat by the time they reach the table.","Carbonation dies from warm mixer, warm glasses, small or wet ice, pouring onto ice violently, and over-stirring. Cold tonic, chilled glass, big ice, pour down a barspoon, one gentle lift.","Keep tonic in the coldest fridge, chill glasses, use Collins spears, pour gently down the spoon, one lift, send."],["A guest asks what a 'fizz' is.","A fizz is a sour lengthened with soda, but served short and without ice, often with egg white. A Collins is the tall, over-ice version.","'It's a sour topped with soda, served short with no ice, often with egg white for foam. A Collins is the tall version over ice.'"],["A guest wants a Bloody Mary 'spicy but not burning.'","Heat comes from hot sauce and horseradish; flavor comes from Worcestershire, celery salt, pepper and lemon. Use horseradish for bright heat that fades fast, less capsaicin.","Build with extra horseradish and black pepper, a modest dash of hot sauce, roll between tins, taste with a straw."]]},{"id":"c6","track":"Cocktails","title":"Sparkling, Tiki & Modern Classics","k":["Sparkling: French 75 is 1 oz gin, ½ oz lemon, ½ oz simple, shaken, topped with Champagne in a flute. Aperol Spritz is 3 oz prosecco, 2 oz Aperol, 1 oz soda (the 3-2-1 rule), with an orange slice. Kir Royale is crème de cassis + Champagne. Mimosa is orange juice + sparkling wine. Bellini is peach purée + prosecco (from Harry's Bar, Venice).","Tiki (1930s onward; Don the Beachcomber, Trader Vic): layered rums, citrus, and spiced or nut syrups.","Mai Tai (credited to Trader Vic, 1944; Don the Beachcomber claimed an earlier, different drink by the same name): 2 oz aged rum, 1 oz lime, ½ oz orange curaçao, ½ oz orgeat, ¼ oz simple. Serve over crushed ice with a mint sprig.","Others: Piña Colada (rum, cream of coconut, pineapple; Puerto Rico, where the Caribe Hilton and Barrachina both claim it), Zombie, Painkiller, Jungle Bird (rum, Campari, pineapple, lime, demerara).","Dessert and cream drinks: White Russian (vodka, coffee liqueur, cream); Black Russian (no cream); Grasshopper (crème de menthe, crème de cacao, cream); Brandy Alexander.","Espresso Martini (Dick Bradsell, London, 1980s): 2 oz vodka, 1 oz fresh espresso, ½ oz coffee liqueur, ¼–½ oz simple. Shake hard for foam, garnish with 3 coffee beans.","Modern classics to know: Paper Plane (equal parts bourbon, Aperol, Amaro Nonino, lemon), Last Word (equal parts gin, green Chartreuse, maraschino, lime), Naked & Famous, Gold Rush, Penicillin, Bramble (gin, lemon, simple, blackberry liqueur drizzle)."],"c":[["French 75?","1 oz gin, ½ lemon, ½ simple, shaken, topped with Champagne, flute."],["Aperol Spritz ratio?","3-2-1: prosecco, Aperol, soda."],["Kir Royale?","Crème de cassis + Champagne."],["Bellini?","Peach purée + prosecco (Harry's Bar, Venice)."],["Mai Tai spec?","2 oz aged rum, 1 lime, ½ curaçao, ½ orgeat, ¼ simple, crushed ice, mint."],["Piña Colada?","Rum, cream of coconut, pineapple; Puerto Rico."],["Espresso Martini spec?","2 oz vodka, 1 oz espresso, ½ coffee liqueur, ¼–½ simple, hard shake, 3 beans."],["Last Word?","Equal parts gin, green Chartreuse, maraschino, lime."],["Paper Plane?","Equal parts bourbon, Aperol, Amaro Nonino, lemon."],["White vs Black Russian?","White adds cream; Black is vodka + coffee liqueur only."]],"q":[["Spec me a Mai Tai (Trader Vic style).","2 oz aged rum · 1 oz lime · ½ oz curaçao · ½ oz orgeat · ¼ oz simple","1½ oz white rum · ¾ oz lime · ½ oz grenadine · pineapple top","2 oz aged rum · 1 oz lemon · ½ oz falernum · ½ oz honey","1 oz dark rum · 1 oz light rum · orange juice · pineapple juice","Crushed ice, mint sprig."],["A Jungle Bird's unusual ingredient for a tiki drink:","Campari","Green Chartreuse","Absinthe","Fernet-Branca","Rum, Campari, pineapple, lime, demerara."],["Spec me a Paper Plane.","¾ oz each bourbon, Aperol, Amaro Nonino, lemon","¾ oz each bourbon, Campari, Amaro Montenegro, lemon","1 oz bourbon, ¾ Aperol, ½ Nonino, ½ lime","¾ oz each rye, Aperol, yellow Chartreuse, lemon","Equal parts, shaken, served up."],["A guest wants an Aperol Spritz but less sweet. Best call:","A Campari Spritz","An Aperol Spritz with extra Aperol","A Bellini","A Kir Royale","Same build, more bitter and drier."],["Naked & Famous vs. Last Word, correctly:","Mezcal, yellow Chartreuse, Aperol, lime vs. gin, green Chartreuse, maraschino, lime","Both use green Chartreuse","Naked & Famous uses tequila and Campari","Last Word uses mezcal","Naked & Famous is a Last Word riff."],["A Bramble is finished with:","Crème de mûre drizzled over crushed ice","Raspberry syrup in the shake","A Champagne top","Blackberries muddled with mint","Gin, lemon, simple, then the blackberry liqueur bleeds down."],["A Kir Royale is:","Crème de cassis topped with Champagne","Chambord and prosecco","Peach purée and prosecco","Aperol and Champagne","A Bellini is peach and prosecco."],["An Espresso Martini comes out flat with no foam. Most likely cause:","Stale or cold espresso and a weak shake","Too much coffee liqueur","Vodka instead of rum","Using a coupe","Fresh, hot espresso and a hard shake build the crema."]],"pro":[["A table orders four Mai Tais and one guest says, 'I'm allergic to nuts.'","Orgeat is almond syrup. Falernum and some other syrups may contain almond too. Remove it from that guest's drink and make a safe version, or steer them to a different drink, and tell your manager.","'The Mai Tai has almond syrup, so let me make you something just as tropical without it,' then confirm every syrup you use is nut-free."],["A guest says an Aperol Spritz is 'too sweet, like candy.'","Keep the spritz format but move to a drier, more bitter aperitivo (Campari or Select), cut the sugar with more soda, or use a drier sparkling wine.","'Try a Campari Spritz: same idea, but drier and more bitter.'"],["A guest asks if the Mai Tai is 'one of those sweet blue tiki drinks.'","The original Trader Vic Mai Tai is a rum-forward sour: aged rum, lime, curaçao, orgeat, a little sugar. No juice, no blue, no grenadine.","'The real one isn't sweet or fruity: it's aged rum, fresh lime, orange curaçao and almond syrup. Think of it as a rich rum Daiquiri.'"]]},{"id":"x1","track":"Mixology","title":"Balance: How to Build Any Drink","k":["Every drink balances four things: strength (spirit), sweetness (syrup, liqueur), acidity (citrus) and bitterness or aromatics (bitters, vermouth, amaro). Dilution from ice is the fifth ingredient that ties them together.","Learn the templates, not just the recipes. Sour: 2 oz spirit, ¾ oz citrus, ¾ oz syrup. Old Fashioned: 2 oz spirit, ¼ oz syrup, 2–3 dashes bitters. Manhattan/Martini: 2 parts spirit to 1 part vermouth. Equal parts: four ingredients at ¾ oz each (Last Word, Paper Plane, Naked & Famous). Highball: about 1 part spirit to 3 parts mixer.","The 'Mr. Potato Head' method: change one part of a classic at a time. Negroni with bourbon = Boulevardier. Swap gin for mezcal = Mezcal Negroni. Daiquiri with honey instead of simple and bourbon instead of rum = Gold Rush. This is how most modern classics were invented.","A liqueur is both a sweetener and a spirit. When it replaces syrup (a Daisy, like the Margarita or Sidecar), use about ¾ oz and pull back other sugar. Rich syrup (2:1) is sweeter than simple (1:1), so roughly ½ oz rich does the job of ¾ oz simple.","Lime and lemon are both about 6% acid. Orange and grapefruit juice are much less acidic, so a drink sweetened with them still needs lime or lemon to taste balanced.","Split bases add depth: use two spirits for the base (rye + Cognac in the Vieux Carré, tequila + mezcal in the Oaxaca Old Fashioned). Same with sweeteners: part simple, part liqueur.","Salt is a secret weapon. 2–3 drops of 20% saline solution brighten citrus, round off bitterness and make fruit taste fruitier, without tasting salty.","Taste every drink before it goes out. Craft bars straw-taste: dip a straw, cap it with your finger, taste, toss the straw. If it's too sour, add a little syrup. Too sweet, a little citrus. Too hot, stir or shake a bit longer."],"c":[["Four elements of balance?","Strength, sweetness, acidity, bitterness/aromatics. Dilution ties them together."],["Sour template?","2 oz spirit : ¾ oz citrus : ¾ oz syrup."],["Stirred 'Manhattan' template?","2 parts spirit : 1 part vermouth + bitters."],["Name three equal-parts drinks.","Last Word, Paper Plane, Naked & Famous (also Negroni, Corpse Reviver #2)."],["What's the Mr. Potato Head method?","Swap one component of a classic at a time to make a new drink."],["Why does a grapefruit-heavy drink still need lime?","Grapefruit and orange are far less acidic than lime and lemon."],["What does saline do?","A few drops brighten citrus, soften bitterness and boost fruit flavors."],["How do you straw-taste?","Dip a straw, cap it with a finger, taste, discard the straw."],["Drink tastes too sour. Fix?","Add a small amount of syrup (about ¼ oz) and re-shake or remake."]],"q":[["You turn a Daiquiri into a Daisy by replacing ¾ oz simple with ¾ oz Cointreau. To keep balance you should:","Taste it; it may need a little extra syrup since Cointreau is less sweet than simple","Add ¾ oz more lime","Double the rum","Add bitters only","Liqueurs are sweeter than spirit but less sweet than syrup; adjust by taste."],["A spec calls for ¾ oz simple, but you only have rich (2:1). Pour about:","½ oz rich","¾ oz rich","1 oz rich","¼ oz rich","Rich is about 1.5× as sweet per ounce."],["A guest wants a Margarita with fresh orange juice for the 'orange.' What else does it need?","Lime still, because orange juice isn't acidic enough on its own","Nothing; orange juice replaces lime","More tequila","Extra salt","Orange and grapefruit are far less acidic than lime or lemon."],["Your new sour tastes balanced but dull and flat. First tweak:","2–3 drops of 20% saline","Another ¼ oz lime","Another ½ oz spirit","Shake twice as long","Salt brightens citrus and lifts flavor without tasting salty."],["A Mezcal Negroni, a Boulevardier and a Kingston Negroni are all examples of:","One-swap riffs on a classic template","Split-base drinks","Daisies","Equal-parts sours","Change one element, keep the structure."],["Which drink uses a split base?","Vieux Carré","Last Word","Boulevardier","Gimlet","Rye and Cognac share the base."],["You straw-taste a stirred drink: it's hot and sharp. Best fix:","Stir a little longer for more dilution","Add ¼ oz lemon","Add ice to the serving glass and send it","Add soda","Heat usually means under-diluted."],["A Gold Rush is a one-swap riff on a Whiskey Sour. What changed?","Honey syrup instead of simple","Lime instead of lemon","Rye instead of bourbon","Egg white removed","Bourbon, lemon, honey."]],"pro":[["Your manager says: 'Make me a sour with Aperol as the sweetener.'","Aperol is a liqueur (sweet and bitter), so it can replace some syrup. Keep the sour skeleton: 2 oz spirit, ¾ oz citrus, then ¾ oz Aperol with maybe ¼ oz syrup. Taste and adjust.","Build 1½ oz gin, ¾ oz Aperol, ¾ oz lemon, ¼ oz simple. Taste. Too bitter? A little more simple. Too sweet? A touch more lemon."],["A drink you're developing tastes balanced but boring.","Balance isn't the same as interest. Add a hook: a split base, a dash of bitters, a few drops of saline, an aromatic garnish, or a modifier like a barspoon of maraschino or amaro.","Try one change at a time: 2 drops saline first, then a dash of bitters, tasting after each."],["A guest asks, 'How do you come up with new drinks?'","Most modern classics come from swapping one element of a classic (the Mr. Potato Head method): Paper Plane from the Last Word structure, Penicillin from a Gold Rush.","'Start from a classic and change one thing. The Penicillin is basically a Gold Rush with Scotch, ginger and a smoky float.'"]]},{"id":"x2","track":"Mixology","title":"Ice, Dilution & Technique","k":["Ice does three jobs: it chills, it dilutes, and (when shaken) it aerates. Chilling and dilution happen together. You can't have a properly cold drink without water from the ice.","Typical finished strength (from Dave Arnold's measurements in Liquid Intelligence): stirred spirit-forward drinks land around 21–29% ABV; shaken sours around 15–20%. A hard-shaken drink gains water equal to roughly 50–60% of its starting volume. Shaking is more violent, so shaken drinks end up colder, more diluted and lighter in texture than stirred ones.","Ice types: 1¼-inch Kold-Draft-style cubes for shaking and stirring; large clear cube or sphere for spirit-forward drinks on the rocks (melts slowly); Collins spear for highballs; crushed or pebble ice for juleps, swizzles, cobblers and tiki (fast dilution, very cold); cracked ice for some old-school stirs and Ramos.","Clear ice is made by directional freezing (water freezes from the top down in an insulated cooler), so air and impurities are pushed to the bottom and cut away. It looks better and melts more evenly.","Wet ice (sitting in meltwater) adds extra water. Shake off or drain wet ice before using it in a mixing glass or tin. Use fresh ice every time and never reuse ice from a shaken drink in the serving glass.","Shaking: fill the tin with ice, seal, and shake hard for about 10–12 seconds until the tin frosts. A whip shake (a few pieces of crushed ice or one cube, very short) is used for drinks going over crushed ice so they aren't over-diluted twice.","Stirring: fill the mixing glass with cold, dry ice and stir smoothly with the back of the spoon riding the inside of the glass, about 20–30 seconds. Taste for temperature and dilution, then strain with a julep or Hawthorne strainer.","Chill the glass. Fill a coupe or Nick & Nora with ice water or keep it in the freezer, and dump it right before you strain. A warm glass warms the drink within a minute.","Double strain shaken drinks served up (Hawthorne plus a fine-mesh strainer) to catch ice shards and pulp. Drinks served over fresh ice don't need it."],"c":[["Three jobs of ice?","Chill, dilute, aerate (when shaken)."],["Typical ABV, stirred vs shaken?","Stirred about 21–29%; shaken sours about 15–20%."],["Why are shaken drinks lighter in texture?","Shaking adds air and more dilution."],["When do you use a whip shake?","For drinks poured over crushed ice — a quick shake with little ice to mix without over-diluting."],["How is clear ice made?","Directional freezing from the top down; the cloudy bottom is cut off."],["What's wrong with wet ice?","Meltwater adds uncontrolled extra dilution."],["How long to shake?","About 10–12 seconds, hard, until the tin frosts."],["How long to stir?","About 20–30 seconds with good cold ice; taste to check."],["When do you double strain?","Shaken drinks served up, to remove ice shards and pulp."]],"q":[["Roughly what finished ABV should a well-made stirred Manhattan land at?","About 21–29%","About 35–40%","About 10–12%","About 15–20%","Shaken sours land around 15–20%."],["A Julep goes over packed crushed ice. Before it, a shaken Mai Tai going over crushed ice gets:","A whip shake (a little crushed ice, very short)","A full 20-second hard shake","A dry shake","No shake, just stirred","Crushed ice dilutes in the glass, so don't over-dilute in the tin."],["Why do drinks on a big clear cube taste better for longer?","Less surface area, so slower, more even melting","Clear ice is colder than cloudy ice","It has no water in it","It adds sweetness","Slow melt keeps the drink from going watery."],["You see your barback filling the ice well from a cooler of half-melted ice. The problem for stirred drinks:","Wet ice adds extra water and throws off dilution","None; ice is ice","It makes drinks too cold","It makes drinks cloudy","Drain or shake off wet ice."],["A shaken drink served up needs double straining mainly to:","Catch ice shards and pulp for a clean texture","Make it colder","Add dilution","Remove alcohol","Drinks over fresh ice don't need it."],["Directional freezing makes clear ice because:","Water freezes from one side, pushing air and impurities to the last part to freeze","Boiling the water first removes all air","Salt is added","It's frozen faster","The cloudy part is cut away."],["Your coupes come from the shelf at room temperature. During a rush the right move is:","Fill them with ice water while you build, dump before straining","Skip it; the drink is cold enough","Put the drink on a big cube instead","Shake longer","A warm glass warms the drink fast."],["Compared with a stirred drink, the same ingredients shaken will be:","Colder, more diluted, lighter and cloudier","Warmer and stronger","Identical but faster","Less diluted and clearer","Shaking is more violent."]],"pro":[["Two Martinis go out: one stirred 10 seconds, one stirred 30 seconds. The guest prefers the second.","Dilution and temperature rise together. 10 seconds leaves the drink warm and hot with alcohol. 20–30 seconds on dry ice gets it to roughly 21–29% ABV and cold.","Stir every stirred drink until the outside of the mixing glass is very cold, then taste for temperature before you strain."],["You need to shake a drink that goes over crushed ice (a Mai Tai).","Crushed ice will melt fast in the glass and dilute it further. A full shake plus crushed ice equals a watery drink. Use a whip shake: a small amount of crushed ice, a few seconds.","Whip shake with a scoop of crushed ice for 3–5 seconds, dump into the glass, top with more crushed ice."],["A guest asks why you put one giant cube in their Old Fashioned.","Less surface area per volume means slower melting, so the drink stays cold without getting watery fast. Clear ice also looks better and melts evenly.","'One big cube melts slowly, so it keeps your drink cold without watering it down.'"]]},{"id":"x3","track":"Mixology","title":"Syrups, Cordials & Daily Prep","k":["Simple syrup is 1:1 sugar to water. Rich simple is 2:1. Measure by weight for consistency. Demerara or turbinado syrup (usually 2:1) adds a molasses note to rum and whiskey drinks.","Honey syrup: honey thinned with warm water (1:1, or 3:1 for richer) so it mixes into cold drinks. Agave syrup: agave nectar cut 1:1 or 2:1 with water. Ginger syrup: fresh-pressed ginger juice and sugar.","Grenadine is pomegranate syrup (pomegranate juice and sugar, often with a little orange flower water). The bright red corn-syrup stuff is not real grenadine. Orgeat is almond syrup with orange flower water. Falernum (Barbados) tastes of lime, clove, ginger and almond.","Oleo saccharum ('oily sugar'): toss citrus peels in sugar and let it sit for a few hours. The sugar pulls out the peel oils into an aromatic syrup. It's the classic base for punch.","Cordials and shrubs: a lime cordial is lime juice and zest, sugar and citric acid (the proper base for a Gimlet). A shrub is fruit, sugar and vinegar, a 'drinking vinegar' that adds acidity.","Acid adjusting: citric and malic acid powders let you make orange or grapefruit juice as tart as lime, or make 'super juice' from citrus peels, acid and water, which stretches yield and holds flavor longer. Many high-volume bars use it.","Freshness: juice citrus fresh every day, ideally before each shift. Most bars toss leftover juice at the end of the night. Syrups go in clean, labeled bottles in the fridge. Rich syrup lasts longer than 1:1 because it has less free water.","Label everything with the name, the date it was made and your initials, and rotate first in, first out (FIFO). Make the prep list before service, not during it.","Par levels: the amount of each prep item you need to start a shift. Check pars before service and make only what you'll use, so nothing goes off."],"c":[["Simple vs rich syrup?","Simple 1:1, rich 2:1 sugar to water, ideally by weight."],["What is real grenadine?","Pomegranate juice + sugar (often a little orange flower water)."],["Orgeat?","Almond syrup with orange flower water."],["Falernum flavors?","Lime, clove, ginger, almond (Barbados)."],["Oleo saccharum?","Sugar that pulls oils from citrus peels; a punch base."],["Shrub?","Fruit + sugar + vinegar."],["What is acid-adjusting?","Adding citric/malic acid so a juice or peel mix matches lime or lemon tartness."],["How long is fresh citrus juice good for?","Best the day it's pressed; most bars discard it at close."]],"q":[["A guest with a nut allergy orders a Mai Tai. Which ingredient is the problem?","Orgeat (almond)","Curaçao","Falernum is always the issue","Demerara syrup","Orgeat is almond syrup. (Many falernums also contain almond, so check yours.)"],["Lime cordial (the proper Gimlet base) is made from:","Lime juice and zest, sugar and citric acid","Lime juice and corn syrup","Lime zest steeped in gin","Lime juice and vinegar","A shrub is the one with vinegar."],["Oleo saccharum is made by:","Letting citrus peels sit in sugar to pull out their oils","Boiling citrus juice down","Mixing oil and sugar","Infusing peels in vodka","The classic base for punch."],["'Super juice' lets a bar:","Stretch citrus yield and hold flavor longer using peels, acid and water","Make juice without any citrus","Skip refrigeration","Avoid syrup","Common at high-volume bars."],["Real grenadine tastes of:","Pomegranate, often with a little orange flower water","Cherry","Raspberry and vanilla","Strawberry","The neon corn-syrup kind isn't the real thing."],["Why does rich syrup keep longer than 1:1?","Less free water for microbes to use","It's boiled longer","Sugar is an acid","It's stored warm","Higher sugar concentration slows spoilage."],["Falernum brings which flavors?","Lime, clove, ginger and almond","Coffee and vanilla","Cherry and cocoa","Pine and juniper","A Barbados tiki staple."],["Your shrub tastes sharp and vinegary in a cocktail. Best adjustment:","Use less and balance with a little more sugar","Add more shrub","Add lime","Add bitters","Shrubs are acid sources; treat them like citrus."]],"pro":[["You arrive for a shift and the lime juice from yesterday is still in the fridge.","Citrus loses aroma within hours and goes flat by the next day. Most craft bars toss leftover juice at close. Check par and squeeze fresh.","Toss it, check the prep list, squeeze fresh to par, label with name, date and initials."],["Your manager wants a tiki drink cheaper without losing quality.","Citrus and syrups are cheap compared with spirit, but citrus costs labor. Options: super juice to stretch lime yield, split the rum base with a cheaper workhorse rum, or batch syrups.","Propose super juice for volume, keep a quality aged rum but split it with a solid workhorse, and cost the spec before and after."],["A guest asks what 'house-made grenadine' means.","Real grenadine is pomegranate juice and sugar, often with orange flower water. The commercial red stuff is corn syrup and dye.","'Ours is real pomegranate juice and sugar. The bright red bottles are mostly corn syrup.'"]]},{"id":"x4","track":"Mixology","title":"Infusions, Fat-Washing & Clarification","k":["Infusing: add an ingredient to a spirit, taste often and strain when it's right. Speed varies a lot. Hot chiles can be done in minutes to an hour, tea in about 5–15 minutes, coffee beans in hours, vanilla and cinnamon in days. Higher-proof spirits extract faster.","Rapid infusion: a whipped-cream siphon (iSi) charged with N2O forces liquid into the solids in minutes. It's a technique popularized by Dave Arnold (Liquid Intelligence).","Fat-washing: stir melted fat (bacon fat, brown butter, coconut oil, sesame oil) into a spirit, let it sit a few hours, freeze it so the fat solidifies, then lift off the fat and fine-strain. The flavor and a silky texture stay; the grease doesn't. Famous example: Benton's Old Fashioned at PDT (bacon fat-washed bourbon, maple syrup, Angostura), by Don Lee.","Milk punch (clarified milk punch): mix spirit, citrus, sugar, tea and spices, then add it to whole milk. The acid curdles the milk; strain the liquid back through the curds until it runs crystal clear. It's silky and shelf-stable. The method dates to the 1700s.","Other clarification: agar clarification (set a little agar in the juice, break the gel, strain) and centrifuges. Clear juice lets you carbonate drinks and make clear, stable batches.","Tinctures and saline: a tincture is a strong extract in high-proof neutral spirit, used in drops. 20% saline is 20 g salt dissolved in 80 g water (20% by weight). Keep both in dropper bottles.","Food safety: strain out fresh produce, refrigerate fat-washed and dairy-based preps, label and date them. When in doubt, throw it out."],"c":[["Which infuses faster, chile or vanilla?","Chile (minutes to an hour). Vanilla takes days."],["What does an iSi siphon do for infusions?","N2O pressure forces liquid into solids for rapid infusion."],["Fat-washing steps?","Add melted fat, rest a few hours, freeze, remove fat, fine-strain."],["Benton's Old Fashioned?","Bacon fat-washed bourbon, maple syrup, Angostura (Don Lee, PDT)."],["How does milk punch clarify?","Acid curdles milk; straining through the curds makes it clear."],["Why clarify a drink?","Clarity, silky texture, shelf stability, and you can carbonate it."],["20% saline recipe?","20 g salt dissolved in 80 g water (20% by weight)."],["What's a tincture?","A potent extract in high-proof spirit, dosed in drops."]],"q":[["You're infusing a tequila with habanero. Best practice:","Taste every few minutes; hot chiles can be ready fast","Leave it a week","Leave it overnight, then strain","Infuse in a warm spot for a month","Hot chiles can take minutes to an hour."],["Benton's Old Fashioned at PDT is famous for:","Bacon fat-washed bourbon with maple syrup","Brown butter rum","Smoked glass and Scotch","Coffee-infused rye","Don Lee's fat-washing classic."],["In a clarified milk punch, the milk:","Curdles from the acid, and the curds filter the punch clear","Is blended in for creaminess","Is boiled off","Is replaced by cream later","Silky, clear and shelf-stable."],["The fastest way to infuse coffee into rum during service prep:","A whipped-cream siphon with N2O","Leave the beans in for a week","Blend the beans into the rum","Heat the rum on a stove","Rapid pressure infusion takes minutes."],["20% saline means:","20 g salt dissolved in 80 g water","20 g salt in 100 ml water","2 g salt in 10 ml vodka","Equal parts salt and water","20% by weight."],["Why freeze a fat-washed spirit?","The fat solidifies so you can lift it off","To make it colder for service","To kill bacteria","To add texture","Flavor stays; grease leaves."],["Agar clarification works by:","Trapping particles in a loose gel you then strain away","Spinning juice at high speed","Filtering through coffee filters only","Adding milk","Centrifuges are the other route."],["A tincture is:","A strong extract in high-proof spirit, used by the drop","A syrup made with tea","A low-proof aperitif","A bitter liqueur","Keep it in a dropper bottle."]],"pro":[["You want to fat-wash bourbon with brown butter for a menu drink.","Ratio guide: roughly 2–4 oz fat per 750 ml. Melt, stir into the spirit, rest a few hours, freeze, lift the fat, fine-strain. Refrigerate if dairy-based, label and date.","Brown 4 oz butter, mix into the bottle, rest 4 hours, freeze overnight, lift, strain through a coffee filter, label 'brown butter bourbon, date, initials, refrigerate.'"],["A clarified milk punch batch comes out cloudy.","Clarity comes from the curd bed filtering the liquid. Pour slowly, don't disturb the curds, and re-pour the first cloudy runnings back through until it runs clear.","Let it curdle fully, pour gently into the filter, recycle the first cloudy liquid back through the curds."],["Your jalapeño tequila is too hot to use.","Dilute it with plain tequila to the heat you want, and next time taste every few minutes. Removing seeds and ribs controls heat.","Blend it back with plain tequila 1:1, taste, adjust, and write the new infusion time on the spec."]]},{"id":"x5","track":"Mixology","title":"The Craft Backbar: Modifiers & Bitters","k":["Vermouth is wine, fortified and flavored with botanicals. Once it's open, it oxidizes like wine: refrigerate it and use it within about a month. Warm, old vermouth is the most common reason a Manhattan or Martini tastes flat.","Vermouth styles: dry (French style, e.g. Dolin Dry, Noilly Prat) for Martinis; blanc/bianco (sweet-ish, pale, e.g. Dolin Blanc); sweet/rosso (Italian style, e.g. Carpano Antica Formula, rich and vanilla; Cocchi Vermouth di Torino; Punt e Mes, more bitter) for Manhattans and Negronis.","Aromatized wines: Lillet Blanc (orange, honey) and Cocchi Americano (bitter quinine, closer to the old Kina Lillet) are used in the Vesper and Corpse Reviver #2.","Bitter liqueurs and amari: Campari (bitter orange, Negroni); Aperol (lighter, lower ABV, Spritz); Cynar (artichoke, bittersweet); Fernet-Branca (intensely bitter and minty, the 'bartender's handshake'); Montenegro (floral, gentle); Averna (caramel, cola notes); Amaro Nonino (orange, grappa base, Paper Plane).","Herbal liqueurs: Green Chartreuse (55% ABV, intense, herbal) and Yellow Chartreuse (40%, honeyed, gentler) are made by Carthusian monks and are often allocated or hard to get. Bénédictine (honey, baking spice) is in the Vieux Carré.","Other modifiers: Luxardo Maraschino (distilled from marasca cherries, funky and floral, not red cherry syrup); orange liqueurs (Cointreau, a clean triple sec; Grand Marnier, Cognac-based; dry curaçao); crème de violette (Aviation); crème de cassis (blackcurrant); crème de mûre (blackberry, Bramble); St-Germain (elderflower); allspice dram; absinthe (anise, for rinses).","Bitters are the salt and pepper of cocktails. Angostura (Trinidad, baking spice) is the default aromatic. Peychaud's (New Orleans, anise and cherry) goes in the Sazerac. Orange bitters go in Martinis. A dash is small but changes a drink."],"c":[["How should opened vermouth be stored?","Refrigerated; use within about a month."],["Dry vs sweet vermouth uses?","Dry: Martini. Sweet: Manhattan, Negroni."],["Lillet Blanc vs Cocchi Americano?","Both aromatized wines; Cocchi Americano is more bitter (quinine)."],["Campari vs Aperol?","Campari is more bitter and stronger; Aperol is lighter and sweeter."],["Fernet-Branca?","Intensely bitter, minty amaro; the 'bartender's handshake'."],["Green vs Yellow Chartreuse?","Green 55%, intense and herbal; Yellow 40%, honeyed and softer."],["What is maraschino liqueur?","A clear, funky, floral liqueur distilled from marasca cherries."],["Angostura vs Peychaud's?","Angostura: baking spice, default aromatic. Peychaud's: anise and cherry, Sazerac."],["Cognac-based orange liqueur?","Grand Marnier."]],"q":[["A guest wants a Manhattan 'a little more bitter than usual.' Best vermouth swap:","Punt e Mes","Dolin Blanc","Lillet Blanc","Dolin Dry","Punt e Mes is a more bitter sweet vermouth."],["Carpano Antica Formula is known for:","Rich vanilla sweetness","Bone-dry and herbal","Bitter quinine","Pale and floral","A big, rich Italian sweet vermouth."],["Cocchi Americano differs from Lillet Blanc by being:","More bitter, with quinine","Sweeter and higher proof","Red and spiced","A gin","Closer to the old Kina Lillet."],["Green vs. Yellow Chartreuse:","Green is about 55% ABV and intense; Yellow about 40%, honeyed and gentler","Yellow is stronger","They're the same liquid with different color","Green is a bitter aperitivo","Both are made by Carthusian monks."],["Which amaro is floral and gentle, a good first amaro for a guest?","Montenegro","Fernet-Branca","Cynar","Campari","Fernet is intense and minty."],["A guest wants an amaro with caramel and cola notes:","Averna","Montenegro","Fernet-Branca","Aperol","Rich and approachable."],["Grand Marnier vs. Cointreau:","Grand Marnier is Cognac-based and richer; Cointreau is a clean triple sec","Cointreau is Cognac-based","They're the same","Grand Marnier is an amaro","Use Cointreau for a classic Margarita."],["Cynar's signature botanical:","Artichoke","Rhubarb","Gentian only","Mint","Bittersweet and vegetal."]],"pro":[["A guest says, 'I want to try an amaro but I'm scared of bitter.'","Start gentle and sweet: Montenegro (floral), Averna (caramel, cola), Nonino (orange). Save Fernet for later.","'Start with Montenegro, it's floral and gentle. If you like it, Averna is richer, like caramel and cola.'"],["Your Martinis taste dull lately.","Check the dry vermouth: how long has it been open and was it refrigerated? Dry vermouth fades fastest because there's no sugar to hide oxidation.","Taste the vermouth, date every open bottle, keep it cold, and use it within about a month."],["A guest asks what's in Green Chartreuse.","The exact recipe is secret (130 herbs, plants and flowers), made by Carthusian monks in France. Green is about 55% ABV and intense; Yellow is softer and honeyed.","'It's a secret monk recipe of 130 herbs from the French Alps. Green is the strong, intense one; yellow is sweeter and softer.'"]]},{"id":"x6","track":"Mixology","title":"Classic Canon: Stirred & Spirit-Forward","k":["Vieux Carré (Hotel Monteleone, New Orleans, 1930s): ¾ oz rye, ¾ oz Cognac, ¾ oz sweet vermouth, 1 barspoon Bénédictine, 2 dashes Peychaud's, 2 dashes Angostura. Stirred, rocks glass with a large cube, lemon twist or cherry.","Brooklyn: 2 oz rye, ¾–1 oz dry vermouth, ¼ oz maraschino, ¼ oz Amer Picon (or a substitute amaro). Stirred, up.","Hanky Panky (Ada Coleman, the Savoy, London): 1½ oz gin, 1½ oz sweet vermouth, 2 dashes Fernet-Branca. Stirred, up, orange twist.","Bijou: equal parts (1 oz) gin, sweet vermouth and green Chartreuse, dash of orange bitters. Stirred, up.","Old Pal: 1½ oz rye, ¾ oz dry vermouth, ¾ oz Campari. A drier cousin of the Boulevardier. Stirred, up, lemon twist.","Toronto: 2 oz rye, ¼ oz Fernet-Branca, ¼ oz simple, 2 dashes Angostura. Stirred, up, orange twist.","Martinez: 1½ oz Old Tom gin, 1½ oz sweet vermouth, 1 barspoon maraschino, dash of bitters. Stirred, up, lemon twist. It's an ancestor of the Martini.","Mint Julep (Kentucky Derby): 2–2½ oz bourbon, ½ oz simple (or rich), 8–10 mint leaves gently pressed, packed crushed ice in a julep cup. Mound the ice, add a big mint bouquet and a short straw near the mint.","Hot drinks: Hot Toddy is 2 oz whiskey (or brandy or rum), ½–¾ oz honey syrup, ½ oz lemon, topped with about 4 oz hot water. Irish Coffee is 1½ oz Irish whiskey, ½ oz brown-sugar syrup, about 4 oz hot coffee in a preheated glass, with lightly whipped cream floated on top (never stirred in)."],"c":[["Vieux Carré spec?","¾ rye, ¾ Cognac, ¾ sweet vermouth, 1 barspoon Bénédictine, 2 Peychaud's, 2 Angostura; stirred, rocks."],["Brooklyn spec?","2 rye, ¾–1 dry vermouth, ¼ maraschino, ¼ Amer Picon; stirred, up."],["Hanky Panky?","1½ gin, 1½ sweet vermouth, 2 dashes Fernet; Ada Coleman, Savoy."],["Bijou?","Equal parts gin, sweet vermouth, green Chartreuse + orange bitters."],["Old Pal?","1½ rye, ¾ dry vermouth, ¾ Campari."],["Toronto?","2 rye, ¼ Fernet, ¼ simple, 2 Angostura."],["Martinez?","1½ Old Tom, 1½ sweet vermouth, barspoon maraschino, bitters."],["Mint Julep?","2–2½ bourbon, ½ simple, mint, crushed ice, julep cup, mint bouquet."],["Irish Coffee?","1½ Irish whiskey, ½ brown sugar syrup, hot coffee, floated lightly whipped cream."]],"q":[["Spec me a Vieux Carré.","¾ oz each rye, Cognac, sweet vermouth · barspoon Bénédictine · 2 Peychaud's · 2 Angostura","1 oz rye · 1 oz Cognac · ½ oz dry vermouth · ½ oz Bénédictine · 2 Angostura","¾ oz each rye, Cognac, Campari · barspoon maraschino · 2 orange bitters","2 oz rye · ¾ oz sweet vermouth · ¼ oz Bénédictine · absinthe rinse","Stirred, rocks over a big cube."],["A Hanky Panky's secret ingredient:","A couple dashes of Fernet-Branca","A barspoon of absinthe","Orange bitters","Maraschino","Gin, sweet vermouth, Fernet."],["Spec me a Bijou.","1 oz each gin, sweet vermouth, green Chartreuse · dash orange bitters","¾ oz each gin, green Chartreuse, maraschino, lime","1 oz each gin, dry vermouth, yellow Chartreuse","1½ oz gin, ¾ oz sweet vermouth, ¾ oz Bénédictine","Equal parts, stirred."],["Irish Coffee cream should be:","Lightly whipped and floated on top, never stirred in","Stiffly whipped and piped","Stirred into the coffee","Replaced with milk foam","Drink the coffee through the cold cream."],["Spec me a Mint Julep.","2–2½ oz bourbon · ½ oz simple · mint pressed · packed crushed ice · mint bouquet","2 oz rye · ¾ oz lime · ¾ oz simple · mint · soda top","2 oz bourbon · 1 oz lemon · mint · shaken, coupe","2 oz Cognac · ½ oz simple · mint · big cube","Julep cup, short straw near the mint."],["A guest wants a whiskey drink like a Negroni but drier and lighter on the palate:","An Old Pal","A Boulevardier","A Toronto","A Brooklyn","Rye, dry vermouth, Campari."],["A Brooklyn uses which vermouth?","Dry","Sweet","Blanc","Half sweet, half dry","Rye, dry vermouth, maraschino, Amer Picon."],["Hot Toddy: which is closest to a solid spec?","2 oz whiskey · ½–¾ oz honey syrup · ½ oz lemon · about 4 oz hot water","1 oz whiskey · 2 oz honey · 2 oz lemon · 2 oz water","2 oz whiskey · 4 oz hot tea only","2 oz rum · 1 oz butter · hot milk","Preheat the mug."]],"pro":[["A guest orders a Vieux Carré and asks what it is.","Name, origin and flavor: New Orleans, Hotel Monteleone, 1930s. Rye and Cognac split base, sweet vermouth, Bénédictine, both bitters. Rich, spiced, a little sweet.","'It's a New Orleans classic, rye and Cognac with sweet vermouth and a little Bénédictine. Think of a richer, spicier Manhattan.'"],["It's winter and a guest wants something warm.","Hot drinks need a preheated glass or mug, a balance of sweetness and acid, and the right dilution from hot water. Hot Toddy or Irish Coffee.","Preheat the mug, 2 oz whiskey, ½–¾ oz honey syrup, ½ oz lemon, top with about 4 oz hot water, lemon wheel with clove."],["Your Mint Julep goes out and the guest says it smells like nothing.","Aroma comes from the garnish, not the muddle. A big, fresh, slapped mint bouquet next to a short straw is the point.","Slap a big mint bouquet, set it right next to the straw so the nose goes in the mint every sip."]]},{"id":"x7","track":"Mixology","title":"Classic Canon: Shaken, Swizzled & Crushed","k":["Aviation: 2 oz gin, ¾ oz lemon, ½ oz maraschino, ¼ oz crème de violette. Shaken, coupe, cherry.","Corpse Reviver #2: equal parts (¾ oz) gin, Cointreau, Lillet Blanc or Cocchi Americano, and lemon, in an absinthe-rinsed coupe. Shaken.","Hemingway Daiquiri: 2 oz white rum, ¾ oz lime, ½ oz grapefruit, ¼–½ oz maraschino. Shaken, up. It's tart with very little sugar, the way Hemingway liked it.","Southside: 2 oz gin, ¾ oz lime (or lemon), ¾ oz simple, a few mint leaves. Shaken, double strained, coupe. Pegu Club: 2 oz gin, ¾ oz orange curaçao, ¾ oz lime, dash Angostura, dash orange bitters.","Jack Rose: 2 oz apple brandy (Laird's), ¾ oz lemon or lime, ½–¾ oz grenadine. Clover Club: 1½ oz gin, ½ oz dry vermouth, ½ oz lemon, ½ oz raspberry syrup, egg white (dry shake).","Caipirinha (Brazil): half a lime cut into wedges and muddled with 2 tsp sugar (or ¾ oz simple), 2 oz cachaça, ice. Ti' Punch (Martinique): a coin of lime peel with a little juice, 1 tsp cane syrup, 2 oz rhum agricole, built and stirred with little or no ice.","Queen's Park Swizzle (Trinidad): 2 oz demerara rum, 1 oz lime, ¾ oz simple, mint, crushed ice. Swizzle with a swizzle stick until the glass frosts, then top with lots of Angostura so it layers green, gold and red.","Jungle Bird (Kuala Lumpur Hilton, 1978): 1½ oz blackstrap or dark rum, ¾ oz Campari, 1½ oz pineapple, ½ oz lime, ½ oz demerara syrup. Shaken, rocks.","Bramble (Dick Bradsell, London, 1980s): 2 oz gin, 1 oz lemon, ½ oz simple, shaken and strained over crushed ice, with ½ oz crème de mûre drizzled over the top."],"c":[["Aviation spec?","2 gin, ¾ lemon, ½ maraschino, ¼ crème de violette; shaken, coupe."],["Corpse Reviver #2?","Equal parts gin, Cointreau, Lillet/Cocchi Americano, lemon; absinthe rinse."],["Hemingway Daiquiri?","2 white rum, ¾ lime, ½ grapefruit, ¼–½ maraschino."],["Southside?","2 gin, ¾ lime, ¾ simple, mint; shaken, double strained."],["Pegu Club?","2 gin, ¾ orange curaçao, ¾ lime, Angostura + orange bitters."],["Jack Rose?","2 apple brandy, ¾ lemon/lime, ½–¾ grenadine."],["Caipirinha?","Muddled lime wedges and sugar, 2 oz cachaça, ice."],["Ti' Punch?","Rhum agricole, lime coin, cane syrup; built."],["Queen's Park Swizzle?","Demerara rum, lime, simple, mint, crushed ice, swizzled, Angostura on top."],["Jungle Bird?","1½ dark rum, ¾ Campari, 1½ pineapple, ½ lime, ½ demerara."]],"q":[["Spec me an Aviation.","2 oz gin · ¾ oz lemon · ½ oz maraschino · ¼ oz crème de violette","2 oz gin · ¾ oz lime · ½ oz violette · ¼ oz maraschino","1½ oz gin · ½ oz lemon · ½ oz Chartreuse · ½ oz maraschino","2 oz vodka · ¾ oz lemon · ½ oz violette · egg white","Shaken, coupe, cherry."],["A Corpse Reviver #2's equal parts:","Gin, Cointreau, Lillet Blanc (or Cocchi Americano), lemon, in an absinthe-rinsed glass","Cognac, Calvados, sweet vermouth","Gin, green Chartreuse, maraschino, lime","Gin, Campari, sweet vermouth, lemon","#1 is the brandy-and-vermouth one."],["A Hemingway Daiquiri adds:","Grapefruit and maraschino, with little sugar","Pineapple and orgeat","Mint and soda","Honey and lemon","Tart and dry."],["Ti' Punch is built with:","Rhum agricole, a coin of lime and cane syrup","Cachaça, muddled lime and sugar","Aged rum, lime juice and soda","White rum, mint and lime","Martinique's national drink."],["Caipirinha vs. Ti' Punch base spirit:","Cachaça vs. rhum agricole (both cane juice)","White rum vs. dark rum","Cachaça vs. pisco","Both use molasses rum","Brazil vs. Martinique."],["Queen's Park Swizzle gets its layers from:","Lots of Angostura on top after swizzling","Grenadine sinking","A Campari float","Blue curaçao","Green, gold and red."],["Spec me a Jack Rose.","2 oz apple brandy · ¾ oz lemon or lime · ½–¾ oz grenadine","2 oz Calvados · ¾ oz lime · ¾ oz orgeat","2 oz apple brandy · ¾ oz lemon · ¾ oz simple · egg","1½ oz applejack · ½ oz Cointreau · ½ oz lemon","Laird's is the classic."],["A Pegu Club's sweetener:","Orange curaçao","Simple syrup","Maraschino","Honey","Gin, curaçao, lime, both bitters."]],"pro":[["A guest wants an Aviation but your bar is out of crème de violette.","Without violette it's essentially the original pre-violette style (gin, lemon, maraschino) or close to a Casino. Tell the guest it'll be the drier version without the floral purple.","'We're out of violette, so it'll be the original version: gin, lemon and maraschino, a bit drier. Still want it?'"],["You need to make a Queen's Park Swizzle.","Build in a tall glass, pack crushed ice, swizzle until the glass frosts, then top with fresh crushed ice and a heavy float of Angostura to layer it.","Mint pressed, demerara rum, lime, simple, crushed ice, swizzle, top ice, then lots of Angostura."],["A Brazilian guest asks for a Caipirinha 'the real way.'","Muddle lime wedges and sugar in the glass to extract juice and peel oils, add cachaça and ice, stir or roll. It's built, not shaken and strained.","Half a lime in wedges, 2 tsp sugar, muddle, 2 oz cachaça, ice, roll, serve in the same glass."]]},{"id":"x8","track":"Mixology","title":"Modern Classics You'll Be Asked For","k":["The craft cocktail revival (late 1990s–2010s) came out of bars like Milk & Honey (Sasha Petraske, NYC, 1999), Pegu Club (Audrey Saunders), Death & Co (2006) and PDT (2007). Their drinks are now standard calls at any serious bar.","Penicillin (Sam Ross, Milk & Honey): 2 oz blended Scotch, ¾ oz lemon, ¾ oz honey-ginger syrup, shaken, rocks, ¼ oz Islay Scotch floated on top, candied ginger.","Gold Rush (Milk & Honey): 2 oz bourbon, ¾ oz lemon, ¾ oz honey syrup. Shaken, rocks.","Paper Plane (Sam Ross): ¾ oz each bourbon, Aperol, Amaro Nonino, lemon. Shaken, up. Naked & Famous (Joaquín Simó, Death & Co): ¾ oz each mezcal, yellow Chartreuse, Aperol, lime. Shaken, up.","Oaxaca Old Fashioned (Phil Ward, Death & Co): 1½ oz reposado tequila, ½ oz mezcal, 1 barspoon agave syrup, 2 dashes Angostura, flamed orange peel. Division Bell (Phil Ward): 1 oz mezcal, ¾ oz Aperol, ½ oz maraschino, ¾ oz lime.","Old Cuban (Audrey Saunders): 1½ oz aged rum, ¾ oz lime, 1 oz simple, 2 dashes Angostura, mint, shaken, up, topped with Champagne. Gin-Gin Mule (Saunders): gin, lime, simple, mint, topped with ginger beer.","Gin Basil Smash (Jörg Meyer, Le Lion, Hamburg, 2008): 2 oz gin, ¾ oz lemon, ¾ oz simple, a big handful of basil muddled, shaken hard, double strained over ice.","Trinidad Sour (Giuseppe González): 1½ oz Angostura bitters, 1 oz orgeat, ¾ oz lemon, ½ oz rye. Yes, bitters as the base. Siesta (Katie Stipe): 1½ oz blanco tequila, ½ oz Campari, ½ oz lime, ½ oz grapefruit, ½ oz simple.","Espresso Martini and Cosmopolitan (the version Toby Cecchini popularized at The Odeon, NYC, in the late 1980s; earlier versions existed) are 'modern classics' too. Make them perfectly and without attitude. They pay the rent."],"c":[["Penicillin spec?","2 blended Scotch, ¾ lemon, ¾ honey-ginger; Islay float. Sam Ross."],["Gold Rush?","2 bourbon, ¾ lemon, ¾ honey syrup."],["Naked & Famous?","Equal parts mezcal, yellow Chartreuse, Aperol, lime. Joaquín Simó."],["Oaxaca Old Fashioned?","1½ reposado, ½ mezcal, barspoon agave, 2 Angostura. Phil Ward."],["Old Cuban?","Aged rum, lime, simple, Angostura, mint, topped with Champagne. Audrey Saunders."],["Gin Basil Smash?","Gin, lemon, simple, lots of basil. Jörg Meyer, Le Lion."],["Trinidad Sour?","1½ Angostura, 1 orgeat, ¾ lemon, ½ rye."],["Division Bell?","Mezcal, Aperol, maraschino, lime. Phil Ward."],["Siesta?","Blanco tequila, Campari, lime, grapefruit, simple. Katie Stipe."]],"q":[["Spec me a Penicillin.","2 oz blended Scotch · ¾ oz lemon · ¾ oz honey-ginger · ¼ oz Islay float","2 oz Islay Scotch · ¾ oz lemon · ¾ oz honey · ¼ oz ginger liqueur","2 oz bourbon · ¾ oz lemon · ¾ oz honey-ginger · Islay rinse","1½ oz blended Scotch · 1 oz lime · ½ oz honey · ½ oz ginger beer","Sam Ross, Milk & Honey."],["Spec me a Division Bell.","1 oz mezcal · ¾ oz Aperol · ½ oz maraschino · ¾ oz lime","¾ oz each mezcal, yellow Chartreuse, Aperol, lime","1½ oz mezcal · ¾ oz Campari · ¾ oz sweet vermouth","1 oz mezcal · ¾ oz Aperol · ½ oz Cointreau · ¾ oz lemon","Phil Ward."],["The Old Cuban is topped with:","Champagne","Ginger beer","Soda","Angostura","Aged rum, lime, simple, mint, Angostura, Champagne."],["A Gin-Gin Mule is:","Gin, lime, simple, mint, topped with ginger beer","Gin and ginger ale","Gin, lemon, honey-ginger","Gin, tonic, ginger syrup","Audrey Saunders."],["Spec me a Siesta.","1½ oz blanco · ½ oz Campari · ½ oz lime · ½ oz grapefruit · ½ oz simple","2 oz blanco · ½ oz Aperol · 1 oz grapefruit · soda","1½ oz mezcal · ½ oz Campari · ½ oz lemon · ½ oz honey","1 oz each tequila, Campari, sweet vermouth","Katie Stipe."],["The Trinidad Sour's base:","1½ oz Angostura bitters","Trinidad rum","Rye whiskey","Campari","With orgeat, lemon and a half ounce of rye."],["A guest orders a Cosmopolitan at your craft bar. You:","Make the best Cosmo they've had, no attitude","Suggest something 'more serious'","Make it with bottled sour","Refuse; it's not on the menu","Modern classics pay the rent."],["Which pair is correctly matched?","Naked & Famous: Joaquín Simó","Paper Plane: Phil Ward","Penicillin: Audrey Saunders","Oaxaca Old Fashioned: Sam Ross","Paper Plane and Penicillin: Sam Ross; Oaxaca OF: Phil Ward."]],"pro":[["A guest asks, 'What's the drink that made Milk & Honey famous?'","Penicillin (Sam Ross) and the Gold Rush are the iconic ones. Say the spec and why it works.","'The Penicillin: blended Scotch, lemon, honey and fresh ginger, with smoky Islay on top. Sweet, sour, spicy and smoky in one sip.'"],["A guest wants 'something like a Margarita but more interesting.'","Stay in agave and citrus, add a bitter or herbal layer: Naked & Famous, Division Bell, Siesta or a mezcal Margarita.","'Try a Siesta: tequila, lime and grapefruit with a little Campari. Like a bitter, grown-up Margarita.'"],["A guest orders an Espresso Martini and your coworker rolls their eyes.","Modern classics pay the rent, and guest perception is everything. Make it perfectly: fresh espresso, hard shake, three beans.","Make it with fresh hot espresso, shake hard, strain into a chilled coupe, three beans, smile."]]},{"id":"x9","track":"Mixology","title":"Zero-Proof & Low-ABV","k":["More guests are drinking less or not at all. A bar that makes zero-proof drinks with the same care as cocktails wins those guests, and their tables. Use the same glassware, ice and garnish as a real cocktail.","Balance rules still apply: acid, sugar, bitterness, texture and dilution. Without alcohol a drink can taste thin, so add body and bite with tea, verjus, shrubs, tonic, ginger, saline, egg white or aquafaba (chickpea liquid) for foam.","Non-alcoholic spirits and aperitifs exist, but many are light on body. Build around them instead of just swapping them in 1:1.","Never ask why someone isn't drinking, and never pressure them. Some guests are pregnant, in recovery, driving, or just don't want to. Be aware that NA beer and some 'non-alcoholic' products can contain up to 0.5% ABV, so tell guests if they ask.","Low-ABV cocktails use fortified wine, vermouth, sherry or amaro as the base. Bamboo: 1½ oz dry sherry (fino or amontillado), 1½ oz dry vermouth, dash orange bitters, dash Angostura, stirred. Adonis: sherry with sweet vermouth.","Sherry Cobbler: about 3 oz amontillado sherry, ½ oz simple, orange half-wheels shaken in, poured over crushed ice with berries and mint. Americano and Spritzes are low-ABV too.","Low-ABV drinks are great for long nights, brunch and day drinking, and for a guest who wants one more without getting drunk."],"c":[["How do you add body to a zero-proof drink?","Tea, verjus, shrubs, tonic, ginger, saline, egg white or aquafaba."],["What is aquafaba?","Chickpea liquid; makes vegan foam like egg white."],["What should you never ask a non-drinking guest?","Why they aren't drinking."],["NA beer ABV note?","'Non-alcoholic' can be up to 0.5% ABV."],["Bamboo spec?","1½ dry sherry, 1½ dry vermouth, orange bitters + Angostura; stirred."],["Adonis?","Sherry + sweet vermouth."],["Sherry Cobbler?","Amontillado, simple, orange, crushed ice, berries, mint."],["Three low-ABV bases?","Sherry, vermouth, amaro (also aromatized wine)."]],"q":[["A zero-proof sour tastes thin and watery. Best fix:","Add body and bite: tea, verjus, a little saline, or aquafaba foam","Add more sugar","Shake longer","Add more ice","Without alcohol you need texture and grip."],["A guest says, 'I'm not drinking tonight.' You:","Offer zero-proof options with the same care, no questions","Ask why","Suggest a low-ABV drink instead","Bring water only","Never pressure or probe."],["Spec me a Bamboo.","1½ oz dry sherry · 1½ oz dry vermouth · dash orange bitters · dash Angostura","1½ oz sweet sherry · 1½ oz sweet vermouth · Peychaud's","2 oz fino · ½ oz Cointreau · lemon","1 oz sherry · 1 oz gin · 1 oz dry vermouth","Stirred, up."],["The Adonis differs from the Bamboo by using:","Sweet vermouth","Gin","Port","Aperol","Sherry with sweet vermouth."],["A guest in recovery asks if your NA beer is truly alcohol-free. You:","Tell them it can contain up to 0.5% ABV","Say it's 0%","Say you're not sure and serve it","Recommend a light beer","Honesty protects the guest."],["Best low-ABV option for a long brunch:","A Sherry Cobbler","A Zombie","A Vieux Carré","A Long Island","Amontillado, sugar, orange, crushed ice."],["Aquafaba replaces:","Egg white","Cream","Simple syrup","Bitters","Chickpea liquid for vegan foam."],["Why build zero-proof drinks in real cocktail glassware with full garnish?","So the guest gets the same experience and isn't singled out","To charge more","Tradition","Because NA drinks need colder glasses","Same care, same look."]],"pro":[["A table of four, one guest is pregnant and wants 'something festive.'","Zero-proof with full ceremony: same glassware and garnish so she's not singled out. Use tea, verjus, citrus, a shrub or tonic for body and bite.","Make a zero-proof spritz: verjus, a little grapefruit and rosemary syrup, topped with soda in a wine glass, citrus wheel. Serve it at the same time as the others."],["A guest wants to keep drinking but not get drunk.","Low-ABV is the answer: sherry, vermouth, aperitivo-based drinks. Bamboo, Adonis, Americano, Sherry Cobbler, Spritzes.","'Try a Bamboo: dry sherry and dry vermouth, stirred. Tastes like a Martini, about half the alcohol.'"],["Your NA sour tastes thin.","Alcohol gives weight and warmth. Replace it with texture (aquafaba foam, a richer syrup), bitterness (tea, gentian NA aperitif) and a little salt.","Add aquafaba and dry shake, swap simple for a tea syrup, two drops of saline."]]},{"id":"x10","track":"Mixology","title":"Speed, Station Setup & Ticket Flow","k":["Mise en place: before service, set your well the same way every time. Tins, mixing glass, jiggers, spoon, strainers, garnish tray, syrups and juices in labeled bottles, speed rail stocked, ice bin full, glassware chilled, bar towels folded. If you have to look for something mid-rush, your setup failed.","Read the whole ticket (or every ticket waiting) before you touch anything. Group the same drinks together and plan the round.","Build a round in an order: set all the glasses down first; build stirred drinks first (they hold well in the mixing glass), then shaken drinks; pour carbonated mixers, sparkling wine and beer last so they stay fizzy. Garnish everything at once at the end.","Pour cheapest ingredients first: citrus, syrup, modifiers, and spirit last. If you mess up, you've wasted lime juice, not $40 Scotch.","Work with both hands and shake two tins at once when you can. Never walk anywhere empty-handed. Restock, clear glassware and wipe down during every lull.","Jigger everything at a craft bar. Fill the jigger to the brim (the meniscus), pour without dripping. Consistency is what managers watch for. Free-pouring has its place, but specs are specs.","Call outs keep everyone safe: 'Behind' when passing behind someone, 'Corner' at blind turns, 'Hot' or 'Sharp' when carrying them. Communicate with your barback before you run out, not after.","When you're slammed, acknowledge every guest in the first moments ('Hi, I'll be right with you') even if you can't serve them yet. People will wait if they know you've seen them.","Clean as you go: rinse tins and spoon between drinks, wipe the bar top, and keep your station looking like it did at open."],"c":[["First step on a ticket?","Read the whole ticket (all waiting tickets), group drinks, plan the round."],["Order of a round?","Glasses down → stirred → shaken → carbonated/sparkling/beer last → garnish all."],["Why pour cheapest ingredients first?","Mistakes waste citrus and syrup, not expensive spirit."]],"q":[["A ticket: Martini, two Margaritas, a G&T, a Champagne. Best build order:","Martini first, then shake the Margaritas, then G&T and Champagne last","Champagne first so it's ready","Margaritas first, Martini last","G&T first, then everything else","Stirred holds, shaken next, bubbles last."],["Within one drink you pour:","Citrus and syrups first, spirit last","Spirit first, citrus last","Most expensive first","Ice first, then everything","Mistakes waste lime juice, not Scotch."],["A $16 cocktail costs $2.40 to make. Pour cost:","15%","12%","20%","24%","2.40 ÷ 16 = 0.15."],["Four shaken drinks on one ticket. Fastest clean approach:","Build all four, ice last, shake two at a time","Make each one start to finish","Shake one big batch in a pitcher","Shake without ice","Two hands, two tins."],["Why add ice last when building a round?","So nothing dilutes while you build","Tradition","It keeps glasses cold","To save ice","Ice goes in right before you shake or stir."],["Your bar is slammed and two new guests sit down. Your first move:","Acknowledge them right away even if you can't serve yet","Finish every ticket first","Ask the barback to tell them to wait","Make their drinks before the tickets","People wait if they know you've seen them."],["When do you tell your barback you need limes?","Before you run out","When the bin is empty","After the rush","Never; get them yourself mid-rush","Communicate early."],["Ten seconds of downtime mid-service. Best use:","Restock, clear glassware, wipe down","Check your phone","Make a drink for yourself","Chat at the service well","Never stand still."]],"pro":[["Five tickets print at once in the middle of a rush.","Read every ticket first. Group like drinks (three Margaritas across tickets get built together), set all glassware, stirred first, shaken next, bubbles last, garnish together.","Line up glasses for all tickets, batch-build the three Margaritas, stir the Manhattan, shake in pairs, pour beer and bubbles last."],["Halfway through service you realize you're out of simple syrup.","That's a setup failure: pars weren't checked. Now: tell the barback immediately, use a backup bottle if there is one, and fix the prep list.","'Barback, I need simple, two bottles,' then note it for tomorrow's par check."],["You're making a round and a guest at the end of the bar is waving.","Acknowledge everyone even if you can't serve them yet. Eye contact and a quick 'I'll be right with you' keeps guests patient.","Make eye contact, 'Hi, I'll be right with you,' finish the round, go to them next."]]},{"id":"x11","track":"Mixology","title":"Garnish, Glassware & Presentation","k":["A garnish is an ingredient: most of what we 'taste' is aroma. Peel oils, mint and spice hit the nose first.","Expressing a peel: cut a wide peel with little white pith (pith is bitter), hold it skin-side down over the drink and pinch it so the oils mist the surface. Optionally run it along the rim, then drop it in or discard it as the spec says.","Flamed orange peel: warm the skin with a lit match, then squeeze the oils through the flame onto the drink for a caramelized orange aroma. Popularized by Dale DeGroff. Do it away from guests and never near hair, napkins or high-proof spills.","Mint: give the sprig a light slap to wake up the aroma, and place it next to the straw so the guest smells it with every sip. Remove brown or bruised leaves.","Salt and sugar rims: do a half rim on the outside of the glass only, so the guest can choose, and nothing falls into the drink.","Match the glass to the drink. Coupe or Nick & Nora for drinks served up; rocks or double rocks for drinks on ice; highball or Collins for tall drinks; julep cup for juleps; flute for sparkling; tiki mugs for tiki.","Handle glasses by the stem or base, never the rim. Check every glass for lipstick, chips and water spots before it goes out. A chipped glass gets tossed immediately, not set aside.","Consistency is presentation. The same drink should look identical every time it leaves the bar: same garnish, same fill line, same ice."],"c":[["Why does garnish matter?","It provides aroma, which drives flavor."],["How do you express a peel?","Skin-side down over the drink, pinch to spray the oils."],["Why avoid pith?","It's bitter."],["Flamed orange peel?","Squeeze warm peel oils through a flame for caramelized orange aroma; Dale DeGroff."],["How to prep a mint garnish?","Slap it lightly; place it by the straw."],["How should salt rims be applied?","Half rim, outside of the glass only."]],"q":[["Why express a peel skin-side down over the drink?","So the oils spray onto the surface","So the pith faces up","Tradition only","To keep the peel from dripping","Aroma is most of what we taste."],["Flaming an orange peel adds:","A caramelized orange aroma","Smoke flavor throughout the drink","Extra sweetness","Nothing; it's for show only","Popularized by Dale DeGroff."],["Where does the mint sprig go in a Julep?","Next to the straw, so the guest smells it each sip","Under the ice","Muddled at the bottom only","On the side plate","Slap it first to wake it up."],["A Margarita gets a half salt rim because:","The guest can choose salt or not with each sip","It saves salt","Full rims are illegal","Salt dilutes the drink","And rim only the outside of the glass."],["Why cut peels without much white pith?","Pith is bitter","Pith has no color","Pith makes it too sweet","Pith dissolves","Wide peel, thin pith."],["A Negroni's classic garnish:","Orange peel or slice","Lemon twist","Cherry","Olive","Orange suits Campari."],["A Nick & Nora glass is mainly for:","Smaller stirred drinks served up","Highballs","Beer","Hot drinks","Elegant and less spill-prone than a wide coupe."],["The same drink should look identical every time because:","Consistency is presentation and builds trust","Managers like photos","It's faster","It uses less garnish","Same garnish, fill line and ice."]],"pro":[["Your coworker drops lemon peels into every drink without expressing them.","The aroma is in the oils. Expressing sprays them over the surface where the nose meets the drink. Without it, the peel is decoration.","Show them: peel skin-side down, pinch over the surface, rim the glass, then drop or discard per spec."],["A guest's drink goes out with a lipstick mark on the glass.","Every glass gets checked before it leaves: lipstick, chips, water spots. If it's already out, apologize and replace it immediately.","Apologize, remake in a fresh, checked glass, and check the rest of the rack."],["You're asked why a Julep is served in a metal cup.","Metal conducts cold, so the cup frosts over, and the packed crushed ice keeps the drink very cold. It's also tradition.","'The metal frosts over and keeps it ice cold. That's the classic Kentucky way.'"]]},{"id":"x12","track":"Mixology","title":"Hospitality & Responsible Service","k":["Great bartenders get hired for hospitality as much as technique. Greet every guest fast, make eye contact, get water down, and read the situation: date night, business, solo regular, celebration. Each needs a different pace and level of conversation.","Guiding a guest who doesn't know what they want: 'What spirits do you usually like? Something refreshing or spirit-forward? Sweet, sour, bitter?' Then suggest two options. Never make a guest feel bad about what they order, vodka soda included.","A drink sent back is a chance, not an insult. Listen, apologize, fix it fast (adjust or remake, or offer something else), and never argue. Tell your manager if it'll be comped.","Remember names and drinks. Regulars build a bar's business, and they follow good bartenders.","Checking ID: look at the photo, date of birth and expiration date, and feel the card. Acceptable ID usually means a valid driver's license, state ID, passport or military ID. If you're unsure, ask a manager. When in doubt, don't serve.","Signs of intoxication: louder or more aggressive, slurred speech, stumbling, glassy eyes, slowed reactions, spilling drinks, ordering faster. Count drinks and slow service early (water, food) rather than waiting for a problem.","Cutting someone off: do it privately and calmly, with a manager's backup. Say 'I can't serve you any more alcohol tonight, but I can get you water, coffee or food.' Don't blame or lecture. Help arrange a safe ride.","In Las Vegas (Clark County) you need an Alcohol Awareness (TAM) card within 30 days of starting an alcohol-serving job; it's valid for 4 years. You also need a Southern Nevada Health District food handler card. Check current rules with your employer."],"c":[["Three questions to guide an undecided guest?","Which spirits do you like? Refreshing or spirit-forward? Sweet, sour or bitter?"],["Drink sent back. Steps?","Listen, apologize, fix fast, don't argue; loop in the manager if comping."],["What do you check on an ID?","Photo, date of birth, expiration, and feel the card."],["Five signs of intoxication?","Loud/aggressive, slurred speech, stumbling, glassy eyes, slow reactions (also spilling, ordering faster)."],["How do you cut someone off?","Privately, calmly, with manager backup; offer water/food; help arrange a ride."],["Clark County alcohol card rule?","Alcohol Awareness (TAM) card within 30 days of starting; valid 4 years."],["Other required Las Vegas card?","Southern Nevada Health District food handler card."]],"q":[["A guest wants an Aperol Spritz but less sweet. Good pick:","A Campari Spritz","A Mai Tai","A Piña Colada","A Long Island","Same format, drier and more bitter."],["A guest can't decide. The best three questions:","What spirits do you like? Refreshing or spirit-forward? Sweet, sour or bitter?","What's your budget? Are you driving? How hungry are you?","Do you want the strongest drink? What color? Hot or cold?","What did you drink last night? What's your sign? Beer or wine?","Then suggest two options."],["A guest sends back an Old Fashioned as 'too sweet.' You:","Apologize, ask what they'd like, and remake it drier","Explain the spec is correct","Add a lemon wedge","Offer them a beer instead","Never argue; fix it fast."],["A guest has had three Old Fashioneds in an hour and orders a fourth. Smart move:","Slow the pace: water, food, check in","Make it a double","Serve it quickly before they get louder","Refuse loudly at the bar","Pace guests before problems start."],["Cutting someone off, the right line:","'I can't serve you any more alcohol tonight, but I can get you water, coffee or food.'","'You've had enough, you're drunk.'","'The manager says you're done.'","'We're closing the bar for you.'","Private, calm, with manager backup."],["In Clark County, the Alcohol Awareness (TAM) card must be obtained:","Within 30 days of starting an alcohol-serving job","Before your first shift","Within 1 year","Only if you're a manager","Valid for 4 years."],["Checking an ID you're unsure about. You:","Ask a manager; when in doubt, don't serve","Serve them if they look over 30","Ask for a second drink order","Hand it back and say nothing","Check photo, birth date, expiry, and feel the card."],["A regular walks in. The most valuable thing you can do:","Remember their name and drink","Give them a free drink","Seat them anywhere","Ask what they'd like","Regulars follow good bartenders."]],"pro":[["A guest sends back a Negroni: 'too bitter.'","Don't argue. Offer to adjust (a softer Negroni with Aperol, or a Boulevardier) or a different drink. Tell your manager if it's a comp.","'Sorry about that. I can make it with Aperol, which is softer, or try a Boulevardier, which is richer. What sounds good?'"],["A regular is getting louder and orders his fourth drink fast.","Count drinks and slow down early: water, food, a slower pace, before he's visibly drunk. If he's showing signs, involve a manager and cut off privately.","Drop water and a menu, 'Want to grab some food?', take a little longer on the next drink, tell your manager to keep an eye out."],["A guest asks for 'whatever's good.'","Narrow it down with three quick questions, then offer two options. It feels personal and gets them a drink they'll love.","'What spirits do you usually go for? Refreshing or spirit-forward? Sweet, sour or bitter?' Then offer two drinks."]]},{"id":"x13","track":"Mixology","title":"Batching, Costing & Menu Development","k":["Batching: multiply a spec by the number of servings. For stirred drinks, add water for dilution (about 20–25% of the batch volume) so you can pour straight from the fridge or freezer into a glass. For shaken drinks, batch the spirits, liqueurs and syrups, and add fresh citrus at service before shaking.","Bottle math: a 750 ml bottle holds about 25.4 oz; a liter holds about 33.8 oz.","Cost per ounce = bottle cost ÷ ounces in the bottle. Example: a $30 750 ml bottle costs about $1.18 per ounce.","Drink cost = the cost of every ingredient, including citrus, syrup and garnish. Pour cost % = drink cost ÷ menu price × 100. Many bars aim for roughly 18–24% on cocktails, but every bar sets its own target.","Worked example: 2 oz of that $30 gin ($2.37) + ¾ oz lime ($0.25) + ¾ oz simple ($0.05) + garnish ($0.10) = about $2.77. At a $16 menu price, pour cost is about 17%.","A balanced menu covers different spirits (not five whiskey drinks), styles (refreshing, sour, spirit-forward, bitter, low-ABV, zero-proof) and price points. Check how much prep and time each drink takes on a busy night.","R&D process: start from a classic template, change one thing at a time, keep notes on every version, have other bartenders taste it, and only finalize after it tastes right three times in a row.","A spec card lists: drink name, glass, ice, method (shake, stir, build), garnish, and ingredients in exact amounts in pour order. Add cost and pour cost % at the bottom. Bring 3–5 of your own finished spec cards to interviews."],"c":[["Batching stirred drinks: what do you add?","Water for dilution, about 20–25% of the batch."],["What do you NOT batch for shaken drinks?","Fresh citrus; add it at service."],["Ounces in 750 ml? In a liter?","About 25.4 oz; about 33.8 oz."],["Cost per ounce formula?","Bottle cost ÷ ounces in the bottle."],["Pour cost % formula?","Drink cost ÷ menu price × 100."],["Typical cocktail pour cost target?","Roughly 18–24% (varies by bar)."],["What makes a balanced menu?","Spread of spirits, styles and prices, plus realistic prep and speed."],["What goes on a spec card?","Name, glass, ice, method, garnish, ingredients in pour order, cost."]],"q":[["You batch 20 Manhattans for service from the freezer. Add water equal to about:","20–25% of the batch volume","5% of the batch","50% of the batch","None; freezer drinks need no water","Dilution is part of the spec."],["A $30 750 ml bottle costs about how much per ounce?","$1.18","$1.00","$1.50","$0.88","750 ml ≈ 25.4 oz."],["A $40 liter bottle costs about how much per ounce?","$1.18","$1.00","$1.33","$1.60","1 L ≈ 33.8 oz."],["Drink cost $3.20, menu price $16. Pour cost:","20%","16%","25%","32%","3.20 ÷ 16 = 0.20."],["For a shaken drink batch, you should:","Batch spirits, liqueurs and syrups; add fresh citrus at service","Batch everything including lime the day before","Batch nothing","Add dilution water to the batch","Citrus fades fast."],["Your 6-drink menu has five whiskey drinks. The fix:","Spread across spirits and styles: refreshing, sour, bitter, low-ABV, zero-proof","Add a sixth whiskey drink","Raise prices","Remove garnishes","Balance the menu."],["When is a new drink ready to go on the menu?","After it tastes right three times in a row and others have tasted it","The first time it tastes good","After one guest likes it","When the manager names it","Change one thing at a time and keep notes."],["A spec card lists ingredients in:","Exact amounts in pour order, with glass, ice, method and garnish","Alphabetical order","Price order, most expensive first","Approximate amounts","Add cost and pour cost at the bottom."]],"pro":[["Your manager asks you to price a new drink: 2 oz gin ($30/750 ml), ¾ oz lime ($0.25), ¾ oz simple ($0.05), garnish ($0.10). Target pour cost 20%.","Gin: 30 ÷ 25.4 ≈ $1.18/oz, × 2 = $2.37. Total ≈ $2.77. Price = cost ÷ target = 2.77 ÷ 0.20 ≈ $13.85, so round to $14.","'It costs about $2.77. At 20% pour cost, it's about $14 on the menu.'"],["You're batching Negronis for a private event of 100.","Multiply the spec (1 oz each) by 100 = 100 oz of each. Stirred drinks need dilution added: about 20–25%. Label, chill, taste before service.","100 oz each gin, Campari, sweet vermouth, plus about 60–75 oz water, chill, taste, label, pour over ice to order."],["Your new drink takes 90 seconds to make and the bar does 300 covers on Saturday.","A great drink that kills ticket times is a menu problem. Simplify: batch the base, cut garnish steps, or keep it for slower nights.","Batch the spirits and syrup, add citrus fresh, simplify the garnish, and time it again."]]},{"id":"x14","track":"Mixology","title":"The Stage, the Interview & Your Career","k":["A stage (pronounced 'stahzh') is a working interview: you work a shift, or part of one, so the team can see how you move, think and treat people. At top bars it matters more than your resume.","Before the stage: study their menu until you can describe every drink, look at their backbar on social media, visit as a guest if you can, and know their classics specs. Ask what to wear (often all black with non-slip shoes) and when to arrive.","Bring: a wine key, two pens, a Sharpie, a small notebook. Leave your own tools at home unless they say otherwise. Arrive 10–15 minutes early.","During: ask 'Where can I help?' and never stand still. Polish glassware, restock, wipe down, take out trash. Follow their specs exactly, even if you'd make it differently. Watch how they set up and move. Ask before tasting. Show urgency and clean habits. Be kind to the dishwasher and barback; they're watching too.","'Make me a drink' test: ask what they like, then make a classic you can nail perfectly. A perfect Daiquiri is the classic test of balance, technique and confidence. Explain your choice in one sentence. Taste it with a straw before you hand it over.","Common interview questions: Why bartending? What's your favorite classic, and what's the spec? How do you handle a rush? Tell me about a difficult guest. What are you drinking lately? What do you know about our program? Have short, honest stories ready.","After: send a short thank-you message that day. If you don't get the job, ask what to work on, and ask if you can barback or trail. Barbacking at a top craft bar is the fastest path to bartending at one.","Keep growing: required cards first (TAM, health card). Then pick from the WSET Level 2 Award in Spirits, the Cicerone Certified Beer Server, BarSmarts, and your local USBG (United States Bartenders' Guild) chapter for classes, events and competitions. Keep a personal spec book and photos of your drinks."],"c":[["What is a stage?","A working interview shift."],["What to bring to a stage?","Wine key, pens, Sharpie, small notebook."],["First thing to say at a stage?","'Where can I help?'"],["Their spec differs from yours. You:","Follow their spec exactly."],["Best drink for the 'make me something' test?","A classic you can nail — a perfect Daiquiri is the standard test."],["What to do after a stage?","Send a thank-you message the same day."],["Didn't get the job. Next move?","Ask for feedback, offer to barback or trail."],["Fastest path into a top craft bar?","Barback there and learn."],["Two good certifications to pursue next?","WSET L2 Spirits, Cicerone Certified Beer Server (also BarSmarts, USBG)."]],"q":[["At a stage they say, 'Spec me a Last Word.' You answer:","¾ oz each gin, green Chartreuse, maraschino, lime","2 oz gin, ¾ lime, ¾ simple","1 oz gin, 1 oz Campari, 1 oz sweet vermouth","1½ oz gin, ½ oz yellow Chartreuse, ¼ oz lime","Equal parts, shaken, up."],["The bar's Margarita spec differs from yours. You:","Make theirs exactly","Make yours; it's better","Ask the guest which they want","Split the difference","Their bar, their specs."],["'Make me something.' Your strongest move:","Ask what they like, then nail a classic like a Daiquiri and explain it in one line","Make your most complicated original","Make a shot","Make something with every bottle on the backbar","Balance and confidence."],["Interview question: 'What are you drinking lately?' Best answer:","A specific bottle or drink and why you like it","'Whatever's cheap'","'I don't really drink'","'Anything, I'm easy'","Shows curiosity and palate."],["After a stage, the same day you:","Send a short thank-you message","Wait for them to call","Post about it online","Ask about pay","Then ask what to work on if it's a no."],["The fastest path into a top craft bar if you don't get hired:","Ask to barback or trail there","Apply as head bartender somewhere else","Get an online certificate","Wait a year","Learn the program from the inside."],["Good next certifications for a craft bartender:","WSET Level 2 Spirits and the Cicerone Certified Beer Server","A food handler card only","A flair bartending course","A real estate license","Plus USBG classes."],["During a stage you see a faster way to do their prep. You:","Do it their way and mention it later if it's welcome","Do it your way to impress them","Tell the head bartender mid-rush","Ignore it forever","Show you can follow systems first."]],"pro":[["At a stage, the head bartender asks: 'What's your favorite classic, and spec it.'","Pick one you can make perfectly and talk about: spec, why you love it, a riff you know. Specific beats impressive.","'The Daiquiri: 2 oz white rum, 1 oz lime, ¾ oz simple, shaken hard, coupe.
