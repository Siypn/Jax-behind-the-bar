as","Primary aromas","Faults","From malolactic","From ageing."],["Red wine gets its color and tannin from:","Fermenting with the skins","Oak only","The pulp","Added coloring","Skin contact."],["Port stays sweet because:","Spirit is added during fermentation","Sugar is added after","Grapes are frozen","Noble rot","Fortification stops yeast."]]},{"id":"wp3","track":"Wine Exam Prep","title":"Cabernet Sauvignon & Merlot","k":["Cabernet Sauvignon: thick-skinned and late-ripening, so it needs a warm site. Black currant, black cherry, and mint or green bell pepper if underripe. High tannin, high acid, a natural partner for oak, and built to age.","Bordeaux Left Bank (Médoc, Haut-Médoc, with the villages Pauillac and Margaux; plus Graves and Pessac-Léognan): gravel soils, Cabernet-led blends with Merlot (and Cabernet Franc, Petit Verdot). Pauillac is home to three of the five First Growths from the 1855 classification.","New World Cabernet: Napa Valley and Sonoma (riper, fuller, black fruit, sweet vanilla oak, softer tannin; Opus One and Duckhorn on the Mott 32 list), Coonawarra (terra rossa soil, mint and eucalyptus), Margaret River, Chile (Maipo, Colchagua), Stellenbosch, Hawke's Bay.","Merlot: earlier ripening, plush plum and red-to-black fruit, medium tannin. Softer than Cabernet.","Bordeaux Right Bank (Saint-Émilion, Pomerol): clay and limestone soils, Merlot-led blends with Cabernet Franc. Les Cadrans de Lassègue Saint-Émilion Grand Cru on the Mott 32 list is a Right Bank wine.","New World Merlot: Napa and Sonoma, Chile's Central Valley, Stellenbosch, Margaret River, Hawke's Bay, and simple varietal wines from the South of France (Pays d'Oc PGI)."],"c":[["Cabernet Sauvignon character?","Black currant, black cherry, mint; high tannin and acid."],["Underripe Cabernet aromas?","Green bell pepper, herbaceous."],["Left Bank soils and blend?","Gravel; Cabernet-led with Merlot."],["Right Bank soils and blend?","Clay/limestone; Merlot-led with Cabernet Franc."],["Two Left Bank villages?","Pauillac and Margaux."],["Two Right Bank appellations?","Saint-Émilion and Pomerol."],["Coonawarra signature?","Terra rossa soil; mint and eucalyptus notes."],["Merlot vs Cabernet?","Merlot: earlier ripening, plummy, softer tannin."]],"q":[["Pomerol and Saint-Émilion are dominated by:","Merlot","Cabernet Sauvignon","Pinot Noir","Syrah","Right Bank."],["Pauillac is on Bordeaux's:","Left Bank","Right Bank","It's in Burgundy","It's in the Rhône","Médoc."],["Mint and eucalyptus in Cabernet suggest:","Coonawarra (Australia)","Pomerol","Chablis","Mosel","Australian signature."],["Napa Cabernet compared with Pauillac is usually:","Riper and fuller with softer tannin","Lighter and more acidic","Sweet","Unoaked","Warm, sunny."],["Les Cadrans de Lassègue Saint-Émilion is likely:","Merlot-led","Cabernet-led","Pinot Noir","White","Right Bank."],["Green bell pepper in Cabernet indicates:","Underripe grapes","Oak","Age","Noble rot","Pyrazines."]]},{"id":"wp4","track":"Wine Exam Prep","title":"Pinot Noir & Chardonnay","k":["Pinot Noir: thin skins and early ripening, so it suits cool to moderate climates. Red fruit (strawberry, raspberry, red cherry), low to medium tannin, high acid. With age: forest floor, mushroom, earth.","Burgundy's Côte d'Or is Pinot's spiritual home: Côte de Nuits villages (Gevrey-Chambertin, Nuits-Saint-Georges) and Côte de Beaune villages (Beaune, Pommard). Labels run from regional Bourgogne up to village, Premier Cru and Grand Cru.","New World Pinot: Carneros, Sonoma and Santa Barbara County (riper red and black cherry), Oregon (often more restrained), Chile's Casablanca Valley, Walker Bay, the Yarra Valley and Mornington Peninsula, and in New Zealand Martinborough, Marlborough and Central Otago (riper, darker fruit). The Mott 32 list has Frédéric Magnien (Bourgogne) and Calera (Central Coast).","Chardonnay: a fairly neutral grape that shows its climate and winemaking. Cool: green apple, citrus, high acid. Moderate: stone fruit, melon. Warm: tropical fruit (pineapple, banana).","Burgundy Chardonnay: Chablis (cool, high acid, usually little or no new oak; the Laroche on the Mott 32 list), Côte de Beaune whites (Puligny-Montrachet: elegant; Meursault: richer, often oaked), and the warmer Mâconnais (Mâcon, Pouilly-Fuissé).","New World Chardonnay: California (Napa, Sonoma, Carneros, Santa Barbara; often riper with MLF and oak, like Far Niente and Neyers on your list), Oregon, Casablanca, Western Cape and Walker Bay, Adelaide Hills, Yarra Valley, Margaret River, Marlborough and Hawke's Bay.","Both grapes are pillars of Champagne: Chardonnay alone makes Blanc de Blancs; Pinot Noir and Meunier make Blanc de Noirs."],"c":[["Pinot Noir character?","Red fruit, low–medium tannin, high acid; earthy with age."],["Côte de Nuits villages (two)?","Gevrey-Chambertin, Nuits-Saint-Georges."],["Côte de Beaune red villages (two)?","Beaune, Pommard."],["Central Otago Pinot style?","Riper, darker fruit."],["Chardonnay in a cool vs warm climate?","Cool: green apple, citrus, high acid. Warm: tropical fruit."],["Chablis style?","Cool, high acid, little or no new oak."],["Meursault vs Puligny-Montrachet?","Meursault richer, often oaked; Puligny more elegant."],["Blanc de Blancs?","Champagne from Chardonnay only."]],"q":[["Pinot Noir is best suited to:","Cool to moderate climates","Very hot climates","Only sweet wines","Only fortified wines","Thin skins, early ripening."],["Gevrey-Chambertin is in:","Côte de Nuits","Côte de Beaune","Chablis","Mâconnais","Northern Côte d'Or."],["Pineapple and banana in Chardonnay suggest:","A warm climate","A cool climate","Noble rot","Carbonic maceration","Ripe, tropical."],["A steely, high-acid Chardonnay with little oak is likely:","Chablis","Napa","Meursault","Barossa","Cool northern Burgundy."],["Blanc de Noirs Champagne is made from:","Black grapes (Pinot Noir and/or Meunier)","Chardonnay only","Riesling","Any white grape","White wine from black grapes."]]},{"id":"wp5","track":"Wine Exam Prep","title":"Syrah, Sauvignon Blanc, Riesling & Pinot Gris","k":["Syrah/Shiraz: black fruit, black pepper, smoky and meaty notes, medium to high tannin. Northern Rhône: Côte-Rôtie (sometimes co-fermented with a little Viognier), Hermitage (powerful, long-lived), Crozes-Hermitage (more approachable). Also varietal Syrah from the South of France (Pays d'Oc PGI).","Australian Shiraz: Barossa Valley (rich, ripe black fruit, chocolate, sweet oak), Hunter Valley (medium-bodied, earthy, ages to leather), and South Eastern Australia (large-volume, fruity, inexpensive).","Sauvignon Blanc: aromatic, high acid, usually unoaked. Grass, green bell pepper, gooseberry, elderflower, passion fruit. Loire: Sancerre and Pouilly-Fumé (restrained, flinty; the Sancerre on the Mott 32 list), Touraine. Bordeaux: blended with Sémillon (Graves, Pessac-Léognan, often oaked). Marlborough, New Zealand: pungent passion fruit and gooseberry. Also Napa, Chile, Elgin and Constantia, Adelaide Hills and Margaret River.","Riesling: very high acid, rarely oaked, from bone dry to very sweet. Floral, citrus, green apple, stone fruit; ages to honey, toast and petrol. Germany: Mosel (light, low alcohol, often off-dry; the Carl Graff on your list), Rheingau and Pfalz (fuller, often drier). Alsace: dry and fuller. Australia's Clare and Eden Valleys: dry, lime, toast with age.","Pinot Grigio/Pinot Gris: one grape, two styles. Italian Pinot Grigio (Veneto, Delle Venezie, Friuli; the Barone Fini on your list) is light, crisp and neutral, with citrus and pear. Alsace Pinot Gris is full-bodied, spicy and honeyed, sometimes off-dry."],"c":[["Syrah signature notes?","Black fruit, black pepper, smoky, meaty."],["Three Northern Rhône Syrah appellations?","Côte-Rôtie, Hermitage, Crozes-Hermitage."],["Barossa vs Hunter Valley Shiraz?","Barossa rich and ripe; Hunter medium-bodied and earthy."],["Sancerre and Pouilly-Fumé grape?","Sauvignon Blanc."],["Marlborough Sauvignon Blanc style?","Pungent passion fruit and gooseberry."],["Aged Riesling aromas?","Honey, toast, petrol."],["Mosel Riesling style?","Light, low alcohol, often off-dry."],["Pinot Grigio vs Alsace Pinot Gris?","Grigio light and neutral; Alsace full, spicy, honeyed."]],"q":[["Black pepper is a classic note of:","Syrah","Pinot Noir","Riesling","Merlot","Rotundone."],["Pouilly-Fumé is made from:","Sauvignon Blanc","Chardonnay","Riesling","Chenin Blanc","Loire."],["A petrol note in an older white suggests:","Riesling","Chardonnay","Pinot Grigio","Sauvignon Blanc","Classic aged Riesling."],["Light, low-alcohol, off-dry Riesling with high acid is typical of:","Mosel","Clare Valley","Alsace","Barossa","German classic."],["Côte-Rôtie may include a little:","Viognier","Chardonnay","Grenache","Merlot","Co-fermentation."],["Pinot Grigio from Veneto is usually:","Light, crisp and neutral","Full and sweet","Oaky and rich","Red","Italian style."]]},{"id":"wp6","track":"Wine Exam Prep","title":"Regionally Important Black Grapes","k":["Gamay: Beaujolais. Light, red fruit, low tannin, often carbonic maceration. The Beaujolais Crus (like Morgon, Fleurie, Moulin-à-Vent) are more structured.","Grenache/Garnacha: Southern Rhône (Côtes du Rhône, Châteauneuf-du-Pape, often blended with Syrah and Mourvèdre) and Spain (Priorat, and blends in Rioja). Red fruit, spice, high alcohol, low to medium tannin.","Tempranillo: Spain's star. Rioja (red fruit, with vanilla and coconut when aged in American oak) and Ribera del Duero (darker, fuller). Rioja ageing terms: Crianza (at least 2 years, 1 in oak), Reserva (at least 3 years, 1 in oak), Gran Reserva (at least 5 years, 2 in oak).","Italian reds: Nebbiolo (Barolo, Barbaresco: pale, high tannin and acid, rose and tar); Barbera (Piedmont: high acid, low tannin, red cherry); Sangiovese (Tuscany: Chianti, Chianti Classico, Brunello di Montalcino; red cherry, dried herbs, high acid and tannin); Corvina (Valpolicella and Amarone, made from dried grapes); Montepulciano (the grape of Montepulciano d'Abruzzo; not the same as Vino Nobile di Montepulciano, which is Sangiovese).","Zinfandel/Primitivo: California (ripe, jammy, high alcohol) and Puglia in southern Italy (Primitivo).","Pinotage: South Africa's own cross of Pinot Noir and Cinsault. Carmenère: Chile's signature, black fruit with a green pepper note. Malbec: Mendoza, Argentina (high altitude, dark fruit, fresh acid; the Corazón del Sol on your list is from the Uco Valley) and its original home, Cahors in France."],"c":[["Beaujolais grape?","Gamay."],["Châteauneuf-du-Pape main grape?","Grenache (blended with Syrah, Mourvèdre and others)."],["Rioja Crianza / Reserva / Gran Reserva?","2 yrs (1 oak) / 3 yrs (1 oak) / 5 yrs (2 oak), minimums."],["Barolo and Barbaresco grape?","Nebbiolo."],["Brunello di Montalcino grape?","Sangiovese."],["Amarone grape and method?","Corvina, from dried grapes."],["Montepulciano d'Abruzzo vs Vino Nobile di Montepulciano?","The first is the Montepulciano grape; the second is Sangiovese."],["Pinotage parents?","Pinot Noir × Cinsault."],["Malbec's two homes?","Mendoza (Argentina) and Cahors (France)."]],"q":[["Vanilla and coconut in Rioja come from:","American oak","Carbonic maceration","Noble rot","Stainless steel","Classic Rioja oak."],["Vino Nobile di Montepulciano is made mainly from:","Sangiovese","Montepulciano","Nebbiolo","Barbera","A classic trap question."],["A pale red with high tannin and rose and tar notes:","Nebbiolo","Gamay","Merlot","Zinfandel","Barolo."],["Amarone is made from:","Dried Corvina grapes","Frozen grapes","Botrytised grapes","Carbonic maceration","Appassimento."],["Chile's signature red with a green pepper note:","Carmenère","Malbec","Pinotage","Barbera","Chilean signature."],["Primitivo is the same grape as:","Zinfandel","Tempranillo","Grenache","Gamay","DNA match."]]},{"id":"wp7","track":"Wine Exam Prep","title":"Regionally Important White Grapes","k":["Chenin Blanc: Loire (Vouvray: dry to sweet and sparkling; Savennières: dry, intense) and South Africa (fresh to rich, oaked styles). High acid; apple, quince, honey.","Sémillon: Bordeaux, blended with Sauvignon Blanc for dry whites and for sweet Sauternes (noble rot). Australia's Hunter Valley Sémillon is low in alcohol and ages from lemony to toasty and honeyed.","Viognier: Condrieu in the Northern Rhône. Apricot, peach, blossom; full-bodied, lower acid.","Gewürztraminer: Alsace. Lychee, rose, ginger spice; full-bodied, low acid, often off-dry.","Italy: Verdicchio (Marche: citrus, almond), Cortese (Gavi in Piedmont: crisp, citrus), Garganega (Soave in the Veneto: almond, stone fruit), Fiano (Campania, Fiano di Avellino: rich, waxy). On your list, the Buglioni Lugana is made from Turbiana (also called Trebbiano di Lugana), a close relative of Verdicchio.","Spain and Hungary: Albariño (Rías Baixas: aromatic, peach and citrus, high acid) and Furmint (Tokaj: the grape behind sweet Tokaji Aszú and also excellent dry wines)."],"c":[["Vouvray grape?","Chenin Blanc."],["Sémillon in Bordeaux is used for?","Dry blends with Sauvignon Blanc and sweet Sauternes."],["Hunter Valley Sémillon?","Low alcohol; ages to toast and honey."],["Condrieu grape?","Viognier."],["Gewürztraminer signature?","Lychee, rose, spice; low acid, full body."],["Gavi grape?","Cortese."],["Soave grape?","Garganega."],["Rías Baixas grape?","Albariño."],["Tokaji grape?","Furmint."]],"q":[["Lychee and rose petal suggest:","Gewürztraminer","Chardonnay","Sauvignon Blanc","Furmint","Aromatic Alsace grape."],["Condrieu is made from:","Viognier","Chenin Blanc","Marsanne","Chardonnay","Northern Rhône white."],["Gavi is made from:","Cortese","Garganega","Fiano","Verdicchio","Piedmont."],["The grape of Tokaji Aszú:","Furmint","Sémillon","Riesling","Albariño","Hungary."],["Vouvray can be:","Dry, sweet or sparkling","Only sweet","Only red","Only fortified","Chenin's range."]]},{"id":"wp8","track":"Wine Exam Prep","title":"Sparkling, Sweet & Fortified Wines","k":["Traditional method (Champagne, Cava, Crémant, South Africa's Méthode Cap Classique): base wine plus sugar and yeast goes into the bottle for a second fermentation; the wine then ages on the dead yeast (lees), gaining brioche and toast notes; then riddling, disgorgement and a final dosage that sets sweetness.","Champagne: Chardonnay, Pinot Noir and Meunier. Non-vintage must age at least 15 months (12 on the lees); vintage at least 3 years. Cava (Spain) uses local grapes like Macabeo, Xarel-lo and Parellada.","Tank method: the second fermentation happens in a pressurized tank, keeping fresh fruit flavors. Prosecco (Glera grape) is the classic. Asti (Moscato) ferments once in a pressurized tank and is stopped early: sweet, grapey, low alcohol.","Sweetness labels: Brut Nature (0–3 g/L), Extra Brut (0–6), Brut (under 12), Extra Dry (12–17), Sec, Demi-Sec (32–50), Doux. Extra Dry is sweeter than Brut, a common trap.","Sweet still wines: noble rot (Sauternes, Tokaji Aszú, German Beerenauslese and Trockenbeerenauslese), late harvest (Alsace Vendanges Tardives), and frozen grapes (Eiswein in Germany, icewine in Canada).","Sherry (Jerez, Spain; mainly Palomino): Fino and Manzanilla age under a yeast layer called flor (pale, dry, tangy). Amontillado ages first under flor, then with oxygen. Oloroso ages with oxygen only (nutty, darker). Sweetened styles: Pale Cream, Medium, Cream. PX (Pedro Ximénez) is made from dried grapes and is intensely sweet. Sherry is blended through a solera system.","Port (Douro Valley, Portugal): grape spirit is added during fermentation, keeping natural sweetness. Ruby and Reserve Ruby (young, fruity), LBV (bottled 4–6 years after harvest), Vintage (declared years only, bottled young, ages for decades, needs decanting), Tawny (long wood ageing, nutty; 10, 20, 30, 40 years old) and Colheita (single-vintage tawny)."],"c":[["Traditional method steps?","Second fermentation in bottle → lees ageing → riddling → disgorgement → dosage."],["Champagne grapes?","Chardonnay, Pinot Noir, Meunier."],["Champagne NV minimum ageing?","15 months, 12 on the lees."],["Prosecco grape and method?","Glera; tank method."],["Asti?","Moscato, single tank fermentation stopped early: sweet, low alcohol."],["Extra Dry vs Brut?","Extra Dry is sweeter (12–17 g/L) than Brut (under 12)."],["Three ways to make sweet still wine?","Noble rot, late harvest, frozen grapes (plus drying)."],["Fino vs Oloroso?","Fino ages under flor (pale, dry); Oloroso oxidative (nutty, darker)."],["What is PX?","Pedro Ximénez: intensely sweet sherry from dried grapes."],["Vintage Port vs Tawny?","Vintage ages in bottle, needs decanting; Tawny ages long in wood, nutty."]],"q":[["Which is sweetest?","Demi-Sec","Brut","Extra Brut","Brut Nature","32–50 g/L."],["Brioche notes in Champagne come from:","Ageing on the lees","Oak barrels","Noble rot","Tank method","Autolysis."],["Prosecco is usually made by the:","Tank method","Traditional method","Carbonic maceration","Solera system","Charmat."],["Sherry aged under flor that stays pale and dry:","Fino","Oloroso","Cream","PX","Biological ageing."],["Port is sweet because:","Grape spirit stops fermentation early","Sugar is added after bottling","Grapes are frozen","Of noble rot","Fortification."],["Eiswein is made from:","Grapes frozen on the vine","Dried grapes","Botrytised grapes","Sparkling base wine","Ice wine."]]},{"id":"wp9","track":"Wine Exam Prep","title":"Tasting, Service & Food Pairing (Exam Style)","k":["Systematic tasting: appearance (clarity, intensity, colour), nose (condition, intensity, aromas), palate (sweetness, acidity, tannin, alcohol, body, flavour intensity, flavours, finish), conclusion (quality).","Judging quality, think BLIC: Balance, Length (finish), Intensity, Complexity. Most exams expect you to justify a quality call with these.","Storage: bottles with corks lie on their side; keep wine cool, at a steady temperature, dark, away from vibration and strong smells.","Common faults: cork taint (TCA: musty, wet cardboard, muted fruit), oxidation (flat, brown-tinged, sherry-like in a wine that shouldn't be), and reduction (struck match, rotten egg).","Food effects on wine: sweetness and umami in food make wine taste more bitter, acidic and drying, and less sweet and fruity. Salt and acid in food make wine taste less bitter and acidic, and more fruity and smooth. Bitterness in food adds to bitterness in wine. Chili heat makes alcohol burn more.","Pairing rules that follow: dessert needs a wine at least as sweet; umami-rich dishes need fruitier, lower-tannin wines; salty dishes are forgiving; high-acid wines cut fat; avoid high-alcohol, tannic wines with spicy food.","Exam formats (check the current rules before booking): WSET Level 2 Wines is 50 multiple-choice questions in 60 minutes, pass at 55%. The Court of Master Sommeliers Introductory exam is multiple choice after a two-day course."],"c":[["Four stages of systematic tasting?","Appearance, nose, palate, conclusion."],["What does BLIC stand for?","Balance, Length, Intensity, Complexity."],["Why store corked bottles on their side?","Keeps the cork moist and sealed."],["TCA cork taint smells like?","Musty, wet cardboard."],["Reduction smells like?","Struck match, rotten egg."],["Sweetness/umami in food does what to wine?","Makes it more bitter, acidic, drying; less fruity."],["Salt/acid in food does what to wine?","Makes it less bitter and acidic; more fruity."],["Chili heat and wine?","Increases the burn of alcohol."],["WSET L2 Wines exam format?","50 multiple-choice in 60 minutes; pass 55%."]],"q":[["A musty, wet-cardboard smell indicates:","Cork taint (TCA)","Oxidation","Reduction","Brett","Classic cork fault."],["Umami-rich food makes a tannic red taste:","More bitter and drying","Sweeter","Fruitier","Unchanged","Umami amplifies tannin."],["Salty food makes wine taste:","Fruitier and smoother","More bitter","More acidic","Corked","Salt softens."],["A dessert wine should be:","At least as sweet as the dessert","Drier than the dessert","Always red","Sparkling","Sweetness rule."],["In BLIC, 'L' stands for:","Length","Lightness","Lees","Level","Finish length."],["Spicy food is most likely to clash with:","High-alcohol, tannic red","Off-dry Riesling","Light sparkling","Low-alcohol white","Heat amplifies alcohol."]]},{"id":"sp1","track":"Sake Exam Prep","title":"Rice, Water & Polishing","k":["Sake is made from four things: steamed rice, kōji, yeast and water, plus (in some styles) a small addition of distilled alcohol.","Sake rice (shuzō kōtekimai) differs from table rice: bigger grains, a starchy white core called shinpaku, and less protein and fat, which can cause off flavors.","Key varieties: Yamada Nishiki ('king of sake rice', grown famously in Hyōgo; elegant and balanced), Gohyakumangoku (Niigata; light, clean, crisp), Omachi (Okayama; one of the oldest varieties; rich, earthy), and Miyama Nishiki (Nagano; cold-hardy, clean).","Polishing (the seimai-buai) is the percentage of the grain left after milling. 60% means 40% was removed. More polishing removes more fat and protein, giving cleaner, more aromatic sake.","Water makes up about 80% of sake. Hard water (more minerals, like Nada's famous miyamizu in Hyōgo) drives a faster, stronger fermentation and drier, bolder sake. Soft water (Fushimi in Kyoto, Hiroshima) gives a slower fermentation and softer, more delicate sake.","Hiroshima's soft-water brewing method, developed in the late 1800s, helped make delicate, aromatic ginjō-style sake possible."],"c":[["Four main sake ingredients?","Rice, kōji, yeast, water (plus optional distilled alcohol)."],["What is shinpaku?","The starchy white core of sake rice."],["Why polish rice?","Removes fat and protein for cleaner, more aromatic sake."],["Seimai-buai 50% means?","50% of the grain remains."],["'King of sake rice'?","Yamada Nishiki."],["Gohyakumangoku style?","Light, clean, crisp (Niigata)."],["Omachi style?","Rich, earthy; one of the oldest varieties."],["Hard vs soft water sake?","Hard: faster ferment, drier, bolder. Soft: slower, softer, delicate."],["Nada's famous water?","Miyamizu (hard)."]],"q":[["The starchy core of sake rice is called:","Shinpaku","Kōji","Moto","Kasu","White heart."],["A seimai-buai of 40% means:","40% of the grain remains","40% was removed","40% ABV","40 days of fermentation","Percentage remaining."],["Yamada Nishiki is most associated with:","Hyōgo","Niigata","Okinawa","Hokkaido","King of sake rice."],["Soft water tends to give sake that is:","Softer and more delicate","Bolder and drier","Sparkling","Sweeter always","Slower fermentation."],["Rich, earthy sake rice with a long history:","Omachi","Gohyakumangoku","Miyama Nishiki","Table rice","Okayama heirloom."]]},{"id":"sp2","track":"Sake Exam Prep","title":"Kōji, Starters & Fermentation","k":["Kōji is steamed rice covered in the mold Aspergillus oryzae. It makes enzymes that turn the rice's starch into sugar.","Multiple parallel fermentation: kōji turns starch into sugar while yeast turns sugar into alcohol, at the same time in the same tank. That's why sake can reach about 18–20% ABV naturally, higher than wine.","The starter (shubo or moto) builds a strong yeast population protected by lactic acid. Sokujō (the modern method) adds lactic acid directly and takes about two weeks. Kimoto (traditional) lets natural lactic bacteria develop, including laborious pole-ramming of the mash, and takes about a month. Yamahai is kimoto without the ramming step.","Kimoto and yamahai sake are usually richer, gamier and higher in acidity and umami, and they often shine warmed.","Main mash (sandan shikomi): rice, kōji and water are added to the starter in three stages over four days, with a rest day after the first addition, so the yeast isn't overwhelmed.","Ginjō-style sake ferments slowly at low temperatures (around 10°C or below) for weeks, building fruity, floral aromas called ginjō-ka: apple, pear, melon, banana."],"c":[["What is kōji?","Steamed rice grown with Aspergillus oryzae mold; its enzymes turn starch to sugar."],["Multiple parallel fermentation?","Starch→sugar and sugar→alcohol happen together in one tank."],["Natural ABV of sake?","About 18–20%."],["Sokujō?","Modern starter: lactic acid added; about two weeks."],["Kimoto?","Traditional starter with natural lactic bacteria and pole-ramming; about a month."],["Yamahai?","Kimoto without the ramming step."],["Kimoto/yamahai flavor?","Richer, gamier, more acid and umami; good warm."],["Sandan shikomi?","Three-stage additions to the main mash over four days."],["Ginjō-ka aromas?","Apple, pear, melon, banana; from slow, cold fermentation."]],"q":[["The mold used to make kōji:","Aspergillus oryzae","Botrytis cinerea","Saccharomyces cerevisiae","Brettanomyces","Kōji-kin."],["Sake reaches high ABV naturally because of:","Multiple parallel fermentation","Distillation","Fortification only","Freezing","Simultaneous saccharification and fermentation."],["A starter that adds lactic acid directly:","Sokujō","Kimoto","Yamahai","Nigori","Modern, fast."],["Yamahai differs from kimoto by:","Skipping the pole-ramming step","Using no kōji","Being distilled","Being sparkling","Yama-oroshi haishi."],["Fruity, floral ginjō aromas come from:","Slow, cold fermentation","Hot fermentation","Oak ageing","Adding fruit","Ginjō-zukuri."]]},{"id":"sp3","track":"Sake Exam Prep","title":"Pressing, Pasteurizing & Special Styles","k":["Pressing separates sake from the lees (sake kasu). Methods: an automatic press (efficient), the traditional fune box press, or hanging bags so sake drips by gravity (shizuku or fukuro-tsuri, the gentlest and most prized).","Fractions of the press: arabashiri (first run: cloudy, lively), nakadori (middle: most balanced and often most prized), seme (last: pressed harder, more robust).","Filtering: most sake is charcoal-filtered for clarity and smoothness. Muroka means not charcoal-filtered, keeping more color and flavor.","Pasteurization (hi-ire) usually happens twice: before storage and before bottling. Nama: never pasteurized (fresh, lively; must be kept cold). Namachozo: pasteurized once, at bottling only. Namazume: pasteurized once, before storage only. Hiyaoroshi is an autumn release that's usually pasteurized only once.","Genshu: undiluted sake, about 17–20% ABV. Most sake is diluted with water to around 15–16%.","Special styles: nigori (coarsely filtered, cloudy), sparkling, koshu (aged; amber, nutty, soy and caramel), taruzake (cedar-cask aged), and kijōshu (made with sake replacing some of the water, giving a rich, sweet style)."],"c":[["Sake kasu?","The lees left after pressing."],["Shizuku / fukuro-tsuri?","Hanging-bag drip pressing; gentlest, most prized."],["Arabashiri, nakadori, seme?","First run (lively), middle (balanced), last (robust)."],["Muroka?","Not charcoal-filtered."],["Nama?","Never pasteurized; keep cold."],["Namachozo vs namazume?","Namachozo: pasteurized only at bottling. Namazume: only before storage."],["Genshu?","Undiluted, about 17–20% ABV."],["Kijōshu?","Made with sake replacing some water; rich, sweet."],["Koshu?","Aged sake: amber, nutty, soy, caramel."]],"q":[["The most balanced middle fraction of the press:","Nakadori","Arabashiri","Seme","Kasu","Middle cut."],["Muroka means:","Not charcoal-filtered","Unpasteurized","Undiluted","Cloudy","Muroka = no charcoal."],["Namazume is pasteurized:","Once, before storage only","Never","Twice","Once, at bottling only","Hiyaoroshi style."],["Sake made with sake replacing some water:","Kijōshu","Genshu","Taruzake","Nigori","Rich, sweet."],["Undiluted sake is called:","Genshu","Nama","Koshu","Junmai","Full strength."]]},{"id":"sp4","track":"Sake Exam Prep","title":"Grades, Labels, Numbers & Regions","k":["Premium 'special designation' sake (tokutei meishōshu) has eight categories: Junmai, Tokubetsu Junmai, Junmai Ginjō, Junmai Daiginjō, Honjōzō, Tokubetsu Honjōzō, Ginjō and Daiginjō.","Polishing rules: Honjōzō 70% or less remaining; Ginjō and Junmai Ginjō 60% or less; Daiginjō and Junmai Daiginjō 50% or less. Junmai has no legal minimum polish today (the old 70% rule was dropped in 2004).","Non-junmai premium sake may add a small amount of distilled alcohol (legally capped relative to the weight of the rice) to lift aroma and lighten the body.","Label kanji worth knowing: 純米 junmai, 本醸造 honjōzō, 吟醸 ginjō, 大吟醸 daiginjō.","Numbers on the label: SMV or nihonshu-do (positive tends drier, negative sweeter), acidity or san-do (higher feels drier and richer), and amino acidity or amino-san-do (higher means more umami and savory depth).","Regions: Niigata (light and dry, tanrei karakuchi), Hyōgo's Nada (Japan's biggest production area, hard water, bold), Kyoto's Fushimi (soft water, gentle), Hiroshima (soft-water pioneer), Akita and Yamagata (aromatic ginjō), Yamaguchi (home of Dassai). Japan protects some sake regions as geographical indications, such as Hakusan, Yamagata and Nada Gogō."],"c":[["How many special designation categories?","Eight."],["Honjōzō polish?","70% or less remaining."],["Ginjō polish?","60% or less remaining."],["Daiginjō polish?","50% or less remaining."],["Junmai minimum polish today?","None (removed in 2004)."],["純米?","Junmai."],["吟醸?","Ginjō."],["SMV positive vs negative?","Positive tends drier; negative sweeter."],["High amino acidity means?","More umami and savory depth."],["Niigata style?","Tanrei karakuchi: light and dry."]],"q":[["大吟醸 on a label means:","Daiginjō","Junmai","Honjōzō","Ginjō","Dai = big/great."],["Which grade requires 60% or less remaining?","Ginjō","Honjōzō","Daiginjō","Futsūshu","Ginjō line."],["High amino acidity suggests:","More umami, savory sake","Sparkling sake","Lower alcohol","No added alcohol","Amino-san-do."],["Japan's largest sake-producing area:","Nada (Hyōgo)","Niigata","Hokkaido","Okinawa","Hard-water heartland."],["A positive SMV generally indicates:","Drier sake","Sweeter sake","Higher ABV","Aged sake","Nihonshu-do."]]},{"id":"sp5","track":"Sake Exam Prep","title":"Service, Temperatures, Faults & the Exams","k":["Temperature vocabulary (approximate): yukibie (about 5°C, snow-chilled), hanabie (about 10°C), suzubie (about 15°C), jō-on or hiya (room temperature, about 20°C), hitohada-kan (about 35°C, body temperature), nuru-kan (about 40°C), jō-kan (about 45°C), atsu-kan (about 50°C), tobikiri-kan (55°C and up).","Matching temperature to style: aromatic ginjō, daiginjō and nama sake are best chilled. Junmai, honjōzō, kimoto and yamahai often open up warm. Warm sake gently in a water bath.","Storage: cool, dark, bottles upright, and drink most sake young. Keep nama refrigerated at all times.","Faults to recognize: oxidation (stale, flat, overly nutty or caramel in a sake that should be fresh), light damage (an off, burnt-rubber-like smell after sunlight exposure), and nama-hine (unpasteurized sake gone off from warmth: stale, sour-sweet, musty).","Pairing considerations: match flavor intensity, consider sweetness, and remember sake's umami and low acidity make it unusually friendly with seafood and savory dishes.","Exams (check current rules before booking): WSET Level 1 Award in Sake is 30 multiple-choice questions in 45 minutes, pass at 70%. WSET Level 3 adds deeper theory, a tasting exam and written answers. The Sake Sommelier Association and SSI (Kikisake-shi) offer other respected paths."],"c":[["Hanabie?","About 10°C, 'flower chill'."],["Atsu-kan?","About 50°C, hot."],["Nuru-kan?","About 40°C, lukewarm."],["Best served chilled?","Ginjō, daiginjō, nama."],["Often good warm?","Junmai, honjōzō, kimoto, yamahai."],["Nama-hine?","Unpasteurized sake gone off from warmth: stale, sour-sweet, musty."],["How to store sake?","Cool, dark, upright; drink young; nama always refrigerated."],["WSET Sake L1 exam format?","30 multiple-choice in 45 minutes; pass 70%."]],"q":[["Sake served at about 50°C is:","Atsu-kan","Hanabie","Nuru-kan","Yukibie","Hot."],["A nama sake left warm for weeks may develop:","Nama-hine","Ginjō-ka","Koshu character, intentionally","Sparkle","Unpasteurized spoilage."],["Sake bottles should be stored:","Upright, cool and dark","On their side in sunlight","Warm","Frozen","No cork to keep moist."],["The best way to warm premium sake:","A gentle water bath","Boiling it","Open flame","Never warm sake","Gentle heat."],["WSET Level 1 Sake pass mark:","70%","55%","85%","50%","30 questions."]]},{"id":"bp1","track":"Beer Exam Prep","title":"Draft Systems In Depth","k":["A draft system pushes beer from the keg to the faucet with gas while keeping its carbonation stable. Temperature and gas pressure must be balanced; change one and the beer foams or goes flat.","Most beers are served with CO2. Nitro beers (like many stouts) use a blend of nitrogen and CO2 through a special stout faucet with a restrictor plate, giving a dense, creamy head.","Keep kegs and lines cold, around 38°F (3°C). Warm beer releases CO2 and foams.","Too much pressure overcarbonates and foams; too little lets beer go flat over time. Long-draw systems (beer travels far from the cooler) need glycol-chilled lines and careful balancing.","Line cleaning: industry best practice (the Brewers Association's Draught Beer Quality Manual) is to clean lines with a caustic solution at least every two weeks, with a periodic acid clean. Dirty lines cause off flavors like buttery diacetyl and sour, vinegary notes.","Troubleshooting foam: check temperature first, then pressure, then cleanliness, then the pour itself (a fully open faucet, a clean, wet glass)."],"c":[["What must be balanced in a draft system?","Temperature and gas pressure."],["What gas do nitro beers use?","A nitrogen/CO2 blend, through a stout faucet."],["Ideal draft temperature?","About 38°F (3°C)."],["Too much pressure causes?","Overcarbonation and foaming."],["Line cleaning frequency (best practice)?","At least every two weeks with caustic; periodic acid clean."],["Dirty-line off flavors?","Buttery diacetyl, sour/vinegar."],["First thing to check when beer foams?","Temperature."]],"q":[["Beer pours foamy. First check:","Temperature","The menu","The glass color","The keg label","Warm beer foams."],["Draft lines should be cleaned at least:","Every two weeks","Once a year","Never","Every six months","BA best practice."],["Nitro stouts use:","A nitrogen/CO2 blend and stout faucet","Pure oxygen","Only CO2 at high pressure","No gas","Creamy head."],["A buttery off flavor on draft suggests:","Dirty lines (diacetyl)","Perfect freshness","Too cold","A nitro beer","Pediococcus in lines."]]},{"id":"bp2","track":"Beer Exam Prep","title":"Freshness, Glassware & the Perfect Pour","k":["Beer's enemies are heat, light and time. Store it cold, dark, and rotate stock first in, first out. Most beers are best fresh, especially hoppy ones.","Light damage (lightstruck or 'skunky' beer) happens fast when UV light hits hop compounds, worst in clear and green bottles. Oxidation from heat and age causes stale, papery or cardboard flavors.","A beer-clean glass has no residue: bubbles don't cling to the sides, the head holds, and foam leaves lacing rings as you drink. Tests: the sheeting test (water sheets evenly off a clean glass), the salt test (salt sticks evenly to a wet clean glass) and the lacing test.","Rinse glasses with cold water before pouring. Avoid frosted or freezer-chilled glasses for quality beer: ice crystals cause foaming and dilution, and freezers pass on food odors.","The pour: open the faucet fully, start at about 45°, then straighten the glass to build about 1–1.5 inches of foam. The head carries aroma and releases excess CO2.","Glassware: shaker pint (all-purpose), pilsner glass (shows clarity and bubbles), weizen glass (tall, curvy for wheat beer's big head), tulip (traps aroma for strong, aromatic ales), snifter (strong, sipping beers), goblet or chalice (Belgian ales), stange (narrow cylinder for Kölsch)."],"c":[["Beer's three enemies?","Heat, light, time."],["What causes skunky beer?","UV light reacting with hop compounds."],["Oxidized beer tastes like?","Stale, papery, cardboard."],["Signs of a beer-clean glass?","No clinging bubbles, head holds, lacing."],["Three beer-clean glass tests?","Sheeting, salt, lacing."],["Ideal head?","About 1–1.5 inches."],["Stange is for?","Kölsch."],["Weizen glass is for?","Wheat beer."]],"q":[["Bubbles clinging to the inside of a glass mean:","The glass isn't beer-clean","The beer is very fresh","Perfect carbonation","It's a nitro beer","Residue."],["Clear bottles are risky because of:","Light damage (skunking)","Oxidation only","Freezing","Too much CO2","UV."],["A stange is the traditional glass for:","Kölsch","Hefeweizen","Stout","Barleywine","Cologne."],["Before pouring, rinse the glass with:","Cold water","Hot soapy water","Nothing","Sanitizer left in","Removes dust, cools."]]},{"id":"bp3","track":"Beer Exam Prep","title":"Off-Flavors Like a Pro","k":["Diacetyl: butter or butterscotch. From fermentation that didn't finish cleanly or from bacteria in dirty draft lines.","DMS (dimethyl sulfide): cooked corn or canned vegetables. From pale malts when the boil isn't vigorous or long enough, or from infection.","Acetaldehyde: green apple or fresh-cut pumpkin. A sign of young beer pulled from the yeast too early.","Lightstruck: skunky. From UV light hitting hop compounds.","Oxidation: wet cardboard or paper in hoppy and pale beers; sherry or honey notes in old strong beers.","Acetic (vinegar) and lactic (sour): from bacteria. Lactic sourness is intended in sour styles but a fault in a lager. Vinegar often points to dirty lines.","Chlorophenols: medicinal, plastic or band-aid. From chlorine in water or sanitizer residue. Isoamyl acetate (banana) is a fault in most beers but expected in German Hefeweizen.","Context matters: some 'off-flavors' are part of a style (banana in Hefeweizen, sourness in a Gose). On exams, ask 'is this appropriate for the style?'"],"c":[["Diacetyl?","Butter/butterscotch; incomplete fermentation or dirty lines."],["DMS?","Cooked corn; weak/short boil or infection."],["Acetaldehyde?","Green apple; beer too young."],["Lightstruck?","Skunky; UV light."],["Oxidation?","Wet cardboard, paper; sherry in old beer."],["Acetic?","Vinegar; bacteria, often dirty lines."],["Chlorophenols?","Medicinal, band-aid; chlorine/sanitizer."],["When is banana NOT a fault?","In German Hefeweizen."]],"q":[["Cooked corn aroma in a lager:","DMS","Diacetyl","Acetaldehyde","Oxidation","Dimethyl sulfide."],["Green apple in a fresh lager suggests:","Acetaldehyde","Lightstruck","Chlorophenols","Brett","Too young."],["Band-aid or medicinal aroma:","Chlorophenols","DMS","Diacetyl","Isoamyl acetate","Chlorine reaction."],["Sourness is appropriate in:","Gose and Berliner Weisse","Pilsner","Helles","American Light Lager","Sour styles."],["Wet cardboard in an old IPA:","Oxidation","Diacetyl","DMS","Lightstruck","Stale."]]},{"id":"bp4","track":"Beer Exam Prep","title":"Ingredients & Brewing In Depth","k":["Malt: barley soaked, sprouted and dried (kilned). Pale base malts provide most of the fermentable sugar; specialty malts add color and flavor (caramel/crystal malts: toffee, sweetness; roasted malts: coffee, chocolate). Adjuncts like corn and rice lighten body and flavor.","Mashing: crushed malt steeps in hot water (roughly 148–158°F / 64–70°C) so enzymes turn starch into sugar. Lower mash temperatures make more fermentable sugar and a drier beer; higher ones leave more body.","Boil: about 60–90 minutes. Hops added early give bitterness (their alpha acids change in the boil); hops added late or after the boil (whirlpool, dry hopping) give aroma and flavor.","Yeast: ale yeast (Saccharomyces cerevisiae) ferments warmer (about 60–72°F) and makes fruity esters. Lager yeast (Saccharomyces pastorianus) ferments cold (about 45–55°F) for a clean profile, followed by lagering (cold conditioning).","Water shapes classic styles: very soft water in Pilsen (delicate Pilsner), sulfate-rich hard water in Burton-on-Trent (crisp, bitter English pale ales), carbonate-rich water in Dublin (roasty stouts).","Other microbes: Brettanomyces (funky, barnyard), Lactobacillus and Pediococcus (sour) define wild and sour beers, from Belgian lambic to modern American sours."],"c":[["What is malting?","Soaking, sprouting and kilning barley."],["Crystal vs roasted malt?","Crystal: toffee, sweetness. Roasted: coffee, chocolate."],["Lower vs higher mash temperature?","Lower: drier, more fermentable. Higher: more body."],["Early vs late hops?","Early: bitterness. Late/dry hop: aroma and flavor."],["Ale vs lager yeast?","Ale: warmer, fruity esters. Lager: cold, clean, then lagering."],["Pilsen water?","Very soft."],["Burton-on-Trent water?","Hard, sulfate-rich; crisp bitter pale ales."],["Microbes in sour/wild beer?","Brettanomyces, Lactobacillus, Pediococcus."]],"q":[["Coffee and chocolate flavors come from:","Roasted malts","Caramel malts","Late hops","Lager yeast","Dark roasting."],["Hops added early in the boil mainly add:","Bitterness","Aroma","Color","Sweetness","Isomerized alpha acids."],["Lager yeast ferments:","Cold, giving a clean profile","Warm, giving fruity esters","Wild and sour","Without sugar","Saccharomyces pastorianus."],["Burton-on-Trent water is famous for:","Pale ales","Pilsner","Stout","Lambic","Sulfate-rich."],["Brettanomyces gives:","Funky, barnyard flavors","Butter","Skunk","Cooked corn","Wild yeast."]]},{"id":"bp5","track":"Beer Exam Prep","title":"Beer Styles with Numbers","k":["Exams test styles by origin, flavor, strength (ABV), bitterness (IBU) and color. The ranges below are approximate, based on the BJCP style guidelines widely used for study.","German and Czech lagers: Pilsner (crisp, bitter, floral hops; about 4.5–5.5%), Helles (malty, soft, low bitterness; about 4.7–5.4%), Märzen/Oktoberfest (toasty, amber; about 5.5–6.3%), Bock and Doppelbock (rich, malty, strong; about 6.3% to 10%).","Wheat and hybrid: German Hefeweizen (banana and clove from yeast; about 4.3–5.6%), Belgian Witbier (orange peel and coriander; about 4.5–5.5%), Kölsch (delicate, crisp ale from Cologne; about 4.4–5.2%).","Belgian ales: Saison (dry, peppery, fruity; widely variable, often 5–7%), Dubbel (dark fruit, caramel; about 6–7.5%), Tripel (golden, spicy, strong but dry; about 7.5–9.5%), Belgian Strong Dark (rich, 8–12%).","British and Irish: Bitter (low alcohol, malty-bitter balance; about 3–5%), English IPA (earthy hops; about 5–7.5%), Irish Stout (dry, roasty, low alcohol; about 4–4.5%), Imperial Stout (big and rich; 8–12%).","American: Pale Ale (citrusy hops; about 4.5–6.2%), IPA (pronounced hop bitterness and aroma; about 5.5–7.5%, roughly 40–70 IBU), Double IPA (7.5–10%), and hazy/New England IPA (juicy, low perceived bitterness).","Sour and wild: Berliner Weisse (light, tart, about 3%), Gose (tart, with salt and coriander), lambic and gueuze (spontaneously fermented, Belgium), Flanders Red (fruity, vinegar-tinged, oak-aged)."],"c":[["Pilsner profile?","Crisp, bitter, floral hops; about 4.5–5.5%."],["Helles vs Pilsner?","Helles is maltier and softer, less bitter."],["Hefeweizen signature?","Banana and clove from yeast."],["Witbier spices?","Orange peel and coriander."],["Tripel?","Golden, spicy, strong (7.5–9.5%) but dry."],["Irish Stout?","Dry, roasty, low alcohol (about 4–4.5%)."],["American IPA IBU range?","Roughly 40–70."],["Gose?","Tart wheat beer with salt and coriander."],["Lambic?","Spontaneously fermented Belgian beer."]],"q":[["A strong, golden, dry, spicy Belgian ale:","Tripel","Dubbel","Witbier","Saison","Golden and dry."],["Salt and coriander in a tart beer:","Gose","Berliner Weisse","Kölsch","Pilsner","Leipzig style."],["The lowest-alcohol of these:","Irish Stout","Imperial Stout","Doppelbock","Tripel","About 4–4.5%."],["Banana and clove flavors indicate:","Hefeweizen","Pilsner","Stout","Pale Ale","Yeast-driven."],["A narrow, crisp, delicate ale from Cologne:","Kölsch","Altbier","Helles","Witbier","Served in a stange."]]},{"id":"bp6","track":"Beer Exam Prep","title":"Beer & Food Pairing + the Exams","k":["The three Cs of pairing: Cut (carbonation, bitterness or roast cut through fat and richness), Contrast (opposite flavors balance each other), and Complement (similar flavors echo each other).","Match intensity first: delicate beers with delicate dishes, bold beers with bold dishes.","Bitterness and alcohol make chili heat burn more; malt sweetness and lower alcohol calm it. With spicy dishes, crisp lagers or malty styles beat a big IPA.","Classic pairings: Irish Stout with oysters; Hefeweizen with salads, eggs and brunch; Saison with cheese and herb-driven dishes; roasty porter with grilled and smoked meats; Kriek (cherry lambic) or Imperial Stout with chocolate desserts; Barleywine with blue cheese.","At Mott 32: crisp rice lagers like Asahi or Tsingtao with dim sum and fried dishes (carbonation cuts fat), a Saison like Boulevard Tank 7 with dumplings, and the dry stout with barbecue pork.","Exams (check current rules before booking): the Certified Beer Server is an online multiple-choice exam (commonly reported as 60 questions in 30 minutes, pass at 75%). The Certified Cicerone® exam adds written answers, a tasting exam and a demonstration. Cicerone® is a registered trademark of the Cicerone Certification Program."],"c":[["The three Cs?","Cut, Contrast, Complement."],["What does 'cut' mean?","Carbonation, bitterness or roast slicing through richness."],["Beer with spicy food?","Crisp lagers or malty, lower-alcohol styles; avoid big bitter IPAs."],["Stout classic pairing?","Oysters."],["Hefeweizen pairing?","Salads, eggs, brunch."],["Barleywine pairing?","Blue cheese."],["CBS exam format (commonly reported)?","About 60 multiple-choice in 30 minutes; pass 75%."]],"q":[["Carbonation cleansing fried food is an example of:","Cut","Contrast","Complement","Clash","Cut through fat."],["Best with a very spicy dish:","A crisp lager","A 10% double IPA","An imperial stout","A barleywine","Lower bitterness and alcohol."],["A classic match for oysters:","Irish Stout","Hefeweizen","Kriek","Double IPA","Tradition."],["Chocolate dessert pairs well with:","Kriek or Imperial Stout","Light lager","Pilsner","Gose","Complement richness."]]},{"id":"a4","track":"Electives","title":"Japanese Technique: The Deep Dive","k":["Ginza bar culture treats bartending as a craft of quiet precision. Key names: Kazuo Uyeda (Tender Bar, creator of the hard shake), Hidetsugu Ueno (Bar High Five, famous for carving ice and for tailoring drinks to each guest), and Masahiro Urushido (Katana Kitten, New York), author of The Japanese Art of the Cocktail.","Tools: the three-piece cobbler shaker is favored in Japan for its control and fine texture. Mixing glasses are often cut crystal (the 'Yarai' pattern). Jiggers are slim Japanese-style double jiggers, held between the fingers so pours are quick and clean.","Stirring: the bar spoon rests between the middle and ring fingers, and the back of the spoon stays against the glass, so the ice turns as one block. The goal is silence and no broken ice.","Ice carving: a block of clear ice is cut down with a knife or ice pick into a sphere or a faceted 'diamond' that fits the glass exactly. It melts slowly and makes the drink look like a jewel.","Ichigo ichie ('one time, one meeting'): each encounter with a guest happens only once, so you give it your full attention. Combined with omotenashi, it's the mindset behind Japanese service.","Tailoring: many Ginza bartenders adjust a classic to the guest's taste and the moment (drier, softer, more aromatic), quietly, without being asked.","Movement economy: every bottle is returned, every tool wiped, labels face the guest, and nothing on the bar top is out of place. Precision shows respect."],"c":[["Kazuo Uyeda?","Tender Bar, Ginza; creator of the hard shake."],["Hidetsugu Ueno?","Bar High Five, Ginza; famous for ice carving and tailored drinks."],["Masahiro Urushido?","Katana Kitten (NYC); wrote The Japanese Art of the Cocktail."],["Shaker favored in Japan?","The three-piece cobbler shaker."],["Where does the bar spoon sit when stirring Japanese-style?","Between the middle and ring fingers, back of spoon on the glass."],["Ichigo ichie?","'One time, one meeting': give each encounter full attention."],["Ice diamond?","Clear ice carved into a faceted shape that fits the glass."]],"q":[["Bar High Five and ice carving are associated with:","Hidetsugu Ueno","Kazuo Uyeda","Dale DeGroff","Sasha Petraske","Ginza, Tokyo."],["'One time, one meeting' is:","Ichigo ichie","Omotenashi","Kaizen","Mizuwari","Every encounter is unique."],["The shaker most associated with Japanese bartending:","Three-piece cobbler shaker","Boston tin-and-glass","Parisian shaker","A blender","Control and texture."],["The author of The Japanese Art of the Cocktail:","Masahiro Urushido","Dave Arnold","Jim Meehan","David Wondrich","Katana Kitten, NYC."]]}],"SCENARIOS":[["Guest: \"I don't like dry wine.\" What do you say?","Ask: \"Do you mean not sweet, or that drying feeling some reds give?\" Dry = no sugar; the drying feeling is tannin (or acid/oak). Then recommend accordingly — e.g., low-tannin Pinot Noir vs. an off-dry Riesling.","d00"],["Guest: \"I want a crisp white, nothing buttery or oaky.\"","Sauvignon Blanc, Pinot Grigio, dry Riesling — or an unoaked Chardonnay. Explain butter comes from MLF and oak, not the grape.","d01"],["Guest: \"What's the difference between Champagne and Prosecco?\"","Champagne: from Champagne, France, traditional method, second fermentation in bottle, lees aging gives brioche/toast. Prosecco: Italy, Glera grape, usually tank method, fresher pear/apple/floral.","d02"],["Guest: \"I want a red with steak.\"","Cabernet Sauvignon for full body and tannin (protein/fat soften it); Merlot if they want softer; Syrah for pepper and savory notes. Match structure + flavor + preference.","d03"],["Guest wants wine with very spicy food.","Lower alcohol, fruity, high acid, a touch of sweetness — off-dry Riesling. Avoid high-alcohol tannic reds; alcohol amplifies chili heat.","d04"],["Guest: \"Bourbon vs. rye?\"","Both American. Bourbon ≥51% corn, new charred oak — rounder, vanilla/caramel. Rye ≥51% rye — more grain spice and herbal character. For a spicier Manhattan, go rye.","d05"],["Guest: \"Isn't mezcal just smoky tequila?\"","No. Separate Mexican agave categories. Tequila uses blue agave within its denomination; mezcal allows many agave species under its own rules, and traditional pit cooking can add smoke — but not every mezcal is smoky.","d06"],["Guest: \"What makes Cognac special?\"","Protected French origin, wine from grapes (mostly Ugni Blanc), double distillation in copper Charentais pot stills, oak aging and blending. VS 2+, VSOP 4+, XO 10+ years (youngest eau-de-vie).","d07"],["Guest: \"Why is this rum so funky compared to that one?\"","Start with cane source and fermentation (long, ester-rich fermentations → banana/pineapple 'hogo'), then still type, distillation strength, cuts, aging and blending. Color tells you little.","d08"],["Guest: \"Is Single Malt from one barrel?\"","No — 'single' means one distillery. Single Malt = malted barley + water, pot-stilled at one distillery, aged 3+ years in Scotland. 'Single barrel' is a different term.","d09"],["Guest picks a gin. How do you guide them?","Ask: classic juniper/pine (London Dry), bright citrus, floral/new-wave, or rounder historical (Old Tom)? Juniper must lead; the rest is botanical style.","d10"],["A bottle of sweet vermouth has been open on the backbar for 2 months. What do you do?","It's wine-based and oxidizes — it's probably tired. Taste it, likely replace, and store open vermouth in the fridge going forward.","d11"],["Guest: \"I don't like beer, it's too bitter.\" What do you offer?","Ask what they do like. Offer low-bitterness styles: Hefeweizen (banana/clove), Witbier (orange/coriander), Helles, a fruited sour or Kriek, or a milk stout if they like dessert flavors. Avoid IPAs.","d12"],["Guest says their draft beer tastes like butter.","Likely diacetyl, often from dirty draft lines. Apologize, offer a different beer, and tell your manager so the lines get checked and cleaned (at least every 2 weeks).","d13"],["Guest: \"What's the difference between a West Coast and a Hazy IPA?\"","West Coast: clear, dry, bitter, pine and citrus. Hazy/New England: cloudy, soft and juicy with tropical fruit and much less bitterness.","d14"],["Guest: \"What does Junmai Daiginjo mean?\"","Junmai: pure rice, no added alcohol. Daiginjo: at least half of each rice grain was polished away (≤50% remaining). That makes it the most refined, aromatic grade, best served chilled.","d15"],["Guest wants hot sake with their expensive Daiginjo.","Gently suggest it chilled, because heat hides its delicate fruity aromas. If they love warm sake, recommend a junmai, honjozo or yamahai for warming instead.","d16"],["Guest: \"Make me something like a Negroni but less bitter.\"","Try a Boulevardier (whiskey softens it), an Americano (lighter, with soda), or a Negroni Sbagliato (prosecco instead of gin). Or swap Campari for Aperol for a lighter style.","d17"],["Guest orders a 'Perfect Rob Roy, up.'","Scotch with equal parts sweet and dry vermouth plus bitters. Stir and serve up in a chilled coupe or Nick & Nora, usually with a lemon twist or cherry.","d18"],["Guest: \"I want something refreshing, not sweet, with tequila.\"","Paloma (tequila, grapefruit soda, lime, salt), a Tommy's-style Margarita with less agave, or tequila and soda with lime.","d19"],["(Stage) The bar manager says: 'Make me something.' What do you do?","Ask one or two quick questions (spirit and style they like). Then make a classic you can nail, like a perfect Daiquiri. Say why in one sentence ('a Daiquiri shows balance and technique'), chill the glass, double strain, and straw-taste it before you hand it over.","d26"],["Guest orders a Martini. What do you ask before you make it?","Gin or vodka (and which brand)? How dry? Up or on the rocks? Twist, olive or onion? Stirred unless they ask for shaken. Repeat it back.","d27"],["Guest orders a Manhattan. What do you ask?","Rye or bourbon (any preference on brand)? Up or on the rocks? Standard is stirred with Angostura and a cherry. Offer 'Perfect' only if they ask.","d28"],["Guest: 'I want something fruity but not too sweet.'","Ask which spirit they like. Recommend a sour-style drink with fresh citrus: a Daiquiri, Southside, Clover Club, or a Paloma if they want tall. Tell them it's bright and tart, not sugary.","d29"],["Guest says their Whiskey Sour is too sour.","Thank them, apologize, and fix it right away: re-shake with about ¼ oz more simple, or remake it to their taste. Don't argue. Note the preference for next time.","d30"],["You run out of lime juice in the middle of a rush.","Tell the barback or a teammate right away so someone juices more. In the meantime, steer guests to drinks that don't need lime, and never substitute bottled juice without telling your manager. Next shift, adjust your par.","d31"],["(Interview) 'Why is a Daiquiri shaken and a Manhattan stirred?'","A Daiquiri has citrus, so shaking mixes, chills, dilutes and aerates it for a bright, frothy texture. A Manhattan is all spirits, so stirring chills and dilutes while keeping it silky and clear.","d32"],["(Interview) 'How would you cost a cocktail?'","Find each ingredient's cost per ounce (bottle cost ÷ ounces), multiply by the amount used, add citrus, syrup and garnish. That's drink cost. Pour cost % = drink cost ÷ menu price × 100. Most bars aim around 18–24% on cocktails.","d33"],["(Interview) 'Tell me about a difficult guest.'","Use a short story: the situation, what you did (listened, stayed calm, fixed it, involved a manager if needed) and how it ended. Focus on the guest leaving happy and what you learned.","d34"],["Guest asks for dealer's choice.","Ask three things: favorite spirits, refreshing or spirit-forward, and sweet, sour or bitter. Then make something matched to them, tell them what it is, and check back after the first sip.","d35"],["Guest says they're not drinking tonight.","Don't ask why. Offer the zero-proof menu or make a balanced NA drink with real care (fresh citrus, a good syrup, tea or tonic for structure), served in proper glassware with a garnish.","d36"],["Guest has had several drinks, is slurring, and orders another.","Don't serve it. Get your manager, then privately and calmly say you can't serve more alcohol tonight but can bring water, coffee or food. Help arrange a safe ride.","d37"],["Six tickets print at once: 2 Old Fashioneds, 2 Margaritas, a Paloma and a Champagne.","Read everything, set all glasses down. Stir the Old Fashioneds first, then shake both Margaritas (two tins at once), build the Paloma and top it, pour the Champagne last, then garnish everything together.","d38"],["(Interview) 'What's your favorite classic and its spec?'","Pick one you truly know and say it cleanly with method, glass and garnish. Example: 'Last Word: equal parts gin, green Chartreuse, maraschino and lime, ¾ oz each, shaken, served up in a coupe.' Add one sentence on why you love it.","d39"],["Guest wants something like a Negroni but less bitter.","Suggest a Boulevardier (whiskey softens it), a Negroni with Aperol instead of Campari, or an Old Pal if they like it drier. Explain the swap.","d40"],["Guest orders a Long Island Iced Tea at a craft bar.","Make it well and without attitude if it's possible on your menu. If the bar doesn't make it, offer something in the same spirit, like a strong, refreshing highball or a Mai Tai.","d41"],["(Fine dining) A server drops a ticket: aperitifs for a 4-top whose first course is about to fire.","Prioritize it. Those drinks must land before the food. Tell the server how long you need, build them first, and let the server know the moment they're up.","d42"],["(Fine dining) A guest asks if the tasting-menu cocktail has nuts.","Don't guess. Check the spec and every house prep in it (orgeat, bitters, syrups, garnish), confirm with the kitchen or manager, and tell the guest exactly what you found. If there's any doubt, offer a drink you know is safe.","d43"],["(Fine dining) Guest: 'What would you drink with the wagyu course?'","Ask whether they'd like wine, sake or a cocktail. Suggest something with acid or bubbles to cut the fat, or a stirred, slightly bitter drink for the richness, and offer the sommelier's pick by the glass.","d44"],["(Fine dining) A guest asks for 'your best Japanese whisky, neat'.","Offer two options at different prices with one flavor sentence each ('Yamazaki 18: rich sherry fruit and mizunara spice'). Confirm the pour size and price before pouring, show the bottle, serve in a tasting glass with a water back.","d45"],["(Fine dining) Guest: 'What's shochu?'","Japan's distilled spirit, usually about 25% alcohol, made from sweet potato, barley, rice and more. It's lighter than whisky and very food-friendly. Try it on the rocks, with water, or warm with hot water.","d46"],["(Fine dining) The sommelier is with another table and a bar guest wants to talk wine.","Help with what you know: the glass pours and two flavor words for each. Offer a small taste if house policy allows, and tell them the sommelier will stop by. Then let the sommelier know.","d47"],["(Fine dining) A guest at the bar wants Champagne opened with a pop for their anniversary.","Congratulate them warmly. Open it the house way (quietly, with control), present it with a little ceremony, and add a personal touch like a toast or a note to the server or kitchen.","d48"],["(Fine dining stage) The beverage director asks: 'Pair a cocktail with our crudo course.'","Ask what's on the plate. Then propose something light, bright and lower-proof that shares a flavor with the dish, like a yuzu or shiso highball or a fino sherry drink. Explain it in one sentence: it matches the dish's delicacy and the acid lifts the fish.","d49"]],"SPECS":[["Daiquiri","Sour","2 oz white rum · 1 oz lime · ¾ oz simple","Shake · coupe · none or lime wheel"],["Margarita","Sour (Daisy)","2 oz blanco tequila · 1 oz lime · ¾ oz Cointreau","Shake · rocks or coupe · half salt rim, lime"],["Tommy's Margarita","Sour","2 oz blanco tequila · 1 oz lime · ½–¾ oz agave syrup","Shake · rocks · lime"],["Whiskey Sour","Sour","2 oz bourbon · ¾ oz lemon · ¾ oz simple · egg white (optional)","Dry shake, then shake · rocks or coupe · Angostura drops"],["Pisco Sour","Sour","2 oz pisco · 1 oz lime · ¾ oz simple · egg white","Dry shake, then shake · coupe · Angostura drops"],["Gimlet","Sour","2 oz gin · ¾ oz lime · ¾ oz simple (or lime cordial)","Shake · coupe · lime wheel"],["Sidecar","Sour (Daisy)","2 oz Cognac · ¾ oz Cointreau · ¾ oz lemon","Shake · coupe · optional sugar rim"],["Cosmopolitan","Sour (Daisy)","1½ oz citrus vodka · ½ oz Cointreau · ½ oz lime · 1 oz cranberry","Shake · coupe · flamed orange or lime"],["Bee's Knees","Sour","2 oz gin · ¾ oz lemon · ¾ oz honey syrup","Shake · coupe · lemon twist"],["Gold Rush","Sour","2 oz bourbon · ¾ oz lemon · ¾ oz honey syrup","Shake · rocks, big cube · none"],["Penicillin","Sour","2 oz blended Scotch · ¾ oz lemon · ¾ oz honey-ginger syrup · ¼ oz Islay float","Shake · rocks · candied ginger"],["Clover Club","Sour","1½ oz gin · ½ oz dry vermouth · ½ oz lemon · ½ oz raspberry syrup · egg white","Dry shake, then shake · coupe · raspberries"],["Aviation","Sour","2 oz gin · ¾ oz lemon · ½ oz maraschino · ¼ oz crème de violette","Shake · coupe · cherry"],["Southside","Sour","2 oz gin · ¾ oz lime · ¾ oz simple · mint","Shake, double strain · coupe · mint leaf"],["Hemingway Daiquiri","Sour","2 oz white rum · ¾ oz lime · ½ oz grapefruit · ¼–½ oz maraschino","Shake · coupe · lime wheel"],["Pegu Club","Sour (Daisy)","2 oz gin · ¾ oz orange curaçao · ¾ oz lime · dash Angostura · dash orange bitters","Shake · coupe · lime"],["Jack Rose","Sour","2 oz apple brandy · ¾ oz lemon or lime · ½–¾ oz grenadine","Shake · coupe · apple slice or none"],["Corpse Reviver #2","Sour","¾ oz each gin, Cointreau, Lillet Blanc, lemon · absinthe ri  $(`<div class="kind">${esc(tr)} · Recall final</div><h1>${esc(tr)} Recall Final</h1><p class="mute">Ten questions, no options. Write each answer in your own words, the way you'd say it to a manager. The coach grades it; if the coach isn't available, you'll grade yourself. Pass at ${RF_PASS}%.</p>

 document.getElementById('rfsub').onclick=()=>{const answers=cards.map((_,n)=>document.getElementById('rf'+n).value.trim());if(answers.filter(Boolean).length<cards.length){document.getElementById('rfwarn').textContent='Answer every question (a guess is fine).';return}gradeRecall({title:tr+' Recall Final',items:cards.map((x,n)=>({q:x.c[0],ref:x.c[1],a:answers[n],l:x.l})),onDone:p=>{const f=S.rfinals[tr]=S.rfinals[tr]||{};f.best=Math.max(f.best||0,p);f.attempts=(f.attempts||0)+1;save()},back:()=>go('finals')})}}
const RF_PASS=80;
async function gradeRecall({title,items,onDone,back}){const g={};
 $(`<h1>${esc(title)}: grading</h1><p class="mute" id="gstat">Asking the coach to grade your answers…</p><div id="glist">${items.map((x,n)=>`<div class="card"><b>${esc(x.q)}</b><div class="fb"><span class="mute">You wrote:</span> ${esc(x.a)}</div><div class="fb ok-bg"><span class="mute">Reference:</span> ${esc(x.ref)}</div><div class="fb" id="cn${n}" hidden></div><div class="row"><button class="btn alt" data-rg="${n}" data-v="1">✓ Correct</button><button class="btn alt" data-rg="${n}" data-v="0">✗ Missed</button></div></div>`).join('')}</div>
 <div class="row"><button class="btn" id="rfin" disabled>See results</button></div>`);
 const mark=(n,v)=>{g[n]=v;document.querySelectorAll(`[data-rg="${n}"]`).forEach(x=>{x.style.background=x.dataset.v==String(v)?(v?'var(--okbg)':'var(--badbg)'):'var(--card)'});document.getElementById('rfin').disabled=Object.keys(g).length<items.length};
 document.querySelectorAll('[data-rg]').forEach(b=>b.onclick=()=>mark(b.dataset.rg,+b.dataset.v));
 try{const res=await coachGradeBatch(items.map(x=>({q:x.q,ref:x.ref,a:x.a})));res.forEach((r,n)=>{mark(n,r.correct?1:0);const c=document.getElementById('cn'+n);c.hidden=false;c.textContent='Coach: '+r.note});document.getElementById('gstat').textContent='The coach graded these. You can override any mark, then see your results.'}
 catch(e){document.getElementById('gstat').textContent=coachErr(e)+' Compare each answer with the reference and mark it honestly.'}
 document.getElementById('rfin').onclick=()=>{const right=Object.values(g).reduce((a,b)=>a+b,0),p=Math.round(right/items.length*100);onDone(p);
  const weak={};items.forEach((x,n)=>{if(!g[n]&&x.l)weak[x.l.id]=(weak[x.l.id]||0)+1});

 return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${Math.round(p*100)}% complete"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ringbg)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#rg)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>${label?`<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="ringtxt">${label}</text>`:''}</svg>`}

   <div class="meta"><span>${dn} of ${tot} steps</span><span>·</span><span>${cur.d} of ${cur.info.length} in this level</span>${dues.length?`<span>·</span><span class="due-t">${dues.length} retake${dues.length>1?'s':''} due</span>`:''}</div></div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptPrivate(keyB64){const r=await fetch('private.enc.json',{cache:'no-cache'});const enc=await r.json();
 const key=await crypto.subtle.importKey('raw',b64(keyB64),'AES-GCM',false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},key,b64(enc.ct));
 return JSON.parse(new TextDecoder().decode(pt))}

function extractJSON(t){const s=String(t||'');const i=Math.min(...['{','['].map(c=>{const k=s.indexOf(c);return k<0?1e9:k}));const j=Math.max(s.lastIndexOf('}'),s.lastIndexOf(']'));
 if(i>=1e9||j<i)throw {code:'invalid_json',text:s};try{return JSON.parse(s.slice(i,j+1))}catch(e){throw {code:'invalid_json',text:s}}}

  const text=(data&&data.text)||'';if(opts.onText)opts.onText({text,delta:text});return {text,truncated:false}};
 const f=(input,opts)=>call(input,opts);f.json=async(input,opts)=>{const {text}=await call(input,opts);return extractJSON(text)};return f}
