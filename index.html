 It's the simplest test of balance. I like it with a split base, half agricole.'"],["The interviewer asks, 'Tell me about a difficult guest.'","Use a short story: what happened, what you did, what you learned. Show calm, empathy and judgment, never blame.","'A guest sent back two drinks in a row. I stopped, asked what they actually liked, made them a third thing, and they became a regular.'"],["You don't get the job after a stage.","Stay gracious; top bars hire from people they've seen work. Ask for one thing to improve and offer to barback or trail.","'Thanks for having me. What's one thing I should work on? And if you ever need a barback, I'd love to learn here.'"]]},{"id":"f1","track":"Fine Dining","title":"What Fine Dining Bars Hire For","k":["A fine dining bar does two jobs at once: it serves guests at the bar, and it runs the service bar for the dining room. Most of your drinks may go to tables you never see, timed to the courses.","Timing is everything. Aperitifs need to land before the first course. A drink paired with a course has to arrive with it, not after. Read tickets by table and course, and talk to servers about when a table is about to be fired.","Polish is the baseline: spotless glassware, a clean and quiet station, neat uniform and grooming, no phone, calm movements. Guests at a $300-a-head restaurant notice a smudged glass and a noisy tin.","The language changes. Describe a drink by flavor and feeling ('bright, a little floral, finishes dry'), not by how much alcohol is in it. Never say 'no problem'. Say 'of course' or 'my pleasure'.","Know every ingredient in every house prep, because allergies are serious here. Orgeat has nuts, many foams use egg white or dairy, some syrups use sesame or honey, and some bitters are made with nuts or gluten grains. If you're not sure, say you'll check, then check with the kitchen or manager.","You're part of the beverage team. The sommelier or beverage director leads the program. Learn their language, back them up on wine and sake service, and ask how they want things described.","Consistency beats creativity on the line. The drink you serve at 10:45 p.m. on a Saturday should be identical to the one the beverage director signed off on.","Omotenashi, the Japanese idea of wholehearted hospitality, is the standard: anticipate what the guest needs before they ask (a fresh napkin, water, the check, a moment of quiet)."],"c":[["Two jobs of a fine dining bar?","Serving guests at the bar and running the service bar for the dining room."],["When should a paired drink arrive?","With the course it's paired with — not after."],["Instead of 'no problem', say?","'Of course' or 'my pleasure'."],["How do you describe a drink here?","By flavor and feel (bright, floral, dry), not by strength."],["Allergen risks in house preps?","Nuts (orgeat), egg and dairy (foams), sesame, honey, nut- or grain-based bitters."],["Guest asks about an allergen you're unsure of?","Say you'll check, then confirm with the kitchen or manager."],["Who leads the beverage program?","The sommelier or beverage director."],["What is omotenashi?","Wholehearted Japanese hospitality — anticipating needs before they're voiced."]],"q":[["A four-top's server says table 12 is about to fire course 3, which is paired with your yuzu sour. You:","Build it now so it lands with the course","Make it after the plates go out","Wait for the ticket to reprint","Batch it for later","Paired drinks arrive with the course, not after."],["A guest asks, 'Is there anything in this drink I should worry about? I have a sesame allergy.' The drink has a house syrup you didn't make. You:","Say you'll check, then confirm with the kitchen or manager before serving","Say it should be fine","Tell them to skip it","Remake it without the garnish","Never guess on allergies."],["A guest thanks you. In this room, the best reply:","'My pleasure.'","'No problem.'","'Yep.'","'No worries, man.'","Language is part of the polish."],["Describing a cocktail to a fine dining guest, the best line:","'Bright and floral, with a dry, slightly bitter finish.'","'It's really strong, three ounces of booze.'","'It's our best seller.'","'It's got a lot going on.'","Flavor and feeling, not proof."],["Which house preps commonly hide allergens?","Orgeat (nuts), foams (egg or dairy), some syrups (sesame, honey)","Simple syrup and soda","Fresh lime juice","Ice and water","Know every ingredient in every prep."],["It's 10:45 p.m. on a Saturday and you'd like to tweak the house Martini spec. You:","Make it exactly to the approved spec","Tweak it; it's late","Ask the guest how they'd like it changed","Use whatever gin is closest","Consistency beats creativity on the line."],["Omotenashi in practice looks like:","Refilling water and bringing the check before the guest has to ask","Waiting to be flagged down","Offering a shot on the house","Explaining the full history of every drink","Anticipate needs."],["Who leads the beverage program in a fine dining restaurant?","The sommelier or beverage director","The bartender with the most seniority","The chef only","Whoever is closing","Back them up and learn their language."]],"pro":[["Service bar printer: tables 4, 9 and 12 all at once. Table 9's server says they're on dessert; table 4 just sat.","Prioritize by course timing, not ticket order. Aperitifs for a table that just sat should land before the first course; dessert pairings must arrive with dessert. Ask servers about timing before you build.","Ask table 9's server when dessert fires, build table 4's aperitifs first, time 9's pairing to the plates, and keep 12 moving."],["A guest says, 'I have a tree nut allergy. Can I have the house Old Fashioned?' The spec uses a house bitters you didn't make.","Many bitters and syrups hide nuts (some use almond or walnut). You don't know, so you check before serving. Guessing on allergies is never okay in fine dining.","'Let me double-check every ingredient for you,' then confirm with the manager or the spec book, and offer a safe alternative if needed."],["A guest at the bar is clearly on a first date and quiet.","Read the room. A date wants attention to timing and discretion, not your stories. Anticipate: water refills, timing of the next drink, the check when they look for it.","Keep it brief and warm, refill water without asking, and check in only at natural pauses."]]},{"id":"f2","track":"Fine Dining","title":"Precision Technique & the Highball","k":["At a fine dining bar, technique is part of the service. Guests watch you work, so every movement should look calm, clean and deliberate.","Stirring: hold the bar spoon loosely and keep the back of the spoon against the inside of the mixing glass so the ice turns as one block. Aim for almost no noise and no splashing, about 20–30 seconds, then taste for temperature and dilution.","Shaking: hard, short and controlled (about 10–12 seconds), sealed tight, away from guests' faces. A clean, confident shake reads as skill; a sloppy one reads as nerves.","Ice is part of the presentation. Use clear ice for spirit-forward drinks and highballs, and rinse fresh ice before using it to remove the frosty surface and any off flavors.","The highball: chill a tall glass full of clear ice by stirring, pour off the meltwater, add the spirit (often about 1 part to 3–4 parts soda) and stir to chill it. Pour very cold soda gently down the ice or a bar spoon so it keeps its bubbles, give it one gentle lift, and serve. A citrus peel over the top is common. This works for whisky, gin, shochu or tequila.","Whisky with water: mizuwari is whisky with cold water and ice, stirred (the classic count is 13½ stirs with the whisky and 3½ after the water). Oyuwari is a spirit with hot water, common with shochu. Both are respected ways to drink fine spirits.","Presentation details: put the coaster down first, set the glass with its garnish or logo facing the guest, show the bottle for premium pours, and return every tool to its place after each drink."],"c":[["How should stirring look and sound?","Smooth, the ice turning as one block, almost silent."],["How long to shake?","About 10–12 seconds, hard and controlled."],["Why rinse fresh ice?","Removes the frosty surface and off flavors for clarity."],["Highball steps?","Chill glass and ice, pour off water, add spirit and stir, gently add cold soda, one lift, citrus peel."],["Spirit-to-soda ratio for a highball?","About 1 part spirit to 3–4 parts soda."],["Mizuwari?","Whisky with cold water and ice, stirred."],["Oyuwari?","Spirit (often shochu) with hot water."],["Presentation basics?","Coaster first, garnish/logo facing the guest, show the bottle for premium pours, tools back in place."]],"q":[["A guest at the bar winces when you shake. Best adjustment:","Seal tight, shake hard but controlled, away from guests' faces","Shake softer and longer","Stir the drink instead","Shake below the bar top only","Clean, confident, controlled."],["The proper Japanese-style highball build:","Chill the glass with ice, pour off meltwater, add spirit and stir, then pour cold soda gently and lift once","Shake whisky and soda together","Pour soda first, then whisky, stir hard","Build over crushed ice and top with soda","Every step protects the bubbles."],["Why rinse fresh ice before a premium drink?","To remove the frosty surface and any freezer off-flavors","To make it colder","To add dilution on purpose","To make it clear","Small step, cleaner taste."],["Mizuwari is:","Whisky stirred with cold water and ice","Shochu with hot water","Whisky with soda","Sake with ice","Oyuwari is the hot-water version."],["Oyuwari for shochu is made by:","Pouring hot water first, then the shochu","Pouring shochu first, then boiling water","Microwaving the shochu","Adding ice to hot sake","The water warms the glass and mixes gently."],["A guest orders an expensive whisky. Before pouring, you:","Show the bottle","Pour it out of sight","Pour it into a highball","Ask if they want it shaken","Presentation is service."],["A classic highball ratio is about:","1 part spirit to 3–4 parts soda","1 to 1","1 to 8","2 to 1","Spirit-forward but long."],["After each drink at a fine dining bar, your tools:","Go back to their place, clean","Stay wherever they landed until close","Get stacked in the sink","Go to the barback","A clean station is part of the show."]],"pro":[["The guest at the bar is watching you stir their Martini.","At a fine dining bar, technique is part of the service. A smooth, nearly silent stir with the spoon riding the glass and no splashing reads as mastery.","Hold the spoon loosely, keep the back on the glass, stir about 25 seconds quietly, taste with a straw, strain cleanly."],["A guest orders a Hibiki highball and says the last one they had was flat.","Highball fizz dies from warm glasses, wet ice, warm soda and over-stirring. Every step is about protecting bubbles.","Chill the glass with clear ice and stir, pour off meltwater, add whisky and stir, pour very cold soda gently down the spoon, one lift, lemon peel."],["A guest asks, 'Isn't adding water to whisky wrong?'","Mizuwari is a respected Japanese way to enjoy whisky with food. A little water opens aromas and lowers alcohol so flavors show.","'In Japan, mizuwari is a classic way to drink whisky with dinner. The water opens up the aroma and makes it gentler with food.'"]]},{"id":"f3","track":"Fine Dining","title":"The Japanese Pantry & Shochu","k":["Citrus: yuzu (floral, between lemon, mandarin and grapefruit), sudachi (small, sharp, green), kabosu, and shikuwasa from Okinawa. Fresh yuzu is rare in the US, so bars often use bottled yuzu juice or yuzu liqueurs and sakes.","Herbs and spice: shiso (minty, basil-like leaf, green or red), sansho pepper (citrusy and numbing), wasabi, ginger, and yuzu kosho (a fermented paste of chiles, yuzu peel and salt, used in tiny amounts for heat and citrus).","Tea: matcha (stone-ground green tea powder; shake or whisk it so it doesn't clump), sencha (steamed leaf green tea), hojicha (roasted green tea, nutty and toasty), genmaicha (green tea with toasted rice), gyokuro (shaded, rich in umami). Oolong is Chinese or Taiwanese, but very common on these menus too.","Flavors and sweeteners: sakura (cherry blossom, floral and slightly salty when pickled), ume (Japanese apricot; umeshu is ume steeped in spirit with sugar), kuromitsu (black sugar syrup), black sesame, miso and kombu (for umami and salinity).","Shochu is Japan's distilled spirit, usually about 25% ABV. Honkaku ('authentic') shochu is single-distilled to keep the flavor of its base: imo (sweet potato, earthy and rich), mugi (barley, light and nutty), kome (rice, clean and soft), kokuto (brown sugar, from the Amami islands), and soba (buckwheat).","Awamori is Okinawa's spirit: made from long-grain rice and black koji, often aged (kusu). Shochu and awamori use koji mold, like sake, but they are distilled, not brewed.","Shochu service: on the rocks, mizuwari, oyuwari (hot water poured first, then shochu), or in a chu-hi (shochu highball). It's lower in alcohol than whisky, so it pairs easily with food."],"c":[["Yuzu tastes like?","Floral citrus — between lemon, mandarin and grapefruit."],["Sudachi?","Small, sharp green Japanese citrus."],["Shiso?","A minty, basil-like leaf, green or red."],["Sansho?","Japanese pepper: citrusy and numbing."],["Yuzu kosho?","Fermented paste of chiles, yuzu peel and salt."],["Hojicha?","Roasted green tea: nutty, toasty."],["Genmaicha?","Green tea with toasted rice."],["Typical shochu ABV?","About 25%."],["Imo, mugi, kome shochu?","Sweet potato, barley, rice."],["Awamori?","Okinawan spirit from long-grain rice and black koji; often aged (kusu)."],["Oyuwari order?","Hot water first, then shochu."]],"q":[["A guest asks what yuzu tastes like. Best description:","Floral, between lemon, mandarin and grapefruit","Like a sweet orange","Like lime but saltier","Like grapefruit only","Fresh yuzu is rare in the US; bottled juice is common."],["Yuzu kosho is:","A fermented paste of chiles, yuzu peel and salt","A yuzu liqueur","Yuzu juice with sugar","A citrus vinegar","Use tiny amounts."],["A guest wants something light and nutty, lower in alcohol than whisky, from Japan:","Mugi (barley) shochu","Imo (sweet potato) shochu","Awamori kusu","Japanese whisky neat","Mugi is light and nutty; imo is earthy and rich."],["What makes honkaku shochu different from many vodkas?","It's single-distilled to keep the flavor of its base","It's distilled 10 times","It's aged in oak by law","It's brewed, not distilled","Character, not neutrality."],["Awamori is:","Okinawa's rice spirit made with black koji, often aged","Sake from Okinawa","A shochu made from sweet potato","A plum liqueur","Aged awamori is called kusu."],["Umeshu is:","Ume fruit steeped in spirit with sugar","Fermented plum wine only","Shochu made from plums","A rice vinegar","Sweet-tart, great in highballs."],["Sansho pepper brings:","Citrusy, tingling, numbing heat","Smoky heat","Sweet spice like cinnamon","No heat at all","Related to Sichuan pepper."],["Hojicha vs. genmaicha:","Roasted green tea vs. green tea with toasted rice","Powdered vs. leaf tea","Black tea vs. oolong","Shaded tea vs. sun-grown tea","Both toasty, different routes."]],"pro":[["A guest asks for a 'Japanese spirit that isn't whisky or sake.'","Shochu and awamori. Shochu is single-distilled from a base like sweet potato, barley or rice, usually about 25% ABV. Ask what they like and match the base.","'Try shochu: it's distilled, about 25%. If you want light and nutty, barley; earthy and rich, sweet potato. I'd serve it on the rocks or with water.'"],["You want to add Japanese character to a gin sour without making it a novelty.","Use one pantry ingredient precisely: yuzu juice for part of the lemon, a shiso leaf in the shake, or a pinch of sansho. One clear idea beats five.","Replace ¼ oz of the lemon with yuzu, shake with one shiso leaf, double strain, garnish with a shiso leaf."],["A guest says shochu is 'just Japanese vodka.'","Honkaku shochu is single-distilled to keep the base ingredient's flavor, unlike vodka's neutrality. It's also lower proof.","'It's actually the opposite of vodka: it's distilled once so you taste the sweet potato or barley it's made from.'"]]},{"id":"f4","track":"Fine Dining","title":"Tea, Umami & Savory Cocktails","k":["Restaurant bar programs borrow from the kitchen: tea, mushrooms, miso, tomato, herbs and fats show up in cocktails so the drinks feel connected to the food.","Tea infusions: steep tea directly in a spirit or vermouth, or make a tea syrup. Green teas turn bitter fast with heat, so brew them cooler (around 160–175°F) or cold-steep. Black and oolong teas handle hotter water and longer steeps. Taste every few minutes and strain the moment it's right.","Tea syrups: brew strong tea, then dissolve sugar into it (for example, an oolong demerara syrup). Tea brings tannin, which adds structure and dryness the way a red wine does.","Savory techniques: infuse vermouth with kombu or dried mushroom; fat-wash with miso butter, brown butter or sesame oil; use tomato water or clarified juices; season with saline, sansho or a pinch of yuzu kosho. A savory Martini or Old Fashioned is a common fine dining move.","Umami (savory depth) makes drinks feel rounder and pairs well with food. But a little goes a long way. The drink should still taste like a drink, not a soup.","Smoke: smoking a glass or a cocktail (with wood chips, cherry blossom wood, or tea) adds aroma and drama. Smoke the glass, not the guest, and keep it short so the drink doesn't taste like an ashtray.","Write every infusion and syrup into the bar's spec book with exact weights, times and temperatures, so anyone on the team can make it the same way."],"c":[["Why brew green tea cooler?","High heat makes it bitter fast; about 160–175°F or cold-steep."],["What does tea add to a cocktail's structure?","Tannin: dryness and grip, like red wine."],["Name two savory infusions for vermouth.","Kombu and dried mushroom."],["Savory fat-wash ideas?","Miso butter, brown butter, sesame oil."],["Main rule with umami in drinks?","A little goes a long way — it should still taste like a drink."],["Smoke rule?","Smoke the glass briefly; don't overpower the drink or the guest."],["What must every infusion have?","An exact written spec: weights, times, temperatures."]],"q":[["Your sencha-infused gin tastes bitter. Most likely cause:","Steeped too long or too hot","Not enough tea","The gin was cold","Too little sugar","Green tea turns bitter fast."],["Tea adds which structural element to a cocktail?","Tannin, for dryness and grip","Sweetness","Acidity like citrus","Carbonation","Like a red wine's structure."],["A savory Martini idea that fits a Japanese tasting menu:","Kombu-infused vermouth with a touch of saline","Bacon-infused vodka","Ketchup-rimmed glass","Blue cheese olives only","Umami and salinity, still a Martini."],["Your miso-washed bourbon Old Fashioned tastes like soup. Fix:","Use less miso fat-wash in the spec, or cut it with plain bourbon","Add more miso","Add soy sauce","Shake it","A little umami goes a long way."],["Smoking a cocktail, best practice:","Smoke the glass briefly, away from guests' faces","Smoke the drink for a full minute","Smoke it at the table under the guest's nose","Light the garnish on fire","Aroma, not an ashtray."],["Cold-steeping green tea in a spirit:","Gentler extraction, less bitterness","Faster and more bitter","Doesn't work","Requires boiling first","Time instead of heat."],["Why write infusion specs with weights, times and temperatures?","So anyone on the team can make it the same","For the health inspector only","To charge more","Tradition","Consistency is the program."],["Matcha in a cocktail adds:","Grassy bitterness and a silky texture","Smoke","Sweetness","Citrus","Shake or whisk so it doesn't clump."]],"pro":[["The chef sends over leftover dried shiitake and asks for a drink.","Umami should round a drink, not make soup. Infuse vermouth or a fortified wine lightly, then build a familiar structure like a Martini or Manhattan.","Infuse dry vermouth with shiitake for an hour, taste, strain, then a savory Martini: gin, shiitake vermouth, a drop of saline, lemon twist."],["Your hojicha-infused bourbon tastes great today and harsh tomorrow.","Tea extraction keeps going if solids aren't fully strained, and temperature matters. Strain thoroughly and write exact times and weights.","Fine-strain through a coffee filter, record grams per liter and minutes, and taste at fixed intervals next time."],["A guest wants a smoked Old Fashioned.","Smoke is aroma. Smoke the glass briefly, not the drink for minutes, and keep it away from the guest's face.","Smoke the inverted glass for 5–10 seconds with cherry wood, build the drink, flip the glass over it at the bar for the reveal."]]},{"id":"f5","track":"Fine Dining","title":"Pairing Cocktails, Sake & Wine With Food","k":["Match intensity: delicate food (sashimi, oysters, crudo) needs a delicate drink; rich, fatty or grilled food can stand up to bolder drinks.","Acid and bubbles cut fat: Champagne, highballs, and bright sours work with fried and fatty dishes (tempura, wagyu, pork belly).","Bitterness loves richness: a bitter or stirred drink can balance a rich, savory course. But bitterness plus very spicy food tastes harsher.","Spice and alcohol: high alcohol makes chile heat burn more. With spicy dishes go lower in alcohol, a little sweeter, and fizzy (off-dry Riesling, a highball, a fruity sake).","Umami and salt: savory, salty foods (soy, miso, aged cheese, mushrooms) make tannic and oaky wines taste harsher, but they make sake, sherry and lighter drinks taste rounder. That's a big reason sake works so well with Japanese food.","Sweetness: a drink served with dessert should be at least as sweet as the dessert, or it will taste thin and sour.","Bridge flavors: repeat an ingredient from the dish in the drink (yuzu with a yuzu dessert, shiso with a shiso garnish on the plate). It ties them together.","The arc of a meal: light, bright and low-proof drinks at the start (aperitif); richer drinks in the middle; and digestifs (amaro, brandy, aged rum, whisky) or dessert wines at the end. Beverage pairings for a tasting menu follow the same arc, and many fine dining restaurants offer a non-alcoholic pairing too."],"c":[["Pairing rule for delicate food?","Delicate drink — match intensity."],["What cuts fat?","Acid and bubbles."],["Why avoid high ABV with spicy food?","Alcohol makes chile heat burn more."],["Best drink styles for spicy dishes?","Lower alcohol, a little sweet, fizzy."],["Why does sake work with Japanese food?","Umami and salt make tannic wines harsh but make sake taste rounder."],["Dessert drink rule?","At least as sweet as the dessert."],["What's a bridge flavor?","An ingredient shared by the dish and the drink."],["Arc of a meal?","Light aperitifs → richer middle → digestifs or dessert wine."]],"q":[["Course: tempura. Strongest drink pairing:","Champagne or a crisp highball","A Manhattan","A tannic red","A sweet dessert wine","Bubbles and acid cut fried batter."],["Course: very spicy Sichuan beef. Best choice:","Off-dry, lower-alcohol and sparkling","A cask-strength whisky","A high-alcohol, tannic red","A Negroni","Alcohol and bitterness amplify heat."],["Course: miso-glazed black cod. A big tannic Cabernet will likely taste:","Harsh and metallic","Sweeter and smoother","Unchanged","Fruitier","Umami makes tannin harsher; sake or a white works better."],["Course: a yuzu tart. Bridge-flavor pairing:","A yuzu or citrus-forward drink at least as sweet as the dessert","A bone-dry Martini","A tannic red","A dry fino sherry","Repeat a flavor, match sweetness."],["The drink arc of a tasting menu runs:","Light and bright → richer → digestif or dessert wine","Strongest first, lightest last","All the same style","Dessert wine first","Like the food."],["Course: wagyu with a rich sauce. Which drink style works best?","A bitter or stirred, spirit-forward drink","A sweet frozen drink","A light, dry Riesling only","A delicate junmai daiginjo","Bitterness and structure balance richness."],["A guest wants a non-alcoholic pairing. You:","Offer one with the same care and arc as the wine pairing","Bring water with each course","Bring the same soda every course","Suggest they drink a little","Many fine dining rooms offer NA pairings."],["Why does sake pair so well with Japanese food?","Savory, salty food makes sake taste rounder instead of harsher","Sake has more tannin than wine","Sake is always sweet","Sake is stronger than wine","Umami-friendly, no tannin."]],"pro":[["A table's tasting menu: oysters, tempura, wagyu, chocolate. They want one drink per course.","Follow intensity and the arc: oysters (delicate, briny), tempura (fat, needs bubbles), wagyu (rich, needs structure or bitterness), chocolate (sweeter drink).","Oysters: manzanilla or a dry sake. Tempura: Champagne. Wagyu: a stirred, spirit-forward drink or bold red. Chocolate: tawny Port or an amaro-based dessert drink."],["A guest pairing a spicy dish insists on a big, high-alcohol red.","Alcohol and tannin amplify chile heat. Explain briefly and offer a better option, but respect their choice.","'Heat and high alcohol can burn together. An off-dry Riesling would cool it down, but if you love that red, I'll bring it.'"],["Dessert is a yuzu tart; the guest wants a dry white with it.","A drink less sweet than dessert tastes thin and sour. Offer a sweeter option that bridges yuzu.","'With the tart, something a little sweeter will taste better. A yuzu sake or a late-harvest Riesling picks up the citrus.'"]]},{"id":"f6","track":"Fine Dining","title":"Kitchen to Bar: Low-Waste Craft","k":["Restaurant bars work with the kitchen, not apart from it. Ask the chef what's in season, what trim is left over, and what flavors are on the menu this month. Shared ingredients mean drinks that match the food and lower costs.","Use the whole ingredient: juice the citrus, then turn the spent peels into oleo saccharum, cordials, dehydrated garnishes or 'super juice'. Herb stems become syrups or tinctures. Fruit trim becomes shrubs.","Kitchen byproducts worth knowing: aquafaba (chickpea liquid) for vegan foam, whey from cheese or yogurt making for milk-punch-style texture, coffee grounds for syrups, and vegetable juices for savory drinks.","Buy less, use more: a smaller inventory with each ingredient used in several ways means fresher prep and less waste. Every syrup you make should earn its place in more than one drink.","Seasonality: menus change with what's fresh. Expect to learn new specs every few weeks, and expect drinks to come off the menu when an ingredient goes out of season.","Prep in the kitchen's world: follow the kitchen's sanitation, labeling and storage rules, keep shared fridges organized, and respect the chefs' space. Bar staff who prep alongside the kitchen earn trust fast.","Track it: note how much of each prep you make and how much you throw out. Adjust your pars every week."],"c":[["First question to ask the chef?","What's in season, what trim is left, and what's on this month's menu."],["Uses for spent citrus peels?","Oleo saccharum, cordials, dehydrated garnishes, super juice."],["Aquafaba?","Chickpea liquid; vegan foam."],["Whey in cocktails?","A byproduct of cheese/yogurt that adds silky texture."],["'Buy less, use more' means?","A smaller inventory with each ingredient used in several ways."],["How to cut waste week to week?","Track made vs. thrown out; adjust pars."]],"q":[["You juiced 50 limes. Best use of the spent husks:","Oleo saccharum, cordial or super juice","Compost them immediately","Garnish every drink with them","Freeze them for next month","Use the whole ingredient."],["A vegan guest wants a sour with foam. Use:","Aquafaba","Egg white","Cream","Gelatin","Chickpea liquid."],["Whey from the kitchen's yogurt making can give a cocktail:","Milk-punch-style roundness and texture","Carbonation","Bitterness","Color","Kitchen byproducts are free flavor."],["'Buy less, use more' means:","Every prep should earn its place in more than one drink","Buy cheaper spirits","Use more spirit per drink","Buy in bulk","Fresher prep, less waste."],["The chef has extra shiso. A smart bar use:","A shiso syrup or garnish that ties a drink to the menu","Throw it out","Use it for staff meal only","Muddle it into beer","Shared ingredients connect bar and kitchen."],["Your yuzu syrup keeps getting thrown out half-used. Fix:","Lower the par and track waste weekly","Make more","Stop labeling it","Leave it out at room temperature","Adjust pars from real usage."],["A 'cordial' at a craft bar usually means:","A sweet-tart house syrup, often citrus","A liqueur","A non-alcoholic beer","A shot","Lime cordial is the classic."],["A seasonal drink's key fruit goes out of season. Expect:","The drink comes off the menu or gets reworked","Use frozen fruit forever without telling anyone","Keep it with a substitute nobody tastes","Raise the price","Menus follow what's fresh."]],"pro":[["The bar throws out half its strawberry syrup every week.","Waste is data. Track use, cut the par, and give the syrup a second job (a zero-proof drink or a spritz).","Halve the batch size, add it to the NA menu, and recheck waste next week."],["The kitchen has lots of citrus peel from desserts.","Peels become oleo saccharum, cordials, dehydrated garnishes or super juice. One prep, several drinks.","Make oleo saccharum for a punch and a cordial for a house Gimlet."],["You start prepping syrups in the kitchen.","The kitchen's space, rules and labeling apply. Bar staff who follow them earn trust fast.","Ask where to work, label and date everything their way, clean up completely."]]},{"id":"f7","track":"Fine Dining","title":"Wine, Champagne & Sake Service at the Bar","k":["At a fine dining bar you'll pour wine and sake as often as cocktails. The sommelier leads, but you need to serve both perfectly.","Bottle service: present the bottle to the host with the label facing them and say the producer, wine and vintage. Cut the foil below the lip, remove the cork quietly, wipe the lip, pour a small taste for the host, then serve the other guests first (ladies or guests of honor first where that's the house style) and the host last.","Opening Champagne: chill it well. Remove the foil, keep your thumb on the cork, loosen the cage (six half-turns), and keep the cage on. Hold the bottle at about 45°, turn the bottle (not the cork), and ease the cork out with a quiet sigh, never a pop. Pour slowly in two stages so it doesn't foam over.","Serving temperatures: sparkling 43–48°F; light whites and rosé 45–50°F; full whites 50–55°F; light reds 55–60°F; full reds 60–65°F. Most reds are served too warm and most whites too cold.","Wine by the glass: know every pour, its grape, region and two flavor words. Know the pour size (often 5–6 oz) and how the bar preserves open bottles (argon or a Coravin, which pours through the cork).","Decanting: to remove sediment from older reds, or to let young, tight reds open up. Pour slowly in front of a light so you can stop when sediment reaches the neck.","Sake service: premium aromatic sake (ginjo, daiginjo) chilled in a wine glass or small cup; richer junmai and yamahai can be served room temperature or warm. Pour for the guest, never let them pour for themselves, and refill before the cup is empty.","Sherry is a secret weapon for pairing and low-ABV drinks: fino and manzanilla (bone dry, salty, serve very cold, open bottles go off within days), amontillado and oloroso (nutty, richer), Pedro Ximénez (very sweet, for dessert)."],"c":[["Bottle presentation?","Label facing the host; say producer, wine, vintage."],["Who tastes first and who's served last?","The host tastes first and is served last."],["Champagne opening key points?","Thumb on cork, cage stays on, 45°, turn the bottle not the cork, quiet sigh."],["Sparkling serving temp?","About 43–48°F."],["Full red serving temp?","About 60–65°F."],["What does a Coravin do?","Pours wine through the cork without opening the bottle."],["Why decant?","Remove sediment from old reds or open up young reds."],["Sake etiquette at the bar?","Pour for the guest; refill before the cup is empty."],["Fino sherry after opening?","Keep cold; it fades within days."]],"q":[["Opening Champagne at the table, correctly:","Thumb on the cork, cage loosened but on, bottle at 45°, turn the bottle, quiet sigh","Remove the cage, point it up, pop it","Twist the cork, hold the bottle straight up","Saber it","No pop in a fine dining room."],["Pouring a bottle for a table of four:","Taste for the host, serve the guests, host last","Host first, full pour","Fill everyone to the rim","Let the guests pour themselves","Classic service order."],["A full-bodied red should be served around:","60–65°F","70–75°F","45–50°F","35–40°F","Most reds are served too warm."],["Sparkling wine should be served around:","43–48°F","55–60°F","35°F or below","Room temperature","Cold, but not ice-cold."],["A guest wants a glass of a $400 bottle without opening it. Tool:","Coravin","Argon only","A decanter","A vacuum pump","It pours through the cork."],["Decanting an older red, you stop pouring when:","Sediment reaches the neck, watched against a light","Half the bottle is out","The cork is visible","Bubbles appear","Slow and steady."],["A guest wants a premium daiginjo. Best serve:","Chilled, in a wine glass or small cup","Hot in a tokkuri","Over crushed ice","Room temperature in a pint glass","Heat hides delicate aromas."],["An open bottle of fino sherry is best within:","A few days, kept very cold","Several months","A year","Forever; it's fortified","Fino and manzanilla fade fast."]],"pro":[["A guest orders a bottle of Champagne for a toast at the bar.","Chill, foil off, thumb on cork, loosen the cage, keep it on, 45°, turn the bottle, ease it with a sigh. Pour in two stages.","Present the label, open quietly, pour a little in each glass, let the foam settle, top up."],["A guest says their glass of red tastes 'hot and flabby.'","Reds served too warm taste alcoholic and soft. Check the temperature; a few minutes in an ice bucket can fix it.","'Let me cool this down a touch for you,' 5 minutes in an ice bucket, pour a fresh glass."],["A guest wants warm sake with dinner.","Premium aromatic daiginjo is usually best chilled. Richer junmai or yamahai shine warm. Steer kindly.","'For warm sake, this yamahai junmai is great: it gets rounder and more savory. The daiginjo is best cold.'"]]},{"id":"f8","track":"Fine Dining","title":"Premium Spirits & Japanese Whisky","k":["High-end restaurants sell expensive pours: rare whisky, aged Cognac, top-shelf tequila and agave, old rum. Guests expect you to know them and present them well.","Japanese whisky: the big two are Suntory (Yamazaki, single malt; Hakushu, single malt, greener and lightly smoky; Hibiki, blended) and Nikka (Yoichi, coastal and peaty; Miyagikyo, softer and fruity; Nikka From the Barrel, blended). Mizunara (Japanese oak) gives sandalwood and incense notes.","Japanese whisky labeling: industry standards that took full effect in 2024 say 'Japanese whisky' must be fermented, distilled, aged at least 3 years and bottled in Japan, using some malted grain and Japanese water. Some bottles sold as Japanese-style or 'world blend' don't meet that, so read the label.","Taiwan's Kavalan makes award-winning single malts that age fast in the hot, humid climate, especially sherry-cask styles. It's often on Asian fine dining menus.","Serving premium pours: show the bottle, state the pour size and price clearly if asked, offer it neat, with a few drops of water, or on a single large clear cube. Use proper glassware (Glencairn or a small tulip glass for neat tasting). Offer a water back.","Pour sizes: standard pours are often 1½–2 oz, but very rare spirits are often sold by the ½ oz or 1 oz. Always confirm the size and price with a guest before pouring something very expensive. No surprises on the check.","Selling up gracefully: describe flavor and story ('aged in mizunara oak, it smells like sandalwood and incense'), offer a flight to compare, and never push. Recommend at two price points so the guest can choose comfortably.","Tasting language: nose (aroma), palate (flavor and texture in the mouth), finish (how long it lasts and what stays). Practice describing every bottle on your backbar in one sentence each."],"c":[["Suntory's three core names?","Yamazaki, Hakushu (single malts), Hibiki (blend)."],["Nikka's two distilleries?","Yoichi (coastal, peaty) and Miyagikyo (softer, fruity)."],["Mizunara oak notes?","Sandalwood and incense."],["Japanese whisky labeling standard?","Fermented, distilled, aged 3+ years and bottled in Japan."],["Kavalan?","Taiwanese single malt; ages fast in heat; known for sherry casks."],["How do you serve a premium neat pour?","Show the bottle, proper glass, offer water drops or a big clear cube, water back."],["Before pouring something very expensive?","Confirm size and price with the guest."],["Selling up gracefully?","Describe flavor and story, offer a flight, two price points, never push."],["Three parts of tasting?","Nose, palate, finish."]],"q":[["A guest asks for 'the Suntory single malt that's greener and lightly smoky.'","Hakushu","Yamazaki","Hibiki","Yoichi","Hibiki is a blend; Yoichi is Nikka."],["Nikka's coastal, peatier single malt:","Yoichi","Miyagikyo","Hakushu","Yamazaki","Miyagikyo is softer and fruity."],["A bottle says 'Japanese whisky.' Under the industry standard that took full effect in 2024, it must be:","Fermented, distilled, aged at least 3 years and bottled in Japan","Just bottled in Japan","Aged 10 years anywhere","Made from rice","Some 'world blends' don't qualify."],["A guest orders the rarest whisky on the list. Before pouring, you:","Confirm the pour size and price","Pour 2 oz and surprise them","Ask if they want ice","Pour it in a highball","No surprises on the check."],["Mizunara oak gives:","Sandalwood and incense notes","Coconut and dill","Smoke and iodine","Sherry and dried fruit","Japanese oak."],["Kavalan whisky ages fast because:","Taiwan's heat and humidity speed cask interaction","It's distilled at very high proof","It uses tiny barrels only","It's not actually aged","Sherry-cask styles are famous."],["Selling up gracefully looks like:","Recommend two price points and describe flavor and story","Push the most expensive bottle","Pour it before asking","Mention only price","Never push."],["A neat premium pour is best served in:","A Glencairn or small tulip glass, with a water back","A pint glass","A coupe with ice","A shot glass","The tulip shape focuses aroma."]],"pro":[["A guest asks for 'a Japanese whisky like Yamazaki 18' and it's $85 an ounce.","Confirm size and price first. Offer two price points so the guest can choose comfortably, without pressure.","'Yamazaki 18 is $85 for an ounce. If you'd like something similar for less, Yamazaki 12 has the same house style. Which would you prefer?'"],["A guest asks why your Kavalan is so dark and rich for its age.","Taiwan's heat speeds the spirit's interaction with the cask, and sherry casks add dark fruit and color.","'It's from Taiwan, where the heat ages whisky much faster, and this one spent its life in sherry casks.'"],["A guest asks for 'the best whisky you have' without a budget.","'Best' is personal. Ask what they like, then give two options at two prices. Confirm the price before you pour.","'What do you usually enjoy, smoky, rich, or light and fruity?' Then offer two bottles with prices."]]},{"id":"mm1","track":"Masters of Mixology","title":"The Six Root Cocktails","k":["In Cocktail Codex (2018), the Death & Co team (Alex Day, Nick Fauchald, David Kaplan) argue that almost every cocktail is a variation on six 'root' drinks. Learn the six and you can explain, fix or invent nearly anything.","Old Fashioned: spirit + sugar + bitters. The original 'cocktail'. Family: Sazerac, Oaxaca Old Fashioned, Improved Whiskey Cocktail, Vieux Carré (a bridge to the Martini family).","Martini: spirit + aromatized wine (vermouth). Family: Manhattan, Rob Roy, Martinez, Negroni and Boulevardier (where a bitter liqueur joins the vermouth), Bamboo (low-ABV).","Daiquiri: spirit + citrus + sugar. The sour. Family: Gimlet, Whiskey Sour, Bee's Knees, Gold Rush, Pisco Sour, Southside, Penicillin.","Sidecar: spirit + citrus + a liqueur as the sweetener. The Daisy branch of the sour. Family: Margarita, Cosmopolitan, Corpse Reviver #2, Pegu Club, Last Word.","Whisky Highball: spirit + a carbonated, lengthening mixer. Family: Gin & Tonic, Tom Collins (a sour lengthened with soda), Paloma, Moscow Mule, Spritz, Americano.","Flip: spirit or fortified wine + sugar + a rich, emulsifying ingredient (whole egg, cream). Family: Eggnog, Brandy Alexander, Grasshopper, and egg-white sours as near cousins.","How to use it: when you meet an unknown drink, ask 'which root is this?' first. Its root tells you the method (stir, shake, build), the balance to aim for, and what to adjust if it tastes wrong."],"c":[["The six root cocktails (Cocktail Codex)?","Old Fashioned, Martini, Daiquiri, Sidecar, Whisky Highball, Flip."],["Old Fashioned root formula?","Spirit + sugar + bitters."],["Martini root formula?","Spirit + aromatized wine (vermouth)."],["Daiquiri root formula?","Spirit + citrus + sugar."],["Sidecar root formula?","Spirit + citrus + liqueur as the sweetener."],["Highball root formula?","Spirit + carbonated lengthener."],["Flip root formula?","Spirit or fortified wine + sugar + whole egg or cream."],["Which root is a Negroni?","Martini (spirit + aromatized wine, with a bitter liqueur)."],["Which root is a Margarita?","Sidecar."]],"q":[["Which root does a Paloma belong to?","Highball","Daiquiri","Sidecar","Flip","Spirit plus a carbonated, lengthening mixer."],["A Corpse Reviver #2 is a branch of which root?","Sidecar","Martini","Old Fashioned","Flip","Spirit + citrus + liqueur as sweetener."],["A Brandy Alexander belongs to which root?","Flip","Sidecar","Martini","Highball","Rich, emulsifying ingredient (cream)."],["A Negroni sits in which root family?","Martini","Old Fashioned","Daiquiri","Highball","Spirit + aromatized wine, with a bitter liqueur."],["A Tom Collins is best described as:","A Daiquiri-style sour lengthened with soda (bridging into the Highball)","A Flip","An Old Fashioned variation","A Martini variation","Sour + soda."],["You're handed an unknown drink: rye, sugar, Peychaud's, absinthe rinse. Which root, and how is it mixed?","Old Fashioned; stirred","Daiquiri; shaken","Highball; built","Flip; shaken with egg","It's a Sazerac."],["Who wrote Cocktail Codex?","The Death & Co team (Day, Fauchald, Kaplan)","Dale DeGroff","Jerry Thomas","Dave Arnold","Six roots."],["The Last Word, by root:","Sidecar (liqueurs sweeten a sour)","Martini","Old Fashioned","Flip","Equal-parts sour with liqueurs."]],"pro":[["A guest orders a drink you've never heard of: 'gin, Lillet, Cointreau, lemon, absinthe rinse.'","Find the root: spirit + citrus + liqueur sweetener = Sidecar root (it's a Corpse Reviver #2). Root tells you: shake, coupe, aim for a balanced sour.","Shake equal parts, strain into an absinthe-rinsed coupe, taste for sour balance."],["A new hire asks how you remember hundreds of drinks.","You don't memorize hundreds; you learn six roots and how drinks branch from them.","'Learn six templates, then every drink is a variation: change the spirit, the sweetener or add a modifier.'"]]},{"id":"mm2","track":"Masters of Mixology","title":"Cocktail History Every Pro Knows","k":["1806: the first known printed definition of a 'cock-tail' appeared in The Balance and Columbian Repository (Hudson, New York): spirits, sugar, water and bitters. That's the Old Fashioned root.","1862: Jerry Thomas published How to Mix Drinks (the Bar-Tender's Guide), the first major American cocktail book. Thomas was the era's celebrity bartender.","Late 1800s golden age: vermouth arrives in American bars, giving us the Manhattan and the Martinez, ancestors of the Martini.","Prohibition in the US (1920–1933) pushed many bartenders to Europe and Cuba. Harry Craddock's The Savoy Cocktail Book (London, 1930) and Harry's New York Bar in Paris (Harry MacElhone) kept the craft alive. Havana bars made the Daiquiri famous.","Tiki (1930s onward): Don the Beachcomber in Hollywood and Trader Vic in Oakland built exotic rum drinks with layered rums, spices and syrups.","The 'dark ages' (roughly the 1970s and 80s): bottled sour mix, artificial flavors and sweet vodka drinks dominated.","The revival: Dale DeGroff at the Rainbow Room in New York (from 1987) brought back fresh juice and the classics. Dick Bradsell shaped London's scene (Bramble, Espresso Martini). Sasha Petraske opened Milk & Honey (1999). Then Pegu Club (2005), Death & Co (2006) and PDT (2007). David Wondrich's Imbibe! (2007) became the history bible.","Today: Tales of the Cocktail (New Orleans, every summer) and the World's 50 Best Bars list (since 2009) are the industry's big stages."],"c":[["First printed definition of a cocktail?","1806, The Balance and Columbian Repository: spirits, sugar, water, bitters."],["First major American cocktail book?","Jerry Thomas, How to Mix Drinks / Bar-Tender's Guide, 1862."],["US Prohibition years?","1920–1933."],["The Savoy Cocktail Book?","Harry Craddock, London, 1930."],["Tiki pioneers?","Don the Beachcomber and Trader Vic, 1930s on."],["Who led the fresh-juice revival in New York?","Dale DeGroff, Rainbow Room, from 1987."],["Milk & Honey?","Sasha Petraske, New York, 1999."],["The cocktail history bible?","Imbibe!, David Wondrich (2007)."]],"q":[["The 1806 'cock-tail' definition is the root of which modern drink?","Old Fashioned","Martini","Daiquiri","Mai Tai","Spirits, sugar, water, bitters."],["The Old Fashioned got its name from guests asking for:","A cocktail made the 'old-fashioned' way: spirit, sugar, bitters, water","A drink in an old glass","An aged whiskey","Muddled fruit","When cocktails got fancier, regulars wanted the original."],["Who brought fresh juice and the classics back at the Rainbow Room?","Dale DeGroff","Sasha Petraske","Jim Meehan","Harry Craddock","From 1987."],["Why did many classics fade during Prohibition?","Skilled bartenders left the US and good spirits were scarce","Sugar was banned","Ice was illegal","Bitters were outlawed","Many went to Europe and Cuba."],["What Milk & Honey made standard in modern craft bars:","Precise specs, fresh juice and great ice","Free pouring","Bottled sour mix","Flair bartending","Sasha Petraske's standards."],["The Savoy Cocktail Book was written by:","Harry Craddock","Jerry Thomas","Dale DeGroff","Trader Vic","London, 1930."],["The 'dark ages' of cocktails (70s–80s) were known for:","Bottled sour mix and artificial flavors","Fresh juice","Tiki's birth","Prohibition","Then the revival."],["Tiki was built by:","Don the Beachcomber and Trader Vic","Jerry Thomas","Sasha Petraske","Dick Bradsell","Layered rums, spices, syrups."]],"pro":[["A guest asks, 'Where did the word cocktail come from?'","Origins are debated; give what's documented: the 1806 printed definition (spirits, sugar, water, bitters), the Old Fashioned's ancestor.","'The first printed definition is from 1806: spirit, sugar, water and bitters. That's basically an Old Fashioned.'"],["A guest asks why so many classics are from the 1800s and then the 2000s.","Golden age (1800s), Prohibition and the dark ages (sour mix), then the revival with DeGroff, Petraske, Pegu Club, Death & Co, PDT.","'There was a golden age, then Prohibition and decades of sour mix. Around 2000 bartenders brought back fresh juice and the old recipes.'"]]},{"id":"mm3","track":"Masters of Mixology","title":"Lessons from the Masters","k":["Dale DeGroff ('King Cocktail'): fresh ingredients, the classics done right, and hospitality as theater. His book The Craft of the Cocktail (2002) trained a generation. Lesson: respect the guest and the recipe.","Sasha Petraske (Milk & Honey): precision, a serious ice program, quiet rooms, house rules and consistency. He trained many bartenders who became leaders (including Sam Ross, creator of the Penicillin and Paper Plane). His book is Regarding Cocktails (2016). Lesson: do simple things perfectly.","Audrey Saunders (Pegu Club): obsessive balance and tasting every component, and a training ground for top bartenders. Created the Old Cuban and Gin-Gin Mule. Lesson: taste everything, every time.","Jim Meehan (PDT): hospitality systems and how bars are designed and run. Wrote The PDT Cocktail Book (2011) and Meehan's Bartender Manual (2017). Lesson: great bars are built on systems, not just talent.","Jeffrey Morgenthaler (Portland): practical technique. His The Bar Book (2014) is a standard manual; he helped popularize barrel-aged cocktails and is known for a much-improved Amaretto Sour. Lesson: understand why a technique works.","Dave Arnold (Liquid Intelligence, 2014): science applied to drinks: dilution, clarification, carbonation, temperature. Lesson: measure things.","Ryan Chetiyawardana (Mr Lyan): ingredient innovation and sustainability. His White Lyan (London, 2013) famously used no ice and no fresh citrus. Lesson: question every 'rule'.","The common thread: every one of them tastes constantly, writes specs down, treats ice and dilution seriously, values hospitality as much as drinks, and mentors the next generation."],"c":[["Dale DeGroff's book?","The Craft of the Cocktail (2002)."],["Sasha Petraske's lesson?","Do simple things perfectly: precision, ice, consistency."],["Who created the Old Cuban?","Audrey Saunders (Pegu Club)."],["Jim Meehan's books?","The PDT Cocktail Book (2011), Meehan's Bartender Manual (2017)."],["Jeffrey Morgenthaler's book?","The Bar Book (2014)."],["Dave Arnold's book?","Liquid Intelligence (2014)."],["White Lyan?","Ryan Chetiyawardana's London bar (2013): no ice, no fresh citrus."],["Common thread of the masters?","Taste constantly, write specs, take ice seriously, value hospitality, mentor."]],"q":[["Sasha Petraske's core lesson:","Do simple things perfectly","Never use ice","Free pour for speed","Menus should be huge","Precision and consistency."],["Audrey Saunders created:","The Old Cuban and Gin-Gin Mule","The Penicillin","The Bramble","The Paper Plane","Pegu Club."],["Jim Meehan's main lesson:","Great bars run on systems","Never write specs down","Speed over quality","Avoid classics","PDT and the Bartender Manual."],["Dave Arnold's lesson:","Measure things: dilution, temperature, carbonation","Taste only once","Avoid technique","Use bottled juice","Liquid Intelligence."],["White Lyan (Mr Lyan) was famous for:","No ice and no fresh citrus","Only tiki drinks","Flair bartending","A 500-drink menu","Questioning every rule."],["Jeffrey Morgenthaler is known for:","Practical technique, barrel-aged cocktails and a better Amaretto Sour","Inventing the Martini","Molecular foams only","Tiki history","The Bar Book."],["Which bartender came up under Sasha Petraske?","Sam Ross","Dale DeGroff","Jerry Thomas","Harry Craddock","Penicillin and Paper Plane."],["What do the masters have in common?","They taste constantly, write specs down, take ice seriously and mentor others","They avoid classics","They never measure","They only make originals","Habits, not tricks."]],"pro":[["You're asked in an interview, 'Who influences your bartending?'","Pick one master and a specific lesson you apply. Specific beats name-dropping.","'Sasha Petraske: do simple things perfectly. I measure everything and treat ice like an ingredient.'"],["Your bar wants to start a clarified program.","Dave Arnold's lesson: measure. Test methods (milk washing, agar), record weights and times, taste and adjust.","Run a small agar test, record grams per liter and yield, compare to milk washing, write up the spec."]]},{"id":"mm4","track":"Masters of Mixology","title":"Building Signature Drinks Like a Pro","k":["Start from a root: pick the root that fits the moment (refreshing = Daiquiri or Highball; contemplative = Old Fashioned or Martini; rich = Flip).","Change the core, then rebalance: swapping the base spirit changes strength and sweetness. A split base (two spirits) adds depth without losing the structure.","Season, don't smother: bitters, a few drops of saline, a rinse or an expressed peel adjust a drink the way salt and pepper adjust food.","Pair flavors that already work in food: tequila + grapefruit, gin + cucumber, rum + banana, whiskey + stone fruit, apple + cinnamon, chocolate + orange, mezcal + pineapple. Bridge flavors to the menu you're pairing with.","Keep it to about four or five components. Every ingredient must earn its place; if you can't taste it, remove it.","Test like a pro: write version numbers, change one thing at a time, taste on different days, get blind feedback from your team, and test it at service speed.","Name and story: a good name is easy to say and hints at the flavor or the place. One sentence of story helps servers sell it.","Document the final spec: glass, ice, method, garnish, amounts in pour order, batch notes, cost, allergens."],"c":[["First step for a signature drink?","Pick the root that fits the moment."],["What does a split base do?","Adds depth without losing structure."],["How to season a drink?","Bitters, saline, rinses, expressed peel."],["Name three proven flavor pairings.","Tequila + grapefruit, gin + cucumber, rum + banana (also whiskey + stone fruit, apple + cinnamon)."],["How many components, ideally?","About four or five; each must earn its place."],["How to test a new drink?","Version numbers, one change at a time, different days, blind team tastes, service-speed test."],["What makes a good drink name?","Easy to say, hints at flavor or place."]],"q":[["You can't taste one of six ingredients in a new drink. You should:","Remove it","Double it","Add a seventh to balance","Keep it for the story","Every ingredient earns its place."],["A refreshing summer signature should start from which root?","Daiquiri or Highball","Old Fashioned","Martini","Flip","Match the moment."],["Changing two things at once while testing:","Makes it hard to know what helped","Is faster and better","Is required","Has no downside","One change at a time."],["Which flavor pairing is a proven starting point?","Tequila and grapefruit","Gin and chocolate milk","Rum and blue cheese","Vodka and soy sauce","Borrow pairings that work in food."],["Your new drink tastes good alone but disappears next to the food. Fix:","Bridge a flavor from the dish and raise intensity to match","Make it sweeter","Remove the garnish","Serve it warmer","Test it with the food."],["A good signature drink name:","Easy to say and hints at flavor or place","Long and complicated","An inside joke","A number","Servers need to sell it."],["Before finalizing, test it:","On different days, blind with the team, and at service speed","Once, at the end of the night","Only on regulars","Never with food","Then document it."],["A signature drink spec card includes:","Glass, ice, method, garnish, amounts in pour order, batch notes, cost, allergens","Just the ingredients","Only the price","The story only","Everything someone needs to make it."]],"pro":[["Your manager asks for a signature tequila drink for summer.","Pick a root that fits (Highball or Daiquiri), a proven pairing (tequila + grapefruit), one twist, four or five ingredients, test.","Start from a Paloma: blanco, grapefruit, lime, a little agave, a pinch of salt, plus a rosemary-infused syrup as the twist. Test three days, cost it."],["Your new drink has seven ingredients and tastes muddy.","Too many components blur flavor. Remove what you can't taste, one at a time.","Pull ingredients one by one, taste after each, keep only what's missed when it's gone."]]},{"id":"mm5","track":"Masters of Mixology","title":"Modern Formats: Barrel-Aged, Bottled, Draft & Batched","k":["Barrel-aged cocktails: an all-spirit drink (Manhattan, Negroni, Boulevardier) rests in a small oak barrel for weeks. Oak adds vanilla and spice; slow oxidation softens the edges. Small barrels work fast, so taste weekly.","Batched and pre-diluted: for speed, build stirred drinks in advance with measured water, keep them cold, and pour to order. A 'freezer Martini' is pre-diluted and stored in the freezer.","Bottled and draft cocktails: carbonated highballs and spritzes can be bottled or kegged for consistency and speed. Fresh citrus fades fast, so draft programs use acid-adjusted or clarified juices and test shelf life.","Events and large parties (BEOs at a restaurant like Mott 32): batch the spirit-and-syrup base, add citrus fresh on the day, and set a clear spec per glass so every guest gets the same drink.","Quality control: label every batch with name, date, maker and dilution; taste every batch before service; record what you'd change.","When not to batch: drinks that rely on fresh aeration or egg (sours, flips) lose texture if fully pre-made. Batch the base, finish to order."],"c":[["What does barrel-aging add?","Oak flavor (vanilla, spice) and gentle oxidation that softens."],["How often to taste a small-barrel cocktail?","Weekly; small barrels work fast."],["Freezer Martini?","Pre-diluted Martini stored in the freezer."],["Why do draft programs avoid plain fresh citrus?","It fades fast; they use acid-adjusted or clarified juice."],["How to batch for a large party?","Batch spirit + syrup base, add citrus fresh, fixed spec per glass."],["What goes on a batch label?","Name, date, maker, dilution."],["What shouldn't be fully pre-made?","Drinks needing fresh aeration or egg (sours, flips)."]],"q":[["Which drink is best suited to barrel aging?","Negroni","Daiquiri","Ramos Gin Fizz","Mojito","All-spirit drinks only."],["A small barrel ages a cocktail:","Fast, so taste weekly","Slowly, so leave it a year","Not at all","Only if it's charred","More surface per volume."],["Draft cocktail programs usually handle citrus by:","Using acid-adjusted or clarified juice and testing shelf life","Using fresh lime in the keg for weeks","Skipping citrus","Adding citrus only at the keg","Fresh juice fades."],["For a 300-guest event, the smart approach is:","Batch the base, add citrus fresh, fixed spec per glass","Make each drink to order","Batch everything including egg white the day before","Free pour","Consistency at volume."],["A 'freezer Martini' must include:","Pre-measured water for dilution","Ice in the bottle","Extra vermouth only","Soda","Freezer drinks don't get stirred."],["Why not fully batch a Whiskey Sour with egg white?","It loses foam and texture; batch the base and finish to order","Egg white is illegal in batches","It gets stronger","It's always fine","Aeration happens at service."],["Every batch should be:","Labeled with name, date, maker, dilution, and tasted before service","Unlabeled to save time","Tasted only weekly","Stored warm","Quality control."],["Bottled highballs need:","A fixed, tested spirit-to-mixer ratio and very cold, clear liquid","Fresh juice and pulp","Warm storage","No testing","Particles cause foaming."]],"pro":[["Your bar wants a barrel-aged Boulevardier.","All-spirit drink, small barrel, taste weekly, stop when oak is integrated, not dominant.","Fill a 3-liter barrel, taste every week, bottle when it's rounder with gentle vanilla, label with date and batch."],["A 200-person event wants Margaritas.","Batch tequila and Cointreau (and syrup) in advance; add fresh lime on the day; fixed spec per glass; shake to order or pre-dilute and serve over ice.","Batch base, squeeze lime that afternoon, combine shortly before service, taste, pour a fixed amount over ice."]]},{"id":"a1","track":"Advanced","title":"Dilution & ABV Math","k":["ABV of a finished drink = total pure alcohol ÷ total final volume. Pure alcohol in each ingredient = its volume × its ABV. Final volume = all ingredients + the water the ice added.","Worked Daiquiri: 2 oz rum at 40% = 0.80 oz alcohol. Add ¾ oz lime and ¾ oz simple (no alcohol) = 3.5 oz before ice. A hard shake adds water equal to roughly 50–60% of that (about 1.9 oz), so the final drink is about 5.4 oz. 0.80 ÷ 5.4 ≈ 15% ABV.","Worked Manhattan: 2 oz rye at 45% = 0.90 oz alcohol; 1 oz sweet vermouth at about 16.5% = 0.165 oz. Total 1.065 oz alcohol in 3 oz. Stirring adds roughly 1–1.3 oz of water, giving about 4–4.3 oz and about 25% ABV, right in the stirred range.","Measure your own dilution the way Dave Arnold teaches: weigh the drink's ingredients, stir or shake as you normally would, weigh the strained drink again. The difference is the water you added. Your ice, your tins and your hands change the number, so use your own.","Batching stirred drinks: build the batch from the spec, then add the water your measured dilution says one drink gains, times the number of drinks. Store it in the fridge or freezer and pour straight into a chilled glass. Taste it cold; drinks taste less sweet and less boozy at freezer temperature.","Balance has numbers behind it: Dave Arnold's analysis of classic sours found they cluster in a narrow band of sugar and acid in the finished drink. You don't need to calculate every drink, but it explains why ¾ oz lime with ¾ oz simple works so reliably, and why a sour with weaker citrus (orange, grapefruit) needs adjusting.","Proof vs ABV: in the US, proof = 2 × ABV. A 100-proof bourbon is 50% ABV. A navy-strength rum (57%+) adds far more alcohol per ounce than a standard 40% rum, so you can use less of it in a split base."],"c":[["ABV formula for a cocktail?","Total pure alcohol ÷ total final volume (ingredients + dilution water)."],["Pure alcohol in 2 oz of 40% rum?","0.8 oz."],["About how much water does a hard shake add?","Roughly 50–60% of the starting volume."],["Daiquiri finished ABV, roughly?","About 15%."],["Manhattan finished ABV, roughly?","About 25%."],["How do you measure your real dilution?","Weigh before and after shaking or stirring; the difference is water."],["Batching water for stirred drinks?","Your measured per-drink dilution × number of drinks."],["What did Arnold find about classic sours?","They cluster in a narrow band of sugar and acid — balance is measurable."],["100 proof = ?","50% ABV."]],"q":[["A Negroni: 1 oz gin (47%), 1 oz Campari (24%), 1 oz sweet vermouth (16%), stirring adds 1.2 oz water. Finished ABV is closest to:","21%","29%","15%","35%","0.87 oz alcohol ÷ 4.2 oz ≈ 20.7%."],["A drink has 1 oz pure alcohol in 5 oz finished volume. ABV:","20%","25%","15%","10%","1 ÷ 5."],["2 oz rum at 40% + ¾ lime + ¾ simple, shaken (adds about 1.9 oz water). ABV is about:","15%","23%","10%","40%","0.8 ÷ 5.4."],["How do you find your real dilution?","Weigh the drink before and after mixing","Guess by color","Count the ice cubes","Use the bottle ABV","Your ice and hands change the number."],["You batch 10 Manhattans; each gains 1.2 oz water when stirred. Add how much water to the batch?","12 oz","1.2 oz","6 oz","24 oz","Per-drink dilution × drinks."],["Navy-strength rum (57%) vs. a 40% rum in a split base:","Use less; it adds more alcohol per ounce","Use the same amount","Use more","Never mix them","Strength per ounce matters."],["Why do batched drinks taste different straight from the freezer?","Cold mutes sweetness and alcohol","They're stronger","Water separates out","Sugar crystallizes","Taste it cold before service."],["A 100-proof bourbon is:","50% ABV","100% ABV","40% ABV","57% ABV","Proof = 2 × ABV."]],"pro":[["Your manager asks why your house Old Fashioned feels 'hot.'","Calculate: 2 oz bourbon at 50% = 1 oz alcohol, ¼ oz syrup; if you only add 0.8 oz water, it's about 1 ÷ 3.05 ≈ 33% ABV, above the stirred sweet spot (21–29%).","Stir longer or add a measured splash of water to bring it to around 27–28%, then re-taste."],["You want to batch 20 Martinis for the freezer.","Measure one drink's dilution by weight, multiply by 20, add that water to the batch, label it.","Weigh one stirred Martini before/after, use that water × 20, chill, taste cold, label."]]},{"id":"a2","track":"Advanced","title":"Carbonation & the Perfect Highball","k":["CO2 dissolves much better in cold liquid. Everything in a highball (glass, spirit, mixer, ice) should be as cold as possible so the drink stays fizzy.","Bubbles escape at nucleation points: scratches, dust, tiny ice cracks, warm spots and rough pouring. Clean, chilled glassware, solid clear ice and a gentle pour down the side or a bar spoon keep carbonation in.","Stir a highball once, gently, by lifting from the bottom. Every extra stir knocks out CO2.","Carbonated water tastes slightly acidic (carbonic acid) and makes drinks taste drier. That's why carbonated cocktails usually need a little less citrus than their still versions.","Force-carbonating cocktails (a CO2 tank, or a bottle with a carbonation cap): use clear, cold liquid. Particles and pulp cause foaming and flat drinks, which is why bars clarify juices before carbonating. Follow your equipment's pressure guidance and chill as close to freezing as you can.","Bottled and kegged cocktails: highballs and spritzes can be pre-batched and carbonated for speed, a big advantage on high-volume nights. The spirit-to-mixer ratio must be fixed and tested.","The Japanese highball is the gold standard: very cold whisky, very cold, highly carbonated soda, a frozen glass full of clear ice, and as little stirring as possible."],"c":[["Why keep everything cold for a highball?","CO2 stays dissolved better in cold liquid."],["What makes bubbles escape?","Nucleation points: scratches, dust, ice cracks, warm spots, rough pours."],["How many times do you stir a highball?","Once, gently, lifting from the bottom."],["Why do carbonated drinks need less citrus?","Carbonic acid adds acidity and dryness."],["Why clarify before carbonating?","Particles cause foaming and flat drinks."],["Gold-standard highball elements?","Frozen glass, clear ice, very cold whisky and soda, minimal stirring."]],"q":[["Your highballs go flat fast. Most likely cause:","Warm glass or mixer and too much stirring","Too much ice","Too cold soda","Clear ice","Cold holds CO2."],["Why do carbonated sours need a little less citrus?","Carbonic acid makes drinks taste drier and more acidic","Bubbles add sugar","Soda neutralizes acid","They don't","Adjust the spec."],["Before force-carbonating a lime cocktail you should:","Clarify the juice","Add pulp for texture","Warm it up","Add egg white","Particles cause foaming."],["Bubbles escape fastest from:","Scratches, dust and warm spots in the glass","Very cold glass","Clear ice","A gentle pour","Nucleation points."],["Best way to add soda to a highball:","Gently down a bar spoon or the side of the glass","Pour hard from high up","Shake it in","Stir hard after","Protect the bubbles."],["CO2 dissolves best in:","Cold liquid","Warm liquid","Sugary liquid only","Any temperature equally","Keep everything cold."],["How many times do you stir a highball?","Once, a gentle lift from the bottom","Ten times","Until the ice melts","Never touch it","Every stir loses fizz."],["The gold-standard highball:","Very cold whisky and soda, frozen glass, clear ice, minimal stirring","Room-temperature soda","Crushed ice and hard stirring","Shaken whisky","Japanese style."]],"pro":[["Your bottled highballs come out foamy and flat.","Warm liquid and particles. Chill to near freezing, clarify juices, use clean bottles, follow carbonation pressure guidance.","Chill the batch overnight, fine-filter, carbonate cold, cap fast, store cold."],["A guest says their gin and tonic tastes 'flat and sweet.'","Carbonation brings perceived dryness and acidity. Flat G&T tastes sweeter. Fix cold chain and stirring.","Remake with cold tonic, chilled glass, big ice, one lift."]]},{"id":"a3","track":"Advanced","title":"Clarification & Texture","k":["Milk washing (clarified milk punch): acid in the punch curdles the milk's casein proteins. The curds trap solids and tannins; you strain the liquid back through the curds (often through a coffee filter) until it runs clear. Recipes commonly use about 1 part milk to 3–4 parts punch. Pour the punch into the milk, not the other way around, for cleaner curds.","What milk washing changes: it removes harsh tannin and color, adds a soft, silky texture, and makes the drink shelf-stable. It also strips some bitterness, so very tannic or bitter drinks come out rounder.","Agar clarification (from Dave Arnold): dissolve a small amount of agar (around 2 g per liter, about 0.2%) into hot juice or water, mix it into the rest, let it set into a loose gel, break it up, and strain through cloth. The gel traps the particles.","Centrifuges spin solids out of juice in minutes. Enzymes like Pectinex break down pectin first so fruit juices clarify more easily.","Texture tools: egg white and aquafaba (foam), cream (richness), gum arabic syrup or 'gomme' (silky mouthfeel), saline (rounds edges), fat-washing (body), and dilution (lighter).","Why clear drinks matter at fine dining bars: visual surprise (a clear 'tomato' or clear Piña Colada), stable batches, and drinks you can carbonate."],"c":[["What curdles in milk washing?","Casein proteins, from the acid in the punch."],["Milk-to-punch ratio (common)?","About 1 part milk to 3–4 parts punch."],["Pour order for milk washing?","Punch into milk."],["What does milk washing remove and add?","Removes tannin, color and harshness; adds silky texture and shelf stability."],["Agar amount (Arnold)?","Around 2 g per liter (about 0.2%)."],["What does Pectinex do?","Breaks down pectin so juices clarify more easily."],["What is gomme?","Gum arabic syrup; adds silky texture."]],"q":[["In milk washing, what does the filtering?","The curds","The coffee filter alone","The ice","The sugar","Strain back through the curd bed."],["A tannic black-tea punch tastes harsh. Milk washing will likely make it:","Rounder and silkier","More tannic","Cloudier","Stronger","It strips tannin."],["Agar clarification works by:","Trapping particles in a loose gel","Spinning at high speed","Boiling","Adding milk","About 2 g per liter."],["Gum arabic (gomme) syrup adds:","Silky texture","Bitterness","Carbonation","Color","Classic texture tool."],["Why add Pectinex before clarifying fruit juice?","It breaks down pectin so the juice clarifies more easily","It sweetens the juice","It adds color","It stops oxidation","Enzymes help centrifuges and filters."],["A typical milk punch ratio is about:","1 part milk to 3–4 parts punch","Equal parts","1 part punch to 4 parts milk","No milk","Pour punch into milk."],["Why clear drinks matter at fine dining bars:","Visual surprise, stable batches, and drinks you can carbonate","They're cheaper","They're stronger","Health codes require it","Clear = carbonation-ready."],["Which texture tool rounds edges without tasting salty?","A few drops of saline","A pinch of sugar","Cream","Soda","Salt as seasoning."]],"pro":[["You want a clear 'Piña Colada' for a tasting menu.","Milk washing or agar can clarify pineapple and coconut; test which keeps more flavor; keep spec notes.","Make a small milk-washed batch and an agar batch, compare flavor and clarity, write the winner up."],["Your milk punch tastes thin after washing.","Washing strips tannin and body. Add texture back: a touch of gomme syrup or richer sugar, or adjust milk ratio.","Add ¼ oz gomme per serving or reduce the milk slightly next batch."]]},{"id":"a5","track":"Advanced","title":"Reading Wine Labels: The Mott 32 List","k":["Champagne sweetness: Brut Nature has 0–3 g/L of sugar (no dosage added), Extra Brut 0–6 g/L, Brut under 12 g/L. NV (non-vintage) means a blend of years in a consistent house style. The Patrick Piuze Crémant de Bourgogne Brut Nature Rosé is bone dry.","Crémant: traditional-method sparkling wine from French regions outside Champagne (Burgundy, Loire, Alsace and others). Same method, often better value.","Burgundy hierarchy: regional (Bourgogne) → village → Premier Cru → Grand Cru. The Frédéric Magnien 'Bourgogne' Pinot Noir is regional-level: the entry point to a great producer.","Saint-Émilion: 'Saint-Émilion Grand Cru' is an appellation with stricter rules than plain Saint-Émilion. It is not the same as being a 'Grand Cru Classé', which is a separate, ranked classification. Les Cadrans de Lassègue is labeled Saint-Émilion Grand Cru.","German labels: QbA (Qualitätswein) is quality wine from a defined region (the Carl Graff Mosel). Above it, Prädikatswein levels are based on grape ripeness at harvest: Kabinett, Spätlese, Auslese, Beerenauslese, Trockenbeerenauslese, plus Eiswein.","Piedmont: Barolo DOCG requires at least 38 months of aging, 18 in wood. Langhe Nebbiolo DOC (the Vajra) is the younger, fresher, more affordable way to taste the grape.","Port styles on the list: Tawny (aged in wood, nutty, caramel), Colheita (a single-vintage tawny aged at least 7 years in wood, like the Dow's 1992 and 1982), 20 Year Tawny (a blend averaging that age, like the Fonseca), and LBV (Late Bottled Vintage, bottled 4–6 years after harvest, like the Niepoort 2019).","Sauternes: sweet Bordeaux white made from grapes affected by noble rot (Botrytis cinerea), which concentrates sugar and adds honey and apricot flavors. Madeira: heated and oxidized fortified wine; Malmsey is the sweetest style and nearly indestructible once open."],"c":[["Brut Nature sugar level?","0–3 g/L, no dosage."],["What is Crémant?","Traditional-method French sparkling wine from outside Champagne."],["Burgundy hierarchy?","Regional → village → Premier Cru → Grand Cru."],["Saint-Émilion Grand Cru vs Grand Cru Classé?","The first is an appellation; the second is a ranked classification."],["QbA?","German quality wine from a defined region."],["Prädikat levels in order?","Kabinett, Spätlese, Auslese, Beerenauslese, Trockenbeerenauslese (+ Eiswein)."],["Barolo minimum aging?","38 months, 18 in wood."],["Colheita?","Single-vintage tawny Port, at least 7 years in wood."],["LBV?","Late Bottled Vintage: bottled 4–6 years after harvest."],["Noble rot?","Botrytis cinerea; concentrates sugar for Sauternes."]],"q":[["Which is driest?","Brut Nature","Brut","Extra Dry","Demi-Sec","0–3 g/L, no dosage."],["A 'Bourgogne' label means:","Regional-level Burgundy","Grand Cru","Premier Cru","Village level","The entry point."],["Saint-Émilion Grand Cru on a label means:","It meets that appellation's stricter rules, not necessarily a ranked Grand Cru Classé","It's a classified estate","It's a Premier Grand Cru Classé A","It's from the Left Bank","Separate classification."],["Dow's 1992 Colheita is:","A single-vintage tawny Port aged at least 7 years in wood","A Vintage Port","A Ruby Port","A Madeira","Colheita = harvest year."],["Highest Prädikat ripeness level listed:","Trockenbeerenauslese","Auslese","Spätlese","Kabinett","Eiswein sits alongside."],["Barolo DOCG requires at least:","38 months of aging, 18 in wood","12 months","5 years in bottle","No minimum","Langhe Nebbiolo is the younger way in."],["Crémant is:","Traditional-method sparkling wine from French regions outside Champagne","Tank-method Italian sparkling","Sweet Champagne","A Champagne grape","Same method, often better value."],["An LBV Port is bottled:","4–6 years after harvest","Within a year","After 20 years","Only in great vintages, after 2 years","Late Bottled Vintage."]],"pro":[["A guest asks if the Saint-Émilion Grand Cru on the list is a 'Grand Cru Classé.'","Saint-Émilion Grand Cru is an appellation with stricter rules, not the ranked Grand Cru Classé classification.","'It's from the Saint-Émilion Grand Cru appellation, which has stricter rules, but it isn't one of the ranked classified estates.'"],["A guest asks what 'Brut Nature' means on the Crémant.","No dosage added: 0–3 g/L sugar. Bone dry.","'Nothing added after the second fermentation, so it's bone dry. Great with oysters.'"]]},{"id":"a6","track":"Advanced","title":"Sensory Skills & Structured Tasting","k":["Taste in a fixed order every time: appearance, nose, palate, finish, conclusion. A system keeps you from jumping to the first word that comes to mind.","Nose: first note intensity (light, medium, pronounced), then aromas in groups: fruit, floral, spice, herbal, wood, earth, savory. Swirl gently, sniff short and often.","Palate: sweetness, acidity, tannin (wine), alcohol heat, body, flavor intensity, then flavors. Finish: how long it lasts and what stays.","Build an aroma memory with real things: smell your spice rack, fresh and dried fruit, flowers, tea, coffee, leather and wood. Name them out loud. Most 'tasting notes' are just remembered smells.","Train side by side: taste two or three things together (two bourbons, three Pinot Noirs) so the differences jump out. Try blind tastings and triangle tests (two the same, one different: pick the odd one).","Calibrate with others: compare notes with your team and the sommelier, and borrow their words. A shared vocabulary makes the whole floor sell better.","Protect your palate: drink water, spit when tasting many things, take breaks, and avoid strong fragrance, mint gum or smoking before tasting.","Turn notes into guest language: one sentence with a hook ('ripe cherry and rose petals, finishes dry and elegant'). That's the line you'll use on the floor."],"c":[["Structured tasting order?","Appearance, nose, palate, finish, conclusion."],["Aroma groups?","Fruit, floral, spice, herbal, wood, earth, savory."],["What do you judge on the palate?","Sweetness, acidity, tannin, alcohol, body, intensity, flavors."],["How to build aroma memory?","Smell and name real things: spices, fruit, flowers, tea, wood."],["What's a triangle test?","Two samples the same, one different; pick the odd one."],["How to protect your palate?","Water, spit, breaks; no fragrance, mint or smoke before tasting."],["How do notes become sales?","One sentence with a flavor hook in guest language."]],"q":[["Best way to notice differences between two bourbons:","Taste them side by side","Taste them a week apart","Taste only the more expensive","Mix them","Contrast reveals detail."],["Before a tasting you should avoid:","Mint gum and strong fragrance","Water","Plain crackers","A light meal","Protect your palate."],["A triangle test is:","Picking the odd one out of three samples","Tasting three times","Rating on three scales","Three people tasting","Two same, one different."],["Turning tasting notes into guest language means:","One clear sentence with a flavor hook","Reading the full tasting note","Listing every aroma","Just saying 'smooth'","That's your floor line."],["Aromas are best organized in groups like:","Fruit, floral, spice, herbal, wood, earth, savory","Good and bad","Cheap and expensive","Strong and weak only","Broad to specific."],["Building aroma memory looks like:","Smelling real spices, fruit, tea, leather and naming them out loud","Reading wine books only","Drinking more","Avoiding smells","Most notes are remembered smells."],["Calibrating with the team and sommelier helps because:","A shared vocabulary makes the whole floor sell better","It's required by law","It speeds service","It lowers pour cost","Borrow their words."],["Tasting many samples, you should:","Spit, drink water and take breaks","Swallow everything","Taste fast","Skip water","Palate fatigue is real."]],"pro":[["You need to learn the bar's eight bourbons fast.","Side-by-side in small flights, same order every time, note two descriptors each, build one-sentence guest lines.","Taste in pairs, write two words each, then a one-line description you'd say to a guest."],["A sommelier describes a wine as 'pronounced, red cherry, rose, firm tannin, long.' A guest asks you about it.","Translate into guest language: one sentence with a hook.","'Bright red cherry and rose petals, structured and long. Beautiful with the duck.'"]]},{"id":"a7","track":"Advanced","title":"R&D Capstone: Build a Menu","k":["This
