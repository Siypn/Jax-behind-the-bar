<\/p>\n<p>But:<\/p>\n<p>Older ≠ automatically better.<\/p>\n<p>Many wines are intended to be consumed young.<\/p>\n<h3 class=\"bk-h\">9. Primary, Secondary &amp; Tertiary Aromas<\/h3>\n<p>This framework is extremely useful.<\/p>\n<div class=\"bk-lab\">PRIMARY<\/div>\n<p>Primarily grape/fermentation-derived.<\/p>\n<div class=\"bk-chips\"><span>Fruit<\/span><span>flowers<\/span><span>herbs<\/span><\/div>\n<div class=\"bk-lab\">SECONDARY<\/div>\n<p>Associated with winemaking.<\/p>\n<div class=\"bk-chips\"><span>Oak<\/span><span>toast<\/span><span>butter<\/span><span>bread/lees<\/span><\/div>\n<div class=\"bk-lab\">TERTIARY<\/div>\n<p>Associated with maturation and aging.<\/p>\n<div class=\"bk-chips\"><span>Dried fruit<\/span><span>leather<\/span><span>mushroom<\/span><span>earth<\/span><span>nuts<\/span><\/div>\n<p>This isn’t always perfectly clean in practice, but it’s an excellent Basic framework.<\/p>\n<h3 class=\"bk-h bk-ck\">Checkpoint<\/h3><p class=\"bk-note\">Answer these out loud before the exam.<\/p>\n<ol class=\"bk-check\"><li>Why use stainless steel?<\/li><li>What can oak contribute?<\/li><li>New vs. used oak?<\/li><li>Why does barrel size matter?<\/li><li>What characteristics might American oak contribute?<\/li><li>Why blend wines?<\/li><li>What are primary, secondary and tertiary aromas?<\/li><li>Does older wine automatically mean better wine?<\/li><\/ol>","pro":[["A guest describes a wine as 'like vanilla and coconut.'","That's likely American oak (Rioja, many US wines). French oak is subtler: spice, toast, cedar.","'That's the American oak. If you like it, Rioja Reserva has a lot of that.'"],["A guest wants an older wine because 'older is better.'","Most wines are made to drink young. Aged wines trade fresh fruit for dried fruit, earth and leather: different, not automatically better.","'Older wines get earthy and savory, less fruity. If you love fresh fruit, a younger bottle might make you happier.'"],["A guest asks if blends are lower quality than single varietals.","Many of the world's great wines are blends (Bordeaux, Châteauneuf, Champagne). Blending is for balance and complexity.","'Not at all. Most Bordeaux and Champagne are blends. Blending is how winemakers get balance.'"]]},{"id":"w6","track":"Wine","title":"Major White Grapes","k":["Chardonnay: fairly neutral, shaped by climate + winemaking (oak, MLF, lees). Burgundy, Champagne, California, Australia.","Sauvignon Blanc: high acid; lime, grapefruit, gooseberry, grass. Loire, Bordeaux, Marlborough.","Riesling: high acid, aromatic, bone dry to very sweet; petrol with age. Germany, Alsace.","Pinot Grigio (light/crisp) = Pinot Gris (richer) — same grape.","Chenin Blanc: high acid, versatile (dry, sweet, sparkling); apple, quince, honey. Loire, South Africa.","Gewürztraminer: lychee, rose, spice; lower acid, richer."],"c":[["Which white grape responds most to oak and MLF?","Chardonnay."],["Sauvignon Blanc profile?","High acid; lime, grapefruit, gooseberry, grass, herbs (passion fruit when riper)."],["Riesling profile?","High acid, very aromatic (lime, apple, peach, flowers); dry to sweet; petrol with age."],["Pinot Grigio vs Pinot Gris?","Same grape. Grigio often light/crisp; Gris often richer and more aromatic."],["Why is Chenin Blanc versatile?","High natural acidity — makes dry, sweet and sparkling styles."],["Lychee and rose?","Gewürztraminer."],["Chenin Blanc key regions?","Loire Valley and South Africa."],["Guest wants crisp white, nothing buttery/oaky. Offer?","Sauvignon Blanc, Pinot Grigio, dry Riesling — or an unoaked Chardonnay."]],"q":[["A guest wants a white with lychee, rose and spice:","Gewürztraminer","Sauvignon Blanc","Pinot Grigio","Chablis","Lower acid, richer, aromatic."],["Pinot Grigio and Pinot Gris are:","The same grape, made in lighter vs. richer styles","Different grapes","Red vs. white","Sparkling vs. still","Italy vs. Alsace styles."],["A guest wants a white that can age and develops honey and petrol notes:","Riesling","Pinot Grigio","Sauvignon Blanc","Gewürztraminer","Petrol is classic aged Riesling."],["Grass, gooseberry and grapefruit point to:","Sauvignon Blanc","Chardonnay","Viognier","Chenin Blanc","Loire or Marlborough."],["Chardonnay is often described as a 'winemaker's grape' because:","It's fairly neutral and shaped by climate, oak, MLF and lees","It's always oaked","It's always buttery","It only grows in Burgundy","Wide range of styles."],["Vouvray and Savennières are made from:","Chenin Blanc","Sauvignon Blanc","Chardonnay","Riesling","Loire Valley."],["A guest wants 'a crisp, dry white, nothing oaky' with oysters. Best pick:","Sancerre or Chablis","A buttery California Chardonnay","A late-harvest Riesling","A Gewürztraminer","High acid, no oak."],["Riesling can range from:","Bone dry to very sweet, always with high acid","Only sweet","Only dry","Only sparkling","Read the label or ask."]],"b":"<p>1. Chardonnay<\/p>\n<p>One of the world’s most important white varieties.<\/p>\n<p>Typical structure:<\/p>\n<p>Medium-high acidity<\/p>\n<p>Body varies significantly.<\/p>\n<p>Chardonnay itself can be relatively neutral aromatically compared with highly aromatic varieties, meaning:<\/p>\n<p>climate + winemaking<\/p>\n<p>can dramatically shape it.<\/p>\n<p>Cooler:<\/p>\n<div class=\"bk-chips\"><span>lemon<\/span><span>green apple<\/span><span>citrus<\/span><\/div>\n<p>Warmer:<\/p>\n<div class=\"bk-chips\"><span>peach<\/span><span>melon<\/span><span>tropical fruit<\/span><\/div>\n<p>Oak:<\/p>\n<div class=\"bk-chips\"><span>vanilla<\/span><span>toast<\/span><span>spice<\/span><\/div>\n<p>MLF:<\/p>\n<div class=\"bk-chips\"><span>butter<\/span><span>creamier texture<\/span><\/div>\n<p>Lees:<\/p>\n<div class=\"bk-chips\"><span>bread<\/span><span>texture<\/span><\/div>\n<p>Major regions include:<\/p>\n<p>Burgundy<\/p>\n<p>Champagne<\/p>\n<p>California<\/p>\n<p>Australia<\/p>\n<h3 class=\"bk-h\">2. Sauvignon Blanc<\/h3>\n<p>Typically:<\/p>\n<p>High acidity<\/p>\n<p>Common characteristics:<\/p>\n<div class=\"bk-chips\"><span>lime<\/span><span>grapefruit<\/span><span>gooseberry<\/span><span>grass<\/span><span>herbs<\/span><\/div>\n<p>Cooler examples can lean:<\/p>\n<div class=\"bk-chips\"><span>green<\/span><span>grassy<\/span><span>citrus<\/span><\/div>\n<p>Riper examples can show:<\/p>\n<div class=\"bk-chips\"><span>passion fruit<\/span><span>tropical fruit<\/span><\/div>\n<p>Major regions:<\/p>\n<p>Loire Valley<\/p>\n<p>Bordeaux<\/p>\n<p>Marlborough<\/p>\n<p>California<\/p>\n<h3 class=\"bk-h\">3. Riesling<\/h3>\n<p>Typically:<\/p>\n<p>High acidity<\/p>\n<p>Highly aromatic.<\/p>\n<p>Potential characteristics:<\/p>\n<div class=\"bk-chips\"><span>lime<\/span><span>lemon<\/span><span>green apple<\/span><span>peach<\/span><span>flowers<\/span><\/div>\n<p>Riesling can be:<\/p>\n<div class=\"bk-eq\">bone dry → intensely sweet<\/div>\n<p>and still retain freshness because of its acidity.<\/p>\n<p>With age, some Rieslings develop distinctive petrol-like aromas.<\/p>\n<p>Major regions:<\/p>\n<p>Germany<\/p>\n<p>Alsace<\/p>\n<p>Austria<\/p>\n<p>Australia<\/p>\n<h3 class=\"bk-h\">4. Pinot Grigio / Pinot Gris<\/h3>\n<p>Same grape.<\/p>\n<p>Different naming traditions can signal different stylistic expectations.<\/p>\n<div class=\"bk-lab\">PINOT GRIGIO<\/div>\n<p>Often associated with lighter, crisp styles.<\/p>\n<div class=\"bk-lab\">PINOT GRIS<\/div>\n<p>Can be richer, fuller and more aromatic.<\/p>\n<p>But label name alone doesn’t guarantee style.<\/p>\n<h3 class=\"bk-h\">5. Chenin Blanc<\/h3>\n<p>Naturally high acidity and highly versatile.<\/p>\n<p>Can produce:<\/p>\n<p>dry<\/p>\n<p>sweet<\/p>\n<p>sparkling<\/p>\n<p>styles.<\/p>\n<p>Potential aromas:<\/p>\n<div class=\"bk-chips\"><span>apple<\/span><span>quince<\/span><span>citrus<\/span><span>honey<\/span><\/div>\n<p>Especially important in:<\/p>\n<p>Loire Valley<\/p>\n<p>South Africa<\/p>\n<h3 class=\"bk-h\">6. Gewürztraminer<\/h3>\n<p>Highly aromatic.<\/p>\n<p>Potential aromas:<\/p>\n<div class=\"bk-chips\"><span>lychee<\/span><span>rose<\/span><span>tropical fruit<\/span><span>spice<\/span><\/div>\n<p>Generally lower acidity than Riesling and can feel richer.<\/p>\n<h3 class=\"bk-h\">Quick Structural Map<\/h3>\n<div class=\"bk-eq\">CHARDONNAY → versatile, winemaking-sensitive<br>SAUVIGNON BLANC → high acid, citrus/herbal<br>RIESLING → high acid, aromatic, dry-to-sweet<br>PINOT GRIGIO → often light/crisp<br>CHENIN BLANC → high acid, versatile<br>GEWÜRZTRAMINER → intensely aromatic, richer<\/div>\n<h3 class=\"bk-h\">Bartender Scenario<\/h3>\n<p>Guest:<\/p>\n<p>“I want a crisp white, nothing buttery or oaky.”<\/p>\n<p>Instead of simply saying:<\/p>\n<p>“No Chardonnay.”<\/p>\n<p>You could offer:<\/p>\n<p>Sauvignon Blanc<\/p>\n<p>Pinot Grigio<\/p>\n<p>Dry Riesling<\/p>\n<p>Or even an unoaked Chardonnay.<\/p>\n<p>Because:<\/p>\n<p>Chardonnay ≠ buttery by definition.<\/p>\n<p>Winemaking creates that style.<\/p>\n<h3 class=\"bk-h bk-ck\">Checkpoint<\/h3><p class=\"bk-note\">Answer these out loud before the exam.<\/p>\n<ol class=\"bk-check\"><li>Which white grape is especially responsive to oak and MLF?<\/li><li>Which grape commonly shows citrus/herbal characteristics?<\/li><li>Which aromatic grape maintains high acidity and can range from dry to sweet?<\/li><li>Pinot Gris and Pinot Grigio: same grape or different?<\/li><li>What makes Chenin Blanc especially versatile?<\/li><li>Which grape commonly shows lychee and rose?<\/li><\/ol>","pro":[["A guest asks for 'something like Pinot Grigio but more interesting.'","Stay light and crisp, add aroma or texture: Albariño, Grüner Veltliner, dry Riesling, Alsace Pinot Gris.","'Try an Albariño: still light and crisp, but with more peach and a salty edge.'"],["A guest wants a white to age in their cellar.","High acid and concentration help aging: Riesling, Chenin Blanc, top white Burgundy.","'Riesling and Chenin Blanc age beautifully because of their acid. They get honeyed and complex over time.'"],["A guest says Gewürztraminer is 'too perfumey' and wants something aromatic but fresher.","Gewürz is low acid and rich. A dry Riesling or Torrontés keeps aromatics with more freshness.","'A dry Riesling has lovely aromatics but much more acidity, so it feels fresher.'"]]},{"id":"w7","track":"Wine","title":"Major Red Grapes","k":["Cabernet Sauvignon: high tannin, high acid, full; blackcurrant, cedar, mint. Bordeaux, Napa, Coonawarra, Chile.","Merlot: medium tannin, plum, black cherry, rounder — blends with Cab.","Pinot Noir: pale, low tannin, high acid; red cherry, strawberry → earth, mushroom.","Syrah (France, pepper, violet, smoked meat) = Shiraz (Australia, ripe, fuller).","Grenache/Garnacha: ripe red fruit, spice, high alcohol.","Tempranillo: Rioja, Ribera; cherry + oak (vanilla, tobacco, leather).","Sangiovese: Chianti, Brunello; sour cherry, high acid. Nebbiolo: Barolo/Barbaresco; pale but high tannin + acid; rose, tar. Malbec: Argentina; blackberry, violet."],"c":[["High tannin + blackcurrant + cedar?","Cabernet Sauvignon."],["Why blend Cabernet with Merlot?","Cab gives structure, tannin, acid; Merlot gives fruit, body, softness."],["Pinot Noir structure?","Pale, low tannin, high acid, light-medium body; red fruit."],["Syrah vs Shiraz?","Same grape. Syrah: French/cooler style, pepper, violet. Shiraz: Australian, riper and fuller."],["Main grape of Chianti?","Sangiovese."],["Grape of Barolo and Barbaresco?","Nebbiolo."],["Grape of Rioja?","Tempranillo."],["Country that made Malbec famous?","Argentina (Mendoza). Its roots are French."],["Nebbiolo's surprising combo?","Pale color but high tannin and high acid; rose, tar, cherry."]],"q":[["Pale color, high tannin and acid, rose and tar:","Nebbiolo","Pinot Noir","Grenache","Merlot","Pale doesn't mean light in structure."],["Black pepper, violet and smoked meat suggest:","Syrah from France","Merlot","Tempranillo","Pinot Noir","Shiraz in Australia is riper."],["A guest wants a red for a delicate fish dish:","A light, low-tannin Pinot Noir","A Napa Cabernet","A Barolo","An Amarone","Tannin can clash with fish."],["Syrah vs. Shiraz:","Same grape; 'Shiraz' usually signals a riper, fuller style","Different grapes","Shiraz is white","Syrah is sweet","France vs. Australia styles."],["Sour cherry, herbs and high acid from Tuscany:","Sangiovese","Cabernet Sauvignon","Malbec","Zinfandel","Chianti, Brunello."],["The softer partner usually blended with Cabernet in Bordeaux:","Merlot","Pinot Noir","Syrah","Grenache","Plum, black cherry, rounder."],["Blackberry and violet from Argentina:","Malbec","Carmenère","Pinotage","Tempranillo","Mendoza's signature."],["Rioja's main grape and its typical oak notes:","Tempranillo; vanilla, tobacco, leather","Grenache; pepper","Cabernet; mint","Pinot Noir; earth","Often American oak."]],"b":"<p>1. Cabernet Sauvignon<\/p>\n<p>Typically:<\/p>\n<p>High tannin<\/p>\n<p>Medium-high/high acidity<\/p>\n<p>Full body<\/p>\n<p>Potential aromas:<\/p>\n<div class=\"bk-chips\"><span>blackcurrant<\/span><span>blackberry<\/span><span>cedar<\/span><span>mint/herbs<\/span><\/div>\n<p>Oak can add:<\/p>\n<div class=\"bk-chips\"><span>vanilla<\/span><span>toast<\/span><span>spice<\/span><\/div>\n<p>Important regions:<\/p>\n<p>Bordeaux<\/p>\n<p>Napa Valley<\/p>\n<p>Coonawarra<\/p>\n<p>Chile<\/p>\n<h3 class=\"bk-h\">2. Merlot<\/h3>\n<p>Generally:<\/p>\n<p>medium to full body<\/p>\n<p>medium tannin<\/p>\n<p>Potential aromas:<\/p>\n<div class=\"bk-chips\"><span>plum<\/span><span>black cherry<\/span><span>blackberry<\/span><\/div>\n<p>Often perceived as softer and rounder than Cabernet Sauvignon.<\/p>\n<p>This is one reason the two blend well.<\/p>\n<p>Cabernet can provide:<\/p>\n<p>structure + tannin + acidity<\/p>\n<p>Merlot can provide:<\/p>\n<p>fruit + body + softness<\/p>\n<h3 class=\"bk-h\">3. Pinot Noir<\/h3>\n<p>Typically:<\/p>\n<p>lighter color<\/p>\n<p>lower tannin<\/p>\n<p>high acidity<\/p>\n<p>light-medium body<\/p>\n<p>Potential aromas:<\/p>\n<div class=\"bk-chips\"><span>red cherry<\/span><span>strawberry<\/span><span>raspberry<\/span><\/div>\n<p>With development:<\/p>\n<div class=\"bk-chips\"><span>earth<\/span><span>mushroom<\/span><span>forest floor<\/span><\/div>\n<p>Important regions:<\/p>\n<p>Burgundy<\/p>\n<p>Oregon<\/p>\n<p>California<\/p>\n<p>New Zealand<\/p>\n<p>Pinot Noir is also crucial in Champagne.<\/p>\n<h3 class=\"bk-h\">4. Syrah / Shiraz<\/h3>\n<p>Same grape.<\/p>\n<div class=\"bk-lab\">SYRAH<\/div>\n<p>Commonly refers to styles associated with France and cooler expressions.<\/p>\n<p>Potential:<\/p>\n<div class=\"bk-chips\"><span>blackberry<\/span><span>black pepper<\/span><span>violet<\/span><span>smoked meat<\/span><\/div>\n<div class=\"bk-lab\">SHIRAZ<\/div>\n<p>Especially associated with Australia and can lean toward:<\/p>\n<div class=\"bk-chips\"><span>ripe blackberry<\/span><span>plum<\/span><span>spice<\/span><span>fuller body<\/span><\/div>\n<p>Again:<\/p>\n<p>Same grape.<\/p>\n<p>Style and place matter.<\/p>\n<h3 class=\"bk-h\">5. Grenache / Garnacha<\/h3>\n<p>Same grape.<\/p>\n<p>Generally:<\/p>\n<p>ripe red fruit<\/p>\n<p>spice<\/p>\n<p>high potential alcohol<\/p>\n<p>moderate tannin/acidity<\/p>\n<p>Important in:<\/p>\n<p>Southern Rhône<\/p>\n<p>Spain<\/p>\n<p>Often blended with other grapes.<\/p>\n<h3 class=\"bk-h\">6. Tempranillo<\/h3>\n<p>One of Spain’s major red varieties.<\/p>\n<p>Potential aromas:<\/p>\n<div class=\"bk-chips\"><span>red cherry<\/span><span>plum<\/span><\/div>\n<p>With oak maturation:<\/p>\n<div class=\"bk-chips\"><span>vanilla<\/span><span>tobacco<\/span><span>leather<\/span><span>spice<\/span><\/div>\n<p>Especially important in:<\/p>\n<p>Rioja<\/p>\n<p>Ribera del Duero<\/p>\n<h3 class=\"bk-h\">7. Sangiovese<\/h3>\n<p>Central to Tuscany.<\/p>\n<p>Typically:<\/p>\n<p>high acidity<\/p>\n<p>medium-high tannin<\/p>\n<p>Potential aromas:<\/p>\n<div class=\"bk-chips\"><span>sour cherry<\/span><span>red plum<\/span><span>herbs<\/span><\/div>\n<p>Important in:<\/p>\n<p>Chianti<\/p>\n<p>Brunello di Montalcino<\/p>\n<h3 class=\"bk-h\">8. Nebbiolo<\/h3>\n<p>Important in Piedmont.<\/p>\n<p>Interesting combination:<\/p>\n<p>relatively pale color<\/p>\n<p>but:<\/p>\n<p>high tannin + high acidity<\/p>\n<p>Potential aromas:<\/p>\n<div class=\"bk-chips\"><span>red cherry<\/span><span>rose<\/span><span>tar<\/span><span>earth<\/span><\/div>\n<p>Most famously:<\/p>\n<p>Barolo<\/p>\n<p>Barbaresco<\/p>\n<h3 class=\"bk-h\">9. Malbec<\/h3>\n<p>Most internationally associated today with Argentina.<\/p>\n<p>Potential:<\/p>\n<div class=\"bk-chips\"><span>blackberry<\/span><span>plum<\/span><span>violet<\/span><\/div>\n<p>Often:<\/p>\n<p>full-bodied with significant color.<\/p>\n<p>Its historical roots are French.<\/p>\n<h3 class=\"bk-h\">Quick Structural Map<\/h3>\n<div class=\"bk-eq\">CABERNET SAUVIGNON → black fruit + tannin + structure<br>MERLOT → plum + roundness<br>PINOT NOIR → red fruit + acidity + lower tannin<br>SYRAH → black fruit + pepper<br>GRENACHE → ripe red fruit + alcohol + spice<br>TEMPRANILLO → red/dark fruit + oak affinity<br>SANGIOVESE → cherry + acidity<br>NEBBIOLO → rose/red fruit + high tannin/acidity<br>MALBEC → dark fruit + color/body<\/div>\n<h3 class=\"bk-h bk-ck\">Checkpoint<\/h3><p class=\"bk-note\">Answer these out loud before the exam.<\/p>\n<ol class=\"bk-check\"><li>Which major red is strongly associated with high tannin and blackcurrant?<\/li><li>Why are Cabernet Sauvignon and Merlot commonly blended?<\/li><li>What’s Pinot Noir’s general structural profile?<\/li><li>Syrah and Shiraz: same grape?<\/li><li>Which grape is central to Chianti?<\/li><li>Which grape makes Barolo?<\/li><li>Which grape is strongly associated with Rioja?<\/li><li>Which country made Malbec internationally famous?<\/li><\/ol>","pro":[["A guest wants a red with salmon.","Salmon is rich but delicate. Low-tannin, high-acid reds work: Pinot Noir, Gamay. Avoid big tannic reds.","'Pinot Noir is the classic: light, bright and soft enough not to fight the fish.'"],["A guest loves Cabernet but wants to try something new.","Map flavor and structure: Bordeaux blends, Malbec (softer, plush), Syrah (pepper), Nebbiolo (structure, more acid).","'If you like Cab's structure, try a northern Rhône Syrah: still full, but with black pepper and violet.'"],["A guest asks why their Barolo is so pale if it's so powerful.","Nebbiolo has thin, lightly pigmented skins but high tannin and acid. Color isn't power.","'Nebbiolo is naturally pale, but it's packed with tannin and acid. Color and power aren't the same thing.'"]]},{"id":"w8","track":"Wine","title":"Old World: France, Italy, Spain","k":["European labels often name the place, not the grape.","Bordeaux: Left Bank = Cabernet-led; Right Bank = Merlot-led.","Burgundy: Chardonnay + Pinot Noir; Chablis = Chardonnay.","Loire: Sancerre = Sauvignon Blanc; Vouvray = Chenin Blanc.","Rhône: North = Syrah; South = Grenache/Syrah/Mourvèdre blends.","Italy: Tuscany = Sangiovese; Piedmont = Nebbiolo (Barolo, Barbaresco); Veneto = Prosecco, Amarone.","Spain: Rioja & Ribera = Tempranillo; Rías Baixas = Albariño; Jerez = Sherry."],"c":[["Why do European labels show place, not grape?","Appellations regulate grapes and production; the region implies the grape."],["Chablis grape?","Chardonnay."],["Sancerre grape?","Sauvignon Blanc."],["Vouvray grape?","Chenin Blanc."],["Bordeaux Left Bank vs Right Bank?","Left: Cabernet Sauvignon-led. Right: Merlot-led."],["Northern Rhône red grape?","Syrah."],["Rías Baixas white grape?","Albariño (high acid, citrus, stone fruit)."],["Barolo translation?","Italy → Piedmont → Nebbiolo."]],"q":[["A guest orders Sancerre and asks the grape:","Sauvignon Blanc","Chenin Blanc","Chardonnay","Pinot Gris","Loire Valley."],["A guest wants a Merlot-led Bordeaux:","Right Bank: Saint-Émilion or Pomerol","Left Bank: Pauillac","Chablis","Sancerre","Left Bank = Cabernet-led."],["Châteauneuf-du-Pape is mainly based on:","Grenache","Syrah only","Pinot Noir","Cabernet Sauvignon","Southern Rhône blends."],["A guest wants an Italian red like a lighter Barolo:","Barbaresco or Langhe Nebbiolo","Amarone","Chianti Classico","Prosecco","Same grape: Nebbiolo."],["Ribera del Duero is mainly:","Tempranillo","Garnacha","Albariño","Monastrell","Like Rioja's grape."],["Rías Baixas is known for:","Albariño","Tempranillo","Verdejo","Sherry","Coastal Spanish white."],["Why do Old World labels often show places, not grapes?","The place implies the grape and rules","They want to hide the grape","European wines are always blends","Grapes aren't allowed on labels","Learn to translate."],["Northern vs. Southern Rhône reds:","North is Syrah; South is Grenache-led blends","North is Grenache; South is Syrah","Both are Pinot Noir","Both are Merlot","Côte-Rôtie vs. Châteauneuf."]],"b":"<p>First:<\/p>\n<div class=\"bk-lab\">OLD WORLD<\/div>\n<p>isn’t a legal wine category.<\/p>\n<p>It’s useful shorthand for established European wine-producing countries.<\/p>\n<p>At Basic, the big three:<\/p>\n<p>France<\/p>\n<p>Italy<\/p>\n<p>Spain<\/p>\n<h3 class=\"bk-h\">1. Place vs. Grape<\/h3>\n<p>This is one of the biggest hurdles for new wine students.<\/p>\n<p>A bottle might say:<\/p>\n<div class=\"bk-lab\">CHABLIS<\/div>\n<p>rather than:<\/p>\n<p>Chardonnay.<\/p>\n<p>Why?<\/p>\n<p>Because many European wine traditions emphasize:<\/p>\n<p>geographical origin<\/p>\n<p>The region often implies the grape and production rules.<\/p>\n<p>So you need to start translating:<\/p>\n<div class=\"bk-eq\">Chablis → Chardonnay<br>Barolo → Nebbiolo<br>Chianti → primarily Sangiovese<\/div>\n<h3 class=\"bk-h\">2. France<\/h3>\n<div class=\"bk-lab\">BORDEAUX<\/div>\n<p>Major red grapes include:<\/p>\n<p>Cabernet Sauvignon<\/p>\n<p>Merlot<\/p>\n<p>Cabernet Franc<\/p>\n<p>Broadly:<\/p>\n<div class=\"bk-lab\">LEFT BANK<\/div>\n<p>Often Cabernet Sauvignon-led.<\/p>\n<div class=\"bk-lab\">RIGHT BANK<\/div>\n<p>Often Merlot-led.<\/p>\n<p>Don’t make it absolute, but memorize the framework.<\/p>\n<div class=\"bk-lab\">BURGUNDY<\/div>\n<p>Two grapes dominate our Basic framework:<\/p>\n<p>Chardonnay<\/p>\n<p>and<\/p>\n<p>Pinot Noir<\/p>\n<p>Important names:<\/p>\n<div class=\"bk-eq\">Chablis → Chardonnay<br>Côte d’Or → major Chardonnay/Pinot Noir territory<\/div>\n<p>Burgundy teaches the importance of:<\/p>\n<div class=\"bk-lab\">SITE<\/div>\n<p>Small geographical differences can carry enormous significance.<\/p>\n<div class=\"bk-lab\">LOIRE VALLEY<\/div>\n<p>Important grapes include:<\/p>\n<p>Sauvignon Blanc<\/p>\n<p>Chenin Blanc<\/p>\n<p>Cabernet Franc<\/p>\n<p>Examples:<\/p>\n<div class=\"bk-eq\">Sancerre → Sauvignon Blanc<br>Vouvray → Chenin Blanc<\/div>\n<p>RHÔNE VALLEY<\/p>\n<p>Northern Rhône:<\/p>\n<p>Syrah<\/p>\n<p>Southern Rhône:<\/p>\n<p>blends commonly involving:<\/p>\n<div class=\"bk-chips\"><span>Grenache<\/span><span>Syrah<\/span><span>Mourvèdre<\/span><\/div>\n<div class=\"bk-lab\">CHAMPAGNE<\/div>\n<p>Sparkling wine from the legally defined Champagne region.<\/p>\n<p>Major grapes include:<\/p>\n<p>Chardonnay<\/p>\n<p>Pinot Noir<\/p>\n<p>Meunier<\/p>\n<p>We’ll make it properly in Lesson 10.<\/p>\n<h3 class=\"bk-h\">3. Italy<\/h3>\n<p>Italy has enormous grape diversity.<\/p>\n<p>For Basic, start with:<\/p>\n<div class=\"bk-lab\">TUSCANY<\/div>\n<p>Sangiovese<\/p>\n<p>Important:<\/p>\n<p>Chianti<\/p>\n<p>Brunello di Montalcino<\/p>\n<div class=\"bk-lab\">PIEDMONT<\/div>\n<p>Nebbiolo<\/p>\n<p>Important:<\/p>\n<p>Barolo<\/p>\n<p>Barbaresco<\/p>\n<p>Also:<\/p>\n<p>Barbera<\/p>\n<p>Dolcetto<\/p>\n<div class=\"bk-lab\">VENETO<\/div>\n<p>Important styles include:<\/p>\n<p>Prosecco<\/p>\n<p>Valpolicella<\/p>\n<p>Amarone<\/p>\n<p>We’ll expand these later.<\/p>\n<p>4. Spain<\/p>\n<div class=\"bk-lab\">RIOJA<\/div>\n<p>Strongly associated with:<\/p>\n<p>Tempranillo<\/p>\n<p>Oak maturation has historically played an important role.<\/p>\n<div class=\"bk-lab\">RIBERA DEL DUERO<\/div>\n<p>Also strongly associated with Tempranillo.<\/p>\n<p>Often powerful, structured expressions.<\/p>\n<p>RÍAS BAIXAS<\/p>\n<p>Important white grape:<\/p>\n<p>Albariño<\/p>\n<p>Often:<\/p>\n<div class=\"bk-chips\"><span>high acid<\/span><span>citrus<\/span><span>stone fruit<\/span><\/div>\n<div class=\"bk-lab\">JEREZ<\/div>\n<p>Home of:<\/p>\n<p>Sherry<\/p>\n<p>which we’ll cover in Lesson 11.<\/p>\n<h3 class=\"bk-h\">5. Appellations<\/h3>\n<p>European wine systems frequently regulate things such as:<\/p>\n<p>geographical boundaries<\/p>\n<p>permitted grapes<\/p>\n<p>yields<\/p>\n<p>viticulture<\/p>\n<p>winemaking<\/p>\n<p>maturation<\/p>\n<p>depending on the appellation.<\/p>\n<p>This means a geographical name can tell you far more than:<\/p>\n<p>“where the grapes came from.”<\/p>\n<p>It can imply a production system.<\/p>\n<h3 class=\"bk-h\">Label Translation<\/h3>\n<div class=\"bk-eq\">CHABLIS → France → Burgundy → Chardonnay<br>SANCERRE → France → Loire → Sauvignon Blanc<br>BAROLO → Italy → Piedmont → Nebbiolo<br>CHIANTI → Italy → Tuscany → Sangiovese-led<br>RIOJA → Spain → region → commonly Tempranillo-led reds<\/div>\n<p>That’s the beginning of reading European wine labels.<\/p>\n<h3 class=\"bk-h bk-ck\">Checkpoint<\/h3><p class=\"bk-note\">Answer these out loud before the exam.<\/p>\n<ol class=\"bk-check\"><li>Why might a European wine label emphasize place instead of grape?<\/li><li>What grape is Chablis?<\/li><li>What grape is Sancerre typically associated with?<\/li><li>Bordeaux Left Bank is commonly associated with which dominant red grape?<\/li><li>Right Bank?<\/li><li>Barolo?<\/li><li>Chianti?<\/li><li>Rioja?<\/li><\/ol>","pro":[["A guest asks what grape is in a Pouilly-Fumé.","Loire: Sancerre and Pouilly-Fumé are Sauvignon Blanc. Vouvray is Chenin Blanc.","'Sauvignon Blanc. It's Sancerre's neighbor across the river, a little smokier.'"],["A guest wants a Chianti Classico and asks if it's 'like Cabernet.'","Sangiovese: sour cherry, herbs, high acid, medium tannin. Lighter and more acidic than Cabernet.","'It's Sangiovese: brighter, more cherry and herbs, with more acid. Great with tomato and pasta.'"],["A guest says, 'Bordeaux is too confusing.'","Simplify: Left Bank = Cabernet-led, structured. Right Bank = Merlot-led, rounder. Then pick by style.","'Left Bank is mostly Cabernet: firm and structured. Right Bank is mostly Merlot: plusher and rounder. Which sounds better?'"]]},{"id":"w9","track":"Wine","title":"New World Wine","k":["Napa = Cabernet (ripe, full, oaky). Sonoma = diverse. Oregon Willamette = Pinot Noir.","Australia: Barossa = Shiraz; Coonawarra = Cabernet.","New Zealand: Marlborough = Sauvignon Blanc (passion fruit, grapefruit, grass).","Argentina: Mendoza = Malbec; altitude keeps acid.","Chile: Carmenère is the signature grape.","South Africa: Chenin Blanc; Pinotage = Pinot Noir × Cinsault.","Old vs New World isn't enough — climate matters more."],"c":[["Napa Valley's famous red?","Cabernet Sauvignon."],["Oregon's Willamette Valley?","Pinot Noir."],["Barossa Valley?","Shiraz."],["Marlborough?","Sauvignon Blanc."],["Mendoza?","Malbec."],["Grape strongly tied to Chile?","Carmenère."],["What is Pinotage?","South African crossing of Pinot Noir and Cinsault."],["Why isn't Old World vs New World enough?","Climate, site and production matter more — cool New Zealand and warm southern France break the rule."]],"q":[["Passion fruit, grapefruit and grass from New Zealand:","Marlborough Sauvignon Blanc","Central Otago Pinot Noir","Hawke's Bay Merlot","Barossa Shiraz","Pungent and bright."],["A guest loved a Barossa red. It was most likely:","Shiraz","Pinot Noir","Malbec","Sangiovese","Ripe and full."],["Coonawarra is famous for:","Cabernet Sauvignon, often with mint or eucalyptus","Shiraz","Riesling","Malbec","Terra rossa soil."],["Oregon's Willamette Valley is known for:","Pinot Noir","Cabernet Sauvignon","Zinfandel","Malbec","Cool-climate Burgundy grape."],["Chile's signature red:","Carmenère","Malbec","Pinotage","Tannat","Green pepper note."],["South Africa's signature white grape (locally called Steen):","Chenin Blanc","Sauvignon Blanc","Chardonnay","Riesling","More than any other country."],["'New World = fruity, Old World = earthy' is:","Too simple; climate and winemaking matter more","Always true","A legal rule","True only for reds","Cool New World sites make lean wines."],["A guest wants a big, ripe, oaky red from California:","Napa Cabernet Sauvignon","Willamette Pinot Noir","Sonoma Coast Chardonnay","Marlborough Sauvignon Blanc","Warm, full, often oaky."]],"b":"<p>“New World” broadly refers to wine-producing countries outside the traditional European wine world.<\/p>\n<p>Again:<\/p>\n<p>Not a legal quality category.<\/p>\n<p>For Basic:<\/p>\n<p>United States<\/p>\n<p>Australia<\/p>\n<p>New Zealand<\/p>\n<p>Argentina<\/p>\n<p>Chile<\/p>\n<p>South Africa<\/p>\n<h3 class=\"bk-h\">1. United States<\/h3>\n<div class=\"bk-lab\">CALIFORNIA<\/div>\n<p>California produces an enormous range of wine.<\/p>\n<p>Two major areas to recognize:<\/p>\n<div class=\"bk-lab\">NAPA VALLEY<\/div>\n<p>Especially famous for:<\/p>\n<p>Cabernet Sauvignon<\/p>\n<p>Often:<\/p>\n<div class=\"bk-chips\"><span>ripe black fruit<\/span><span>full body<\/span><span>substantial tannin<\/span><span>oak<\/span><\/div>\n<div class=\"bk-lab\">SONOMA<\/div>\n<p>More diverse geographically and climatically.<\/p>\n<p>Important varieties include:<\/p>\n<p>Chardonnay<\/p>\n<p>Pinot Noir<\/p>\n<p>Cabernet Sauvignon<\/p>\n<p>Zinfandel<\/p>\n<div class=\"bk-lab\">OREGON<\/div>\n<p>Particularly associated with:<\/p>\n<p>Pinot Noir<\/p>\n<p>especially the:<\/p>\n<p>Willamette Valley.<\/p>\n<p>Cooler conditions can support:<\/p>\n<p>high acidity + red-fruit-driven Pinot Noir.<\/p>\n<h3 class=\"bk-h\">2. Australia<\/h3>\n<div class=\"bk-lab\">BAROSSA VALLEY<\/div>\n<p>Famous for:<\/p>\n<p>Shiraz<\/p>\n<p>Often:<\/p>\n<div class=\"bk-chips\"><span>ripe<\/span><span>full-bodied<\/span><span>dark-fruited<\/span><span>powerful<\/span><\/div>\n<div class=\"bk-lab\">COONAWARRA<\/div>\n<p>Known especially for:<\/p>\n<p>Cabernet Sauvignon.<\/p>\n<p>Australia also produces major Chardonnay, Riesling and other styles.<\/p>\n<h3 class=\"bk-h\">3. New Zealand<\/h3>\n<div class=\"bk-lab\">MARLBOROUGH<\/div>\n<p>Internationally famous for:<\/p>\n<p>Sauvignon Blanc<\/p>\n<p>Often intensely aromatic:<\/p>\n<div class=\"bk-chips\"><span>passion fruit<\/span><span>grapefruit<\/span><span>lime<\/span><span>grass/herbs<\/span><\/div>\n<p>New Zealand also produces important Pinot Noir.<\/p>\n<h3 class=\"bk-h\">4. Argentina<\/h3>\n<div class=\"bk-lab\">MENDOZA<\/div>\n<p>Think:<\/p>\n<p>Malbec<\/p>\n<p>Altitude is extremely important in many vineyards.<\/p>\n<p>Strong sunlight + cool nights at elevation can help create:<\/p>\n<p>ripeness + retained acidity<\/p>\n<p>Potential characteristics:<\/p>\n<div class=\"bk-chips\"><span>blackberry<\/span><span>plum<\/span><span>violet<\/span><\/div>\n<h3 class=\"bk-h\">5. Chile<\/h3>\n<p>Chile produces important:<\/p>\n<p>Cabernet Sauvignon<\/p>\n<p>Carmenère<\/p>\n<p>Sauvignon Blanc<\/p>\n<p>Chardonnay<\/p>\n<p>CARMENÈRE<\/p>\n<p>has become particularly associated with Chile.<\/p>\n<p>Potential:<\/p>\n<div class=\"bk-chips\"><span>black fruit<\/span><span>spice<\/span><span>herbal character<\/span><\/div>\n<p>depending on ripeness and production.<\/p>\n<h3 class=\"bk-h\">6. South Africa<\/h3>\n<p>South Africa combines long wine history with New World geography.<\/p>\n<p>Important grapes include:<\/p>\n<p>Chenin Blanc<\/p>\n<p>Cabernet Sauvignon<\/p>\n<p>Syrah<\/p>\n<p>And:<\/p>\n<div class=\"bk-lab\">PINOTAGE<\/div>\n<p>a crossing of Pinot Noir and Cinsault.<\/p>\n<h3 class=\"bk-h\">7. Old World vs. New World<\/h3>\n<p>Don’t memorize:<\/p>\n<p>Old World = earthy<\/p>\n<p>New World = fruity.<\/p>\n<p>That’s far too simplistic.<\/p>\n<p>But at Basic, warmer New World regions can often produce:<\/p>\n<p>riper fruit + higher alcohol + fuller body<\/p>\n<p>compared with cooler European examples.<\/p>\n<p>Yet climate matters more than the Old/New World label itself.<\/p>\n<p>Cool-climate New Zealand and warm southern France already break the simplistic rule.<\/p>\n<p>So ask:<\/p>\n<p>Where?<\/p>\n<p>Climate?<\/p>\n<p>Grape?<\/p>\n<p>Production?<\/p>\n<h3 class=\"bk-h\">Comparative Example<\/h3>\n<div class=\"bk-lab\">BURGUNDY PINOT NOIR<\/div>\n<p>vs.<\/p>\n<div class=\"bk-lab\">CALIFORNIA PINOT NOIR<\/div>\n<p>Same grape.<\/p>\n<p>But climate, vineyard and winemaking can create substantial differences in:<\/p>\n<p>ripeness<\/p>\n<p>alcohol<\/p>\n<p>fruit profile<\/p>\n<p>body<\/p>\n<p>oak expression<\/p>\n<p>That’s how wine should be compared.<\/p>\n<h3 class=\"bk-h bk-ck\">Checkpoint<\/h3><p class=\"bk-note\">Answer these out loud before the exam.<\/p>\n<ol class=\"bk-check\"><li>Napa Valley is particularly famous for what red grape?<\/li><li>Oregon’s Willamette Valley?<\/li><li>Barossa?<\/li><li>Marlborough?<\/li><li>Mendoza?<\/li><li>Which grape is especially associated with Chile?<\/li><li>What is Pinotage?<\/li><li>Why is Old World vs. New World not enough to predict style?<\/li><\/ol>","pro":[["A guest wants a Malbec 'like the one in Argentina.'","Mendoza's altitude gives cool nights, keeping acid; the style is plush, blackberry and violet.","'Mendoza Malbec is grown high in the Andes, so it's rich but still fresh: blackberry and violet.'"],["A guest assumes all Australian wine is big and jammy.","Climate matters more than country: Barossa Shiraz is big, but Tasmania, Yarra and Adelaide Hills make lean, cool-climate wines.","'Barossa is big and ripe, but cooler spots like Yarra Valley make elegant, lighter wines.'"],["A guest wants a Marlborough Sauvignon Blanc alternative.","Same grape, different climate: Sancerre (leaner, mineral), or a South African Sauvignon (between the two).","'For something less tropical, try Sancerre: same grape, more mineral and lean.'"]]},{"id":"w10","track":"Wine","title":"Sparkling Wine","k":["Bubbles = CO2 from fermentation, trapped.","Traditional Method: second fermentation in the bottle, lees aging (brioche, toast), remove sediment, dosage.","Champagne: only from Champagne, France. Grapes: Chardonnay, Pinot Noir, Meunier.","Blanc de Blancs = white from whites (Chardonnay). Blanc de Noirs = white from black grapes.","Tank Method: second fermentation in a pressurized tank → Prosecco (Glera; pear, apple, flowers).","Cava: Spain, Traditional Method (Macabeo, Xarel-lo, Parellada).","Extra Dry is sweeter than Brut."],"c":[["Where does the second fermentation happen in the Traditional Method?","In the bottle."],["Champagne's three main grapes?","Chardonnay, Pinot Noir, Meunier."],["What does lees aging add to sparkling wine?","Bread, brioche, biscuit, toast."],["Blanc de Blancs?","'White from whites' — usually 100% Chardonnay in Champagne."],["Blanc de Noirs?","White sparkling wine made from dark grapes (Pinot Noir, Meunier)."],["Prosecco: grape and method?","Glera; Tank Method (second fermentation in pressurized tank)."],["Cava method?","Traditional Method (Spain)."],["Brut vs Extra Dry — which is sweeter?","Extra Dry is sweeter than Brut."],["What is dosage?","Liquid (can include sugar) added after sediment removal; sets final sweetness."]],"q":[["Which is sweeter, Brut or Extra Dry?","Extra Dry","Brut","They're the same","Neither has sugar","Labels are counterintuitive."],["Brioche and toast in Champagne come from:","Aging on the lees after the second fermentation","Oak barrels","Added bread yeast flavor","Malolactic only","Traditional Method."],["Prosecco is usually made by:","The Tank Method","The Traditional Method","Carbonation injection","Ancestral method","Fresh pear and apple."],["Blanc de Blancs Champagne is made from:","White grapes (Chardonnay)","Black grapes","Any grapes","Pinot Meunier only","White from whites."],["Cava is made by:","The Traditional Method in Spain","The Tank Method in Italy","Injecting CO2","Freezing","Macabeo, Xarel-lo, Parellada."],["Disgorgement is:","Removing yeast sediment from the bottle","Adding sugar","Blending base wines","Aging on lees","Then dosage."],["'Champagne' properly means:","Sparkling wine from the Champagne region of France","Any sparkling wine","Any French sparkling wine","Any Traditional Method wine","A protected name."],["A guest wants bubbles 'like Champagne but under $15 a glass':","A Crémant or Cava (Traditional Method)","A tank-method Moscato","A sparkling Shiraz","A carbonated wine","Same method, lower price."]],"b":"<p>Question:<\/p>\n<p>How do bubbles get into wine?<\/p>\n<p>CO₂.<\/p>\n<p>The important question is how the producer creates and retains it.<\/p>\n<h3 class=\"bk-h\">1. Fermentation creates CO₂<\/h3>\n<p>Remember:<\/p>\n<div class=\"bk-eq\">Sugar + yeast<br>↓<br>Alcohol + CO₂<\/div>\n<p>During normal still-wine fermentation, the CO₂ escapes.<\/p>\n<p>To make sparkling wine, producers can conduct a fermentation under conditions where the CO₂ is trapped and dissolves into the wine.<\/p>\n<h3 class=\"bk-h\">2. Traditional Method<\/h3>\n<p>Simplified:<\/p>\n<div class=\"bk-eq\">Make base wine<br>↓<br>Bottle<br>↓<br>Add yeast + sugar<br>↓<br>Second fermentation IN bottle<br>↓<br>CO₂ trapped<br>↓<br>Lees aging<br>↓<br>Remove yeast sediment<br>↓<br>Adjust/bottle<\/div>\n<p>This is the:<\/p>\n<div class=\"bk-lab\">TRADITIONAL METHOD<\/div>\n<p>used for Champagne and other sparkling wines.<\/p>\n<h3 class=\"bk-h\">3. Champagne<\/h3>\n<p>Champagne must come from:<\/p>\n<p>Champagne, France<\/p>\n<p>under its appellation rules.<\/p>\n<p>Champagne is not the generic word for all sparkling wine.<\/p>\n<p>Major grapes:<\/p>\n<p>Chardonnay<\/p>\n<p>Pinot Noir<\/p>\n<p>Meunier<\/p>\n<h3 class=\"bk-h\">4. Lees Aging<\/h3>\n<p>After the second fermentation, the wine can remain in contact with dead yeast cells.<\/p>\n<p>Over time this can contribute:<\/p>\n<div class=\"bk-chips\"><span>bread<\/span><span>brioche<\/span><span>biscuit<\/span><span>toast<\/span><\/div>\n<p>These are classic secondary characteristics of traditional-method sparkling wine.<\/p>\n<h3 class=\"bk-h\">5. Blanc de Blancs<\/h3>\n<p>Literally:<\/p>\n<div class=\"bk-lab\">WHITE FROM WHITES<\/div>\n<p>In Champagne, this typically means Champagne made from white grapes, most famously:<\/p>\n<p>Chardonnay.<\/p>\n<h3 class=\"bk-h\">6. Blanc de Noirs<\/h3>\n<div class=\"bk-lab\">WHITE FROM BLACKS<\/div>\n<p>White sparkling wine made from dark-skinned grapes.<\/p>\n<p>In Champagne, this can involve:<\/p>\n<p>Pinot Noir<\/p>\n<p>Meunier<\/p>\n<p>Remember Lesson 4:<\/p>\n<p>Dark grapes can make pale wine if skin contact is limited.<\/p>\n<h3 class=\"bk-h\">7. Tank Method<\/h3>\n<p>Instead of conducting the second fermentation in each bottle:<\/p>\n<p>Second fermentation happens in a:<\/p>\n<div class=\"bk-lab\">PRESSURIZED TANK<\/div>\n<p>CO₂ remains trapped.<\/p>\n<p>The wine is then bottled under pressure.<\/p>\n<p>This is particularly associated with:<\/p>\n<div class=\"bk-lab\">PROSECCO<\/div>\n<h3 class=\"bk-h\">8. Prosecco<\/h3>\n<p>From northeastern Italy.<\/p>\n<p>Primary grape:<\/p>\n<p>Glera<\/p>\n<p>Generally associated with:<\/p>\n<div class=\"bk-chips\"><span>fresh fruit<\/span><span>flowers<\/span><span>pear<\/span><span>apple<\/span><\/div>\n<p>The tank method helps preserve fresh aromatic character rather than emphasizing long lees-derived complexity.<\/p>\n<h3 class=\"bk-h\">9. Cava<\/h3>\n<p>Spanish sparkling wine.<\/p>\n<p>Traditionally produced using the:<\/p>\n<p>Traditional Method<\/p>\n<p>Important traditional grapes include:<\/p>\n<p>Macabeo<\/p>\n<p>Xarel-lo<\/p>\n<p>Parellada<\/p>\n<p>Other permitted varieties exist.<\/p>\n<p>So:<\/p>\n<div class=\"bk-eq\">Champagne → Traditional Method<br>Cava → Traditional Method<br>Prosecco → commonly Tank Method<\/div>\n<h3 class=\"bk-h\">10. Dosage<\/h3>\n<p>After traditional-method sparkling wine has its sediment removed, a small amount of liquid may be added before final closure. This can include sugar and helps determine the final sweetness level.<\/p>\n<p>You’ll encounter terms such as:<\/p>\n<p>Brut Nature<\/p>\n<p>Extra Brut<\/p>\n<p>Brut<\/p>\n<p>Extra Dry<\/p>\n<p>Dry<\/p>\n<p>Demi-Sec<\/p>\n<p>Here’s the confusing part:<\/p>\n<p>Extra Dry is sweeter than Brut.<\/p>\n<p>Don’t interpret the English literally.<\/p>\n<p>At Basic, remember:<\/p>\n<p>Brut = dry sparkling style<\/p>\n<p>and we’ll memorize the precise sugar ranges later.<\/p>\n<h3 class=\"bk-h\">Bartender Scenario<\/h3>\n<p>Guest:<\/p>\n<p>“What’s the difference between Champagne and Prosecco?”<\/p>\n<p>Strong Basic answer:<\/p>\n<p>“Champagne comes from Champagne, France and uses the traditional method, where the second fermentation occurs in the bottle. That can create more bread and brioche complexity from lees aging. Prosecco comes from Italy and is usually made using the tank method, which tends to preserve fresher pear, apple and floral characteristics.”<\/p>\n<p>Useful.<\/p>\n<p>Clear.<\/p>\n<p>Production-based.<\/p>\n<h3 class=\"bk-h bk-ck\">Checkpoint<\/h3><p class=\"bk-note\">Answer these out loud before the exam.<\/p>\n<ol class=\"bk-check\"><li>What creates CO₂ during fermentation?<\/li><li>Where does the second fermentation occur in the traditional method?<\/li><li>What can lees aging contribute?<\/li><li>Can sparkling wine outside Champagne legally just be called Champagne?<\/li><li>What does Blanc de Blancs mean?<\/li><li>Blanc de Noirs?<\/li><li>What method is commonly associated with Prosecco?<\/li><li>What grape is central to Prosecco?<\/li><li>What method is used for Cava?<\/li><li>Which is generally sweeter: Brut or Extra Dry?<\/li><\/ol>","pro":[["A guest orders 'Extra Dry Champagne' expecting it to be the driest.","Extra Dry is sweeter than Brut. Clarify so they get what they want.","'Funny enough, Extra Dry is a bit sweeter than Brut. If you want the driest, Brut or Extra Brut.'"],["A guest wants Champagne-style bubbles at a lower price.","Traditional Method outside Champagne: Crémant (France), Cava (Spain), Franciacorta (Italy), quality US sparkling.","'Try a Crémant: same method as Champagne, from elsewhere in France, at a lower price.'"],["A guest asks why Prosecco tastes fruitier than Champagne.","Tank Method keeps fresh fruit (pear, apple); Champagne's lees aging adds toast and brioche.","'Prosecco's second fermentation happens in a tank, so it stays fresh and fruity. Champagne ages on yeast in the bottle, so it gets toasty.'"]]},{"id":"w11","track":"Wine","title":"Sweet & Fortified Wine","k":["Sweet = residual sugar. Fortified = alcohol added. Separate ideas.","Sweet methods: stop fermentation early, late harvest, noble rot, dried grapes.","Noble rot (Botrytis cinerea) dries grapes, concentrating sugar, acid, flavor: honey, apricot. Sauternes, Tokaji.","Port (Douro, Portugal): spirit added mid-fermentation → sweet + fortified. Ruby, Tawny, Vintage.","Sherry (Jerez, Spain): fortified, not always sweet. Fino/Manzanilla age under flor (dry, almond, saline). Oloroso is oxidative (nuts, dried fruit).","Madeira: heat + oxygen → nuts, caramel; very stable.","Vermouth: aromatized fortified wine."],"c":[["Does fortified mean sweet?","No — Fino Sherry is fortified and dry."],["What is noble rot?","Botrytis cinerea dehydrating grapes, concentrating sugar, acid and flavor (honey, apricot)."],["Two famous noble rot wines?","Sauternes and Tokaji."],["Why is most Port sweet?","Grape spirit is added before fermentation finishes; alcohol stops yeast, leaving sugar."],["What is flor?","A layer of yeast on some Sherries that protects from oxygen; gives almond, bread, saline notes."],["Biological vs oxidative aging?","Biological: under flor (Fino, Manzanilla). Oxidative: oxygen exposure → nuts, dried fruit (Oloroso)."],["Fortified wine aged with heat?","Madeira."],["What makes vermouth different?","It's fortified AND aromatized with botanicals."]],"q":[["A guest asks if all Sherry is sweet. Best reply:","No: Fino and Manzanilla are bone dry; some styles are sweet","Yes","Only cream Sherry is dry","Sherry isn't wine","Fortified ≠ sweet."],["Port stays sweet because:","Spirit is added mid-fermentation, stopping it","Sugar is added after","It's made from raisins","It's aged in sweet barrels","Sweet and fortified."],["Noble rot (Botrytis) concentrates:","Sugar, acid and flavor: honey, apricot","Tannin","Color only","Alcohol only","Sauternes and Tokaji."],["Oloroso tastes of nuts and dried fruit because of:","Oxidative aging","Flor","Noble rot","Carbonation","Fino ages under flor."],["Madeira is famously stable because:","It's deliberately exposed to heat and oxygen","It's sealed under nitrogen","It's kept frozen","It's sterile-filtered","Nuts, caramel, very long-lived."],["Tokaji Aszú's sweetness comes from:","Noble rot","Fortification","Freezing","Dried grapes on mats","Hungary."],["A guest wants a dry fortified wine with oysters:","Manzanilla or Fino Sherry","Ruby Port","Pedro Ximénez","Madeira Malmsey","Salty, crisp, very cold."],["Ice wine (Eiswein) is made from:","Grapes frozen on the vine","Grapes frozen after harvest","Wine frozen and thawed","Noble-rot grapes","Concentrated sugar."]],"b":"<p>Two different concepts:<\/p>\n<div class=\"bk-lab\">SWEET WINE<\/div>\n<p>contains meaningful residual sugar.<\/p>\n<div class=\"bk-lab\">FORTIFIED WINE<\/div>\n<p>has additional alcohol added.<\/p>\n<p>A wine can be:<\/p>\n<p>sweet but not fortified<\/p>\n<p>dry and fortified<\/p>\n<p>or<\/p>\n<p>sweet and fortified.<\/p>\n<p>Don’t confuse the categories.<\/p>\n<h3 class=\"bk-h\">1. How do we make sweet wine?<\/h3>\n<p>Broadly, producers can:<\/p>\n<p>Stop fermentation before all sugar is consumed<\/p>\n<p>or<\/p>\n<p>Begin with grapes containing extremely concentrated sugar<\/p>\n<p>or use other methods that result in residual sweetness.<\/p>\n<h3 class=\"bk-h\">2. Late Harvest<\/h3>\n<p>Leave grapes on the vine longer.<\/p>\n<p>They can accumulate greater ripeness and sugar.<\/p>\n<p>Potentially:<\/p>\n<div class=\"bk-chips\"><span>richer<\/span><span>sweeter<\/span><span>riper<\/span><\/div>\n<p>depending on fermentation.<\/p>\n<h3 class=\"bk-h\">3. Noble Rot<\/h3>\n<p>A fungus:<\/p>\n<div class=\"bk-lab\">BOTRYTIS CINEREA<\/div>\n<p>under favorable conditions can produce:<\/p>\n<div class=\"bk-lab\">NOBLE ROT<\/div>\n<p>It causes grapes to lose water, concentrating:<\/p>\n<div class=\"bk-chips\"><span>sugar<\/span><span>acid<\/span><span>flavor<\/span><\/div>\n<p>and can contribute distinctive characteristics such as:<\/p>\n<div class=\"bk-chips\"><span>honey<\/span><span>apricot<\/span><span>dried fruit<\/span><\/div>\n<p>Important examples include:<\/p>\n<p>Sauternes<\/p>\n<p>Tokaji<\/p>\n<p>Not all rot is noble.<\/p>\n<p>Under poor conditions, rot can simply destroy grapes.<\/p>\n<h3 class=\"bk-h\">4. Dried Grapes<\/h3>\n<p>Another method:<\/p>\n<p>Dry grapes to remove water.<\/p>\n<p>Less water means:<\/p>\n<p>more concentrated sugar and flavor.<\/p>\n<p>This concept appears in multiple wine traditions.<\/p>\n<h3 class=\"bk-h\">5. Fortification<\/h3>\n<p>Fortification means:<\/p>\n<p>adding alcohol to wine<\/p>\n<p>often grape spirit.<\/p>\n<p>The timing matters.<\/p>\n<h3 class=\"bk-h\">6. Port<\/h3>\n<p>Port comes from Portugal’s Douro region and is fortified.<\/p>\n<p>For many Port styles:<\/p>\n<div class=\"bk-eq\">Fermentation begins.<br>↓<br>Sugar → alcohol<br>↓<br>Grape spirit is added BEFORE fermentation consumes all the sugar.<br>↓<br>Higher alcohol stops fermentation.<br>↓<br>Residual sugar remains.<\/div>\n<p>Result:<\/p>\n<p>sweet + fortified<\/p>\n<p>Major styles include:<\/p>\n<p>Ruby<\/p>\n<p>Tawny<\/p>\n<p>Vintage<\/p>\n<p>We’ll separate them properly later.<\/p>\n<h3 class=\"bk-h\">7. Sherry<\/h3>\n<p>Sherry comes from southern Spain, centered around Jerez.<\/p>\n<p>Sherry is fortified, but unlike Port:<\/p>\n<p>Sherry is not automatically sweet.<\/p>\n<p>Major styles include:<\/p>\n<p>Fino<\/p>\n<p>Manzanilla<\/p>\n<p>Amontillado<\/p>\n<p>Oloroso<\/p>\n<p>Pedro Ximénez<\/p>\n<p>Some are extremely dry.<\/p>\n<p>Others can be intensely sweet.<\/p>\n<h3 class=\"bk-h\">8. Flor<\/h3>\n<p>Certain Sherries mature under a layer of yeast called:<\/p>\n<div class=\"bk-lab\">FLOR<\/div>\n<p>Flor protects the wine from substantial oxygen exposure while contributing distinctive characteristics.<\/p>\n<p>Fino and Manzanilla are strongly associated with biological aging under flor.<\/p>\n<p>Potential profile:<\/p>\n<div class=\"bk-chips\"><span>dry<\/span><span>light<\/span><span>almond<\/span><span>bread/dough<\/span><span>saline impressions<\/span><\/div>\n<h3 class=\"bk-h\">9. Oxidative Aging<\/h3>\n<p>Other Sherry styles experience greater oxygen exposure.<\/p>\n<p>This can create characteristics such as:<\/p>\n<div class=\"bk-chips\"><span>nuts<\/span><span>dried fruit<\/span><span>caramelized notes<\/span><\/div>\n<p>Oloroso is a major example.<\/p>\n<p>So Sherry teaches:<\/p>\n<div class=\"bk-lab\">BIOLOGICAL AGING VS. OXIDATIVE AGING<\/div>\n<h3 class=\"bk-h\">10. Madeira<\/h3>\n<p>Madeira comes from the Portuguese island of Madeira.<\/p>\n<p>It is fortified and famous for maturation involving:<\/p>\n<p>heat + oxygen<\/p>\n<p>which contributes distinctive stability and characteristics such as:<\/p>\n<div class=\"bk-chips\"><span>nuts<\/span><span>caramel<\/span><span>dried fruit<\/span><span>spice<\/span><\/div>\n<p>Styles can range from dry to sweet.<\/p>\n<h3 class=\"bk-h\">11. Vermouth Again<\/h3>\n<p>Vermouth is:<\/p>\n<div class=\"bk-lab\">AROMATIZED FORTIFIED WINE<\/div>\n<div class=\"bk-eq\">Wine<br>↓<br>Fortification<br>↓<br>Botanicals<br>↓<br>Vermouth<\/div>\n<p>So wine knowledge and spirits knowledge connect.<\/p>\n<h3 class=\"bk-h\">Category Map<\/h3>\n<div class=\"bk-lab\">SAUTERNES<\/div>\n<div class=\"bk-eq\">Sweet wine → noble rot important<\/div>\n<div class=\"bk-lab\">PORT<\/div>\n<p>Fortified + commonly sweet<\/p>\n<div class=\"bk-lab\">FINO SHERRY<\/div>\n<p>Fortified + dry<\/p>\n<div class=\"bk-lab\">MADEIRA<\/div>\n<p>Fortified + heat/oxidative maturation<\/p>\n<div class=\"bk-lab\">VERMOUTH<\/div>\n<p>Fortified + aromatized<\/p>\n<p>These are completely different products even though several involve added alcohol.<\/p>\n<h3 class=\"bk-h bk-ck\">Checkpoint<\/h3><p class=\"bk-note\">Answer these out loud before the exam.<\/p>\n<ol class=\"bk-check\"><li>Does fortified automatically mean sweet?<\/li><li>What is residual sugar?<\/li><li>What is noble rot?<\/li><li>Why can noble rot make grapes intensely concentrated?<\/li><li>Why does much Port remain sweet?<\/li><li>Is all Sherry sweet?<\/li><li>What is flor?<\/li><li>What’s the broad difference between biological and oxidative aging?<\/li><li>What makes vermouth different from ordinary fortified wine?<\/li><li>Which fortified wine is famous for maturation involving heat?<\/li><\/ol>","pro":[["A guest wants a dessert wine with blue cheese.","Sweet and salty: Sauternes or Port with blue cheese is classic.","'Port or Sauternes. Sweet wine and salty blue cheese is a classic match.'"],["A guest is surprised a Sherry is bone dry.","Fino and Manzanilla age under flor (a yeast layer) and are dry, saline and almondy. Serve very cold.","'This one ages under a layer of yeast that keeps it fresh and dry. It's great with salty snacks.'"],["A guest asks how long an open bottle of Port lasts.","Ruby and tawny Port last weeks to a month or more once open (tawny longer). Vintage Port fades within days.","'Tawny keeps a few weeks or more; vintage Port is best within a couple of days.'"]]},{"id":"w12","track":"Wine","title":"Tasting, Service & Pairing","k":["Appearance: clarity, intensity, color (white lemon→gold→amber; red purple→ruby→garnet→tawny).","Nose: intensity, then broad → specific (fruit → red fruit → cherry).","Palate: sweetness, acidity, tannin, alcohol, body, intensity, finish.","Quality: balance, length, intensity, complexity.","Serve sparkling & light whites chilled; full reds at COOL room temp.","Pairing: wine at least as sweet as food; acid with fat/acid; tannin with protein/fat; salt is friendly; umami makes wine taste bitter; alcohol boosts chili heat → off-dry Riesling."],"c":[["Order of systematic tasting?","Appearance → Nose → Palate → Conclusion (quality)."],["Four quality markers?","Balance, length, intensity, complexity."],["Red wine color with age?","Purple → ruby → garnet → tawny/brown."],["Rule for sweet wine with dessert?","Wine should be at least as sweet as the food."],["Why are tannic reds good with steak?","Protein and fat soften the perceived tannin."],["What does chili heat do with high alcohol?","Alcohol makes the heat feel hotter."],["Best type for spicy food?","Lower alcohol, fruity, high acid, some sweetness — e.g., off-dry Riesling."],["What does umami do to wine?","Makes it seem more bitter, tannic, less fruity."],["Effect of salt?","Makes wine seem softer, fruitier, less bitter."]],"q":[["Spicy Thai curry. Best wine:","Off-dry, high-acid Riesling","High-alcohol Zinfandel","Tannic Barolo","Oaky Chardonnay","Alcohol boosts chile heat."],["A dessert is sweeter than the wine. The wine will taste:","Thin, sour or bitter","Sweeter","Better","Unchanged","Wine at least as sweet as dessert."],["Steak with high fat and protein pairs with:","A tannic red like Cabernet","A delicate Pinot Grigio","A sweet Riesling","A Prosecco","Tannin and fat soften each other."],["Salty food makes wine taste:","Fruitier and smoother","More bitter","Sweeter and thinner","More tannic","Salt is friendly."],["Umami-rich food makes a tannic red taste:","More bitter and drying","Fruitier","Sweeter","Lighter","Choose low-tannin or white."],["A red served at 75°F will taste:","Hot, alcoholic and flabby","Fresher","More tannic","Sweeter","Serve at cool room temperature."],["'Length' in quality assessment means:","How long the flavor lasts after swallowing","Bottle size","Time aged","Sip size","Longer is usually better."],["Broad to specific tasting looks like:","Fruit → red fruit → cherry","Cherry → fruit → red","Wine → red → good","Sweet → dry → strong","Narrow down step by step."]],"b":"<p>You’ve learned:<\/p>\n<div class=\"bk-eq\">vineyard → grape → fermentation → winemaking → maturation → geography → style<\/div>\n<p>Now we evaluate the finished wine.<\/p>\n<p>We’ll use a simplified systematic approach inspired by professional wine education.<\/p>\n<h3 class=\"bk-h\">1. Appearance<\/h3>\n<p>Look at:<\/p>\n<div class=\"bk-lab\">CLARITY<\/div>\n<div class=\"bk-lab\">INTENSITY<\/div>\n<div class=\"bk-lab\">COLOR<\/div>\n<p>White:<\/p>\n<div class=\"bk-eq\">lemon-green → lemon → gold → amber<\/div>\n<p>Red:<\/p>\n<div class=\"bk-eq\">purple → ruby → garnet → tawny/brown<\/div>\n<p>Rosé:<\/p>\n<div class=\"bk-eq\">pink → salmon → orange tones<\/div>\n<p>Color can provide clues about:<\/p>\n<div class=\"bk-chips\"><span>grape variety<\/span><span>extraction<\/span><span>age<\/span><span>winemaking<\/span><\/div>\n<p>But never use color alone to make absolute conclusions.<\/p>\n<h3 class=\"bk-h\">2. Nose<\/h3>\n<p>Assess:<\/p>\n<div class=\"bk-lab\">INTENSITY<\/div>\n<p>Then identify aroma families.<\/p>\n<div class=\"bk-lab\">FRUIT<\/div>\n<div class=\"bk-chips\"><span>citrus<\/span><span>green fruit<\/span><span>stone fruit<\/span><span>tropical<\/span><span>red fruit<\/span><span>black fruit<\/span><span>dried fruit<\/span><\/div>\n<div class=\"bk-lab\">FLORAL<\/div>\n<div class=\"bk-chips\"><span>blossom<\/span><span>rose<\/span><span>violet<\/span><\/div>\n<div class=\"bk-lab\">HERBAL/VEGETAL<\/div>\n<div class=\"bk-chips\"><span>grass<\/span><span>mint<\/span><span>bell pepper<\/span><\/div>\n<div class=\"bk-lab\">SPICE<\/div>\n<div class=\"bk-chips\"><span>pepper<\/span><span>cinnamon<\/span><span>clove<\/span><\/div>\n<div class=\"bk-lab\">OAK<\/div>\n<div class=\"bk-chips\"><span>vanilla<\/span><span>cedar<\/span><span>toast<\/span><span>coconut<\/span><\/div>\n<div class=\"bk-lab\">DEVELOPMENT<\/div>\n<div class=\"bk-chips\"><span>leather<\/span><span>mushroom<\/span><span>earth<\/span><span>nuts<\/span><span>dried fruit<\/span><\/div>\n<p>Start broad.<\/p>\n<p>Then become specific.<\/p>\n<div class=\"bk-eq\">Fruit → red fruit → cherry<\/div>\n<p>is better tasting discipline than desperately guessing:<\/p>\n<p>“organic Montmorency cherry compote.”<\/p>\n<h3 class=\"bk-h\">3. Palate<\/h3>\n<p>Assess:<\/p>\n<div class=\"bk-eq\">SWEETNESS<br>Dry → sweet<br>ACIDITY<br>Low → high<br>TANNIN<br>Low → high<\/div>\n<p>for relevant wines.<\/p>\n<div class=\"bk-eq\">ALCOHOL<br>Low → high<br>BODY<br>Light → full<br>FLAVOR INTENSITY<br>Light → pronounced<\/div>\n<div class=\"bk-lab\">FLAVOR CHARACTERISTICS<\/div>\n<p>What do you taste?<\/p>\n<div class=\"bk-lab\">FINISH<\/div>\n<p>How long do desirable flavors persist?<\/p>\n<h3 class=\"bk-h\">4. Quality<\/h3>\n<p>At Basic, think:<\/p>\n<div class=\"bk-lab\">BALANCE<\/div>\n<p>Do the structural elements work together?<\/p>\n<div class=\"bk-lab\">LENGTH<\/div>\n<p>Do desirable flavors persist?<\/p>\n<div class=\"bk-lab\">INTENSITY<\/div>\n<p>Are the flavors sufficiently expressive for the style?<\/p>\n<div class=\"bk-lab\">COMPLEXITY<\/div>\n<p>Are there multiple integrated characteristics?<\/p>\n<p>The underlying goal is:<\/p>\n<p>Evaluate quality rather than simply preference.<\/p>\n<h3 class=\"bk-h\">5. Serving Temperature<\/h3>\n<p>Temperature changes how wine presents.<\/p>\n<p>Generally:<\/p>\n<div class=\"bk-eq\">Sparkling → chilled<br>Light whites → chilled<br>Fuller whites → cool, not freezing<br>Light reds → slightly cool<br>Full-bodied reds → cool room temperature<\/div>\n<p>One misconception:<\/p>\n<p>“Red wine should be served at room temperature.”<\/p>\n<p>Historically, room temperature didn’t mean a modern warm dining room.<\/p>\n<p>Too warm can make alcohol feel dominant and the wine heavy.<\/p>\n<h3 class=\"bk-h\">6. Glassware<\/h3>\n<p>A proper wine glass generally allows:<\/p>\n<p>space for aromas<\/p>\n<p>a narrower opening to direct aroma<\/p>\n<p>a stem to reduce warming from the hand<\/p>\n<p>You don’t need dozens of different glasses to appreciate wine.<\/p>\n<p>But appropriate glassware can improve the experience.<\/p>\n<h3 class=\"bk-h\">7. Decanting<\/h3>\n<p>Decanting can serve two major purposes.<\/p>\n<div class=\"bk-lab\">REMOVE SEDIMENT<\/div>\n<p>especially from older wines.<\/p>\n<p>Or:<\/p>\n<div class=\"bk-lab\">INCREASE OXYGEN EXPOSURE<\/div>\n<p>which can help some young, concentrated wines become more expressive.<\/p>\n<p>Not every old wine should receive aggressive aeration.<\/p>\n<p>Fragile older wines can fade quickly.<\/p>\n<h3 class=\"bk-h\">8. Storage<\/h3>\n<p>Wine generally prefers:<\/p>\n<p>cool<\/p>\n<p>dark<\/p>\n<p>stable conditions<\/p>\n<p>Avoid:<\/p>\n<p>heat<\/p>\n<p>strong light<\/p>\n<p>major temperature fluctuations<\/p>\n<p>For cork-sealed wine intended for extended storage, horizontal storage has traditionally been used to help maintain cork conditions.<\/p>\n<p>Once opened, oxygen becomes increasingly important.<\/p>\n<h3 class=\"bk-h\">9. Food Pairing<\/h3>\n<p>Forget the simplistic rule:<\/p>\n<p>Red = meat<\/p>\n<p>White = fish<\/p>\n<p>It sometimes works.<\/p>\n<p>But structure gives us better tools.<\/p>\n<h3 class=\"bk-h\">10. Acidity<\/h3>\n<p>High-acid wine can work beautifully with:<\/p>\n<p>fatty foods<\/p>\n<p>acidic dishes<\/p>\n<p>Acidity can refresh the palate.<\/p>\n<p>But if the food is highly acidic, the wine generally needs enough acidity to avoid seeming flat.<\/p>\n<h3 class=\"bk-h\">11. Sweetness<\/h3>\n<p>Sweetness can help with:<\/p>\n<p>spicy foods<\/p>\n<p>and sweet wines can pair with desserts.<\/p>\n<p>But generally:<\/p>\n<p>The wine should be at least as sweet as the food.<\/p>\n<p>Otherwise the wine can taste:<\/p>\n<div class=\"bk-chips\"><span>thin<\/span><span>sour<\/span><span>bitter<\/span><\/div>\n<h3 class=\"bk-h\">12. Tannin<\/h3>\n<p>Tannic reds can pair well with protein-rich, fatty foods.<\/p>\n<p>Think:<\/p>\n<p>Cabernet Sauvignon + steak.<\/p>\n<p>The interaction can make the wine feel more harmonious.<\/p>\n<h3 class=\"bk-h\">13. Salt<\/h3>\n<p>Salt can make many wines appear:<\/p>\n<div class=\"bk-chips\"><span>softer<\/span><span>fruitier<\/span><span>less bitter<\/span><\/div>\n<p>This is why salty foods can create excellent wine pairings.<\/p>\n<h3 class=\"bk-h\">14. Umami<\/h3>\n<p>Umami-rich foods can make wines appear:<\/p>\n<p>more bitter<\/p>\n<p>more tannic<\/p>\n<p>less fruity<\/p>\n<p>Pairing can become trickier.<\/p>\n<p>Other components—salt, fat, acidity—can help balance the interaction.<\/p>\n<h3 class=\"bk-h\">15. Chili Heat<\/h3>\n<p>Alcohol can intensify the perception of chili heat.<\/p>\n<p>So with spicy food, a high-alcohol tannic red may make the experience feel hotter.<\/p>\n<p>A lower-alcohol wine with:<\/p>\n<p>fruit + acidity + some sweetness<\/p>\n<p>can often work better.<\/p>\n<p>Think:<\/p>\n<p>off-dry Riesling + spicy food.<\/p>\n<h3 class=\"bk-h\">Sommelier Scenario<\/h3>\n<p>Guest:<\/p>\n<p>“I want a red with steak.”<\/p>\n<p>Weak answer:<\/p>\n<p>“Cabernet.”<\/p>\n<p>Better:<\/p>\n<p>“If you want something full-bodied and structured, Cabernet Sauvignon works really well—the tannin and dark fruit can stand up to the richness of the steak. If you’d prefer something softer, we could go Merlot; if you want more pepper and savory character, Syrah could be great.”<\/p>\n<p>You’re not matching:<\/p>\n<p>red + meat.<\/p>\n<p>You’re matching:<\/p>\n<p>structure + flavor + guest preference.<\/p>\n<h3 class=\"bk-h\">YOUR BASIC WINE MAP<\/h3>\n<ol class=\"bk-model\"><li>GRAPE — What variety?<\/li><li>CLIMATE &amp; VINEYARD — Where did it grow? Cool? Warm? Altitude? Water?<\/li><li>RIPENESS — Sugar? Acidity? Tannin? Flavor development?<\/li><li>WINEMAKING — Skin contact? Fermentation? MLF? Lees?<\/li><li>MATURATION — Steel? New oak? Used oak? Bottle?<\/li><li>GEOGRAPHY — What does the region/appellation tell me?<\/li><li>STRUCTURE — Sweetness? Acidity? Tannin? Alcohol? Body?<\/li><li>FLAVOR — Primary? Secondary? Tertiary?<\/li><li>QUALITY — Balance? Length? Intensity? Complexity?<\/li><li>SERVICE — Temperature? Glass? Decanting? Food?<\/li><\/ol>\n<h3 class=\"bk-h\">Production → Glass<\/h3>\n<p>Suppose you taste:<\/p>\n<p>lemon + green apple + high acidity + subtle mineral character<\/p>\n<p>Potentially:<\/p>\n<div class=\"bk-eq\">Chardonnay<br>↓<br>Cool climate<br>↓<br>Limited overt oak<br>↓<br>Northern Burgundy<br>↓<br>CHABLIS<\/div>\n<p>Or:<\/p>\n<p>blackcurrant + blackberry + high tannin + full body + vanilla + cedar<\/p>\n<p>Potentially:<\/p>\n<div class=\"bk-eq\">Cabernet Sauvignon<br>↓<br>Warm, ripe fruit<br>↓<br>Oak maturation<br>↓<br>NAPA VALLEY CABERNET SAUVIGNON<\/div>\n<p>Or:<\/p>\n<p>lime + peach + high acidity + slight sweetness<\/p>\n<p>Potentially:<\/p>\n<div class=\"bk-eq\">Riesling<br>↓<br>Cool climate<br>↓<br>Residual sugar<br>↓<br>GERMAN RIESLING<\/div>\n<p>Or:<\/p>\n<p>red cherry + rose + high acidity + high tannin + developing earth/tar<\/p>\n<p>Potentially:<\/p>\n<div class=\"bk-eq\">Nebbiolo<br>↓<br>Piedmont<br>↓<br>Oak/bottle development<br>↓<br>BAROLO<\/div>\n<p>Now you’re no longer saying:<\/p>\n<p>“I know Barolo tastes like cherry.”<\/p>\n<p>You’re reasoning:<\/p>\n<div class=\"bk-eq\">Nebbiolo → structure → climate/place → production → development → Barolo.<\/div>\n<p>That’s the skill.<\/p>\n<h3 class=\"bk-h\">BASIC WINE COMPLETE<\/h3>\n<p>You’ve now covered:<\/p>\n<p>Lesson 1 — What Is Wine?<\/p>\n<p>Lesson 2 — Vineyard, Climate &amp; Terroir<\/p>\n<p>Lesson 3 — Wine Structure<\/p>\n<p>Lesson 4 — White, Red &amp; Rosé Winemaking<\/p>\n<p>Lesson 5 — Maturation, Oak &amp; Blending<\/p>\n<p>Lesson 6 — Major White Grapes<\/p>\n<p>Lesson 7 — Major Red Grapes<\/p>\n<p>Lesson 8 — Old World Wine<\/p>\n<p>Lesson 9 — New World Wine<\/p>\n<p>Lesson 10 — Sparkling Wine<\/p>\n<p>Lesson 11 — Sweet &amp; Fortified Wine<\/p>\n<p>Lesson 12 — Tasting, Service &amp; Food Pairing<\/p>\n<p>TIER I: BASIC WINE — COMPLETE<\/p>\n<p>At this point, the goal isn’t that you know every appellation, grape or classification.<\/p>\n<p>It’s that when someone puts a bottle in front of you, your brain starts asking:<\/p>\n<p>What grape?<\/p>\n<p>Where was it grown?<\/p>\n<p>What climate?<\/p>\n<p>How ripe were the grapes?<\/p>\n<p>How was it fermented?<\/p>\n<p>Was oak involved?<\/p>\n<p>What’s the acidity?<\/p>\n<p>What’s the tannin?<\/p>\n<p>What’s the body?<\/p>\n<p>Why does it taste like this?<\/p>\n<p>That’s the foundation for:<\/p>\n<p>TIER II — INTERMEDIATE WINE<\/p>","pro":[["A guest orders spicy Thai food and a high-alcohol Zinfandel.","Alcohol amplifies chile heat. Suggest off-dry Riesling or a lower-alcohol, fruity option, but respect their choice.","'Spicy food and high alcohol can burn. An off-dry Riesling would cool it down, but I'm happy to bring the Zin.'"],["A guest asks how to taste wine without looking pretentious.","Simple sequence: look, smell, sip, notice sweet/acid/tannin, how long it lasts. Then say what you like.","'Smell it, take a sip, notice if it's fruity or earthy, light or heavy, and how long the flavor stays. That's it.'"],["Your manager asks why your red pours taste 'soupy.'","Reds stored warm on the backbar are served too warm. Cool room temperature (60–65°F) tightens them up.","Move reds to a cooler spot or wine fridge set around 60°F; chill briefly if warm."]]},{"id":"s1","track":"Spirits","title":"What Is a Spirit?","k":["Raw material → fermentation → distillation → post-distillation → bottling.","Fermentation makes alcohol; distillation concentrates it and selects character.","Distillation is not 'boiling alcohol away from water' and not automatically purification.","Congeners = non-ethanol compounds giving flavor.","After distillation: dilution, oak aging, botanical redistillation (gin), blending.","Six questions: raw material, fermentation, distillation, post-distillation, maturation, regulation."],"c":[["Does distillation create alcohol?","No. Fermentation creates it; distillation concentrates and separates."],["What are congeners?","Compounds other than ethanol and water that add aroma, flavor, texture."],["Why do vodka and Jamaican rum taste so different if both are distilled?","What the producer chose to retain, remove and develop."],["Raw material of Cognac?","Grapes."],["Raw material of tequila?","Blue agave."],["Raw material of whiskey?","Grain."],["Six-question model?","Raw material, fermentation, distillation, post-distillation, maturation, regulation/geography."]],"q":[["A guest says, 'Vodka is pure because distillation removes everything but alcohol.' Most accurate reply:","Distillation concentrates alcohol and selects which flavors stay; vodka producers choose neutrality","Correct, distillation always purifies","Vodka isn't distilled","Only filtering makes vodka pure","Distillation is selection, not automatic purification."],["A neutral vodka and a funky Jamaican rum differ mainly because:","Of what each producer chose to retain, remove and develop","Only the rum was distilled","Rum is fermented longer by law everywhere","Vodka is aged in steel","Both are distilled; choices differ."],["Which step actually creates the alcohol in Cognac?","Fermenting grape juice into wine","Distilling the wine","Aging in oak","Blending eaux-de-vie","Fermentation makes alcohol; distillation concentrates it."],["A guest asks how gin gets its flavor. Best answer:","Botanicals are added through redistillation, maceration or vapor infusion","It's aged in juniper wood","Juniper syrup is added after bottling","It's made from juniper berries instead of grain","Juniper leads, other botanicals support."],["'Congeners' are best described as:","Non-ethanol compounds that contribute aroma and flavor","Impurities that are always removed","The alcohol itself","Added flavorings","Fruit, grain, floral, earthy and other notes."],["Which question would you ask first to understand any unfamiliar spirit?","What was it made from?","What color is it?","How expensive is it?","What proof is it?","Raw material starts the production chain."],["A gin and an aquavit are both examples of:","Spirits flavored after or through distillation","Aged spirits","Fortified wines","Liqueurs","Juniper vs. caraway or dill."],["The 'production chain' for any spirit, in order:","Raw material → fermentation → distillation → post-distillation → bottling","Distillation → fermentation → aging → bottling","Raw material → distillation → fermentation → bottling","Fermentation → aging → distillation → bottling","Follow production to understand any bottle."]],"b":"<p class=\"bk-obj\"><b>Learning objectives<\/b>distinguish fermentation from distillation; describe the broad production chain; explain why distilled spirits can range from neutral to intensely characterful.<\/p>\n<div class=\"bk-flow\">RAW MATERIAL → FERMENTATION → DISTILLATION → POST-DISTILLATION → BOTTLING<\/div>\n<h3 class=\"bk-h\">1. Fermentation creates the alcohol<\/h3>\n<p>A spirit begins with material containing fermentable sugar, or material whose carbohydrates can be converted into fermentable sugar. Yeast metabolizes sugar and produces ethanol, carbon dioxide and many secondary compounds that can influence aroma and flavor.<\/p>\n<div class=\"bk-call key\"><b>Key concept<\/b>Fermentation makes alcohol. Distillation concentrates alcohol and selects/concentrates volatile character.<\/div>\n<div class=\"bk-tw\"><table class=\"bk-t\"><thead><tr><th>Raw material<\/th><th>Typical spirit family<\/th><\/tr><\/thead><tbody><tr><td>Grains<\/td><td>Whiskey; many neutral-spirit bases<\/td><\/tr><tr><td>Grapes<\/td><td>Cognac, Armagnac and other grape brandies<\/td><\/tr><tr><td>Sugarcane<\/td><td>Rum and cane spirits<\/td><\/tr><tr><td>Agave<\/td><td>Tequila and mezcal<\/td><\/tr><tr><td>Other fruit<\/td><td>Fruit brandies<\/td><\/tr><tr><td>Potatoes / other agricultural material<\/td><td>Some vodka bases<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 class=\"bk-h\">2. Sugar-rich vs. starch-rich materials<\/h3>\n<p>Grapes already contain fermentable sugars. Grains store much of their energy as starch, so production requires a conversion step before yeast can efficiently ferment the material. That is why a grain-spirit flow begins with starch conversion, while grape brandy begins with fruit juice or wine production.<\/p>\n<div class=\"bk-flow\">GRAIN → STARCH CONVERSION → FERMENTABLE SUGAR → FERMENTATION → DISTILLATION<\/div>\n<div class=\"bk-flow\">GRAPES → JUICE / MUST → FERMENTATION TO WINE → DISTILLATION<\/div>\n<h3 class=\"bk-h\">3. What distillation does<\/h3>\n<p>A fermented wash, beer or wine is relatively low in alcohol. Heating it creates vapor whose composition differs from the liquid because ethanol, water and aroma compounds have different volatilities. Condensing selected vapor yields distillate with a higher alcohol concentration. Distillation is therefore not the creation of alcohol and is not simply 'boiling alcohol away from water.'<\/p>\n<h3 class=\"bk-h\">4. Distillation is not automatically purification<\/h3>\n<p>A distiller may seek neutrality, but many categories depend on retaining character. Fermentation produces numerous compounds—often discussed broadly as congeners—that can contribute fruit, grain, floral, vegetal, sulfurous, earthy or other notes. Still design, reflux, distillation strength and cuts determine which portions of that character reach the final distillate.<\/p>\n<div class=\"bk-call bk-bar\"><b>Behind the bar<\/b>A neutral vodka and an ester-rich Jamaican rum can both be distilled spirits. Their difference is not whether they were distilled, but what the producer chose to retain, remove and develop.<\/div>\n<h3 class=\"bk-h\">5. What can happen after distillation?<\/h3>\n<ul class=\"bk-ul\"><li>Dilution and bottling for an unaged spirit.<\/li><li>Oak maturation, followed by blending, proof adjustment and bottling.<\/li><li>Redistillation or other permitted flavoring with botanicals, as in gin production.<\/li><li>Blending of distillates, casks, ages or styles to build consistency and complexity.<\/li><\/ul>\n<h3 class=\"bk-h\">The six-question mental model<\/h3>\n<div class=\"bk-tw\"><table class=\"bk-t\"><thead><tr><th>Question<\/th><th>Ask yourself<\/th><\/tr><\/thead><tbody><tr><td>1. Raw material<\/td><td>What was it made from?<\/td><\/tr><tr><td>2. Fermentation<\/td><td>How were alcohol and early flavor created?<\/td><\/tr><tr><td>3. Distillation<\/td><td>How was the fermented liquid separated and concentrated?<\/td><\/tr><tr><td>4. Post-distillation<\/td><td>Was it flavored, blended, filtered or otherwise adjusted?<\/td><\/tr><tr><td>5. Maturation<\/td><td>Was it aged? In what wood and environment?<\/td><\/tr><tr><td>6. Regulation/geography<\/td><td>What rules define the name on the label?<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"bk-call sum\"><b>Lesson summary<\/b>Spirits become understandable when you follow production. Fermentation creates alcohol; distillation concentrates it and shapes character; post-distillation choices can transform it again.<\/div>","pro":[["A guest holds up two clear spirits: 'Vodka and white rum are basically the same, right?'","Walk the production chain. Vodka: any agricultural base, distilled to high strength for neutrality. White rum: sugarcane, often lower distillation strength, and many are aged then filtered. Different raw material, different goals.","'They're both clear, but vodka is built to be neutral, and rum keeps the sugarcane character. Taste them side by side and you'll get it right away.'"],["Your manager asks you to explain distillation to a new server in one sentence.","Avoid the myth that distillation 'boils alcohol off water.' It concentrates alcohol and lets the distiller choose which flavors stay.","'Distillation heats a fermented liquid and collects the vapor, which concentrates the alcohol and lets the distiller choose which flavors to keep.'"],["A guest asks, 'Is gin just flavored vodka?'","Close but not quite: gin starts with neutral spirit, but the botanicals are usually added through redistillation or vapor infusion, and juniper must lead. It's a defined category.","'It starts from a neutral spirit, but the botanicals are distilled in, and juniper has to lead. That's what makes it gin.'"]]},{"id":"s2","track":"Spirits","title":"Raw Materials & Fermentation","k":["Yeast needs fermentable sugar. Fruit and cane have sugar; grain has starch that must be converted.","Malting: grain germinates then dries; develops enzymes for starch → sugar.","Rum: molasses or fresh cane juice. Martinique AOC rhum agricole = cane juice.","Agave is a succulent, not a cactus; stores fructans that must be broken down by cooking.","Fermentation creates flavor: esters → fruity notes.","Longer fermentation ≠ better; it's a style choice."],"c":[["Why does grain need a conversion step?","It stores energy as starch; enzymes must convert it to fermentable sugar."],["What is malting?","Letting grain begin to germinate, then drying it — develops enzymes for starch conversion."],["Two rum starting materials?","Molasses and fresh cane juice."],["Is agave a cactus?","No — it's a succulent."],["What carbohydrate does agave store?","Fructans — cooking breaks them into fermentable sugars."],["What are esters?","Aroma compounds from fermentation, often fruity."],["Is longer fermentation better?","No — it's chosen to fit a target style."]],"q":[["Why does whiskey need malting or added enzymes but brandy doesn't?","Grain stores starch that must be converted; grapes already have sugar","Grapes have more alcohol","Whiskey is distilled twice","Brandy is aged longer","Starch-rich vs. sugar-rich materials."],["Agave must be cooked before fermentation mainly to:","Break down fructans into fermentable sugars","Add smoke","Kill bacteria","Remove bitterness only","Agave stores fructans, not ready sugar."],["A guest asks why a rum smells like overripe banana and pineapple. Best answer:","Esters created during fermentation, often in long ferments","Banana is added after distillation","It was aged in fruit barrels","It's a spiced rum","Jamaican-style rums are famous for this."],["Martinique AOC rhum agricole must be made from:","Fresh sugarcane juice","Molasses","Either, by choice","Cane syrup only","Don't apply this to every rum labeled 'agricole.'"],["'Longer fermentation always makes better spirit.' This is:","False; it's a style choice that changes flavor","True for every category","True only for vodka","Legally required for rum","Different goals, different ferments."],["Cachaça and rhum agricole share which base?","Fresh sugarcane juice","Molasses","Agave","Grain","Brazil and Martinique."],["Malting barley mainly develops:","Enzymes that convert starch into sugar","Smoke flavor","Higher alcohol","Color","Peat smoke comes from drying with peat, a separate choice."],["A distiller ferments the same wash two ways: 2 days vs. 2 weeks. The 2-week wash likely has:","More fruity, funky ester-driven character","More alcohol by law","Less flavor","No difference after distillation","Fermentation creates flavor that distillation can carry."]],"b":"<p class=\"bk-obj\"><b>Learning objectives<\/b>distinguish sugar-rich and starch-rich materials; explain malting at a foundational level; connect fermentation choices to flavor.<\/p>\n<h3 class=\"bk-h\">1. Yeast needs fermentable sugar<\/h3>\n<p>The central production question is not simply 'what plant is used?' but 'how does the producer make fermentable sugar available?' Fruit and cane materials can supply sugar directly. Grain and other starch-rich materials require enzymatic conversion.<\/p>\n<div class=\"bk-tw\"><table class=\"bk-t\"><thead><tr><th>Material<\/th><th>Carbohydrate situation<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td>Grapes / fruit<\/td><td>Fermentable sugars already present<\/td><td>Brandy<\/td><\/tr><tr><td>Cane juice / molasses<\/td><td>Fermentable cane-derived sugars<\/td><td>Rum<\/td><\/tr><tr><td>Grain<\/td><td>Mostly starch; conversion required<\/td><td>Whiskey<\/td><\/tr><tr><td>Agave<\/td><td>Fructans must be broken down<\/td><td>Tequila, mezcal<\/td><\/tr><\/tbody><\/table><\/div>\n<p>2. Grain: starch → sugar In grain production, enzymes break starch into fermentable sugars. Malted grain is grain allowed to begin germination under controlled conditions and then dried. Germination develops/activates enzymes that can support starch conversion during mashing. Malted barley is especially important in whisky production.<\/p>\n<div class=\"bk-call key\"><b>Key concept<\/b>Basic simplification: malting helps supply enzymes for starch conversion. Later tiers should distinguish malting, milling, mashing, exogenous enzymes and category-specific requirements.<\/div>\n<h3 class=\"bk-h\">3. Grapes and fruit<\/h3>\n<p>Grape sugars can be fermented into wine without the grain-style starch-conversion step. Distilling that wine creates grape brandy. Cognac therefore begins as a wine-production process before it becomes a distillation and maturation process.<\/p>\n<h3 class=\"bk-h\">4. Sugarcane<\/h3>\n<p>Rum can begin with molasses—the sugar industry’s sugar-rich by-product—or with fresh cane juice. The raw material changes the fermentation matrix and can strongly influence style. Martinique AOC rhum agricole is specifically a cane-juice rum; do not turn that protected example into a universal legal definition for every product using the word agricole.<\/p>\n<h3 class=\"bk-h\">5. Agave<\/h3>\n<p>Agave is a succulent, not a cactus. It stores much of its carbohydrate as fructans. Cooking or other permitted processing breaks those larger carbohydrates into simpler sugars that yeast can ferment. Tequila uses blue agave; mezcal regulations permit multiple agave species.<\/p>\n<h3 class=\"bk-h\">6. Fermentation creates flavor<\/h3>\n<p>Yeast produces ethanol, but also compounds that influence aroma. Fermentation length, temperature, yeast strain, nutrient availability and—where a producer allows it—other microbial activity can shift the resulting flavor profile. Esters are an important family of aroma co
