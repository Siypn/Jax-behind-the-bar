ry vermouth:","Bamboo","Adonis","Americano","Spritz","Bamboo."],["Aquafaba replaces which ingredient?","Egg white","Cream","Sugar","Citrus","Vegan foam."]]},{"id":"x10","track":"Mixology","title":"Speed, Station Setup & Ticket Flow","k":["Mise en place: before service, set your well the same way every time. Tins, mixing glass, jiggers, spoon, strainers, garnish tray, syrups and juices in labeled bottles, speed rail stocked, ice bin full, glassware chilled, bar towels folded. If you have to look for something mid-rush, your setup failed.","Read the whole ticket (or every ticket waiting) before you touch anything. Group the same drinks together and plan the round.","Build a round in an order: set all the glasses down first; build stirred drinks first (they hold well in the mixing glass), then shaken drinks; pour carbonated mixers, sparkling wine and beer last so they stay fizzy. Garnish everything at once at the end.","Pour cheapest ingredients first: citrus, syrup, modifiers, and spirit last. If you mess up, you've wasted lime juice, not $40 Scotch.","Work with both hands and shake two tins at once when you can. Never walk anywhere empty-handed. Restock, clear glassware and wipe down during every lull.","Jigger everything at a craft bar. Fill the jigger to the brim (the meniscus), pour without dripping. Consistency is what managers watch for. Free-pouring has its place, but specs are specs.","Call outs keep everyone safe: 'Behind' when passing behind someone, 'Corner' at blind turns, 'Hot' or 'Sharp' when carrying them. Communicate with your barback before you run out, not after.","When you're slammed, acknowledge every guest in the first moments ('Hi, I'll be right with you') even if you can't serve them yet. People will wait if they know you've seen them.","Clean as you go: rinse tins and spoon between drinks, wipe the bar top, and keep your station looking like it did at open."],"c":[["What is mise en place?","Everything set and in its place before service."],["First step on a ticket?","Read the whole ticket (all waiting tickets), group drinks, plan the round."],["Order of a round?","Glasses down → stirred → shaken → carbonated/sparkling/beer last → garnish all."],["Why pour cheapest ingredients first?","Mistakes waste citrus and syrup, not expensive spirit."],["Jigger or free-pour at a craft bar?","Jigger everything, filled to the brim."],["Call out passing behind someone?","'Behind.'"],["What do you do when slammed and a new guest arrives?","Acknowledge them right away, even before you can serve them."],["When do you restock?","During every lull, and tell the barback before you run out."]],"q":[["The ticket has a Martini, two Margaritas and a G&T. Pour the tonic:","Last","First","Before the Martini","Whenever","Carbonation goes last."],["Within one drink, pour ingredients in what order?","Cheapest first, spirit last","Spirit first","Most expensive first","Doesn't matter","Protects the costly stuff."],["A craft bar manager watches you free-pour a 2 oz spec. Best practice:","Use a jigger, filled to the brim","Free-pour faster","Eyeball the glass","Pour a little extra to be safe","Accuracy = consistency."],["You're slammed and a guest sits down. You:","Make eye contact and say you'll be right with them","Ignore them until you're free","Ask a server to tell them to wait","Hand them a menu without speaking","Acknowledge first."],["Why build stirred drinks before shaken ones in a round?","Stirred drinks hold better while you shake","Shaken drinks taste better warm","Rules require it","No reason","Shaken drinks lose texture fast."],["'Corner' means:","You're coming around a blind corner","We're out","Behind you","Hot item","Safety call."]]},{"id":"x11","track":"Mixology","title":"Garnish, Glassware & Presentation","k":["A garnish is an ingredient: most of what we 'taste' is aroma. Peel oils, mint and spice hit the nose first.","Expressing a peel: cut a wide peel with little white pith (pith is bitter), hold it skin-side down over the drink and pinch it so the oils mist the surface. Optionally run it along the rim, then drop it in or discard it as the spec says.","Flamed orange peel: warm the skin with a lit match, then squeeze the oils through the flame onto the drink for a caramelized orange aroma. Popularized by Dale DeGroff. Do it away from guests and never near hair, napkins or high-proof spills.","Mint: give the sprig a light slap to wake up the aroma, and place it next to the straw so the guest smells it with every sip. Remove brown or bruised leaves.","Salt and sugar rims: do a half rim on the outside of the glass only, so the guest can choose, and nothing falls into the drink.","Match the glass to the drink. Coupe or Nick & Nora for drinks served up; rocks or double rocks for drinks on ice; highball or Collins for tall drinks; julep cup for juleps; flute for sparkling; tiki mugs for tiki.","Handle glasses by the stem or base, never the rim. Check every glass for lipstick, chips and water spots before it goes out. A chipped glass gets tossed immediately, not set aside.","Consistency is presentation. The same drink should look identical every time it leaves the bar: same garnish, same fill line, same ice."],"c":[["Why does garnish matter?","It provides aroma, which drives flavor."],["How do you express a peel?","Skin-side down over the drink, pinch to spray the oils."],["Why avoid pith?","It's bitter."],["Flamed orange peel?","Squeeze warm peel oils through a flame for caramelized orange aroma; Dale DeGroff."],["How to prep a mint garnish?","Slap it lightly; place it by the straw."],["How should salt rims be applied?","Half rim, outside of the glass only."],["Up drink glassware?","Coupe or Nick & Nora (chilled)."],["How to hold a glass?","By the stem or base, never the rim."],["Chipped glass?","Discard immediately."]],"q":[["When expressing a lemon peel, the skin side faces:","Down toward the drink","Up toward you","The guest","It doesn't matter","Oils spray from the skin."],["A half salt rim on a Margarita lets the guest:","Choose salt or no salt each sip","Avoid ice","Drink faster","Avoid lime","Guest control."],["Why place mint near the straw?","So the guest smells it while sipping","It looks nice in photos","It sweetens the drink","It keeps ice from melting","Aroma = flavor."],["A glass coming out of the washer has a small chip. You:","Throw it away immediately","Serve it to a regular","Use it for water only","Put it back in the rack","Chipped glass is a safety hazard."],["A flamed orange peel adds:","Caramelized orange aroma","Bitterness","Sweetness","Color","Burnt oils."],["Why avoid the white pith when cutting peels?","It's bitter","It's sweet","It's toxic","It's colorless","Pith is bitter."]]},{"id":"x12","track":"Mixology","title":"Hospitality & Responsible Service","k":["Great bartenders get hired for hospitality as much as technique. Greet every guest fast, make eye contact, get water down, and read the situation: date night, business, solo regular, celebration. Each needs a different pace and level of conversation.","Guiding a guest who doesn't know what they want: 'What spirits do you usually like? Something refreshing or spirit-forward? Sweet, sour, bitter?' Then suggest two options. Never make a guest feel bad about what they order, vodka soda included.","A drink sent back is a chance, not an insult. Listen, apologize, fix it fast (adjust or remake, or offer something else), and never argue. Tell your manager if it'll be comped.","Remember names and drinks. Regulars build a bar's business, and they follow good bartenders.","Checking ID: look at the photo, date of birth and expiration date, and feel the card. Acceptable ID usually means a valid driver's license, state ID, passport or military ID. If you're unsure, ask a manager. When in doubt, don't serve.","Signs of intoxication: louder or more aggressive, slurred speech, stumbling, glassy eyes, slowed reactions, spilling drinks, ordering faster. Count drinks and slow service early (water, food) rather than waiting for a problem.","Cutting someone off: do it privately and calmly, with a manager's backup. Say 'I can't serve you any more alcohol tonight, but I can get you water, coffee or food.' Don't blame or lecture. Help arrange a safe ride.","In Las Vegas (Clark County) you need an Alcohol Awareness (TAM) card within 30 days of starting an alcohol-serving job; it's valid for 4 years. You also need a Southern Nevada Health District food handler card. Check current rules with your employer."],"c":[["Three questions to guide an undecided guest?","Which spirits do you like? Refreshing or spirit-forward? Sweet, sour or bitter?"],["Drink sent back. Steps?","Listen, apologize, fix fast, don't argue; loop in the manager if comping."],["What do you check on an ID?","Photo, date of birth, expiration, and feel the card."],["Five signs of intoxication?","Loud/aggressive, slurred speech, stumbling, glassy eyes, slow reactions (also spilling, ordering faster)."],["How do you cut someone off?","Privately, calmly, with manager backup; offer water/food; help arrange a ride."],["Clark County alcohol card rule?","Alcohol Awareness (TAM) card within 30 days of starting; valid 4 years."],["Other required Las Vegas card?","Southern Nevada Health District food handler card."]],"q":[["A guest orders a vodka soda at a craft cocktail bar. You:","Make it perfectly, no attitude","Suggest they order a 'real' cocktail","Make it with well vodka without asking","Roll your eyes","Hospitality first."],["A guest is slurring and asks for another round. You:","Privately decline, offer water or food, involve a manager","Serve a weaker drink","Serve it and say it's the last one","Announce it to the bar","Never serve a visibly intoxicated guest."],["In Clark County, the alcohol awareness card must be obtained:","Within 30 days of starting","Within 1 year","Only for managers","Before age 25","30 days."],["Unsure if an ID is real. Best move:","Ask a manager; when in doubt, don't serve","Serve if they look over 21","Ask their friends","Take a photo of it","Protect yourself and the license."],["A guest says their drink is too strong. Best response:","Apologize and offer to adjust or remake it","Explain it's the correct spec","Ignore it","Add more alcohol","Guest first."],["Which is NOT a usual sign of intoxication?","Ordering water","Slurred speech","Stumbling","Glassy eyes","Water is a good sign."]]},{"id":"x13","track":"Mixology","title":"Batching, Costing & Menu Development","k":["Batching: multiply a spec by the number of servings. For stirred drinks, add water for dilution (about 20–25% of the batch volume) so you can pour straight from the fridge or freezer into a glass. For shaken drinks, batch the spirits, liqueurs and syrups, and add fresh citrus at service before shaking.","Bottle math: a 750 ml bottle holds about 25.4 oz; a liter holds about 33.8 oz.","Cost per ounce = bottle cost ÷ ounces in the bottle. Example: a $30 750 ml bottle costs about $1.18 per ounce.","Drink cost = the cost of every ingredient, including citrus, syrup and garnish. Pour cost % = drink cost ÷ menu price × 100. Many bars aim for roughly 18–24% on cocktails, but every bar sets its own target.","Worked example: 2 oz of that $30 gin ($2.37) + ¾ oz lime ($0.25) + ¾ oz simple ($0.05) + garnish ($0.10) = about $2.77. At a $16 menu price, pour cost is about 17%.","A balanced menu covers different spirits (not five whiskey drinks), styles (refreshing, sour, spirit-forward, bitter, low-ABV, zero-proof) and price points. Check how much prep and time each drink takes on a busy night.","R&D process: start from a classic template, change one thing at a time, keep notes on every version, have other bartenders taste it, and only finalize after it tastes right three times in a row.","A spec card lists: drink name, glass, ice, method (shake, stir, build), garnish, and ingredients in exact amounts in pour order. Add cost and pour cost % at the bottom. Bring 3–5 of your own finished spec cards to interviews."],"c":[["Batching stirred drinks: what do you add?","Water for dilution, about 20–25% of the batch."],["What do you NOT batch for shaken drinks?","Fresh citrus; add it at service."],["Ounces in 750 ml? In a liter?","About 25.4 oz; about 33.8 oz."],["Cost per ounce formula?","Bottle cost ÷ ounces in the bottle."],["Pour cost % formula?","Drink cost ÷ menu price × 100."],["Typical cocktail pour cost target?","Roughly 18–24% (varies by bar)."],["What makes a balanced menu?","Spread of spirits, styles and prices, plus realistic prep and speed."],["What goes on a spec card?","Name, glass, ice, method, garnish, ingredients in pour order, cost."]],"q":[["A $40 liter bottle costs about how much per ounce?","$1.18","$0.40","$2.50","$4.00","40 ÷ 33.8 ≈ $1.18."],["Drink cost $3.00, menu price $15. Pour cost:","20%","5%","30%","50%","3 ÷ 15 = 0.20."],["A batched Manhattan for service should include:","Pre-measured water for dilution","Fresh lemon juice","Soda water","Nothing extra; just spirits","Stirred batches need dilution added."],["A new menu has six bourbon drinks and no refreshing options. The problem:","Not balanced across spirits and styles","Too cheap","Too many garnishes","Nothing; bourbon sells","Cover different guests."],["A 1-liter bottle at $33.80 costs about how much per ounce?","$1.00","$3.38","$0.50","$2.00","33.8 oz per liter."],["Raising a drink's price while keeping the same cost will:","Lower the pour cost %","Raise the pour cost %","Not change it","Make it illegal","Cost ÷ price."]]},{"id":"x14","track":"Mixology","title":"The Stage, the Interview & Your Career","k":["A stage (pronounced 'stahzh') is a working interview: you work a shift, or part of one, so the team can see how you move, think and treat people. At top bars it matters more than your resume.","Before the stage: study their menu until you can describe every drink, look at their backbar on social media, visit as a guest if you can, and know their classics specs. Ask what to wear (often all black with non-slip shoes) and when to arrive.","Bring: a wine key, two pens, a Sharpie, a small notebook. Leave your own tools at home unless they say otherwise. Arrive 10–15 minutes early.","During: ask 'Where can I help?' and never stand still. Polish glassware, restock, wipe down, take out trash. Follow their specs exactly, even if you'd make it differently. Watch how they set up and move. Ask before tasting. Show urgency and clean habits. Be kind to the dishwasher and barback; they're watching too.","'Make me a drink' test: ask what they like, then make a classic you can nail perfectly. A perfect Daiquiri is the classic test of balance, technique and confidence. Explain your choice in one sentence. Taste it with a straw before you hand it over.","Common interview questions: Why bartending? What's your favorite classic, and what's the spec? How do you handle a rush? Tell me about a difficult guest. What are you drinking lately? What do you know about our program? Have short, honest stories ready.","After: send a short thank-you message that day. If you don't get the job, ask what to work on, and ask if you can barback or trail. Barbacking at a top craft bar is the fastest path to bartending at one.","Keep growing: required cards first (TAM, health card). Then pick from the WSET Level 2 Award in Spirits, the Cicerone Certified Beer Server, BarSmarts, and your local USBG (United States Bartenders' Guild) chapter for classes, events and competitions. Keep a personal spec book and photos of your drinks."],"c":[["What is a stage?","A working interview shift."],["What to bring to a stage?","Wine key, pens, Sharpie, small notebook."],["First thing to say at a stage?","'Where can I help?'"],["Their spec differs from yours. You:","Follow their spec exactly."],["Best drink for the 'make me something' test?","A classic you can nail — a perfect Daiquiri is the standard test."],["What to do after a stage?","Send a thank-you message the same day."],["Didn't get the job. Next move?","Ask for feedback, offer to barback or trail."],["Fastest path into a top craft bar?","Barback there and learn."],["Two good certifications to pursue next?","WSET L2 Spirits, Cicerone Certified Beer Server (also BarSmarts, USBG)."]],"q":[["At a stage, a slow moment arrives. You:","Polish glassware, restock or wipe down","Check your phone","Chat with guests about yourself","Wait to be told what to do","Never stand still."],["The bar's Margarita spec is different from the one you learned. You:","Make theirs exactly","Make your version; it's better","Ask the guest which they want","Split the difference","Respect the house spec."],["Asked to 'make me anything', a strong choice is:","A perfectly balanced Daiquiri","The most complicated drink you know","A shot","Whatever has the most ingredients","Simple drinks show balance and technique."],["You didn't get hired after a stage. Best response:","Thank them, ask for feedback, offer to barback or trail","Stop applying to craft bars","Post about it online","Argue the decision","Keep the door open."],["Best thing to bring to a stage:","Wine key, pen, Sharpie, notebook","Your own spirits","A blender","Nothing at all","Basics."],["During a stage you see a faster way to do their prep. You:","Do it their way and mention it later if appropriate","Do it your way","Tell guests","Leave early","Respect the house."]]},{"id":"f1","track":"Fine Dining","title":"What Fine Dining Bars Hire For","k":["A fine dining bar does two jobs at once: it serves guests at the bar, and it runs the service bar for the dining room. Most of your drinks may go to tables you never see, timed to the courses.","Timing is everything. Aperitifs need to land before the first course. A drink paired with a course has to arrive with it, not after. Read tickets by table and course, and talk to servers about when a table is about to be fired.","Polish is the baseline: spotless glassware, a clean and quiet station, neat uniform and grooming, no phone, calm movements. Guests at a $300-a-head restaurant notice a smudged glass and a noisy tin.","The language changes. Describe a drink by flavor and feeling ('bright, a little floral, finishes dry'), not by how much alcohol is in it. Never say 'no problem'. Say 'of course' or 'my pleasure'.","Know every ingredient in every house prep, because allergies are serious here. Orgeat has nuts, many foams use egg white or dairy, some syrups use sesame or honey, and some bitters are made with nuts or gluten grains. If you're not sure, say you'll check, then check with the kitchen or manager.","You're part of the beverage team. The sommelier or beverage director leads the program. Learn their language, back them up on wine and sake service, and ask how they want things described.","Consistency beats creativity on the line. The drink you serve at 10:45 p.m. on a Saturday should be identical to the one the beverage director signed off on.","Omotenashi, the Japanese idea of wholehearted hospitality, is the standard: anticipate what the guest needs before they ask (a fresh napkin, water, the check, a moment of quiet)."],"c":[["Two jobs of a fine dining bar?","Serving guests at the bar and running the service bar for the dining room."],["When should a paired drink arrive?","With the course it's paired with — not after."],["Instead of 'no problem', say?","'Of course' or 'my pleasure'."],["How do you describe a drink here?","By flavor and feel (bright, floral, dry), not by strength."],["Allergen risks in house preps?","Nuts (orgeat), egg and dairy (foams), sesame, honey, nut- or grain-based bitters."],["Guest asks about an allergen you're unsure of?","Say you'll check, then confirm with the kitchen or manager."],["Who leads the beverage program?","The sommelier or beverage director."],["What is omotenashi?","Wholehearted Japanese hospitality — anticipating needs before they're voiced."]],"q":[["A table's paired drink for course 3 should arrive:","With course 3","After course 3 is cleared","Whenever it's ready","Before course 1","Pairings land with the food."],["A guest asks if a drink contains nuts and you're unsure. You:","Check with the kitchen or manager before serving","Say probably not","Remove the garnish","Guess from the menu description","Allergies can be life-threatening."],["The best way to describe a cocktail to a fine dining guest:","Flavor and feel, like 'bright, floral, dry finish'","'It's really strong'","Listing every brand","'It's our best seller'","Paint the taste."],["Omotenashi means:","Anticipating a guest's needs before they ask","A Japanese garnish","Hard shaking","A sake style","Japanese hospitality."],["A table's dessert wine should reach the table:","With the dessert course","Before appetizers","After the check","Whenever","Timing with courses."],["Orgeat is a concern for which allergy?","Nuts","Shellfish","Gluten only","Dairy","Almond."]]},{"id":"f2","track":"Fine Dining","title":"Precision Technique & the Highball","k":["At a fine dining bar, technique is part of the service. Guests watch you work, so every movement should look calm, clean and deliberate.","Stirring: hold the bar spoon loosely and keep the back of the spoon against the inside of the mixing glass so the ice turns as one block. Aim for almost no noise and no splashing, about 20–30 seconds, then taste for temperature and dilution.","Shaking: hard, short and controlled (about 10–12 seconds), sealed tight, away from guests' faces. A clean, confident shake reads as skill; a sloppy one reads as nerves.","Ice is part of the presentation. Use clear ice for spirit-forward drinks and highballs, and rinse fresh ice before using it to remove the frosty surface and any off flavors.","The highball: chill a tall glass full of clear ice by stirring, pour off the meltwater, add the spirit (often about 1 part to 3–4 parts soda) and stir to chill it. Pour very cold soda gently down the ice or a bar spoon so it keeps its bubbles, give it one gentle lift, and serve. A citrus peel over the top is common. This works for whisky, gin, shochu or tequila.","Whisky with water: mizuwari is whisky with cold water and ice, stirred (the classic count is 13½ stirs with the whisky and 3½ after the water). Oyuwari is a spirit with hot water, common with shochu. Both are respected ways to drink fine spirits.","Presentation details: put the coaster down first, set the glass with its garnish or logo facing the guest, show the bottle for premium pours, and return every tool to its place after each drink."],"c":[["How should stirring look and sound?","Smooth, the ice turning as one block, almost silent."],["How long to shake?","About 10–12 seconds, hard and controlled."],["Why rinse fresh ice?","Removes the frosty surface and off flavors for clarity."],["Highball steps?","Chill glass and ice, pour off water, add spirit and stir, gently add cold soda, one lift, citrus peel."],["Spirit-to-soda ratio for a highball?","About 1 part spirit to 3–4 parts soda."],["Mizuwari?","Whisky with cold water and ice, stirred."],["Oyuwari?","Spirit (often shochu) with hot water."],["Presentation basics?","Coaster first, garnish/logo facing the guest, show the bottle for premium pours, tools back in place."]],"q":[["In a highball, the soda is added:","Gently, down the ice or a bar spoon","Shaken with the spirit","First, before the spirit","Room temperature","Protect the bubbles."],["Good stirring at a fine dining bar is:","Smooth and nearly silent","Fast and loud","Done with a whisk","Done in the shaker","Calm, controlled movement."],["Mizuwari is:","Whisky with cold water and ice","Whisky with hot water","Shochu with tea","A sake style","Water ('mizu') + mixing ('wari')."],["A premium pour is best presented by:","Showing the guest the bottle","Free-pouring quickly","Hiding the bottle","Adding soda without asking","Transparency and ceremony."],["The best spirit-to-soda ratio for a classic highball:","About 1:3 to 1:4","1:1","1:10","Equal parts soda and ice","Balanced, refreshing."],["Mizuwari classic stir count after adding whisky:","13½ times","3 times","50 times","None","13½, then 3½ after water."]]},{"id":"f3","track":"Fine Dining","title":"The Japanese Pantry & Shochu","k":["Citrus: yuzu (floral, between lemon, mandarin and grapefruit), sudachi (small, sharp, green), kabosu, and shikuwasa from Okinawa. Fresh yuzu is rare in the US, so bars often use bottled yuzu juice or yuzu liqueurs and sakes.","Herbs and spice: shiso (minty, basil-like leaf, green or red), sansho pepper (citrusy and numbing), wasabi, ginger, and yuzu kosho (a fermented paste of chiles, yuzu peel and salt, used in tiny amounts for heat and citrus).","Tea: matcha (stone-ground green tea powder; shake or whisk it so it doesn't clump), sencha (steamed leaf green tea), hojicha (roasted green tea, nutty and toasty), genmaicha (green tea with toasted rice), gyokuro (shaded, rich in umami). Oolong is Chinese or Taiwanese, but very common on these menus too.","Flavors and sweeteners: sakura (cherry blossom, floral and slightly salty when pickled), ume (Japanese apricot; umeshu is ume steeped in spirit with sugar), kuromitsu (black sugar syrup), black sesame, miso and kombu (for umami and salinity).","Shochu is Japan's distilled spirit, usually about 25% ABV. Honkaku ('authentic') shochu is single-distilled to keep the flavor of its base: imo (sweet potato, earthy and rich), mugi (barley, light and nutty), kome (rice, clean and soft), kokuto (brown sugar, from the Amami islands), and soba (buckwheat).","Awamori is Okinawa's spirit: made from long-grain rice and black koji, often aged (kusu). Shochu and awamori use koji mold, like sake, but they are distilled, not brewed.","Shochu service: on the rocks, mizuwari, oyuwari (hot water poured first, then shochu), or in a chu-hi (shochu highball). It's lower in alcohol than whisky, so it pairs easily with food."],"c":[["Yuzu tastes like?","Floral citrus — between lemon, mandarin and grapefruit."],["Sudachi?","Small, sharp green Japanese citrus."],["Shiso?","A minty, basil-like leaf, green or red."],["Sansho?","Japanese pepper: citrusy and numbing."],["Yuzu kosho?","Fermented paste of chiles, yuzu peel and salt."],["Hojicha?","Roasted green tea: nutty, toasty."],["Genmaicha?","Green tea with toasted rice."],["Typical shochu ABV?","About 25%."],["Imo, mugi, kome shochu?","Sweet potato, barley, rice."],["Awamori?","Okinawan spirit from long-grain rice and black koji; often aged (kusu)."],["Oyuwari order?","Hot water first, then shochu."]],"q":[["A fermented paste of chiles, yuzu peel and salt:","Yuzu kosho","Umeshu","Kuromitsu","Sansho","Use it sparingly."],["Shochu made from sweet potato:","Imo","Mugi","Kome","Kokuto","Imo = potato."],["Awamori comes from:","Okinawa","Hokkaido","Kyoto","Taiwan","Black koji, long-grain rice."],["Roasted green tea with a nutty flavor:","Hojicha","Matcha","Sencha","Gyokuro","Hoji = roasted."],["Shochu differs from sake because it is:","Distilled","Brewed only","Made without koji","Always sparkling","Sake is brewed; shochu is distilled."],["Hojicha is:","Roasted green tea","Powdered green tea","Black tea","Barley tea","Roasted."],["A guest wants a light, nutty Japanese spirit lower in alcohol than whisky:","Mugi (barley) shochu","Cask-strength bourbon","Mezcal","Absinthe","About 25% ABV."]]},{"id":"f4","track":"Fine Dining","title":"Tea, Umami & Savory Cocktails","k":["Restaurant bar programs borrow from the kitchen: tea, mushrooms, miso, tomato, herbs and fats show up in cocktails so the drinks feel connected to the food.","Tea infusions: steep tea directly in a spirit or vermouth, or make a tea syrup. Green teas turn bitter fast with heat, so brew them cooler (around 160–175°F) or cold-steep. Black and oolong teas handle hotter water and longer steeps. Taste every few minutes and strain the moment it's right.","Tea syrups: brew strong tea, then dissolve sugar into it (for example, an oolong demerara syrup). Tea brings tannin, which adds structure and dryness the way a red wine does.","Savory techniques: infuse vermouth with kombu or dried mushroom; fat-wash with miso butter, brown butter or sesame oil; use tomato water or clarified juices; season with saline, sansho or a pinch of yuzu kosho. A savory Martini or Old Fashioned is a common fine dining move.","Umami (savory depth) makes drinks feel rounder and pairs well with food. But a little goes a long way. The drink should still taste like a drink, not a soup.","Smoke: smoking a glass or a cocktail (with wood chips, cherry blossom wood, or tea) adds aroma and drama. Smoke the glass, not the guest, and keep it short so the drink doesn't taste like an ashtray.","Write every infusion and syrup into the bar's spec book with exact weights, times and temperatures, so anyone on the team can make it the same way."],"c":[["Why brew green tea cooler?","High heat makes it bitter fast; about 160–175°F or cold-steep."],["What does tea add to a cocktail's structure?","Tannin: dryness and grip, like red wine."],["Name two savory infusions for vermouth.","Kombu and dried mushroom."],["Savory fat-wash ideas?","Miso butter, brown butter, sesame oil."],["Main rule with umami in drinks?","A little goes a long way — it should still taste like a drink."],["Smoke rule?","Smoke the glass briefly; don't overpower the drink or the guest."],["What must every infusion have?","An exact written spec: weights, times, temperatures."]],"q":[["A sencha infusion turned bitter. The likely cause:","Water too hot or steeped too long","Too much sugar","Not enough ice","Wrong glass","Green tea is delicate."],["Tea adds which structural element to a cocktail?","Tannin","Carbonation","Fat","Salt","Tea tannins dry the finish."],["An Old Fashioned with a dried-mushroom rim is an example of:","A savory, kitchen-inspired cocktail","A tiki drink","A highball","A zero-proof drink","Umami from the pantry."],["Why write every infusion spec down?","So anyone can make it consistently","For tax reasons","To keep it secret","It isn't necessary","Consistency is the job."],["Kombu infused into vermouth adds:","Umami and salinity","Sweetness","Bubbles","Bitterness","Seaweed savoriness."],["Smoke should be used:","Briefly, on the glass","Heavily on every drink","Never","Only on beer","Aroma, not ashtray."]]},{"id":"f5","track":"Fine Dining","title":"Pairing Cocktails, Sake & Wine With Food","k":["Match intensity: delicate food (sashimi, oysters, crudo) needs a delicate drink; rich, fatty or grilled food can stand up to bolder drinks.","Acid and bubbles cut fat: Champagne, highballs, and bright sours work with fried and fatty dishes (tempura, wagyu, pork belly).","Bitterness loves richness: a bitter or stirred drink can balance a rich, savory course. But bitterness plus very spicy food tastes harsher.","Spice and alcohol: high alcohol makes chile heat burn more. With spicy dishes go lower in alcohol, a little sweeter, and fizzy (off-dry Riesling, a highball, a fruity sake).","Umami and salt: savory, salty foods (soy, miso, aged cheese, mushrooms) make tannic and oaky wines taste harsher, but they make sake, sherry and lighter drinks taste rounder. That's a big reason sake works so well with Japanese food.","Sweetness: a drink served with dessert should be at least as sweet as the dessert, or it will taste thin and sour.","Bridge flavors: repeat an ingredient from the dish in the drink (yuzu with a yuzu dessert, shiso with a shiso garnish on the plate). It ties them together.","The arc of a meal: light, bright and low-proof drinks at the start (aperitif); richer drinks in the middle; and digestifs (amaro, brandy, aged rum, whisky) or dessert wines at the end. Beverage pairings for a tasting menu follow the same arc, and many fine dining restaurants offer a non-alcoholic pairing too."],"c":[["Pairing rule for delicate food?","Delicate drink — match intensity."],["What cuts fat?","Acid and bubbles."],["Why avoid high ABV with spicy food?","Alcohol makes chile heat burn more."],["Best drink styles for spicy dishes?","Lower alcohol, a little sweet, fizzy."],["Why does sake work with Japanese food?","Umami and salt make tannic wines harsh but make sake taste rounder."],["Dessert drink rule?","At least as sweet as the dessert."],["What's a bridge flavor?","An ingredient shared by the dish and the drink."],["Arc of a meal?","Light aperitifs → richer middle → digestifs or dessert wine."]],"q":[["Tempura with which drink?","Champagne or a crisp highball","A heavy, sweet dessert wine","A tannic red","A neat cask-strength whisky","Acid and bubbles cut the fryer oil."],["A very spicy dish. Best choice:","Off-dry, lower-alcohol, sparkling","A cask-strength bourbon neat","A bitter Negroni","A big oaky Cabernet","Alcohol amplifies heat."],["A drink served with a sweet dessert should be:","At least as sweet as the dessert","Very dry","Very bitter","Very sour","Otherwise it tastes thin and sour."],["Miso-glazed fish with a tannic red wine will likely taste:","Harsh or metallic","Perfect","Sweeter","Flat but fine","Umami amplifies tannin. Sake is safer."],["Where in a tasting menu does a digestif go?","At the end","With the first course","With the oysters","Before the meal","Digestif = after dinner."],["Fatty, fried food pairs best with:","Acid and bubbles","Sweet, still wine","High-tannin red","Neat whisky","Cut the fat."],["A shiso garnish on a dish and shiso in the drink is a:","Bridge flavor","Clash","Contrast","Fault","Shared ingredient."]]},{"id":"f6","track":"Fine Dining","title":"Kitchen to Bar: Low-Waste Craft","k":["Restaurant bars work with the kitchen, not apart from it. Ask the chef what's in season, what trim is left over, and what flavors are on the menu this month. Shared ingredients mean drinks that match the food and lower costs.","Use the whole ingredient: juice the citrus, then turn the spent peels into oleo saccharum, cordials, dehydrated garnishes or 'super juice'. Herb stems become syrups or tinctures. Fruit trim becomes shrubs.","Kitchen byproducts worth knowing: aquafaba (chickpea liquid) for vegan foam, whey from cheese or yogurt making for milk-punch-style texture, coffee grounds for syrups, and vegetable juices for savory drinks.","Buy less, use more: a smaller inventory with each ingredient used in several ways means fresher prep and less waste. Every syrup you make should earn its place in more than one drink.","Seasonality: menus change with what's fresh. Expect to learn new specs every few weeks, and expect drinks to come off the menu when an ingredient goes out of season.","Prep in the kitchen's world: follow the kitchen's sanitation, labeling and storage rules, keep shared fridges organized, and respect the chefs' space. Bar staff who prep alongside the kitchen earn trust fast.","Track it: note how much of each prep you make and how much you throw out. Adjust your pars every week."],"c":[["First question to ask the chef?","What's in season, what trim is left, and what's on this month's menu."],["Uses for spent citrus peels?","Oleo saccharum, cordials, dehydrated garnishes, super juice."],["Aquafaba?","Chickpea liquid; vegan foam."],["Whey in cocktails?","A byproduct of cheese/yogurt that adds silky texture."],["'Buy less, use more' means?","A smaller inventory with each ingredient used in several ways."],["How to cut waste week to week?","Track made vs. thrown out; adjust pars."]],"q":[["After juicing 50 limes, the best use of the peels:","Make a cordial or oleo saccharum","Throw them out","Use them as ice","Store them for a month","Use the whole ingredient."],["A vegan guest wants a sour with foam. Use:","Aquafaba","Egg white","Cream","Gelatin","Chickpea liquid foams like egg white."],["Why build drinks from kitchen ingredients?","They match the food and lower costs","They're always cheaper to buy separately","Chefs require it by law","They need no prep","Synergy and less waste."],["When prepping in the kitchen, you follow:","The kitchen's sanitation, labeling and storage rules","Bar rules only","No rules if it's after service","Whatever is fastest","Shared space, shared standards."],["Spent citrus husks can become:","Oleo saccharum or a cordial","Ice","Bitters only","Nothing useful","Use the whole fruit."],["Why track how much prep you throw away?","To adjust pars and cut waste","To blame others","It's not useful","For taxes only","Data-driven pars."]]},{"id":"f7","track":"Fine Dining","title":"Wine, Champagne & Sake Service at the Bar","k":["At a fine dining bar you'll pour wine and sake as often as cocktails. The sommelier leads, but you need to serve both perfectly.","Bottle service: present the bottle to the host with the label facing them and say the producer, wine and vintage. Cut the foil below the lip, remove the cork quietly, wipe the lip, pour a small taste for the host, then serve the other guests first (ladies or guests of honor first where that's the house style) and the host last.","Opening Champagne: chill it well. Remove the foil, keep your thumb on the cork, loosen the cage (six half-turns), and keep the cage on. Hold the bottle at about 45°, turn the bottle (not the cork), and ease the cork out with a quiet sigh, never a pop. Pour slowly in two stages so it doesn't foam over.","Serving temperatures: sparkling 43–48°F; light whites and rosé 45–50°F; full whites 50–55°F; light reds 55–60°F; full reds 60–65°F. Most reds are served too warm and most whites too cold.","Wine by the glass: know every pour, its grape, region and two flavor words. Know the pour size (often 5–6 oz) and how the bar preserves open bottles (argon or a Coravin, which pours through the cork).","Decanting: to remove sediment from older reds, or to let young, tight reds open up. Pour slowly in front of a light so you can stop when sediment reaches the neck.","Sake service: premium aromatic sake (ginjo, daiginjo) chilled in a wine glass or small cup; richer junmai and yamahai can be served room temperature or warm. Pour for the guest, never let them pour for themselves, and refill before the cup is empty.","Sherry is a secret weapon for pairing and low-ABV drinks: fino and manzanilla (bone dry, salty, serve very cold, open bottles go off within days), amontillado and oloroso (nutty, richer), Pedro Ximénez (very sweet, for dessert)."],"c":[["Bottle presentation?","Label facing the host; say producer, wine, vintage."],["Who tastes first and who's served last?","The host tastes first and is served last."],["Champagne opening key points?","Thumb on cork, cage stays on, 45°, turn the bottle not the cork, quiet sigh."],["Sparkling serving temp?","About 43–48°F."],["Full red serving temp?","About 60–65°F."],["What does a Coravin do?","Pours wine through the cork without opening the bottle."],["Why decant?","Remove sediment from old reds or open up young reds."],["Sake etiquette at the bar?","Pour for the guest; refill before the cup is empty."],["Fino sherry after opening?","Keep cold; it fades within days."]],"q":[["Opening Champagne, you turn:","The bottle, not the cork","The cork, not the bottle","Both quickly","Neither; let it pop","Control and a quiet sigh."],["The host of a table is served:","Last, after tasting first","First and last","Never","Only if they ask","Host tastes, guests served, then host."],["Most restaurants serve reds:","Too warm","Too cold","Perfectly","Over ice","Aim for 55–65°F."],["A dry, salty sherry to serve very cold:","Fino or manzanilla","Pedro Ximénez","Oloroso","Cream sherry","Biological aging under flor."],["A guest wants a glass of a rare wine without opening the whole bottle. Tool:","Coravin","Corkscrew","Decanter","Champagne stopper","Pours through the cork."],["When presenting a bottle, the label faces:","The host","The bartender","The wall","Down","Show the host."],["Decanting an old red mainly removes:","Sediment","Alcohol","Tannin entirely","Color","And lets it breathe."]]},{"id":"f8","track":"Fine Dining","title":"Premium Spirits & Japanese Whisky","k":["High-end restaurants sell expensive pours: rare whisky, aged Cognac, top-shelf tequila and agave, old rum. Guests expect you to know them and present them well.","Japanese whisky: the big two are Suntory (Yamazaki, single malt; Hakushu, single malt, greener and lightly smoky; Hibiki, blended) and Nikka (Yoichi, coastal and peaty; Miyagikyo, softer and fruity; Nikka From the Barrel, blended). Mizunara (Japanese oak) gives sandalwood and incense notes.","Japanese whisky labeling: industry standards that took full effect in 2024 say 'Japanese whisky' must be fermented, distilled, aged at least 3 years and bottled in Japan, using some malted grain and Japanese water. Some bottles sold as Japanese-style or 'world blend' don't meet that, so read the label.","Taiwan's Kavalan makes award-winning single malts that age fast in the hot, humid climate, especially sherry-cask styles. It's often on Asian fine dining menus.","Serving premium pours: show the bottle, state the pour size and price clearly if asked, offer it neat, with a few drops of water, or on a single large clear cube. Use proper glassware (Glencairn or a small tulip glass for neat tasting). Offer a water back.","Pour sizes: standard pours are often 1½–2 oz, but very rare spirits are often sold by the ½ oz or 1 oz. Always confirm the size and price with a guest before pouring something very expensive. No surprises on the check.","Selling up gracefully: describe flavor and story ('aged in mizunara oak, it smells like sandalwood and incense'), offer a flight to compare, and never push. Recommend at two price points so the guest can choose comfortably.","Tasting language: nose (aroma), palate (flavor and texture in the mouth), finish (how long it lasts and what stays). Practice describing every bottle on your backbar in one sentence each."],"c":[["Suntory's three core names?","Yamazaki, Hakushu (single malts), Hibiki (blend)."],["Nikka's two distilleries?","Yoichi (coastal, peaty) and Miyagikyo (softer, fruity)."],["Mizunara oak notes?","Sandalwood and incense."],["Japanese whisky labeling standard?","Fermented, distilled, aged 3+ years and bottled in Japan."],["Kavalan?","Taiwanese single malt; ages fast in heat; known for sherry casks."],["How do you serve a premium neat pour?","Show the bottle, proper glass, offer water drops or a big clear cube, water back."],["Before pouring something very expensive?","Confirm size and price with the guest."],["Selling up gracefully?","Describe flavor and story, offer a flight, two price points, never push."],["Three parts of tasting?","Nose, palate, finish."]],"q":[["A blended Japanese whisky from Suntory:","Hibiki","Yamazaki","Yoichi","Kavalan","Hibiki = harmony."],["A guest orders 'the rarest whisky you have'. Before pouring:","Confirm pour size and price","Pour a double","Pour first, discuss later","Ask for ID only","No surprises on the check."],["Which wood gives sandalwood and incense notes?","Mizunara","American white oak","French Limousin oak","Cedar","Japanese oak."],["Under Japan's labeling standards, 'Japanese whisky' must be aged at least:","3 years in Japan","1 year anywhere","10 years","No minimum","3 years, distilled and bottled in Japan."],["Kavalan comes from:","Taiwan","Japan","Scotland","Korea","Hot climate, fast maturation."],["Yamazaki is distilled by:","Suntory","Nikka","Kavalan","Diageo","Suntory."],["Nikka's Hokkaido distillery, known for a bolder, peatier style:","Yoichi","Miyagikyo","Hakushu","Chita","Yoichi."]]},{"id":"mm1","track":"Masters of Mixology","title":"The Six Root Cocktails","k":["In Cocktail Codex (2018), the Death & Co team (Alex Day, Nick Fauchald, David Kaplan) argue that almost every cocktail is a variation on six 'root' drinks. Learn the six and you can explain, fix or invent nearly anything.","Old Fashioned: spirit + sugar + bitters. The original 'cocktail'. Family: Sazerac, Oaxaca Old Fashioned, Improved Whiskey Cocktail, Vieux Carré (a bridge to the Martini family).","Martini: spirit + aromatized wine (vermouth). Family: Manhattan, Rob Roy, Martinez, Negroni and Boulevardier (where a bitter liqueur joins the vermouth), Bamboo (low-ABV).","Daiquiri: spirit + citrus + sugar. The sour. Family: Gimlet, Whiskey Sour, Bee's Knees, Gold Rush, Pisco Sour, Southside, Penicillin.","Sidecar: spirit + citrus + a liqueur as the sweetener. The Daisy branch of the sour. Family: Margarita, Cosmopolitan, Corpse Reviver #2, Pegu Club, Last Word.","Whisky Highball: spirit + a carbonated, lengthening mixer. Family: Gin & Tonic, Tom Collins (a sour lengthened with soda), Paloma, Moscow Mule, Spritz, Americano.","Flip: spirit or fortified wine + sugar + a rich, emulsifying ingredient (whole egg, cream). Family: Eggnog, Brandy Alexander, Grasshopper, and egg-white sours as near cousins.","How to use it: when you meet an unknown drink, ask 'which root is this?' first. Its root tells you the method (stir, shake, build), the balance to aim for, and what to adjust if it tastes wrong."],"c":[["The six root cocktails (Cocktail Codex)?","Old Fashioned, Martini, Daiquiri, Sidecar, Whisky Highball, Flip."],["Old Fashioned root formula?","Spirit + sugar + bitters."],["Martini root formula?","Spirit + aromatized wine (vermouth)."],["Daiquiri root formula?","Spirit + citrus + sugar."],["Sidecar root formula?","Spirit + citrus + liqueur as the sweetener."],["Highball root formula?","Spirit + carbonated lengthener."],["Flip root formula?","Spirit or fortified wine + sugar + whole egg or cream."],["Which root is a Negroni?","Martini (spirit + aromatized wine, with a bitter liqueur)."],["Which root is a Margarita?","Sidecar."]],"q":[["Cocktail Codex was written by:","The Death & Co team","Dale DeGroff","Jerry Thomas","Dave Arnold","Day, Fauchald, Kaplan."],["A Cosmopolitan belongs to which root?","Sidecar","Daiquiri","Highball","Flip","Liqueur sweetens it."],["A Brandy Alexander belongs to which root?","Flip","Martini","Sidecar","Old Fashioned","Rich, creamy."],["A Tom Collins is best described as:","A sour lengthened with soda (Highball family)","A Flip","An Old Fashioned","A Martini","Daiquiri meets Highball."],["Which is NOT one of the six roots?","Mojito","Daiquiri","Flip","Sidecar","Mojito is a Daiquiri-family highball."]]},{"id":"mm2","track":"Masters of Mixology","title":"Cocktail History Every Pro Knows","k":["1806: the first known printed definition of a 'cock-tail' appeared in The Balance and Columbian Repository (Hudson, New York): spirits, sugar, water and bitters. That's the Old Fashioned root.","1862: Jerry Thomas published How to Mix Drinks (the Bar-Tender's Guide), the first major American cocktail book. Thomas was the era's celebrity bartender.","Late 1800s golden age: vermouth arrives in American bars, giving us the Manhattan and the Martinez, ancestors of the Martini.","Prohibition in the US (1920–1933) pushed many bartenders to Europe and Cuba. Harry Craddock's The Savoy Cocktail Book (London, 1930) and Harry's New York Bar in Paris (Harry MacElhone) kept the craft alive. Havana bars made the Daiquiri famous.","Tiki (1930s onward): Don the Beachcomber in Hollywood and Trader Vic in Oakland built exotic rum drinks with layered rums, spices and syrups.","The 'dark ages' (roughly the 1970s and 80s): bottled sour mix, artificial flavors and sweet vodka drinks dominated.","The revival: Dale DeGroff at the Rainbow Room in New York (from 1987) brought back fresh juice and the classics. Dick Bradsell shaped London's scene (Bramble, Espresso Martini). Sasha Petraske opened Milk & Honey (1999). Then Pegu Club (2005), Death & Co (2006) and PDT (2007). David Wondrich's Imbibe! (2007) became the history bible.","Today: Tales of the Cocktail (New Orleans, every summer) and the World's 50 Best Bars list (since 2009) are the industry's big stages."],"c":[["First printed definition of a cocktail?","1806, The Balance and Columbian Repository: spirits, sugar, water, bitters."],["First major American cocktail book?","Jerry Thomas, How to Mix Drinks / Bar-Tender's Guide, 1862."],["US Prohibition years?","1920–1933."],["The Savoy Cocktail Book?","Harry Craddock, London, 1930."],["Tiki pioneers?","Don the Beachcomber and Trader Vic, 1930s on."],["Who led the fresh-juice revival in New York?","Dale DeGroff, Rainbow Room, from 1987."],["Milk & Honey?","Sasha Petraske, New York, 1999."],["The cocktail history bible?","Imbibe!, David Wondrich (2007)."]],"q":[["The original 1806 definition of a cocktail included:","Spirits, sugar, water, bitters","Vodka and juice","Gin and vermouth","Rum, lime and mint","Old Fashioned root."],["Jerry Thomas's book was published in:","1862","1906","1933","1987","Bar-Tender's Guide."],["Who brought fresh juice back to New York bars at the Rainbow Room?","Dale DeGroff","Jerry Thomas","Harry Craddock","Trader Vic","King Cocktail."],["Prohibition in the US ended in:","1933","1920","1945","1919","Repeal, December 1933."],["Imbibe! was written by:","David Wondrich","Jim Meehan","Dave Arnold","Audrey Saunders","Drink historian."]]},{"id":"mm3","track":"Masters of Mixology","title":"Lessons from the Masters","k":["Dale DeGroff ('King Cocktail'): fresh ingredients, the classics done right, and hospitality as theater. His book The Craft of the Cocktail (2002) trained a generation. Lesson: respect the guest and the recipe.","Sasha Petraske (Milk & Honey): precision, a serious ice program, quiet rooms, house rules and consistency. He trained many bartenders who became leaders (including Sam Ross, creator of the Penicillin and Paper Plane). His book is Regarding Cocktails (2016). Lesson: do simple things perfectly.","Audrey Saunders (Pegu Club): obsessive balance and tasting every component, and a training ground for top bartenders. Created the Old Cuban and Gin-Gin Mule. Lesson: taste everything, every time.","Jim Meehan (PDT): hospitality systems and how bars are designed and run. Wrote The PDT Cocktail Book (2011) and Meehan's Bartender Manual (2017). Lesson: great bars are built on systems, not just talent.","Jeffrey Morgenthaler (Portland): practical technique. His The Bar Book (2014) is a standard manual; he helped popularize barrel-aged cocktails and is known for a much-improved Amaretto Sour. Lesson: understand why a technique works.","Dave Arnold (Liquid Intelligence, 2014): science applied to drinks: dilution, clarification, carbonation, temperature. Lesson: measure things.","Ryan Chetiyawardana (Mr Lyan): ingredient innovation and sustainability. His White Lyan (London, 2013) famously used no ice and no fresh citrus. Lesson: question every 'rule'.","The common thread: every one of them tastes constantly, writes specs down, treats ice and dilution seriously, values hospitality as much as drinks, and mentors the next generation."],"c":[["Dale DeGroff's book?","The Craft of the Cocktail (2002)."],["Sasha Petraske's lesson?","Do simple things perfectly: precision, ice, consistency."],["Who created the Old Cuban?","Audrey Saunders (Pegu Club)."],["Jim Meehan's books?","The PDT Cocktail Book (2011), Meehan's Bartender Manual (2017)."],["Jeffrey Morgenthaler's book?","The Bar Book (2014)."],["Dave Arnold's book?","Liquid Intelligence (2014)."],["White Lyan?","Ryan Chetiyawardana's London bar (2013): no ice, no fresh citrus."],["Common thread of the masters?","Taste constantly, write specs, take ice seriously, value hospitality, mentor."]],"q":[["'King Cocktail' is:","Dale DeGroff","Sasha Petraske","Jim Meehan","Jerry Thomas","Rainbow Room."],["Sam Ross came up under:","Sasha Petraske at Milk & Honey","Trader Vic","Jerry Thomas","Harry Craddock","Milk & Honey alumni."],["The bartender known for science and measurement:","Dave Arnold","Dale DeGroff","Audrey Saunders","Dick Bradsell","Liquid Intelligence."],["Meehan's main lesson:","Great bars run on systems","Never measure","Only use rare spirits","Avoid hospitality","PDT."],["What do the masters have in common?","They taste constantly and write specs down","They free-pour everything","They avoid mentoring","They never use ice","Discipline."]]},{"id":"mm4","track":"Masters of Mixology","title":"Building Signature Drinks Like a Pro","k":["Start from a root: pick the root that fits the moment (refreshing = Daiquiri or Highball; contemplative = Old Fashioned or Martini; rich = Flip).","Change the core, then rebalance: swapping the base spirit changes strength and sweetness. A split base (two spirits) adds depth without losing the structure.","Season, don't smother: bitters, a few drops of saline, a rinse or an expressed peel adjust a drink the way salt and pepper adjust food.","Pair flavors that already work in food: tequila + grapefruit, gin + cucumber, rum + banana, whiskey + stone fruit, apple + cinnamon, chocolate + orange, mezcal + pineapple. Bridge flavors to the menu you're pairing with.","Keep it to about four or five components. Every ingredient must earn its place; if you can't taste it, remove it.","Test like a pro: write version numbers, change one thing at a time, taste on different days, get blind feedback from your team, and test it at service speed.","Name and story: a good name is easy to say and hints at the flavor or the place. One sentence of story helps servers sell it.","Document the final spec: glass, ice, method, garnish, amounts in pour order, batch notes, cost, allergens."],"c":[["First step for a signature drink?","Pick the root that fits the moment."],["What does a split base do?","Adds depth without losing structure."],["How to season a drink?","Bitters, saline, rinses, expressed peel."],["Name three proven flavor pairings.","Tequila + grapefruit, gin + cucumber, rum + banana (also whiskey + stone fruit, apple + cinnamon)."],["How many components, ideally?","About four or five; each must earn its place."],["How to test a new drink?","Version numbers, one change at a time, different days, blind team tastes, service-speed test."],["What makes a good drink name?","Easy to say, hints at flavor or place."]],"q":[["You can't taste one of six ingredients in a new drink. You should:","Remove it","Double it","Add a seventh","Keep it for the menu description","Every ingredient must earn its place."],["A refreshing summer signature should start from:","Daiquiri or Highball root","Flip root","Old Fashioned root","No root","Match the moment."],["Changing two things at once while testing:","Makes it hard to know what helped","Is faster and better","Is required","Doesn't matter","One change at a time."],["A proven pairing to build from:","Tequila and grapefruit","Gin and cola","Vodka and milk only","Rum and vinegar","Paloma logic."]]},{"id":"mm5","track":"Masters of Mixology","title":"Modern Formats: Barrel-Aged, Bottled, Draft & Batched","k":["Barrel-aged cocktails: an all-spirit drink (Manhattan, Negroni, Boulevardier) rests in a small oak barrel for weeks. Oak adds vanilla and spice; slow oxidation softens the edges. Small barrels work fast, so taste weekly.","Batched and pre-diluted: for speed, build stirred drinks in advance with measured water, keep them cold, and pour to order. A 'freezer Martini' is pre-diluted and stored in the freezer.","Bottled and draft cocktails: carbonated highballs and spritzes can be bottled or kegged for consistency and speed. Fresh citrus fades fast, so draft programs use acid-adjusted or clarified juices and test shelf life.","Events and large parties (BEOs at a restaurant like Mott 32): batch the spirit-and-syrup base, add citrus fresh on the day, and set a clear spec per glass so every guest gets the same drink.","Quality control: label every batch with name, date, maker and dilution; taste every batch before service; record what you'd change.","When not to batch: drinks that rely on fresh aeration or egg (sours, flips) lose texture if fully pre-made. Batch the base, finish to order."],"c":[["What does barrel-aging add?","Oak flavor (vanilla, spice) and gentle oxidation that softens."],["How often to taste a small-barrel cocktail?","Weekly; small barrels work fast."],["Freezer Martini?","Pre-diluted Martini stored in the freezer."],["Why do draft programs avoid plain fresh citrus?","It fades fast; they use acid-adjusted or clarified juice."],["How to batch for a large party?","Batch spirit + syrup base, add citrus fresh, fixed spec per glass."],["What goes on a batch label?","Name, date, maker, dilution."],["What shouldn't be fully pre-made?","Drinks needing fresh aeration or egg (sours, flips)."]],"q":[["Which drink is best suited to barrel aging?","Negroni","Mojito","Whiskey Sour","Ramos Gin Fizz","All-spirit drinks age well."],["Draft cocktail programs usually handle citrus by:","Using acid-adjusted or clarified juice","Using plain juice for weeks","Leaving it out of all drinks","Adding it to the keg months ahead","Stability."],["For a 300-guest BEO, the smart approach is:","Batch the base, add citrus fresh, fixed spec","Make each drink from scratch","Batch everything a week ahead","Free-pour","Speed + consistency."],["Every batch should be:","Labeled and tasted before service","Hidden from the manager","Made without measuring","Served without tasting","Quality control."]]},{"id":"a1","track":"Advanced","title":"Dilution & ABV Math","k":["ABV of a finished drink = total pure alcohol ÷ total final volume. Pure alcohol in each ingredient = its volume × its ABV. Final volume = all ingredients + the water the ice added.","Worked Daiquiri: 2 oz rum at 40% = 0.80 oz alcohol. Add ¾ oz lime and ¾ oz simple (no alcohol) = 3.5 oz before ice. A hard shake adds water equal to roughly 50–60% of that (about 1.9 oz), so the final drink is about 5.4 oz. 0.80 ÷ 5.4 ≈ 15% ABV.","Worked Manhattan: 2 oz rye at 45% = 0.90 oz alcohol; 1 oz sweet vermouth at about 16.5% = 0.165 oz. Total 1.065 oz alcohol in 3 oz. Stirring adds roughly 1–1.3 oz of water, giving about 4–4.3 oz and about 25% ABV, right in the stirred range.","Measure your own dilution the way Dave Arnold teaches: weigh the drink's ingredients, stir or shake as you normally would, weigh the strained drink again. The difference is the water you added. Your ice, your tins and your hands change the number, so use your own.","Batching stirred drinks: build the batch from the spec, then add the water your measured dilution says one drink gains, times the number of drinks. Store it in the fridge or freezer and pour straight into a chilled glass. Taste it cold; drinks taste less sweet and less boozy at freezer temperature.","Balance has numbers behind it: Dave Arnold's analysis of classic sours found they cluster in a narrow band of sugar and acid in the finished drink. You don't need to calculate every drink, but it explains why ¾ oz lime with ¾ oz simple works so reliably, and why a sour with weaker citrus (orange, grapefruit) needs adjusting.","Proof vs ABV: in the US, proof = 2 × ABV. A 100-proof bourbon is 50% ABV. A navy-strength rum (57%+) adds far more alcohol per ounce than a standard 40% rum, so you can use less of it in a split base."],"c":[["ABV formula for a cocktail?","Total pure alcohol ÷ total final volume (ingredients + dilution water)."],["Pure alcohol in 2 oz of 40% rum?","0.8 oz."],["About how much water does a hard shake add?","Roughly 50–60% of the starting volume."],["Daiquiri finished ABV, roughly?","About 15%."],["Manhattan finished ABV, roughly?","About 25%."],["How do you measure your real dilution?","Weigh before and after shaking or stirring; the difference is water."],["Batching water for stirred drinks?","Your measured per-drink dilution × number of drinks."],["What did Arnold find about classic sours?","They cluster in a narrow band of sugar and acid — balance is measurable."],["100 proof = ?","50% ABV."]],"q":[["A drink has 1 oz pure alcohol in a 5 oz finished volume. ABV:","20%","5%","50%","10%","1 ÷ 5 = 0.20."],["How do you find your real dilution?","Weigh the drink before and after mixing","Guess from the glass","Count the ice cubes","Use the bottle's proof","Weight difference = water added."],["Navy-strength rum vs standard rum in a split base:","Use less; it adds more alcohol per ounce","Use more","It's identical","Never use it","57%+ vs 40%."],["Why do batched drinks taste different straight from the freezer?","Cold mutes sweetness and alcohol","Freezing removes alcohol","The water separates","They don't","Taste at service temperature."]]},{"id":"a2","track":"Advanced","title":"Carbonation & the Perfect Highball","k":["CO2 dissolves much better in cold liquid. Everything in a highball (glass, spirit, mixer, ice) should be as cold as possible so the drink stays fizzy.","Bubbles escape at nucleation points: scratches, dust, tiny ice cracks, warm spots and rough pouring. Clean, chilled glassware, solid clear ice and a gentle pour down the side or a bar spoon keep carbonation in.","Stir a highball once, gently, by lifting from the bottom. Every extra stir knocks out CO2.","Carbonated water tastes slightly acidic (carbonic acid) and makes drinks taste drier. That's why carbonated cocktails usually need a little less citrus than their still versions.","Force-carbonating cocktails (a CO2 tank, or a bottle with a carbonation cap): use clear, cold liquid. Particles and pulp cause foaming and flat drinks, which is why bars clarify juices before carbonating. Follow your equipment's pressure guidance and chill as close to freezing as you can.","Bottled and kegged cocktails: highballs and spritzes can be pre-batched and carbonated for speed, a big advantage on high-volume nights. The spirit-to-mixer ratio must be fixed and tested.","The Japanese highball is the gold standard: very cold whisky, very cold, highly carbonated soda, a frozen glass full of clear ice, and as little stirring as possible."],"c":[["Why keep everything cold for a highball?","CO2 stays dissolved better in cold liquid."],["What makes bubbles escape?","Nucleation points: scratches, dust, ice cracks, warm spots, rough pours."],["How many times do you stir a highball?","Once, gently, lifting from the bottom."],["Why do carbonated drinks need less citrus?","Carbonic acid adds acidity and dryness."],["Why clarify before carbonating?","Particles cause foaming and flat drinks."],["Gold-standard highball elements?","Frozen glass, clear ice, very cold whisky and soda, minimal stirring."]],"q":[["Your highballs go flat fast. Most likely cause:","Warm glass or mixer and too much stirring","Too much ice","Too cold","Clear ice","Warmth and agitation release CO2."],["Before force-carbonating a lime cocktail, you should:","Clarify the juice","Add pulp for texture","Warm it up","Add egg white","Particles cause foaming."],["Carbonated versions of sours usually need:","Slightly less citrus","More citrus","More sugar only","No changes","Carbonic acid adds acidity."],["The best way to add soda to a highball:","Gently down a bar spoon or the side","From high up for foam","Shaken in a tin","Before the ice","Protect the bubbles."]]},{"id":"a3","track":"Advanced","title":"Clarification & Texture","k":["Milk washing (clarified milk punch): acid in the punch curdles the milk's casein proteins. The curds trap solids and tannins; you strain the liquid back through the curds (often through a coffee filter) until it runs clear. Recipes commonly use about 1 part milk to 3–4 parts punch. Pour the punch into the milk, not the other way around, for cleaner curds.","What milk washing changes: it removes harsh tannin and color, adds a soft, silky texture, and makes the drink shelf-stable. It also strips some bitterness, so very tannic or bitter drinks come out rounder.","Agar clarification (from Dave Arnold): dissolve a small amount of agar (around 2 g per liter, about 0.2%) into hot juice or water, mix it into the rest, let it set into a loose gel, break it up, and strain through cloth. The gel traps the particles.","Centrifuges spin solids out of juice in minutes. Enzymes like Pectinex break down pectin first so fruit juices clarify more easily.","Texture tools: egg white and aquafaba (foam), cream (richness), gum arabic syrup or 'gomme' (silky mouthfeel), saline (rounds edges), fat-washing (body), and dilution (lighter).","Why clear drinks matter at fine dining bars: visual surprise (a clear 'tomato' or clear Piña Colada), stable batches, and drinks you can carbonate."],"c":[["What curdles in milk washing?","Casein proteins, from the acid in the punch."],["Milk-to-punch ratio (common)?","About 1 part milk to 3–4 parts punch."],["Pour order for milk washing?","Punch into milk."],["What does milk washing remove and add?","Removes tannin, color and harshness; adds silky texture and shelf stability."],["Agar amount (Arnold)?","Around 2 g per liter (about 0.2%)."],["What does Pectinex do?","Breaks down pectin so juices clarify more easily."],["What is gomme?","Gum arabic syrup; adds silky texture."]],"q":[["In milk washing, what does the filtering?","The curds","The milk fat","Ice","Sugar","Strain back through the curds."],["Agar clarification works by:","Trapping particles in a loose gel","Boiling off solids","Adding charcoal","Freezing the alcohol","Gel, break, strain."],["A tannic tea punch tastes harsh. Milk washing will likely make it:","Rounder and silkier","More bitter","Cloudier","Fizzier","Casein binds tannins."],["Gum arabic syrup is used for:","Silky texture","Sourness","Bitterness","Carbonation","Gomme = mouthfeel."]]},{"id":"a5","track":"Advanced","title":"Reading Wine Labels: The Mott 32 List","k":["Champagne sweetness: Brut Nature has 0–3 g/L of sugar (no dosage added), Extra Brut 0–6 g/L, Brut under 12 g/L. NV (non-vintage) means a blend of years in a consistent house style. The Patrick Piuze Crémant de Bourgogne Brut Nature Rosé is bone dry.","Crémant: traditional-method sparkling wine from French regions outside Champagne (Burgundy, Loire, Alsace and others). Same method, often better value.","Burgundy hierarchy: regional (Bourgogne) → village → Premier Cru → Grand Cru. The Frédéric Magnien 'Bourgogne' Pinot Noir is regional-level: the entry point to a great producer.","Saint-Émilion: 'Saint-Émilion Grand Cru' is an appellation with stricter rules than plain Saint-Émilion. It is not the same as being a 'Grand Cru Classé', which is a separate, ranked classification. Les Cadrans de Lassègue is labeled Saint-Émilion Grand Cru.","German labels: QbA (Qualitätswein) is quality wine from a defined region (the Carl Graff Mosel). Above it, Prädikatswein levels are based on grape ripeness at harvest: Kabinett, Spätlese, Auslese, Beerenauslese, Trockenbeerenauslese, plus Eiswein.","Piedmont: Barolo DOCG requires at least 38 months of aging, 18 in wood. Langhe Nebbiolo DOC (the Vajra) is the younger, fresher, more affordable way to taste the grape.","Port styles on the list: Tawny (aged in wood, nutty, caramel), Colheita (a single-vintage tawny aged at least 7 years in wood, like the Dow's 1992 and 1982), 20 Year Tawny (a blend averaging that age, like the Fonseca), and LBV (Late Bottled Vintage, bottled 4–6 years after harvest, like the Niepoort 2019).","Sauternes: sweet Bordeaux white made from grapes affected by noble rot (Botrytis cinerea), which concentrates sugar and adds honey and apricot flavors. Madeira: heated and oxidized fortified wine; Malmsey is the sweetest style and nearly indestructible once open."],"c":[["Brut Nature sugar level?","0–3 g/L, no dosage."],["What is Crémant?","Traditional-method French sparkling wine from outside Champagne."],["Burgundy hierarchy?","Regional → village → Premier Cru → Grand Cru."],["Saint-Émilion Grand Cru vs Grand Cru Classé?","The first is an appellation; the second is a ranked classification."],["QbA?","German quality wine from a defined region."],["Prädikat levels in order?","Kabinett, Spätlese, Auslese, Beerenauslese, Trockenbeerenauslese (+ Eiswein)."],["Barolo minimum aging?","38 months, 18 in wood."],["Colheita?","Single-vintage tawny Port, at least 7 years in wood."],["LBV?","Late Bottled Vintage: bottled 4–6 years after harvest."],["Noble rot?","Botrytis cinerea; concentrates sugar for Sauternes."]],"q":[["Which is driest?","Brut Nature","Brut","Extra Dry","Demi-Sec","0–3 g/L."],["A 'Bourgogne' label means:","Regional-level Burgundy","Grand Cru","Premier Cru","Bordeaux","Entry level of the hierarchy."],["Saint-Émilion Grand Cru on a label means:","It meets that appellation's stricter rules, not necessarily a classified estate","It's a First Growth","It's from the Médoc","It's a sweet wine","Appellation vs classification."],["Dow's 1992 Colheita is:","A single-vintage tawny Port","A vintage Champagne","A Madeira","An LBV","Colheita = harvest."],["The highest Prädikat ripeness level listed:","Trockenbeerenauslese","Kabinett","Spätlese","QbA","TBA."]]},{"id":"a6","track":"Advanced","title":"Sensory Skills & Structured Tasting","k":["Taste in a fixed order every time: appearance, nose, palate, finish, conclusion. A system keeps you from jumping to the first word that comes to mind.","Nose: first note intensity (light, medium, pronounced), then aromas in groups: fruit, floral, spice, herbal, wood, earth, savory. Swirl gently, sniff short and often.","Palate: sweetness, acidity, tannin (wine), alcohol heat, body, flavor intensity, then flavors. Finish: how long it lasts and what stays.","Build an aroma memory with real things: smell your spice rack, fresh and dried fruit, flowers, tea, coffee, leather and wood. Name them out loud. Most 'tasting notes' are just remembered smells.","Train side by side: taste two or three things together (two bourbons, three Pinot Noirs) so the differences jump out. Try blind tastings and triangle tests (two the same, one different: pick the odd one).","Calibrate with others: compare notes with your team and the sommelier, and borrow their words. A shared vocabulary makes the whole floor sell better.","Protect your palate: drink water, spit when tasting many things, take breaks, and avoid strong fragrance, mint gum or smoking before tasting.","Turn notes into guest language: one sentence with a hook ('ripe cherry and rose petals, finishes dry and elegant'). That's the line you'll use on the floor."],"c":[["Structured tasting order?","Appearance, nose, palate, finish, conclusion."],["Aroma groups?","Fruit, floral, spice, herbal, wood, earth, savory."],["What do you judge on the palate?","Sweetness, acidity, tannin, alcohol, body, intensity, flavors."],["How to build aroma memory?","Smell and name real things: spices, fruit, flowers, tea, wood."],["What's a triangle test?","Two samples the same, one different; pick the odd one."],["How to protect your palate?","Water, spit, breaks; no fragrance, mint or smoke before tasting."],["How do notes become sales?","One sentence with a flavor hook in guest language."]],"q":[["Best way to notice differences between two bourbons:","Taste them side by side","Taste one per week","Read the labels","Mix them","Comparison sharpens perception."],["Before a tasting you should avoid:","Mint gum and strong fragrance","Water","Plain crackers","Breaks","They overpower your senses."],["A triangle test is:","Pick the odd one of three samples","Taste three times","Three-spirit cocktail","A food pairing","Calibration drill."],["Turning tasting notes into guest language means:","One clear sentence with a flavor hook","Reading every note aloud","Technical terms only","Saying 'it's good'","Short and vivid."]]},{"id":"a7","track":"Advanced","title":"R&D Capstone: Build a Menu","k":["This is your capstone: design a 6-drink menu for a fine dining restaurant bar, the way a beverage director would. Bring it to interviews.","Step 1, concept: who's the guest, what's the food, what's the price point? Write one sentence that ties the menu to the restaurant (for example, Japanese ingredients, seasonal, low-waste).","Step 2, map the menu: cover different spirits and styles. A strong 6-drink menu might be: one highball, one sour, one spirit-forward stirred, one low-ABV, one zero-proof, one showpiece. Check prep load and speed for a busy night.","Step 3, build from templates: start each drink from a classic template and change one thing at a time. Keep an R&D log for every version: spec, date, notes, what you'll change.","Step 4, taste and test: drink each one at least three times on different days. Have others taste it blind. Check it next to the food it's meant for.","Step 5, cost it: cost every ingredient, including prep (syrups, infusions) and garnish, and calculate pour cost against the price.","Step 6, write it up: a spec card for each drink (name, glass, ice, method, garnish, exact amounts in pour order, batch notes, cost), a one-line guest description, a food pairing, and an allergen list.","Step 7, present it: practice explaining each drink in one sentence and why it's on the menu. A finished, costed menu in a folder is one of the strongest things you can bring to a fine dining interview."],"c":[["What's the capstone?","A costed 6-drink menu for a fine dining restaurant bar."],["A balanced 6-drink map?","Highball, sour, stirred, low-ABV, zero-proof, showpiece."],["What goes in an R&D log?","Every version: spec, date, notes, next change."],["How many times to taste before finalizing?","At least three, on different days, plus blind tastes from others."],["What's on each spec card?","Name, glass, ice, method, garnish, amounts in pour order, batch notes, cost."],["What else goes with each drink?","A one-line guest description, a food pairing, an allergen list."]],"q":[["A 6-drink menu with five bourbon drinks is:","Unbalanced","Ideal","Required","Cheaper to train","Spread spirits and styles."],["Before finalizing a drink you should:","Taste it on different days and have others taste blind","Taste it once","Only cost it","Name it first","Consistency check."],["Allergens belong:","On every spec card","Only on the dessert menu","Nowhere","Only in the manager's head","Fine dining standard."],["What makes the capstone useful in interviews?","It proves you can think like a beverage director","It's long","It has photos only","It lists every bottle","Show, don't tell."]]},{"id":"wp1","track":"Wine Exam Prep","title":"The Vineyard: Climate, Site & Growing","k":["A vine needs sunlight, heat, water, nutrients and CO2. Ripening grapes gain sugar and color and lose acid; tannins and flavors ripen too.","Climate shapes style. Cool climates give high acid, lighter body, lower alcohol, and green or citrus fruit (whites) or red fruit (reds). Hot climates give riper fruit (tropical; black fruit), fuller body, more alcohol and lower acid.","Things that cool a site: higher latitude, altitude, cold ocean currents and fog (California's coastal fog, the Humboldt Current in Chile, the Benguela Current in South Africa). Things that warm a site: slopes facing the sun, stony soils that hold heat, nearby water that extends the season.","Climate is the long-term pattern; weather is a single year. Vintage variation matters most in cool, marginal regions (Burgundy, Germany, Champagne).","Hazards: spring frost, hail, rain at flowering or harvest, drought, fungal disease and rot, and the pest phylloxera (which is why most vines are grafted onto American rootstocks).","The growing year: winter dormancy → budburst → flowering → fruit set → véraison (grapes change color) → ripening → harvest. Harvest is around September–October in the Northern Hemisphere and March–April in the Southern.","Grower choices: yields (lower yields often mean more concentration), irrigation (where allowed), canopy management, timing of harvest, and hand vs machine picking (hand picking allows selection; machines are fast and cheap)."],"c":[["Cool vs hot climate wine?","Cool: high acid, lighter, lower alcohol, green/red fruit. Hot: riper, fuller, more alcohol, lower acid, tropical/black fruit."],["Name three cooling influences.","Altitude, latitude, cold ocean currents and fog."],["Chile's cooling current?","The Humboldt Current."],["South Africa's cooling current?","The Benguela Current."],["What is véraison?","When grapes change color and start ripening."],["Why are most vines grafted?","Onto American rootstocks to resist phylloxera."],["Northern vs Southern Hemisphere harvest?","Sept–Oct vs March–April."],["Hand vs machine harvest?","Hand: selection, gentler. Machine: fast, cheaper."]],"q":[["A wine with high acid, light body and citrus fruit most likely comes from:","A cool climate","A hot climate","A dessert vineyard","Any climate equally","Cool = acid retained."],["Fog from the Pacific cools vineyards in:","California","Burgundy","Mosel","Rioja","Coastal fog."],["Phylloxera is:","A vine pest that attacks roots","A grape variety","A wine fault","A winemaking method","Grafting is the defense."],["Véraison is when grapes:","Change color and begin ripening","Are harvested","Flower","Go dormant","Color change."],["Vintage variation matters most in:","Cool, marginal regions","Hot, consistent regions","Fortified wines only","Never","Weather swings matter more."],["Lower yields usually lead to:","More concentrated grapes","More diluted grapes","Sweeter wine always","Sparkling wine","Concentration."]]},{"id":"wp2","track":"Wine Exam Prep","title":"Winemaking & Bottle Ageing","k":["White wines: crush and press quickly, settle the juice, ferment cool (about 12–22°C) to keep fruity aromas. Stainless steel keeps wines fresh and fruity; oak barrels add flavor or texture.","Options for whites: malolactic conversion (bacteria turn sharp malic acid into softer lactic acid and can add buttery notes), lees contact and stirring (creamy texture, bread notes), and oak (new oak adds vanilla, toast, smoke; old oak mostly adds gentle oxygen).","Red wines: ferment the juice with the skins, warmer (about 20–32°C) to extract color and tannin. Manage the cap of skins by punching down or pumping over. Press, then mature in tank or oak.","Carbonic maceration (Beaujolais): whole bunches ferment in a CO2-filled tank, giving light tannin and soft, fruity flavors like banana, bubblegum and kirsch.","Rosé: usually short skin contact (a few hours) before pressing. Blending red and white wine is rare in quality rosé, with Champagne rosé the main exception.","Making sweet wine: stop fermentation early (chilling and filtering, or adding spirit as in Port), add sweet reserve (unfermented juice), or concentrate the grape's sugar before fermenting (noble rot, late harvest, freezing for icewine, or drying the grapes).","Aromas come in three layers: primary (from the grape and fermentation: fruit, floral, herbal), secondary (from winemaking: oak's vanilla and smoke, malolactic butter, lees bread), tertiary (from ageing: dried fruit, leather, earth, mushroom, nuts, honey).","Most wine is made to drink young. Wines that age well need concentration plus structure (acid, tannin, sometimes sugar). With age, whites deepen toward gold and amber; reds fade toward garnet and tawny."],"c":[["Typical white fermentation temperature?","Cool, about 12–22°C."],["Typical red fermentation temperature?","Warmer, about 20–32°C."],["Malolactic conversion?","Malic acid → softer lactic acid; can add buttery notes."],["Lees contact adds?","Creamy texture and bread/biscuit notes."],["New vs old oak?","New: vanilla, toast, smoke. Old: mainly gentle oxygen."],["Carbonic maceration flavors?","Banana, bubblegum, kirsch; low tannin."],["Four ways to make sweet wine?","Stop fermentation, add sweet reserve, concentrate sugar (noble rot, late harvest, freezing, drying)."],["Primary, secondary, tertiary aromas?","Grape/fermentation; winemaking; ageing."],["How do reds change color with age?","Toward garnet and tawny."]],"q":[["Buttery notes in Chardonnay usually come from:","Malolactic conversion","Cold fermentation","Carbonic maceration","Noble rot","MLF creates diacetyl."],["Carbonic maceration is linked to:","Beaujolais","Barolo","Sauternes","Champagne","Whole-bunch, fruity, low tannin."],["Vanilla and toast are which type of aroma?","Secondary (from oak)","Primary","Tertiary","A fault","Winemaking-derived."],["Leather, mushroom and dried fruit are:","Tertiary arom
