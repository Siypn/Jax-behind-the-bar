s of the hop plant. Alpha acids give bitterness when boiled; the oils give aroma (citrus, pine, floral, herbal, tropical). They also help preserve beer.","Late-boil or dry hops = more aroma, less bitterness. Early-boil hops = more bitterness.","Yeast: ale yeast (Saccharomyces cerevisiae) ferments warmer and makes fruity esters. Lager yeast (Saccharomyces pastorianus) ferments cold and tastes cleaner.","Water is about 90%+ of beer. Its minerals shape style: soft Pilsen water suits delicate Pilsner; sulfate-rich Burton-on-Trent water sharpens hoppy pale ales."],"c":[["Four core beer ingredients?","Malt, hops, yeast, water."],["What is malting?","Steeping, germinating, then kiln-drying grain to develop starch-converting enzymes and flavor."],["Flavors of roasted malt?","Coffee, chocolate, roast — think stouts and porters."],["Flavors of caramel/crystal malt?","Caramel, toffee, raisin; adds color and sweetness."],["What do hop alpha acids do?","Give bitterness when boiled."],["What do hop oils give?","Aroma: citrus, pine, floral, herbal, tropical fruit."],["Ale vs lager yeast?","Ale: S. cerevisiae, warmer, fruity esters. Lager: S. pastorianus, colder, cleaner."],["Why are corn and rice used in American lagers?","They lighten body and flavor (adjuncts)."],["What is the Reinheitsgebot?","German beer purity law of 1516: originally barley, hops, water only."]],"q":[["Coffee and chocolate flavors in a stout come mainly from:","Roasted malt","Hops","Lager yeast","Corn adjuncts","Darkly roasted malts give roast character."],["Bitterness in beer comes mainly from:","Hop alpha acids","Malt sugar","Water minerals","Wheat proteins","Boiled hops release bitterness."],["Which yeast ferments colder and cleaner?","Lager yeast (S. pastorianus)","Ale yeast (S. cerevisiae)","Brettanomyces","Wild koji","Lagers ferment cold."],["Adding hops late in the boil or dry hopping mainly increases:","Aroma","Bitterness","Alcohol","Color","Late hops = aroma."],["Which grain adds haze and a silky body?","Oats or wheat","Rice","Corn","Barley only","Proteins and beta-glucans."],["Hop oils mainly contribute:","Aroma","Bitterness","Alcohol","Color","Alpha acids give bitterness; oils give aroma."]]},{"id":"b2","track":"Beer","title":"The Brewing Process","k":["Milling: malt is crushed to expose the starch.","Mashing: crushed malt soaks in hot water; enzymes turn starch into fermentable sugar. The sweet liquid is called wort.","Lautering: wort is separated from the spent grain.","Boil: about 60–90 minutes; hops are added, the wort is sterilized, and flavors are set.","Cooling, then fermentation: yeast turns sugar into alcohol and CO2. Ales ferment at roughly 60–72°F, lagers at roughly 45–55°F.","Conditioning: beer matures. Lagering means cold storage for weeks, which makes the beer smoother and cleaner.","Packaging: keg, can or bottle. Carbonation is forced (CO2 added) or natural (bottle-conditioned with a little sugar and yeast).","Key numbers: ABV = strength; IBU = bitterness units; SRM = color (low = pale straw, high = black)."],"c":[["What is wort?","The sweet sugary liquid made by mashing malt, before fermentation."],["What happens in the mash?","Enzymes convert malt starch into fermentable sugars in hot water."],["What is lautering?","Separating the wort from spent grain."],["Why boil wort?","Extract hop bitterness, sterilize, set flavors."],["What does lagering mean?","Cold storage/conditioning for weeks for a clean, smooth beer."],["What is bottle conditioning?","Natural carbonation in the bottle from added sugar and live yeast."],["IBU measures?","Bitterness (International Bitterness Units)."],["SRM measures?","Beer color."]],"q":[["The sweet liquid before fermentation is called:","Wort","Mash tun","Lees","Moromi","Wort becomes beer after fermentation."],["Starch becomes sugar during:","Mashing","Boiling","Lagering","Packaging","Enzymes work in the mash."],["A beer at 100 IBU is likely:","Very bitter","Very dark","Very strong","Unhopped","IBU = bitterness."],["Cold conditioning a lager for weeks is called:","Lagering","Lautering","Dry hopping","Sparging","Lager = German for 'store'."],["Separating sweet wort from spent grain is:","Lautering","Mashing","Lagering","Pitching","Lauter tun."],["SRM describes a beer's:","Color","Bitterness","Strength","Carbonation","SRM = color."]]},{"id":"b3","track":"Beer","title":"Keeping Beer Fresh","k":["Beer's three enemies: heat, light, and time (oxygen).","Keep beer cold. Warm storage speeds up staling and oxidation. Draft beer should be kept cold at all times, about 34–38°F.","Light: UV and blue light react with hop compounds and make 'lightstruck' (skunky) beer. Brown bottles protect best, green and clear bottles barely protect, and cans block light completely.","Oxidation: over time beer tastes like wet cardboard or paper, and hop aroma fades. Hoppy beers like IPAs are best fresh.","Most draft beer isn't pasteurized and is best within about 45–60 days. Pasteurized kegs last longer, roughly 90–120 days.","Rotate stock: first in, first out. Check the date codes.","Some strong, dark or sour beers (barleywine, imperial stout, lambic) can be cellared, but most beer is meant to be drunk fresh."],"c":[["Three enemies of beer?","Heat, light, time/oxygen."],["What causes skunky beer?","Light (UV/blue) reacting with hop compounds — lightstruck."],["Best packaging against light?","Cans, then brown bottles. Green/clear give little protection."],["Taste of oxidized beer?","Wet cardboard, papery; faded hops."],["Unpasteurized draft freshness window?","About 45–60 days, kept cold."],["Ideal draft beer storage temperature?","About 34–38°F, always cold."],["Stock rotation rule?","First in, first out (FIFO); check date codes."],["Which beers can age well?","Some strong, dark or sour beers: barleywine, imperial stout, lambic."]],"q":[["A beer in a clear bottle sat in a sunny window. Likely fault:","Lightstruck (skunky)","Diacetyl","DMS","Acetaldehyde","Light + hops = skunk."],["Which IPA would you pour first?","The freshest-dated is best; rotate oldest stock first (FIFO)","Oldest — IPAs improve","Warmest","Any, hops don't fade","Rotate stock, and hoppy beer is best fresh."],["Wet cardboard flavor means:","Oxidation","Infection","Lightstruck","Too cold","Classic stale beer."],["Best container to block light:","Can","Green bottle","Clear bottle","Pint glass","Cans block all light."],["The best package for protecting beer from light:","A can","A green bottle","A clear bottle","A growler left in the sun","Cans block light completely."],["An unpasteurized draft keg is generally best within about:","45–60 days, kept cold","1 year","1 week","6 months","Brewers Association guidance."]]},{"id":"b4","track":"Beer","title":"Draft, Glassware & Pouring","k":["Basic draft system: keg → coupler → beer line → faucet, pushed by CO2 (or a CO2/nitrogen blend for long runs and nitro beers).","Clean draft lines at least every 2 weeks (the Brewers Association standard). Dirty lines make beer taste sour, buttery or off.","A 'beer clean' glass has no oil, residue or detergent left on it. Test it three ways: water sheets evenly (sheeting test), salt sticks evenly to the wet glass (salt test), and foam leaves rings as you drink (lacing).","Signs of a dirty glass: bubbles stuck to the sides, and foam that falls apart quickly.","Rinse the glass in cold water just before you pour.","How to pour: hold the glass at 45°, open the faucet fully and quickly, never let the faucet touch the beer, then straighten the glass to build about 1–1.5 inches of head.","The head carries aroma and releases CO2, so don't pour flat.","Glassware: shaker pint, nonic, Pilsner glass, Weizen glass (wheat beer), tulip (Belgian ales, IPA), snifter (strong beer), chalice/goblet (Belgian), stange (Kölsch), mug/stein."],"c":[["How often clean draft lines?","At least every 2 weeks."],["Three beer-clean glass tests?","Sheeting, salt test, lacing."],["Sign of a dirty glass?","Bubbles clinging to the sides; foam that collapses fast."],["Why rinse a glass before pouring?","Cools, removes dust/sanitizer, helps a clean pour."],["Proper pour technique?","45° angle, open faucet fully, faucet never touches beer, straighten to build 1–1.5 inch head."],["Why have a head on beer?","Releases aroma and CO2; better texture and presentation."],["What gas pushes nitro stouts?","Nitrogen/CO2 blend (nitro)."],["Glass for Kölsch?","Stange (tall, narrow cylinder)."],["Glass for Hefeweizen?","Weizen glass — tall vase shape."]],"q":[["Bubbles clinging to the inside of a poured glass suggest:","The glass isn't beer clean","Perfect carbonation","Nitro beer","A cold keg","Residue gives bubbles a place to form."],["When pouring, the faucet should:","Never touch the beer or glass","Be dipped in the beer","Be half open","Be opened slowly","Contact spreads bacteria."],["Draft lines should be cleaned at least:","Every 2 weeks","Every 6 months","Once a year","Only when beer tastes off","BA standard is every 2 weeks."],["A Belgian Tripel is best served in a:","Tulip or chalice","Shaker pint","Stange","Copper mug","Shaped glasses hold Belgian aromas."],["Salt sticks evenly to a wet glass in the salt test. That means:","The glass is beer-clean","The glass is dirty","The beer is flat","The beer is skunked","Residue causes patchy salt."],["Why open the faucet fully and quickly?","Partial opening causes turbulence and excess foam","To save beer","It's faster to clean","It cools the beer","Half-open faucets foam."]]},{"id":"b5","track":"Beer","title":"Tasting & Off-Flavors","k":["How to taste: Appearance (color, clarity, head) → Aroma (malt, hops, yeast) → Flavor → Mouthfeel (body, carbonation) → Finish.","Diacetyl: butter or butterscotch flavor. Caused by poor fermentation or dirty draft lines.","DMS: cooked corn or canned vegetables. Usually from a short or covered boil, or pale malt.","Acetaldehyde: green apple. The beer is too young or fermentation was rushed.","Lightstruck: skunk. Caused by light reacting with hops.","Oxidation: wet cardboard or paper, and sometimes sherry notes. The beer is old or got air.","Acetic or lactic sourness where it doesn't belong: infection, often from dirty lines.","Some 'faults' are part of the style. Banana esters and clove phenols are normal in Hefeweizen, and sourness is normal in Gose or lambic."],"c":[["Butter/butterscotch in beer?","Diacetyl — fermentation issue or dirty draft lines."],["Cooked corn / creamed corn?","DMS (dimethyl sulfide)."],["Green apple?","Acetaldehyde — beer too young/rushed."],["Skunk?","Lightstruck."],["Wet cardboard?","Oxidation — stale beer."],["Unwanted vinegar/sour in a lager?","Infection, often dirty draft lines."],["Banana in Hefeweizen — fault?","No. Banana esters (and clove) are expected in the style."],["Tasting order?","Appearance → aroma → flavor → mouthfeel → finish."]],"q":[["A guest says their draft pilsner tastes like movie-theater butter. Likely:","Diacetyl, check line cleaning","DMS","Lightstruck","Normal for pilsner","Diacetyl is often a dirty-line problem."],["Cooked corn aroma:","DMS","Acetaldehyde","Oxidation","Hop oil","DMS = corn."],["Clove and banana in a German wheat beer is:","Correct for the style","A serious infection","Lightstruck","Oxidation","Hefeweizen yeast character."],["Green apple flavor:","Acetaldehyde","Diacetyl","Skunk","Roast","Young beer marker."],["Wet cardboard plus faded hops in an old pale ale means:","Oxidation","DMS","Diacetyl","Acetaldehyde","Stale beer."],["Butterscotch in a draft lager is most often fixed by:","Cleaning the draft lines","Pouring colder","Adding more CO2","Using a different glass","Diacetyl from dirty lines."]]},{"id":"b6","track":"Beer","title":"Lager Styles","k":["German Pilsner: pale, crisp, dry, with spicy/floral noble hops and firm bitterness.","Czech (Bohemian) Pilsner: the original Pilsner (Pilsen, 1842). Richer malt, soft bitterness from Saaz hops.","Munich Helles: pale and malty-bready with gentle hops. Softer than Pilsner.","Märzen / Oktoberfest: amber, toasty malt, clean, medium body.","Dunkel: a dark Munich lager. Bread crust and light chocolate, not roasty. Schwarzbier is a black lager that's light-bodied with gentle roast.","Bock: strong, malty, amber to brown. Doppelbock is stronger and richer, often with names ending in '-ator'. Maibock is pale and a little hoppier.","American lager: very pale, light-bodied, often brewed with corn or rice, very cold and crisp. Light lager is lower in calories.","Vienna lager: amber, toasty, and a bit drier (many Mexican amber lagers trace back to it)."],"c":[["Original Pilsner comes from?","Pilsen, Czech Republic (1842)."],["Czech vs German Pilsner?","Czech: richer malt, soft Saaz bitterness. German: drier, crisper, firmer bitterness."],["Munich Helles?","Pale, bready-malty, gentle hops — softer than Pilsner."],["Märzen/Oktoberfest?","Amber, toasty malt, clean lager."],["Doppelbock?","Strong, rich, malty lager; names often end in '-ator'."],["Schwarzbier?","Black lager — light body, gentle roast."],["American lager adjuncts?","Corn or rice."],["Vienna lager?","Amber, toasty, drier lager; ancestor of many Mexican ambers."]],"q":[["Guest wants a malty, toasty amber German lager in fall:","Märzen/Oktoberfest","Hefeweizen","Kölsch","Gose","Classic Oktoberfest beer."],["A black beer that is light-bodied and lagered:","Schwarzbier","Imperial Stout","Porter","Doppelbock","Black lager."],["Saaz hops and a soft, rich malt base:","Czech Pilsner","American lager","IPA","Saison","Bohemian classic."],["A strong lager named something like 'Celebrator':","Doppelbock","Helles","Pilsner","Light lager","'-ator' tradition."],["The original Pilsner was first brewed in:","Pilsen, 1842","Munich, 1516","Dortmund, 1900","Vienna, 1950","Czech Pilsner."],["A dark Munich lager with bread-crust malt, not roasty:","Dunkel","Schwarzbier","Stout","Porter","Dunkel = dark."]]},{"id":"b7","track":"Beer","title":"Ale Styles: British & American","k":["Ales are fermented warmer and are often fruitier than lagers.","English Bitter / ESB: amber, balanced, with earthy English hops and caramel malt. Often low ABV and served on cask.","Pale Ale: American pale ale is citrusy and piney from American hops (Cascade). English pale ale is more earthy and malty.","IPA: hoppy and bitter. West Coast IPA is dry, clear and bitter. Hazy/New England IPA is juicy, soft and low in bitterness. Double/Imperial IPA is stronger.","Brown Ale: nutty and caramel. Porter: chocolate and roast, but softer than stout.","Stout: Dry Irish stout (Guinness) is roasty, dry and often served on nitro. Milk stout has lactose for sweetness. Oatmeal stout is silky. Imperial stout is strong and intense.","Barleywine: very strong, malty and warming. Can age well.","Hybrids: Kölsch (Cologne) and California Common/steam beer use ale or lager yeast in a non-standard way. Cream ale is another example."],"c":[["West Coast vs Hazy IPA?","West Coast: clear, dry, bitter, pine/citrus. Hazy: juicy, soft, low bitterness, opaque."],["Double/Imperial IPA?","Stronger, more intense IPA (often 8%+)."],["American Pale Ale signature hop?","Cascade — citrus/grapefruit."],["Porter vs Stout?","Both dark; porter generally softer chocolate, stout more roasty."],["Dry Irish Stout?","Roasty, dry, light-to-medium body, often nitro (Guinness)."],["Milk stout?","Stout sweetened with lactose."],["Kölsch?","Pale, delicate hybrid from Cologne; ale yeast, lager-like cold conditioning; served in a stange."],["Barleywine?","Very strong, malty ale; can age."]],"q":[["Guest loves juicy, tropical, low-bitterness beers:","Hazy/New England IPA","West Coast IPA","Dry Irish Stout","ESB","Hazy = juicy and soft."],["A stout sweetened with lactose:","Milk stout","Dry stout","Imperial IPA","Kölsch","Lactose = milk sugar."],["Pale, delicate beer from Cologne served in a stange:","Kölsch","Helles","Pilsner","Witbier","Kölsch is a hybrid."],["Guinness is classically a:","Dry Irish Stout on nitro","Porter","Milk stout","Imperial stout","Dry and roasty."],["A clear, dry, bitter IPA with pine and citrus:","West Coast IPA","Hazy IPA","Milk stout","English bitter","West Coast style."],["The hop that defined American Pale Ale's grapefruit character:","Cascade","Saaz","Fuggle","Hallertau","Cascade."]]},{"id":"b8","track":"Beer","title":"Belgian, Wheat & Sour Beers","k":["German Hefeweizen: hazy, at least 50% wheat, with banana and clove from the yeast. Served in a Weizen glass.","Belgian Witbier: wheat beer spiced with coriander and orange peel. Hazy and refreshing.","Belgian ales get spicy, fruity notes and high carbonation from their yeast. Trappist beers are brewed by or under Trappist monks (e.g., Chimay, Westmalle, Rochefort, Orval).","Dubbel: brown, dark fruit (raisin, plum). Tripel: golden, strong, dry, spicy. Quad / Belgian Dark Strong: very rich and strong.","Saison: farmhouse ale. Dry, peppery, fruity, highly carbonated.","Berliner Weisse: low ABV, tart wheat beer. Gose: tart, with salt and coriander.","Lambic: Belgian beer fermented by wild yeast and bacteria (spontaneous fermentation). Gueuze is a blend of young and old lambic. Kriek is lambic with cherries.","Flanders Red / Oud Bruin: sour, aged in oak, with cherry and vinegar-like tang."],"c":[["Hefeweizen signature flavors?","Banana and clove (from yeast)."],["Witbier spices?","Coriander and orange peel."],["Dubbel vs Tripel?","Dubbel: brown, dark fruit. Tripel: golden, strong, dry, spicy."],["What is a Trappist beer?","Brewed by/under Trappist monks (Chimay, Westmalle, Orval…)."],["Saison?","Dry, peppery, fruity farmhouse ale, high carbonation."],["Gose?","Tart wheat beer with salt and coriander."],["Lambic?","Spontaneously fermented Belgian wild beer."],["Gueuze?","Blend of young and old lambic."],["Kriek?","Lambic with cherries."]],"q":[["Coriander and orange peel, hazy, Belgian:","Witbier","Hefeweizen","Saison","Tripel","Witbier is spiced."],["Spontaneous fermentation with wild microbes:","Lambic","Helles","Kölsch","Milk stout","Lambic is wild."],["Tart, slightly salty with coriander:","Gose","Berliner Weisse","Dubbel","ESB","Salt = Gose."],["Golden, strong, dry and spicy Belgian:","Tripel","Dubbel","Quad","Witbier","Tripel."],["A blend of young and old lambic:","Gueuze","Kriek","Dubbel","Witbier","Gueuze."],["A Trappist beer must be brewed:","By or under the supervision of Trappist monks","In Trappes, France","With wild yeast","Only as a Tripel","Monastery-made."]]},{"id":"b9","track":"Beer","title":"Beer & Food Pairing","k":["Three C's: Cut, Complement, Contrast.","Cut: carbonation and bitterness scrub fat. An IPA with fried chicken or a Pilsner with fries.","Complement: match similar flavors. Roasty stout with chocolate cake or grilled meat; caramel malt with roast pork.","Contrast: opposites that balance. Salty oysters with dry stout; rich cheese with tart Gueuze.","Match intensity: a delicate beer goes with delicate food, and a big beer goes with big food.","Hop bitterness and alcohol make chili heat feel hotter. For spicy food, choose a malty, lower-bitterness beer, or a crisp, low-ABV lager.","Classic matches: Witbier + mussels; Hefeweizen + brunch; Porter + barbecue; Imperial stout + dessert; Saison + cheese."],"c":[["Three C's of beer pairing?","Cut, Complement, Contrast."],["How does beer 'cut' fat?","Carbonation and bitterness scrub the palate."],["Hops with spicy food?","Bitterness amplifies chili heat — choose malty or low-bitterness beer."],["Classic stout + seafood pairing?","Dry stout with oysters."],["Witbier pairing?","Mussels, salads, light seafood."],["Imperial stout pairing?","Chocolate desserts — complement."],["Golden pairing rule?","Match intensity."]],"q":[["Spicy wings, guest wants beer that won't make it hotter:","Malty, low-bitterness beer (e.g., Märzen)","Double IPA","Imperial IPA","Barleywine","Bitterness and alcohol intensify heat."],["IPA with fried food is mainly an example of:","Cut","Complement","Contrast","Intensity","Bitterness/carbonation cut fat."],["Chocolate cake + imperial stout is:","Complement","Cut","Contrast","A clash","Roast meets chocolate."],["A delicate Kölsch with a heavy braised short rib breaks which rule?","Match intensity","Cut","FIFO","Lacing","Big food overpowers delicate beer."],["Dry stout with oysters is a classic example of:","Contrast","Cut","Complement","Clash","Roast and salt-brine balance."],["A big barleywine with a delicate salad breaks which rule?","Match intensity","FIFO","Cut","Lacing","Big beer overwhelms delicate food."]]},{"id":"k1","track":"Sake","title":"What Is Sake?","k":["Sake (nihonshu) is a Japanese brewed drink made from rice, water, koji and yeast. It isn't distilled and it isn't rice wine (it's brewed more like beer).","ABV is usually around 15–16%. Undiluted genshu runs about 17–20%.","Sake rice (sakamai) has large grains with a starchy core called shinpaku. Famous varieties: Yamada Nishiki ('king of sake rice'), Omachi, Gohyakumangoku and Miyama Nishiki.","Water: hard water (Nada region) gives firm, dry sake. Soft water (Fushimi) gives softer sake.","Koji is the mold Aspergillus oryzae grown on steamed rice. It makes the enzymes that turn rice starch into sugar.","Polishing (seimai): the outer layers of the grain hold fats and proteins that cause rough flavors. The polishing ratio (seimaibuai) is how much of the grain remains. 60% means 40% was polished away.","Brewery = kura (sakagura). Master brewer = tōji."],"c":[["Four sake ingredients?","Rice, water, koji, yeast."],["Is sake rice wine?","No — it's brewed (starch converted like beer), not fermented from fruit."],["Typical sake ABV?","About 15–16% (genshu 17–20%)."],["What is koji?","Aspergillus oryzae mold grown on steamed rice; makes starch-converting enzymes."],["'King of sake rice'?","Yamada Nishiki."],["What is seimaibuai?","Polishing ratio — % of the rice grain remaining. 50% = half polished away."],["Why polish rice?","Remove outer fats/proteins that give rougher flavors; cleaner, more aromatic sake."],["What is a tōji?","Master sake brewer."],["What is a kura?","A sake brewery."]],"q":[["A seimaibuai of 40% means:","40% of the grain remains","40% was polished away","40% ABV","40% koji","The number is what remains."],["Koji's main job is to:","Convert rice starch to sugar","Add carbonation","Add alcohol","Color the sake","Enzymes from koji."],["Sake is technically closest in production to:","Beer (brewed from starch)","Wine","Vodka","Cider","Starch → sugar → alcohol."],["Most famous premium sake rice:","Yamada Nishiki","Koshihikari","Basmati","Arborio","King of sake rice."],["Sake's typical ABV after dilution:","About 15–16%","About 5%","About 40%","About 25%","Diluted from about 18–20%."],["The master brewer of a sake brewery:","Tōji","Kura","Shubo","Kasu","Tōji."]]},{"id":"k2","track":"Sake","title":"How Sake Is Brewed","k":["Polish rice → wash and soak → steam → make koji → make the yeast starter → mash → press → filter → pasteurize → age → bottle.","Shubo / moto (yeast starter): a small batch that grows a large, healthy yeast population.","Multiple parallel fermentation: koji turns starch into sugar while yeast turns sugar into alcohol, both in the same tank. That's how sake reaches about 20% ABV naturally before it's diluted.","Sandan shikomi: rice, koji and water are added to the main mash (moromi) in three steps over four days.","Kimoto and yamahai are traditional slow starters that use natural lactic bacteria. They give richer, gamier, more acidic sake. Sokujō (quick method) uses added lactic acid and is cleaner and more modern.","Pressing separates the sake from the lees (sake kasu).","Pasteurization (hi-ire) is usually done twice. Unpasteurized sake is called namazake."],"c":[["What is multiple parallel fermentation?","Koji converting starch to sugar while yeast converts sugar to alcohol, simultaneously in one tank."],["What is the shubo/moto?","Yeast starter."],["What is moromi?","The main fermenting mash."],["What is sandan shikomi?","Three-step addition of rice, koji, water to the mash over four days."],["Kimoto/yamahai style?","Traditional natural-lactic starters; richer, gamey, higher acidity."],["Sokujō?","Modern quick starter with added lactic acid; cleaner."],["Sake kasu?","Lees left after pressing; used in cooking."],["Hi-ire?","Pasteurization, usually done twice."]],"q":[["Why can sake reach ~20% ABV naturally?","Multiple parallel fermentation","Distillation","Added sugar","Freezing","Saccharification and fermentation happen together."],["A sake labeled yamahai will likely be:","Richer, gamier, more acidic","Very light and sweet","Sparkling","Always unpasteurized","Natural lactic starter."],["The main fermenting mash is the:","Moromi","Shubo","Kasu","Tokkuri","Moromi = main mash."],["Namazake means the sake is:","Unpasteurized","Aged","Cloudy","Undiluted","Nama = raw."],["Sake kasu is:","The lees left after pressing","The yeast starter","Rice polish dust","Cedar barrels","Used in cooking."],["Adding rice, koji and water to the mash in three stages over four days:","Sandan shikomi","Multiple parallel fermentation","Hi-ire","Seimai","Three-step addition."]]},{"id":"k3","track":"Sake","title":"Sake Grades","k":["Premium sake (tokutei meishōshu) is classified by two things: polishing ratio, and whether distilled alcohol was added.","Junmai means pure rice: no added alcohol. It has no legal minimum polishing ratio, though many are 70% or lower. Usually fuller, richer, with more umami and acidity.","Honjozo: no more than 70% of the grain remains, plus a small amount of added brewer's alcohol. Lighter and drier, often good warm.","Ginjo / Junmai Ginjo: no more than 60% remains. Fruity and floral (apple, melon, pear, banana), made with cold, slow fermentation.","Daiginjo / Junmai Daiginjo: no more than 50% remains. The most refined and aromatic grade.","Tokubetsu ('special'): used on Junmai or Honjozo made with extra polishing (60% or lower) or a special method.","Futsūshu: table sake, which is most sake made. No premium requirements.","A small amount of added alcohol isn't 'cheating'. It brings out aroma and lightens the body."],"c":[["What does junmai mean?","Pure rice — no added distilled alcohol."],["Honjozo polishing requirement?","≤70% remaining, with a small amount of added alcohol."],["Ginjo polishing?","≤60% remaining."],["Daiginjo polishing?","≤50% remaining."],["Ginjo aroma profile?","Fruity, floral: apple, melon, pear, banana."],["Tokubetsu?","'Special' — extra polishing (≤60%) or special method."],["Futsūshu?","Table sake; no premium classification."],["Why add a little alcohol in honjozo/ginjo?","Lifts aroma and lightens body — not a shortcut."]],"q":[["A sake labeled Junmai Daiginjo has:","No added alcohol and ≤50% grain remaining","Added alcohol and ≤70% remaining","No polishing rules","Been distilled","Junmai + Daiginjo."],["The most refined, aromatic grade:","Daiginjo","Honjozo","Futsūshu","Junmai","Highest polish."],["Ginjo requires the rice be polished to:","≤60% remaining","≤70% remaining","≤50% remaining","≤90% remaining","Ginjo = 60%."],["Added brewer's alcohol in a Ginjo is:","A permitted style choice that lifts aroma","Illegal","A sign of fake sake","Only for cooking sake","Non-junmai premium grades allow it."],["A sake labeled Honjōzō has:","≤70% remaining and a little added alcohol","No added alcohol","≤50% remaining","No polishing rules","Honjōzō."],["Tokubetsu ('special') junmai means:","Extra polishing (≤60%) or a special method","Sparkling","Aged","Unpasteurized","Special."]]},{"id":"k4","track":"Sake","title":"Sake Styles & Labels","k":["Nigori: cloudy and coarsely filtered, with rice sediment. Usually sweeter and creamier. Gently mix it before pouring.","Namazake: unpasteurized, fresh and lively. Must be kept refrigerated.","Genshu: undiluted, about 17–20% ABV, bold.","Koshu / jukusei: aged sake. Amber color, with nutty, caramel, soy notes.","Taruzake: aged in cedar casks, with a woody, cedar aroma.","Sparkling sake (happō-sei): bubbly and often lower in alcohol. (Don't confuse it with happōshu, a Japanese low-malt beer.)","Nihonshu-do / SMV (Sake Meter Value): positive (+) usually means drier, negative (−) usually means sweeter. Higher acidity makes sake taste drier.","Useful label words: amakuchi = sweet, karakuchi = dry, kimoto/yamahai = traditional starter."],"c":[["Nigori?","Cloudy, coarsely filtered sake with rice sediment; usually sweeter, creamy."],["Namazake storage?","Always refrigerated — unpasteurized."],["Genshu?","Undiluted sake, about 17–20% ABV."],["Koshu?","Aged sake: amber, nutty, caramel, soy."],["Taruzake?","Cedar-cask aged sake."],["SMV +5 vs −5?","+5 tends drier; −5 tends sweeter."],["Karakuchi vs amakuchi?","Karakuchi = dry; amakuchi = sweet."],["How to serve nigori?","Gently invert/swirl to mix sediment; serve chilled."]],"q":[["A guest wants sweet, creamy, cloudy sake:","Nigori","Genshu","Taruzake","Karakuchi Honjozo","Nigori is cloudy and often sweeter."],["Positive SMV generally indicates:","Drier sake","Sweeter sake","Higher ABV","Sparkling sake","+ = dry tendency."],["Sake aged in cedar casks:","Taruzake","Koshu","Nama","Nigori","Taru = cask."],["Which must always be refrigerated?","Namazake","Futsūshu","Honjozo","Koshu","Unpasteurized."],["Karakuchi on a label means:","Dry","Sweet","Cloudy","Aged","Karakuchi = dry."],["Koshu (jukusei) sake shows:","Amber color with nutty, caramel, soy notes","Bright clear fruit","Bubbles","Cedar only","Aged."]]},{"id":"k5","track":"Sake","title":"Serving & Pairing Sake","k":["Temperature matters a lot. Chilled (reishu, about 41–50°F) suits aromatic ginjo and daiginjo, namazake and sparkling sake.","Room temperature (hiya) or warm (kan): junmai, honjozo, kimoto/yamahai and aged sake often open up when warmed. Atsukan (hot) is about 122°F/50°C. Don't heat premium aromatic sake.","Vessels: the tokkuri is the serving flask; the ochoko or guinomi is the cup. The masu (wooden box) is traditional, but its cedar can mask delicate aromas. A wine glass shows off ginjo aromas well.","Etiquette: pour for others, not yourself. Hold the tokkuri with two hands when pouring for someone senior.","Storage: keep it cold and dark, and drink most sake within about a year of bottling. Once opened, refrigerate and finish within about a week or two.","Pairing: sake's umami and low acidity work with sushi, sashimi, tempura, miso, soy, cheese, even fried chicken. Ginjo goes with delicate dishes; junmai and yamahai go with richer, savory food.","Sake has no tannin, so it's a great match for seafood that would make red wine taste metallic."],"c":[["Best temp for daiginjo?","Chilled (reishu)."],["Sake styles good warmed?","Junmai, honjozo, kimoto/yamahai, aged."],["Atsukan?","Hot sake, about 50°C / 122°F."],["Tokkuri?","Ceramic serving flask."],["Ochoko?","Small sake cup."],["Masu drawback?","Cedar wood can mask delicate aromas."],["Sake etiquette?","Pour for others, not yourself."],["How long after opening?","Refrigerate; best within about 1–2 weeks."],["Why sake with seafood?","No tannin and gentle acidity, with umami that complements fish."]],"q":[["A guest orders an expensive Junmai Daiginjo 'hot':","Suggest chilled; heat hides its delicate aromas","Microwave it","Serve at 150°F","Add ice and soda","Premium aromatic sake shines chilled."],["Sake serving flask:","Tokkuri","Ochoko","Masu","Kura","Tokkuri pours."],["A rich yamahai junmai with grilled pork belly is a:","Good match: richer sake with savory food","Bad match","Only for dessert","Must be sparkling","Match weight."],["Opened sake should be:","Refrigerated and finished within 1–2 weeks","Kept on the backbar for months","Frozen","Aged for years","It oxidizes."],["The traditional square cedar box cup:","Masu","Ochoko","Tokkuri","Guinomi","Masu."],["Why can sake beat red wine with seafood?","No tannin, so no metallic clash","It's sweeter","It's stronger","It's always warm","Tannin + fish oils = metallic."]]},{"id":"c1","track":"Cocktails","title":"Cocktail Fundamentals","k":["Shake drinks that have citrus, juice, dairy or egg. Shaking chills, dilutes, aerates and gives texture. Shake hard for about 10–15 seconds.","Stir drinks that are all spirits (Martini, Manhattan, Negroni). Stirring chills and dilutes while keeping the drink silky and clear. About 20–30 seconds.","Build drinks with carbonation in the glass (highballs). Never shake soda.","Dry shake: shake egg white without ice first to build foam, then shake again with ice. A reverse dry shake (ice first, then without) works too.","Dilution is an ingredient. Water from ice is a large part of every finished drink: Dave Arnold (Liquid Intelligence) measured hard-shaken drinks gaining water equal to about 50–60% of their starting volume. Large, dense ice melts slower.","Balance: strong (spirit) + sweet (syrup, liqueur) + sour (citrus) + bitter/aromatic (bitters, vermouth).","Basic syrups: simple syrup 1:1 sugar:water; rich simple 2:1; honey syrup; agave syrup; grenadine (pomegranate); orgeat (almond). Use fresh citrus only.","Tools: jigger, Boston shaker (tin on tin) or cobbler shaker, Hawthorne strainer, julep strainer, fine-mesh strainer (double strain), bar spoon, muddler. Glassware: coupe, Nick & Nora, martini, rocks (old fashioned), double rocks, highball, Collins, copper mug, flute."],"c":[["When to shake?","When the drink has citrus, juice, dairy or egg."],["When to stir?","All-spirit drinks — Martini, Manhattan, Negroni, Old Fashioned."],["Never shake what?","Carbonated ingredients — build or top them."],["What is a dry shake?","Shaking egg white without ice first to build foam, then with ice."],["Simple syrup ratio?","1:1 sugar:water (rich = 2:1)."],["What is orgeat?","Almond syrup (Mai Tai)."],["Why double strain?","Fine strainer removes ice chips and pulp for a smooth texture."],["Why is dilution important?","Water from ice balances strength and opens flavor; ~20–30%."],["Hawthorne vs julep strainer?","Hawthorne (coil) for shaken drinks from a tin; julep for stirred drinks from a mixing glass."]],"q":[["A Manhattan should be:","Stirred","Shaken","Blended","Built over soda","All-spirit drinks are stirred."],["A Whiskey Sour with egg white starts with a:","Dry shake","Stir","Blend","Roll","Build the foam first."],["A Gin & Tonic should be:","Built in the glass","Shaken hard","Dry shaken","Stirred then strained","Never shake carbonation."],["Rich simple syrup is:","2:1 sugar to water","1:1","1:2","Honey and water","Rich = 2:1."],["Why is a Martini stirred instead of shaken?","To chill and dilute while staying silky and clear","Because shaking adds sugar","Stirring adds more water","It's faster","All-spirit drinks are stirred."],["Which strainer fits a mixing glass for stirred drinks?","Julep strainer","Fine strainer only","Hawthorne only","Tea strainer","Julep for mixing glasses (Hawthorne works too)."]]},{"id":"c2","track":"Cocktails","title":"Old Fashioned Family","k":["Template: spirit + sugar + bitters (+ water/ice). This is the original definition of a 'cocktail' from the early 1800s.","Old Fashioned: 2 oz bourbon or rye, 1 sugar cube or ¼ oz simple syrup, 2–3 dashes Angostura bitters. Stir with ice, serve in a rocks glass over a large cube, garnish with an expressed orange peel.","Sazerac (New Orleans): 2 oz rye (often said to have been made with Cognac originally, though drink historians debate it), 1 sugar cube or ¼ oz simple, 3–4 dashes Peychaud's bitters. Rinse the glass with absinthe, stir, serve up with no ice in a chilled rocks glass. Express a lemon peel and discard it (or garnish).","Oaxaca Old Fashioned: reposado tequila + mezcal, agave syrup, Angostura, flamed orange peel.","Rum Old Fashioned and other variations swap the base spirit and sweetener: aged rum, demerara syrup, maple, honey.","Expressing a peel means squeezing the citrus oils over the drink's surface for aroma.","Wisconsin-style 'Brandy Old Fashioned' is muddled with fruit and topped with soda. Know that regional versions exist."],"c":[["Old Fashioned template?","Spirit + sugar + bitters."],["Old Fashioned spec?","2 oz bourbon/rye, ¼ oz simple (or sugar cube), 2–3 dashes Angostura, stirred, rocks, orange peel."],["Sazerac spec?","2 oz rye, ¼ oz simple/sugar cube, 3–4 dashes Peychaud's, absinthe rinse, stirred, served up in rocks glass, lemon peel."],["Sazerac's city?","New Orleans."],["Sazerac's bitters?","Peychaud's."],["Oaxaca Old Fashioned?","Reposado tequila + mezcal, agave, Angostura, flamed orange peel."],["What does expressing a peel do?","Sprays citrus oils over the drink for aroma."]],"q":[["Which drink uses an absinthe rinse?","Sazerac","Manhattan","Old Fashioned","Negroni","Sazerac signature."],["Classic Old Fashioned bitters:","Angostura","Peychaud's","Orange only","None","Angostura is standard."],["Sazerac is served:","Up, no ice, in a rocks glass","Over crushed ice","In a highball with soda","Blended","Chilled glass, no ice."],["Old Fashioned family template:","Spirit + sugar + bitters","Spirit + citrus + sugar","Spirit + vermouth","Spirit + soda","Original cocktail definition."],["A Sazerac rinse uses:","Absinthe","Campari","Vermouth","Chartreuse","Absinthe rinse."],["The 1806 definition of a cocktail is the root of which family?","Old Fashioned","Sour","Highball","Flip","Spirit, sugar, water, bitters."]]},{"id":"c3","track":"Cocktails","title":"Martini & Manhattan Family","k":["Template: spirit + aromatized wine (vermouth) ± bitters or liqueur. Always stirred.","Martini: 2½ oz gin, ½ oz dry vermouth, optional dash of orange bitters. Stir, serve up, garnish with a lemon twist or olive. 'Dry' means less vermouth, 'wet' means more, 'dirty' adds olive brine. A 50/50 Martini is equal parts. A vodka martini uses vodka.","Gibson: a Martini garnished with a cocktail onion. Vesper: gin, vodka and Lillet Blanc, shaken (made famous by James Bond).","Manhattan: 2 oz rye (or bourbon), 1 oz sweet vermouth, 2 dashes Angostura. Stir, serve up, garnish with a cherry. Perfect Manhattan splits the vermouth: ½ sweet and ½ dry.","Rob Roy: a Manhattan made with Scotch.","Negroni: 1 oz gin, 1 oz Campari, 1 oz sweet vermouth. Stir, serve over ice in a rocks glass, garnish with an orange peel.","Boulevardier: a Negroni with bourbon or rye instead of gin (often 1¼–1½ oz whiskey). Americano: Campari + sweet vermouth topped with soda. Negroni Sbagliato: Campari + sweet vermouth + prosecco.","Martinez: an ancestor of the Martini. Old Tom gin, sweet vermouth, maraschino liqueur, bitters."],"c":[["Classic Martini spec?","2½ oz gin, ½ oz dry vermouth, (orange bitters), stirred, up, lemon twist or olive."],["Dirty Martini?","Adds olive brine."],["Gibson?","Martini with a cocktail onion."],["Manhattan spec?","2 oz rye, 1 oz sweet vermouth, 2 dashes Angostura, stirred, up, cherry."],["Perfect Manhattan?","Splits vermouth: half sweet, half dry."],["Rob Roy?","Manhattan with Scotch."],["Negroni spec?","1:1:1 gin, Campari, sweet vermouth; stirred, rocks, orange peel."],["Boulevardier?","Negroni with bourbon/rye instead of gin."],["Americano?","Campari + sweet vermouth + soda."],["Vesper?","Gin, vodka, Lillet Blanc — shaken."]],"q":[["A Manhattan made with Scotch is a:","Rob Roy","Boulevardier","Gibson","Sazerac","Rob Roy."],["Guest orders a 'Perfect' Manhattan. You use:","Half sweet, half dry vermouth","Double rye","No vermouth","Extra bitters","Perfect = split vermouth."],["Negroni with bourbon instead of gin:","Boulevardier","Americano","Martinez","Rob Roy","Boulevardier."],["A Martini garnished with a cocktail onion:","Gibson","Vesper","Dirty Martini","Martinez","Onion = Gibson."],["Equal parts gin, Campari, sweet vermouth:","Negroni","Manhattan","Americano","Martini","1:1:1."],["An Americano is Campari, sweet vermouth and:","Soda water","Prosecco","Gin","Bourbon","Topped with soda."],["A Negroni Sbagliato replaces the gin with:","Prosecco","Vodka","Bourbon","Mezcal","Sbagliato = mistaken."]]},{"id":"c4","track":"Cocktails","title":"The Sour Family","k":["Template: spirit + citrus + sweetener. A reliable starting ratio is 2 : ¾–1 : ¾ (spirit : citrus : syrup). Always shaken.","Daiquiri: 2 oz white rum, 1 oz lime, ¾ oz simple. Shake, serve up in a coupe.","Margarita: 2 oz blanco tequila, 1 oz lime, ¾ oz orange liqueur (Cointreau). Shake, salt rim optional, served up or on the rocks. Tommy's Margarita: agave syrup instead of orange liqueur.","Whiskey Sour: 2 oz bourbon, ¾ oz lemon, ¾ oz simple, optional egg white (dry shake). Angostura drops on top.","Pisco Sour: 2 oz pisco, 1 oz lime, ¾ oz simple, egg white, Angostura drops on the foam.","Gimlet: 2 oz gin, ¾ oz lime, ¾ oz simple (or lime cordial).","Sidecar: 2 oz Cognac, ¾ oz Cointreau, ¾ oz lemon, optional sugar rim. Its 'daisy' cousins (spirit + citrus + orange liqueur) include the Margarita and Cosmopolitan.","Cosmopolitan: 1½ oz citrus vodka, ½ oz Cointreau, ½ oz lime, 1 oz cranberry. Lemon Drop: vodka, lemon, simple or triple sec, sugar rim. Clover Club: gin, lemon, raspberry syrup, egg white. Amaretto Sour, Bee's Knees (gin, lemon, honey), Gold Rush (bourbon, lemon, honey), Penicillin (Scotch, lemon, honey-ginger, Islay float)."],"c":[["Sour template and ratio?","Spirit + citrus + sweet; ~2 : ¾–1 : ¾."],["Daiquiri spec?","2 oz white rum, 1 oz lime, ¾ oz simple, shaken, coupe."],["Margarita spec?","2 oz tequila, 1 oz lime, ¾ oz Cointreau, shaken."],["Tommy's Margarita?","Tequila, lime, agave syrup — no orange liqueur."],["Whiskey Sour spec?","2 oz bourbon, ¾ lemon, ¾ simple, optional egg white."],["Pisco Sour?","2 oz pisco, 1 lime, ¾ simple, egg white, Angostura drops."],["Sidecar?","2 oz Cognac, ¾ Cointreau, ¾ lemon, sugar rim optional."],["Cosmopolitan?","1½ oz citrus vodka, ½ Cointreau, ½ lime, 1 oz cranberry."],["Bee's Knees?","Gin, lemon, honey syrup."],["Penicillin?","Blended Scotch, lemon, honey-ginger syrup, Islay Scotch float."]],"q":[["Rum, lime and simple syrup, shaken and served up:","Daiquiri","Mojito","Gimlet","Mai Tai","Classic Daiquiri."],["Cognac, orange liqueur and lemon:","Sidecar","Margarita","Lemon Drop","Pisco Sour","Sidecar."],["Gin, lemon and honey:","Bee's Knees","Gimlet","Tom Collins","Clover Club","Honey = Bee's Knees."],["Scotch, lemon, honey-ginger with an Islay float:","Penicillin","Rob Roy","Gold Rush","Blood and Sand","Modern classic by Sam Ross."],["A Tommy's Margarita replaces orange liqueur with:","Agave syrup","Simple syrup","Grenadine","Triple sec","Tommy's uses agave."],["A sour with an orange liqueur as the sweetener is a:","Daisy (Sidecar branch)","Fizz","Flip","Highball","Margarita, Sidecar."],["A Gold Rush is a Whiskey Sour made with:","Honey syrup instead of simple","Orgeat","Grenadine","Cointreau","Bourbon, lemon, honey."]]},{"id":"c5","track":"Cocktails","title":"Highballs, Collins & Fizzes","k":["Highball template: spirit + a larger amount of carbonated mixer, built over ice in a tall glass. Usually about 1½–2 oz spirit to 4–6 oz mixer.","Classics: Gin & Tonic; Whisky Highball (Japanese style is very cold, with lots of carbonation); Cuba Libre (rum, cola, lime); Paloma (tequila, grapefruit soda, lime, salt); Moscow Mule (vodka, ½ oz lime, ginger beer, copper mug); Dark 'n' Stormy (Gosling's dark rum + ginger beer + lime, trademarked); Mexican Mule; Kentucky Mule.","Collins: a sour topped with soda. Tom Collins is 2 oz gin, 1 oz lemon, ¾ oz simple, shaken, topped with soda, in a Collins glass. A Vodka Collins uses vodka.","Fizz: like a Collins but served without ice in a smaller glass, often with egg white. Gin Fizz; Ramos Gin Fizz adds cream, egg white and orange flower water, and gets a long shake.","Mojito: 2 oz white rum, 1 oz lime, ¾ oz simple, mint (gently pressed, not shredded), topped with soda over crushed or cracked ice.","Bloody Mary: vodka, tomato juice, lemon, Worcestershire, hot sauce, horseradish, celery salt, pepper. Roll it between tins; don't shake hard. Bloody Maria uses tequila. Michelada uses beer.","Keep the mixer cold, add it last, and stir gently once to keep the bubbles."],"c":[["Highball template?","Spirit + carbonated mixer, built over ice."],["Moscow Mule?","Vodka, lime, ginger beer, copper mug."],["Dark 'n' Stormy?","Gosling's dark rum, ginger beer, lime (trademarked)."],["Paloma?","Tequila, grapefruit soda, lime, pinch of salt."],["Cuba Libre?","Rum, cola, lime."],["Tom Collins spec?","2 oz gin, 1 oz lemon, ¾ oz simple, shaken, top soda, Collins glass."],["Collins vs Fizz?","Collins: tall with ice. Fizz: no ice, smaller glass, often egg white."],["Ramos Gin Fizz extras?","Cream, egg white, orange flower water, long shake."],["Mojito spec?","2 oz white rum, 1 oz lime, ¾ oz simple, mint, soda, crushed ice."],["How to mix a Bloody Mary?","Roll between tins — not a hard shake."]],"q":[["Gin, lemon, sugar, topped with soda, tall over ice:","Tom Collins","Gin Fizz","Gimlet","French 75","Collins is tall with ice."],["Vodka, lime and ginger beer in a copper mug:","Moscow Mule","Dark 'n' Stormy","Paloma","Cuba Libre","Mule."],["Tequila with grapefruit soda:","Paloma","Margarita","Tommy's","Bloody Maria","Paloma."],["Mint for a Mojito should be:","Gently pressed, not shredded","Blended","Boiled","Muddled to paste","Shredding releases bitterness."],["The difference between a Collins and a Fizz:","A Fizz is served without ice in a smaller glass","A Fizz has no citrus","A Collins is stirred","No difference","Fizz: no ice, often egg white."],["Why add soda last and stir only once?","To keep the carbonation","To add dilution","To warm the drink","To mix the sugar","Bubbles escape with agitation."]]},{"id":"c6","track":"Cocktails","title":"Sparkling, Tiki & Modern Classics","k":["Sparkling: French 75 is 1 oz gin, ½ oz lemon, ½ oz simple, shaken, topped with Champagne in a flute. Aperol Spritz is 3 oz prosecco, 2 oz Aperol, 1 oz soda (the 3-2-1 rule), with an orange slice. Kir Royale is crème de cassis + Champagne. Mimosa is orange juice + sparkling wine. Bellini is peach purée + prosecco (from Harry's Bar, Venice).","Tiki (1930s onward; Don the Beachcomber, Trader Vic): layered rums, citrus, and spiced or nut syrups.","Mai Tai (credited to Trader Vic, 1944; Don the Beachcomber claimed an earlier, different drink by the same name): 2 oz aged rum, 1 oz lime, ½ oz orange curaçao, ½ oz orgeat, ¼ oz simple. Serve over crushed ice with a mint sprig.","Others: Piña Colada (rum, cream of coconut, pineapple; Puerto Rico, where the Caribe Hilton and Barrachina both claim it), Zombie, Painkiller, Jungle Bird (rum, Campari, pineapple, lime, demerara).","Dessert and cream drinks: White Russian (vodka, coffee liqueur, cream); Black Russian (no cream); Grasshopper (crème de menthe, crème de cacao, cream); Brandy Alexander.","Espresso Martini (Dick Bradsell, London, 1980s): 2 oz vodka, 1 oz fresh espresso, ½ oz coffee liqueur, ¼–½ oz simple. Shake hard for foam, garnish with 3 coffee beans.","Modern classics to know: Paper Plane (equal parts bourbon, Aperol, Amaro Nonino, lemon), Last Word (equal parts gin, green Chartreuse, maraschino, lime), Naked & Famous, Gold Rush, Penicillin, Bramble (gin, lemon, simple, blackberry liqueur drizzle)."],"c":[["French 75?","1 oz gin, ½ lemon, ½ simple, shaken, topped with Champagne, flute."],["Aperol Spritz ratio?","3-2-1: prosecco, Aperol, soda."],["Kir Royale?","Crème de cassis + Champagne."],["Bellini?","Peach purée + prosecco (Harry's Bar, Venice)."],["Mai Tai spec?","2 oz aged rum, 1 lime, ½ curaçao, ½ orgeat, ¼ simple, crushed ice, mint."],["Piña Colada?","Rum, cream of coconut, pineapple; Puerto Rico."],["Espresso Martini spec?","2 oz vodka, 1 oz espresso, ½ coffee liqueur, ¼–½ simple, hard shake, 3 beans."],["Last Word?","Equal parts gin, green Chartreuse, maraschino, lime."],["Paper Plane?","Equal parts bourbon, Aperol, Amaro Nonino, lemon."],["White vs Black Russian?","White adds cream; Black is vodka + coffee liqueur only."]],"q":[["Equal parts gin, green Chartreuse, maraschino and lime:","Last Word","Paper Plane","Aviation","Bramble","Last Word."],["Aperol Spritz classic ratio:","3 prosecco : 2 Aperol : 1 soda","1:1:1","2:1:3","Equal Aperol and soda only","3-2-1."],["Orgeat and curaçao with aged rum and lime:","Mai Tai","Daiquiri","Zombie","Piña Colada","Trader Vic's Mai Tai."],["Gin, lemon, sugar, topped with Champagne:","French 75","Kir Royale","Bellini","Tom Collins","French 75."],["Created by Dick Bradsell in London:","Espresso Martini","Mojito","Negroni","Sazerac","Bradsell's 1980s classic."],["Orgeat is a key ingredient in the:","Mai Tai","Mojito","Negroni","Martini","Almond syrup."],["The 3-2-1 ratio refers to the:","Aperol Spritz","Daiquiri","Martini","Margarita","Prosecco, Aperol, soda."]]},{"id":"x1","track":"Mixology","title":"Balance: How to Build Any Drink","k":["Every drink balances four things: strength (spirit), sweetness (syrup, liqueur), acidity (citrus) and bitterness or aromatics (bitters, vermouth, amaro). Dilution from ice is the fifth ingredient that ties them together.","Learn the templates, not just the recipes. Sour: 2 oz spirit, ¾ oz citrus, ¾ oz syrup. Old Fashioned: 2 oz spirit, ¼ oz syrup, 2–3 dashes bitters. Manhattan/Martini: 2 parts spirit to 1 part vermouth. Equal parts: four ingredients at ¾ oz each (Last Word, Paper Plane, Naked & Famous). Highball: about 1 part spirit to 3 parts mixer.","The 'Mr. Potato Head' method: change one part of a classic at a time. Negroni with bourbon = Boulevardier. Swap gin for mezcal = Mezcal Negroni. Daiquiri with honey instead of simple and bourbon instead of rum = Gold Rush. This is how most modern classics were invented.","A liqueur is both a sweetener and a spirit. When it replaces syrup (a Daisy, like the Margarita or Sidecar), use about ¾ oz and pull back other sugar. Rich syrup (2:1) is sweeter than simple (1:1), so roughly ½ oz rich does the job of ¾ oz simple.","Lime and lemon are both about 6% acid. Orange and grapefruit juice are much less acidic, so a drink sweetened with them still needs lime or lemon to taste balanced.","Split bases add depth: use two spirits for the base (rye + Cognac in the Vieux Carré, tequila + mezcal in the Oaxaca Old Fashioned). Same with sweeteners: part simple, part liqueur.","Salt is a secret weapon. 2–3 drops of 20% saline solution brighten citrus, round off bitterness and make fruit taste fruitier, without tasting salty.","Taste every drink before it goes out. Craft bars straw-taste: dip a straw, cap it with your finger, taste, toss the straw. If it's too sour, add a little syrup. Too sweet, a little citrus. Too hot, stir or shake a bit longer."],"c":[["Four elements of balance?","Strength, sweetness, acidity, bitterness/aromatics. Dilution ties them together."],["Sour template?","2 oz spirit : ¾ oz citrus : ¾ oz syrup."],["Stirred 'Manhattan' template?","2 parts spirit : 1 part vermouth + bitters."],["Name three equal-parts drinks.","Last Word, Paper Plane, Naked & Famous (also Negroni, Corpse Reviver #2)."],["What's the Mr. Potato Head method?","Swap one component of a classic at a time to make a new drink."],["Why does a grapefruit-heavy drink still need lime?","Grapefruit and orange are far less acidic than lime and lemon."],["What does saline do?","A few drops brighten citrus, soften bitterness and boost fruit flavors."],["How do you straw-taste?","Dip a straw, cap it with a finger, taste, discard the straw."],["Drink tastes too sour. Fix?","Add a small amount of syrup (about ¼ oz) and re-shake or remake."]],"q":[["A Negroni made with bourbon instead of gin is an example of:","The Mr. Potato Head method (one-swap riff)","A split base","A Daisy","A fizz","One component swapped."],["Lime and lemon juice are roughly:","6% acid","1% acid","20% acid","Not acidic","That's why ¾ oz balances ¾ oz simple."],["You swap ¾ oz simple for ¾ oz Cointreau in a sour. You should:","Expect it sweeter and boozier, and adjust","Add more simple","Remove the citrus","Double the spirit","Liqueur adds both sugar and alcohol."],["Two to three drops of saline in a Daiquiri will:","Brighten it without tasting salty","Make it taste like a Margarita","Curdle it","Dilute it heavily","Salt is a flavor enhancer at low doses."],["A drink using rye and Cognac together has a:","Split base","Float","Rinse","Daisy build","Two base spirits."],["A drink tastes flat and dull, though sweet and sour are balanced. Try:","A few drops of saline or a dash of bitters","More ice","More sugar","More water","Seasoning lifts flavor."],["Equal parts gin, Campari and sweet vermouth follows which template?","Equal parts / Martini family","Sour","Highball","Flip","Negroni."]]},{"id":"x2","track":"Mixology","title":"Ice, Dilution & Technique","k":["Ice does three jobs: it chills, it dilutes, and (when shaken) it aerates. Chilling and dilution happen together. You can't have a properly cold drink without water from the ice.","Typical finished strength (from Dave Arnold's measurements in Liquid Intelligence): stirred spirit-forward drinks land around 21–29% ABV; shaken sours around 15–20%. A hard-shaken drink gains water equal to roughly 50–60% of its starting volume. Shaking is more violent, so shaken drinks end up colder, more diluted and lighter in texture than stirred ones.","Ice types: 1¼-inch Kold-Draft-style cubes for shaking and stirring; large clear cube or sphere for spirit-forward drinks on the rocks (melts slowly); Collins spear for highballs; crushed or pebble ice for juleps, swizzles, cobblers and tiki (fast dilution, very cold); cracked ice for some old-school stirs and Ramos.","Clear ice is made by directional freezing (water freezes from the top down in an insulated cooler), so air and impurities are pushed to the bottom and cut away. It looks better and melts more evenly.","Wet ice (sitting in meltwater) adds extra water. Shake off or drain wet ice before using it in a mixing glass or tin. Use fresh ice every time and never reuse ice from a shaken drink in the serving glass.","Shaking: fill the tin with ice, seal, and shake hard for about 10–12 seconds until the tin frosts. A whip shake (a few pieces of crushed ice or one cube, very short) is used for drinks going over crushed ice so they aren't over-diluted twice.","Stirring: fill the mixing glass with cold, dry ice and stir smoothly with the back of the spoon riding the inside of the glass, about 20–30 seconds. Taste for temperature and dilution, then strain with a julep or Hawthorne strainer.","Chill the glass. Fill a coupe or Nick & Nora with ice water or keep it in the freezer, and dump it right before you strain. A warm glass warms the drink within a minute.","Double strain shaken drinks served up (Hawthorne plus a fine-mesh strainer) to catch ice shards and pulp. Drinks served over fresh ice don't need it."],"c":[["Three jobs of ice?","Chill, dilute, aerate (when shaken)."],["Typical ABV, stirred vs shaken?","Stirred about 21–29%; shaken sours about 15–20%."],["Why are shaken drinks lighter in texture?","Shaking adds air and more dilution."],["When do you use a whip shake?","For drinks poured over crushed ice — a quick shake with little ice to mix without over-diluting."],["How is clear ice made?","Directional freezing from the top down; the cloudy bottom is cut off."],["What's wrong with wet ice?","Meltwater adds uncontrolled extra dilution."],["How long to shake?","About 10–12 seconds, hard, until the tin frosts."],["How long to stir?","About 20–30 seconds with good cold ice; taste to check."],["Why chill the glass?","A warm glass warms the drink fast."],["When do you double strain?","Shaken drinks served up, to remove ice shards and pulp."]],"q":[["Which drink style finishes the most diluted?","A shaken sour","A stirred Manhattan","A neat pour","An Old Fashioned on a big cube","Shaking adds more water."],["Best ice for a spirit-forward drink on the rocks:","One large clear cube","Crushed ice","Pebble ice","Wet cubes from the bin","Slow melt keeps it from watering down."],["A Mai Tai going over crushed ice gets a:","Whip shake","20-second stir","Dry shake only","Long hard shake","It'll dilute more on crushed ice."],["Clear ice is made by:","Directional freezing","Boiling water twice","Adding salt","Freezing fast in a blast chiller","Freezing from one direction pushes impurities out."],["You're making a Daiquiri served up. You should:","Double strain it into a chilled coupe","Serve it with the shaking ice","Stir it","Build it in the glass","Up + shaken = double strain."],["Shaking a drink with wet, half-melted ice will:","Over-dilute it","Make it stronger","Make it clearer","Change nothing","Meltwater adds water."],["Which drink needs a double strain?","A Daiquiri served up","A Negroni on a rock","A Highball","An Old Fashioned","Up + shaken."]]},{"id":"x3","track":"Mixology","title":"Syrups, Cordials & Daily Prep","k":["Simple syrup is 1:1 sugar to water. Rich simple is 2:1. Measure by weight for consistency. Demerara or turbinado syrup (usually 2:1) adds a molasses note to rum and whiskey drinks.","Honey syrup: honey thinned with warm water (1:1, or 3:1 for richer) so it mixes into cold drinks. Agave syrup: agave nectar cut 1:1 or 2:1 with water. Ginger syrup: fresh-pressed ginger juice and sugar.","Grenadine is pomegranate syrup (pomegranate juice and sugar, often with a little orange flower water). The bright red corn-syrup stuff is not real grenadine. Orgeat is almond syrup with orange flower water. Falernum (Barbados) tastes of lime, clove, ginger and almond.","Oleo saccharum ('oily sugar'): toss citrus peels in sugar and let it sit for a few hours. The sugar pulls out the peel oils into an aromatic syrup. It's the classic base for punch.","Cordials and shrubs: a lime cordial is lime juice and zest, sugar and citric acid (the proper base for a Gimlet). A shrub is fruit, sugar and vinegar, a 'drinking vinegar' that adds acidity.","Acid adjusting: citric and malic acid powders let you make orange or grapefruit juice as tart as lime, or make 'super juice' from citrus peels, acid and water, which stretches yield and holds flavor longer. Many high-volume bars use it.","Freshness: juice citrus fresh every day, ideally before each shift. Most bars toss leftover juice at the end of the night. Syrups go in clean, labeled bottles in the fridge. Rich syrup lasts longer than 1:1 because it has less free water.","Label everything with the name, the date it was made and your initials, and rotate first in, first out (FIFO). Make the prep list before service, not during it.","Par levels: the amount of each prep item you need to start a shift. Check pars before service and make only what you'll use, so nothing goes off."],"c":[["Simple vs rich syrup?","Simple 1:1, rich 2:1 sugar to water, ideally by weight."],["What is real grenadine?","Pomegranate juice + sugar (often a little orange flower water)."],["Orgeat?","Almond syrup with orange flower water."],["Falernum flavors?","Lime, clove, ginger, almond (Barbados)."],["Oleo saccharum?","Sugar that pulls oils from citrus peels; a punch base."],["Shrub?","Fruit + sugar + vinegar."],["What is acid-adjusting?","Adding citric/malic acid so a juice or peel mix matches lime or lemon tartness."],["How long is fresh citrus juice good for?","Best the day it's pressed; most bars discard it at close."],["What goes on every prep label?","Item name, date made, your initials."],["What is FIFO?","First in, first out — use older prep first."]],"q":[["Bright red, corn-syrup grenadine is:","Not real grenadine; real grenadine is pomegranate","The original recipe","Cherry syrup by definition","Required for a Jack Rose","Grenadine = pomegranate."],["Peels left in sugar for hours to make an aromatic syrup:","Oleo saccharum","Orgeat","Falernum","Shrub","Oleo = oil, saccharum = sugar."],["Why does rich syrup keep longer than simple?","Less free water for microbes","It's boiled longer","It has vinegar","It doesn't","Higher sugar concentration preserves it."],["The best base for a proper Gimlet:","Lime cordial","Grenadine","Orgeat","Honey syrup","The Gimlet was built on lime cordial."],["Your opening checklist says lime juice par is 1 quart. That means:","Have 1 quart ready to start the shift","Make 1 quart per drink","Never make more than 1 quart a week","Order 1 quart of limes","Par = the starting amount you need."],["Real grenadine is made from:","Pomegranate","Cherry","Raspberry","Red dye and corn syrup","Pomegranate."],["What should every prep bottle's label show?","Name, date made, initials","Only the name","Price","Nothing","Label and date."]]},{"id":"x4","track":"Mixology","title":"Infusions, Fat-Washing & Clarification","k":["Infusing: add an ingredient to a spirit, taste often and strain when it's right. Speed varies a lot. Hot chiles can be done in minutes to an hour, tea in about 5–15 minutes, coffee beans in hours, vanilla and cinnamon in days. Higher-proof spirits extract faster.","Rapid infusion: a whipped-cream siphon (iSi) charged with N2O forces liquid into the solids in minutes. It's a technique popularized by Dave Arnold (Liquid Intelligence).","Fat-washing: stir melted fat (bacon fat, brown butter, coconut oil, sesame oil) into a spirit, let it sit a few hours, freeze it so the fat solidifies, then lift off the fat and fine-strain. The flavor and a silky texture stay; the grease doesn't. Famous example: Benton's Old Fashioned at PDT (bacon fat-washed bourbon, maple syrup, Angostura), by Don Lee.","Milk punch (clarified milk punch): mix spirit, citrus, sugar, tea and spices, then add it to whole milk. The acid curdles the milk; strain the liquid back through the curds until it runs crystal clear. It's silky and shelf-stable. The method dates to the 1700s.","Other clarification: agar clarification (set a little agar in the juice, break the gel, strain) and centrifuges. Clear juice lets you carbonate drinks and make clear, stable batches.","Tinctures and saline: a tincture is a strong extract in high-proof neutral spirit, used in drops. 20% saline is 20 g salt dissolved in 80 g water (20% by weight). Keep both in dropper bottles.","Food safety: strain out fresh produce, refrigerate fat-washed and dairy-based preps, label and date them. When in doubt, throw it out."],"c":[["Which infuses faster, chile or vanilla?","Chile (minutes to an hour). Vanilla takes days."],["What does an iSi siphon do for infusions?","N2O pressure forces liquid into solids for rapid infusion."],["Fat-washing steps?","Add melted fat, rest a few hours, freeze, remove fat, fine-strain."],["Benton's Old Fashioned?","Bacon fat-washed bourbon, maple syrup, Angostura (Don Lee, PDT)."],["How does milk punch clarify?","Acid curdles milk; straining through the curds makes it clear."],["Why clarify a drink?","Clarity, silky texture, shelf stability, and you can carbonate it."],["20% saline recipe?","20 g salt dissolved in 80 g water (20% by weight)."],["What's a tincture?","A potent extract in high-proof spirit, dosed in drops."]],"q":[["You leave jalapeño in tequila overnight without tasting. Likely result:","Far too hot","Barely any flavor","Clear tequila","It turns sweet","Chiles extract very fast."],["After fat-washing, why freeze the spirit?","To solidify the fat so you can remove it","To make it clear","To add dilution","To kill bacteria","Fat hardens and lifts off."],["A clarified milk punch gets clear because:","Curdled milk proteins act as a filter","It's boiled","It's centrifuged with charcoal","Milk is removed by freezing","Strain through the curds."],["A whipped-cream siphon infusion uses:","N2O pressure","CO2 for bubbles","Heat","Vacuum distillation","Pressure pushes liquid in."],["Fat-washing works because:","Fat solidifies when frozen and can be removed","Fat dissolves completely","Alcohol evaporates","Sugar binds the fat","Freeze, lift, strain."],["A tincture is used in:","Drops","Ounces","Pints","Whole bottles","Concentrated extract."]]},{"id":"x5","track":"Mixology","title":"The Craft Backbar: Modifiers & Bitters","k":["Vermouth is wine, fortified and flavored with botanicals. Once it's open, it oxidizes like wine: refrigerate it and use it within about a month. Warm, old vermouth is the most common reason a Manhattan or Martini tastes flat.","Vermouth styles: dry (French style, e.g. Dolin Dry, Noilly Prat) for Martinis; blanc/bianco (sweet-ish, pale, e.g. Dolin Blanc); sweet/rosso (Italian style, e.g. Carpano Antica Formula, rich and vanilla; Cocchi Vermouth di Torino; Punt e Mes, more bitter) for Manhattans and Negronis.","Aromatized wines: Lillet Blanc (orange, honey) and Cocchi Americano (bitter quinine, closer to the old Kina Lillet) are used in the Vesper and Corpse Reviver #2.","Bitter liqueurs and amari: Campari (bitter orange, Negroni); Aperol (lighter, lower ABV, Spritz); Cynar (artichoke, bittersweet); Fernet-Branca (intensely bitter and minty, the 'bartender's handshake'); Montenegro (floral, gentle); Averna (caramel, cola notes); Amaro Nonino (orange, grappa base, Paper Plane).","Herbal liqueurs: Green Chartreuse (55% ABV, intense, herbal) and Yellow Chartreuse (40%, honeyed, gentler) are made by Carthusian monks and are often allocated or hard to get. Bénédictine (honey, baking spice) is in the Vieux Carré.","Other modifiers: Luxardo Maraschino (distilled from marasca cherries, funky and floral, not red cherry syrup); orange liqueurs (Cointreau, a clean triple sec; Grand Marnier, Cognac-based; dry curaçao); crème de violette (Aviation); crème de cassis (blackcurrant); crème de mûre (blackberry, Bramble); St-Germain (elderflower); allspice dram; absinthe (anise, for rinses).","Bitters are the salt and pepper of cocktails. Angostura (Trinidad, baking spice) is the default aromatic. Peychaud's (New Orleans, anise and cherry) goes in the Sazerac. Orange bitters go in Martinis. A dash is small but changes a drink."],"c":[["How should opened vermouth be stored?","Refrigerated; use within about a month."],["Dry vs sweet vermouth uses?","Dry: Martini. Sweet: Manhattan, Negroni."],["Lillet Blanc vs Cocchi Americano?","Both aromatized wines; Cocchi Americano is more bitter (quinine)."],["Campari vs Aperol?","Campari is more bitter and stronger; Aperol is lighter and sweeter."],["Fernet-Branca?","Intensely bitter, minty amaro; the 'bartender's handshake'."],["Green vs Yellow Chartreuse?","Green 55%, intense and herbal; Yellow 40%, honeyed and softer."],["What is maraschino liqueur?","A clear, funky, floral liqueur distilled from marasca cherries."],["Angostura vs Peychaud's?","Angostura: baking spice, default aromatic. Peychaud's: anise and cherry, Sazerac."],["Cognac-based orange liqueur?","Grand Marnier."]],"q":[["A guest says their Manhattan tastes flat and dull. First suspect:","Oxidized, unrefrigerated vermouth","Too much ice","The cherry","The rocks glass","Vermouth is wine."],["The amaro in a Paper Plane:","Amaro Nonino","Fernet-Branca","Cynar","Averna","Equal parts bourbon, Aperol, Nonino, lemon."],["Which Chartreuse is 55% ABV?","Green","Yellow","Both","Neither","Green is stronger."],["Luxardo Maraschino is:","A clear liqueur distilled from marasca cherries","Red cherry syrup","A vermouth","A bitters","Funky, floral, clear."],["Sazerac bitters:","Peychaud's","Angostura","Orange","Mole","New Orleans classic."],["Cocchi Americano differs from Lillet Blanc by being:","More bitter (quinine)","Sweeter","A spirit","A beer","Kina-style."],["Opened vermouth kept warm on the backbar for two months will taste:","Flat and oxidized","Better","Stronger","Sweeter and fresher","It's wine."]]},{"id":"x6","track":"Mixology","title":"Classic Canon: Stirred & Spirit-Forward","k":["Vieux Carré (Hotel Monteleone, New Orleans, 1930s): ¾ oz rye, ¾ oz Cognac, ¾ oz sweet vermouth, 1 barspoon Bénédictine, 2 dashes Peychaud's, 2 dashes Angostura. Stirred, rocks glass with a large cube, lemon twist or cherry.","Brooklyn: 2 oz rye, ¾–1 oz dry vermouth, ¼ oz maraschino, ¼ oz Amer Picon (or a substitute amaro). Stirred, up.","Hanky Panky (Ada Coleman, the Savoy, London): 1½ oz gin, 1½ oz sweet vermouth, 2 dashes Fernet-Branca. Stirred, up, orange twist.","Bijou: equal parts (1 oz) gin, sweet vermouth and green Chartreuse, dash of orange bitters. Stirred, up.","Old Pal: 1½ oz rye, ¾ oz dry vermouth, ¾ oz Campari. A drier cousin of the Boulevardier. Stirred, up, lemon twist.","Toronto: 2 oz rye, ¼ oz Fernet-Branca, ¼ oz simple, 2 dashes Angostura. Stirred, up, orange twist.","Martinez: 1½ oz Old Tom gin, 1½ oz sweet vermouth, 1 barspoon maraschino, dash of bitters. Stirred, up, lemon twist. It's an ancestor of the Martini.","Mint Julep (Kentucky Derby): 2–2½ oz bourbon, ½ oz simple (or rich), 8–10 mint leaves gently pressed, packed crushed ice in a julep cup. Mound the ice, add a big mint bouquet and a short straw near the mint.","Hot drinks: Hot Toddy is 2 oz whiskey (or brandy or rum), ½–¾ oz honey syrup, ½ oz lemon, topped with about 4 oz hot water. Irish Coffee is 1½ oz Irish whiskey, ½ oz brown-sugar syrup, about 4 oz hot coffee in a preheated glass, with lightly whipped cream floated on top (never stirred in)."],"c":[["Vieux Carré spec?","¾ rye, ¾ Cognac, ¾ sweet vermouth, 1 barspoon Bénédictine, 2 Peychaud's, 2 Angostura; stirred, rocks."],["Brooklyn spec?","2 rye, ¾–1 dry vermouth, ¼ maraschino, ¼ Amer Picon; stirred, up."],["Hanky Panky?","1½ gin, 1½ sweet vermouth, 2 dashes Fernet; Ada Coleman, Savoy."],["Bijou?","Equal parts gin, sweet vermouth, green Chartreuse + orange bitters."],["Old Pal?","1½ rye, ¾ dry vermouth, ¾ Campari."],["Toronto?","2 rye, ¼ Fernet, ¼ simple, 2 Angostura."],["Martinez?","1½ Old Tom, 1½ sweet vermouth, barspoon maraschino, bitters."],["Mint Julep?","2–2½ bourbon, ½ simple, mint, crushed ice, julep cup, mint bouquet."],["Irish Coffee?","1½ Irish whiskey, ½ brown sugar syrup, hot coffee, floated lightly whipped cream."]],"q":[["Rye, Cognac, sweet vermouth and Bénédictine:","Vieux Carré","Sazerac","Brooklyn","Bijou","New Orleans, Hotel Monteleone."],["Gin, sweet vermouth and a touch of Fernet-Branca:","Hanky Panky","Toronto","Martinez","Bijou","Ada Coleman's classic."],["A Boulevardier with dry vermouth instead of sweet:","Old Pal","Toronto","Brooklyn","Americano","Old Pal is the drier cousin."],["Irish Coffee cream should be:","Lightly whipped and floated on top","Stirred in","Canned whipped cream","Shaken with the coffee","Drink the coffee through the cream."],["Equal parts gin, sweet vermouth, green Chartreuse:","Bijou","Last Word","Negroni","Hanky Panky","Bijou = jewel colors."],["A Vieux Carré is served:","Stirred, on the rocks","Shaken, up","Built with soda","Blended","Rocks glass, big cube."],["Equal parts gin, sweet vermouth and green Chartreuse:","Bijou","Hanky Panky","Martinez","Old Pal","Bijou."]]},{"id":"x7","track":"Mixology","title":"Classic Canon: Shaken, Swizzled & Crushed","k":["Aviation: 2 oz gin, ¾ oz lemon, ½ oz maraschino, ¼ oz crème de violette. Shaken, coupe, cherry.","Corpse Reviver #2: equal parts (¾ oz) gin, Cointreau, Lillet Blanc or Cocchi Americano, and lemon, in an absinthe-rinsed coupe. Shaken.","Hemingway Daiquiri: 2 oz white rum, ¾ oz lime, ½ oz grapefruit, ¼–½ oz maraschino. Shaken, up. It's tart with very little sugar, the way Hemingway liked it.","Southside: 2 oz gin, ¾ oz lime (or lemon), ¾ oz simple, a few mint leaves. Shaken, double strained, coupe. Pegu Club: 2 oz gin, ¾ oz orange curaçao, ¾ oz lime, dash Angostura, dash orange bitters.","Jack Rose: 2 oz apple brandy (Laird's), ¾ oz lemon or lime, ½–¾ oz grenadine. Clover Club: 1½ oz gin, ½ oz dry vermouth, ½ oz lemon, ½ oz raspberry syrup, egg white (dry shake).","Caipirinha (Brazil): half a lime cut into wedges and muddled with 2 tsp sugar (or ¾ oz simple), 2 oz cachaça, ice. Ti' Punch (Martinique): a coin of lime peel with a little juice, 1 tsp cane syrup, 2 oz rhum agricole, built and stirred with little or no ice.","Queen's Park Swizzle (Trinidad): 2 oz demerara rum, 1 oz lime, ¾ oz simple, mint, crushed ice. Swizzle with a swizzle stick until the glass frosts, then top with lots of Angostura so it layers green, gold and red.","Jungle Bird (Kuala Lumpur Hilton, 1978): 1½ oz blackstrap or dark rum, ¾ oz Campari, 1½ oz pineapple, ½ oz lime, ½ oz demerara syrup. Shaken, rocks.","Bramble (Dick Bradsell, London, 1980s): 2 oz gin, 1 oz lemon, ½ oz simple, shaken and strained over crushed ice, with ½ oz crème de mûre drizzled over the top."],"c":[["Aviation spec?","2 gin, ¾ lemon, ½ maraschino, ¼ crème de violette; shaken, coupe."],["Corpse Reviver #2?","Equal parts gin, Cointreau, Lillet/Cocchi Americano, lemon; absinthe rinse."],["Hemingway Daiquiri?","2 white rum, ¾ lime, ½ grapefruit, ¼–½ maraschino."],["Southside?","2 gin, ¾ lime, ¾ simple, mint; shaken, double strained."],["Pegu Club?","2 gin, ¾ orange curaçao, ¾ lime, Angostura + orange bitters."],["Jack Rose?","2 apple brandy, ¾ lemon/lime, ½–¾ grenadine."],["Caipirinha?","Muddled lime wedges and sugar, 2 oz cachaça, ice."],["Ti' Punch?","Rhum agricole, lime coin, cane syrup; built."],["Queen's Park Swizzle?","Demerara rum, lime, simple, mint, crushed ice, swizzled, Angostura on top."],["Jungle Bird?","1½ dark rum, ¾ Campari, 1½ pineapple, ½ lime, ½ demerara."]],"q":[["Gin, lemon, maraschino and crème de violette:","Aviation","Last Word","Bramble","Pegu Club","The violette gives it the sky color."],["The national cocktail of Brazil:","Caipirinha","Ti' Punch","Mojito","Pisco Sour","Cachaça, lime, sugar."],["Rum + Campari + pineapple:","Jungle Bird","Queen's Park Swizzle","Mai Tai","Hemingway Daiquiri","1978, Kuala Lumpur."],["Which uses an absinthe rinse?","Corpse Reviver #2","Aviation","Southside","Jack Rose","CR#2 is rinsed."],["Crème de mûre drizzled over crushed ice:","Bramble","Clover Club","Jack Rose","Southside","Bradsell's Bramble."],["A Queen's Park Swizzle is topped with:","Angostura bitters","Soda","Champagne","Cream","Layers of bitters."],["The Hemingway Daiquiri adds:","Grapefruit and maraschino","Mint and soda","Pineapple and orgeat","Cream","Papa Doble."]]},{"id":"x8","track":"Mixology","title":"Modern Classics You'll Be Asked For","k":["The craft cocktail revival (late 1990s–2010s) came out of bars like Milk & Honey (Sasha Petraske, NYC, 1999), Pegu Club (Audrey Saunders), Death & Co (2006) and PDT (2007). Their drinks are now standard calls at any serious bar.","Penicillin (Sam Ross, Milk & Honey): 2 oz blended Scotch, ¾ oz lemon, ¾ oz honey-ginger syrup, shaken, rocks, ¼ oz Islay Scotch floated on top, candied ginger.","Gold Rush (Milk & Honey): 2 oz bourbon, ¾ oz lemon, ¾ oz honey syrup. Shaken, rocks.","Paper Plane (Sam Ross): ¾ oz each bourbon, Aperol, Amaro Nonino, lemon. Shaken, up. Naked & Famous (Joaquín Simó, Death & Co): ¾ oz each mezcal, yellow Chartreuse, Aperol, lime. Shaken, up.","Oaxaca Old Fashioned (Phil Ward, Death & Co): 1½ oz reposado tequila, ½ oz mezcal, 1 barspoon agave syrup, 2 dashes Angostura, flamed orange peel. Division Bell (Phil Ward): 1 oz mezcal, ¾ oz Aperol, ½ oz maraschino, ¾ oz lime.","Old Cuban (Audrey Saunders): 1½ oz aged rum, ¾ oz lime, 1 oz simple, 2 dashes Angostura, mint, shaken, up, topped with Champagne. Gin-Gin Mule (Saunders): gin, lime, simple, mint, topped with ginger beer.","Gin Basil Smash (Jörg Meyer, Le Lion, Hamburg, 2008): 2 oz gin, ¾ oz lemon, ¾ oz simple, a big handful of basil muddled, shaken hard, double strained over ice.","Trinidad Sour (Giuseppe González): 1½ oz Angostura bitters, 1 oz orgeat, ¾ oz lemon, ½ oz rye. Yes, bitters as the base. Siesta (Katie Stipe): 1½ oz blanco tequila, ½ oz Campari, ½ oz lime, ½ oz grapefruit, ½ oz simple.","Espresso Martini and Cosmopolitan (the version Toby Cecchini popularized at The Odeon, NYC, in the late 1980s; earlier versions existed) are 'modern classics' too. Make them perfectly and without attitude. They pay the rent."],"c":[["Penicillin spec?","2 blended Scotch, ¾ lemon, ¾ honey-ginger; Islay float. Sam Ross."],["Gold Rush?","2 bourbon, ¾ lemon, ¾ honey syrup."],["Naked & Famous?","Equal parts mezcal, yellow Chartreuse, Aperol, lime. Joaquín Simó."],["Oaxaca Old Fashioned?","1½ reposado, ½ mezcal, barspoon agave, 2 Angostura. Phil Ward."],["Old Cuban?","Aged rum, lime, simple, Angostura, mint, topped with Champagne. Audrey Saunders."],["Gin Basil Smash?","Gin, lemon, simple, lots of basil. Jörg Meyer, Le Lion."],["Trinidad Sour?","1½ Angostura, 1 orgeat, ¾ lemon, ½ rye."],["Division Bell?","Mezcal, Aperol, maraschino, lime. Phil Ward."],["Siesta?","Blanco tequila, Campari, lime, grapefruit, simple. Katie Stipe."]],"q":[["Bourbon, lemon, honey syrup:","Gold Rush","Bee's Knees","Penicillin","Whiskey Sour","Bee's Knees uses gin."],["A drink with 1½ oz of Angostura as its base:","Trinidad Sour","Old Cuban","Queen's Park Swizzle","Toronto","Giuseppe González."],["Mezcal, yellow Chartreuse, Aperol, lime:","Naked & Famous","Paper Plane","Division Bell","Last Word","Death & Co."],["Topped with Champagne and made with aged rum and mint:","Old Cuban","Mojito","French 75","Gin-Gin Mule","Audrey Saunders."],["The bar where the Gin Basil Smash was created:","Le Lion, Hamburg","PDT, New York","The Savoy, London","Harry's Bar, Venice","Jörg Meyer, 2008."],["The Paper Plane was created by:","Sam Ross","Phil Ward","Audrey Saunders","Dick Bradsell","Sam Ross."],["Mezcal, Aperol, maraschino and lime:","Division Bell","Naked & Famous","Last Word","Siesta","Phil Ward."]]},{"id":"x9","track":"Mixology","title":"Zero-Proof & Low-ABV","k":["More guests are drinking less or not at all. A bar that makes zero-proof drinks with the same care as cocktails wins those guests, and their tables. Use the same glassware, ice and garnish as a real cocktail.","Balance rules still apply: acid, sugar, bitterness, texture and dilution. Without alcohol a drink can taste thin, so add body and bite with tea, verjus, shrubs, tonic, ginger, saline, egg white or aquafaba (chickpea liquid) for foam.","Non-alcoholic spirits and aperitifs exist, but many are light on body. Build around them instead of just swapping them in 1:1.","Never ask why someone isn't drinking, and never pressure them. Some guests are pregnant, in recovery, driving, or just don't want to. Be aware that NA beer and some 'non-alcoholic' products can contain up to 0.5% ABV, so tell guests if they ask.","Low-ABV cocktails use fortified wine, vermouth, sherry or amaro as the base. Bamboo: 1½ oz dry sherry (fino or amontillado), 1½ oz dry vermouth, dash orange bitters, dash Angostura, stirred. Adonis: sherry with sweet vermouth.","Sherry Cobbler: about 3 oz amontillado sherry, ½ oz simple, orange half-wheels shaken in, poured over crushed ice with berries and mint. Americano and Spritzes are low-ABV too.","Low-ABV drinks are great for long nights, brunch and day drinking, and for a guest who wants one more without getting drunk."],"c":[["How do you add body to a zero-proof drink?","Tea, verjus, shrubs, tonic, ginger, saline, egg white or aquafaba."],["What is aquafaba?","Chickpea liquid; makes vegan foam like egg white."],["What should you never ask a non-drinking guest?","Why they aren't drinking."],["NA beer ABV note?","'Non-alcoholic' can be up to 0.5% ABV."],["Bamboo spec?","1½ dry sherry, 1½ dry vermouth, orange bitters + Angostura; stirred."],["Adonis?","Sherry + sweet vermouth."],["Sherry Cobbler?","Amontillado, simple, orange, crushed ice, berries, mint."],["Three low-ABV bases?","Sherry, vermouth, amaro (also aromatized wine)."]],"q":[["A zero-proof sour tastes thin. Best fix:","Add texture and bite, e.g. aquafaba or tea","Add more water","Serve it in a smaller glass","Add vodka","Body and structure matter."],["Sherry and dry vermouth, stirred:","Bamboo","Adonis","Americano","Cobbler","Bamboo is the dry one."],["A guest orders a non-alcoholic drink. You:","Make it with full care and the same presentation","Ask why they're not drinking","Pour a soda without asking","Suggest a 'light' cocktail instead","Hospitality first."],["A guest in recovery asks if NA beer has any alcohol:","Explain it can contain up to 0.5% ABV","Say it has none","Say you don't know","Recommend a light beer","Be honest so they can choose."],["A low-ABV classic of sherry and d
