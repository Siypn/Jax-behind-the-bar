oak and flavor work together?<\/td><\/tr><tr><td>Intensity<\/td><td>How pronounced are the aromas and flavors?<\/td><\/tr><tr><td>Complexity<\/td><td>How many distinct, integrated characteristics develop?<\/td><\/tr><tr><td>Finish<\/td><td>How persistent and interesting is the aftertaste?<\/td><\/tr><\/tbody><\/table><\/div>\n<p>9. Production → glass The central skill is forming plausible production explanations without pretending you know facts the glass cannot prove.<\/p>\n<div class=\"bk-tw\"><table class=\"bk-t\"><thead><tr><th>Sensory pattern<\/th><th>Plausible production connection<\/th><\/tr><\/thead><tbody><tr><td>Vanilla + caramel + oak + pepper<\/td><td>New charred oak; rye in an American whiskey mash bill is one possible spice source<\/td><\/tr><tr><td>Cooked agave + citrus + pepper + grass<\/td><td>Agave-forward distillate with limited oak influence<\/td><\/tr><tr><td>Malt + smoke + vanilla<\/td><td>Malted barley; peat smoke may explain smoke; ex-bourbon oak may explain vanilla<\/td><\/tr><tr><td>Banana + pineapple + funk<\/td><td>Characterful fermentation and ester-rich rum production are plausible<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"bk-call key\"><b>Key concept<\/b>Tasting can suggest production; it cannot prove a mash bill, exact cask, age or additive without external information.<\/div>\n<h3 class=\"bk-h\">10. Service integration<\/h3>\n<p>A professional recommendation translates production into guest language. Ask about flavor direction, intensity, oak, smoke, sweetness perception and proof tolerance. Then explain the category in one or two accurate sentences and offer a reasoned choice.<\/p>\n<div class=\"bk-call bk-bar\"><b>Behind the bar<\/b>Instead of 'this one is smoother,' say: 'This bourbon is rounder and more vanilla-led; that rye is drier and more peppery. If you want spice in a Manhattan, I'd point you toward the rye style.'<\/div>\n<h3 class=\"bk-h\">The Basic Spirits map<\/h3>\n<div class=\"bk-flow\">RAW MATERIAL → SUGAR ACCESS → FERMENTATION → DISTILLATION → MATURATION / BOTANICALS → BLENDING / ADJUSTMENT → BOTTLING → TASTING<\/div>\n<div class=\"bk-call sum\"><b>Lesson summary<\/b>The point of Basic Spirits is not memorization for its own sake. It is the ability to look at a category, trace how it was made, taste what resulted and explain the connection accurately.<\/div>","ref":"<h3 class=\"bk-h\">Reference — Core Production Map<\/h3>\n<div class=\"bk-tw\"><table class=\"bk-t\"><thead><tr><th>Family<\/th><th>Raw material<\/th><th>Signature Basic question<\/th><\/tr><\/thead><tbody><tr><td>Whiskey<\/td><td>Grain<\/td><td>Which grains, legal category and cask rules?<\/td><\/tr><tr><td>Rum<\/td><td>Sugarcane-derived material<\/td><td>Molasses or juice? Fermentation/still? Geography?<\/td><\/tr><tr><td>Tequila<\/td><td>Blue agave<\/td><td>100% agave or category tequila? Maturation class?<\/td><\/tr><tr><td>Mezcal<\/td><td>Permitted agave species<\/td><td>Species, geography and traditional/modern production?<\/td><\/tr><tr><td>Brandy<\/td><td>Fruit / wine<\/td><td>Which fruit, protected origin and maturation system?<\/td><\/tr><tr><td>Vodka<\/td><td>Agricultural fermentable material<\/td><td>How neutral/rectified? What texture remains?<\/td><\/tr><tr><td>Gin<\/td><td>Spirit + botanicals<\/td><td>How does juniper lead the profile?<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 class=\"bk-h\">High-value misconceptions to correct<\/h3>\n<ul class=\"bk-ul\"><li>Distillation creates alcohol. → No: fermentation creates alcohol; distillation concentrates and separates.<\/li><li>Pot still = flavorful; column = flavorless. → No: design and operation matter; columns can make flavorful spirit.<\/li><li>Older = better. → No: age is one production variable; balance matters.<\/li><li>Bourbon must be from Kentucky. → No: it must be produced in the United States; Kentucky is a major center.<\/li><li>Bourbon must be two years old. → No: the two-year threshold belongs to straight whiskey requirements.<\/li><li>Single Malt means one barrel. → No: 'single' means one distillery.<\/li><li>All Scotch is smoky. → No: peat is a production choice, not a universal Scotch trait.<\/li><li>Irish whiskey is always triple distilled. → No: triple distillation is common, not universal.<\/li><li>Canadian rye must be 51% rye. → No: that is a U.S. rye-whiskey mash rule.<\/li><li>White rum is always unaged. → No: aged rum can be filtered clear.<\/li><li>Rum is sweet because sugarcane is sweet. → Distillation changes the matrix; sweetness can be sensory or added where permitted.<\/li><li>Mezcal is smoky tequila. → No: separate regulated categories; smoke is one possible production result.<\/li><li>Vodka is potato spirit. → Potatoes are one possible raw material.<\/li><li>London Dry must be made in London. → No: it is principally a production category/style designation.<\/li><li>Vermouth is a spirit. → No: it is wine-based aromatised wine.<\/li><li>High proof means harsh. → No: integration and balance matter. Reference — Essential Glossary ABV — Alcohol by volume; concentration of ethanol expressed as a percentage of total beverage volume.<\/li><\/ul>\n<p>Angel's share — Evaporative loss during cask maturation.<\/p>\n<p>Botanical — Plant-derived flavoring material used in products such as gin, aquavit and absinthe.<\/p>\n<p>Congeners — Broad practical term for compounds other than ethanol and water that can contribute aroma, flavor and texture.<\/p>\n<p>Cuts — Distiller's selection of fractions during a batch distillation.<\/p>\n<p>Distillate — Condensed liquid collected from distillation.<\/p>\n<p>Eau-de-vie — Literally 'water of life'; contextually used for distilled fruit spirits and Cognac components.<\/p>\n<p>Esters — A family of compounds; many have fruity aromas.<\/p>\n<p>Fermentation — Microbial conversion of fermentable sugars into ethanol, CO₂ and secondary compounds.<\/p>\n<p>Mash bill — The grain recipe used for a whiskey.<\/p>\n<p>Maturation — Development of spirit during storage, commonly in wood.<\/p>\n<p>Rectification — Further purification/separation through repeated distillation stages or reflux.<\/p>\n<p>Reflux — Condensation inside a still followed by return and re-vaporization.<\/p>\n<p>Proof — U.S. spirits measure equal to twice the numerical ABV percentage.<\/p>\n<p>Piña — The harvested central body of an agave plant after leaves are removed.<\/p>\n<p>Tahona — Large stone wheel traditionally associated with crushing cooked agave.<\/p>\n<p>Horno — Oven; in tequila context, a masonry oven used to cook agave.<\/p>\n<p>Jimador — Skilled agave harvester.<\/p>\n<p>Non-chill filtered — Not subjected to chill filtration intended to prevent cold/dilution haze.<\/p>\n<p>Pot still — Batch distillation apparatus, often associated with characterful spirit production.<\/p>\n<p>Column still — Staged distillation apparatus often capable of continuous operation and high rectification. Source &amp; Accuracy Notes This course is original educational material. The 2026 rebuild preserves the supplied Lessons 1–12 while tightening statements that could otherwise blur legal requirements, industry standards and stylistic generalizations. Regulations change; advanced study should always return to the current primary text.<\/p>\n<h3 class=\"bk-h\">Primary authorities consulted for high-risk claims<\/h3>\n<ul class=\"bk-ul\"><li>U.S. Alcohol and Tobacco Tax and Trade Bureau (TTB) and 27 CFR Part 5 — distilled spirits standards, bourbon/rye/straight whiskey, labeling, ABV and proof.<\/li><li>Scotch Whisky Regulations 2009 (UK legislation) — Scotch production, maturation and five legal categories.<\/li><li>Irish Whiskey Technical File / Department of Agriculture, Food and the Marine — Irish whiskey protected specification and category framework.<\/li><li>Consejo Regulador del Tequila (CRT) / NOM-006 — tequila raw material, categories/classes, maturation and denomination requirements.<\/li><li>Bureau National Interprofessionnel du Cognac (BNIC) / Cognac official materials — Cognac production and VS/VSOP/XO minimum ages.<\/li><li>European Union Regulations 2019/787 and 251/2014 — spirit-drink definitions including gin/aquavit and aromatised wine products including vermouth.<\/li><li>Justice Laws Website, Canada — Food and Drug Regulations for whisky aging and 'small wood' definition.<\/li><li>Japan Spirits &amp; Liqueurs Makers Association — voluntary industry labeling standard for Japanese whisky.<\/li><li>Institut national de l'origine et de la qualité (INAO) — AOC Rhum de la Martinique, including cane-juice basis and maturation classes.<\/li><\/ul>\n<h3 class=\"bk-h\">Editorial corrections made from the supplied lessons<\/h3>\n<ul class=\"bk-ul\"><li>Separated legal requirements from sensory tendencies throughout, especially for still type, oak and grain flavor.<\/li><li>Tightened bourbon language around straight bourbon and avoided treating 'two years' as a bourbon-wide minimum.<\/li><li>Added the Tennessee statutory-exception caveat rather than presenting charcoal mellowing as an exceptionless universal rule.<\/li><li>Clarified Canadian whisky using current Canadian aging law instead of applying U.S. rye mash-bill logic.<\/li><li>Framed Japanese whisky correctly around the JSLMA industry standard rather than presenting it as identical to statutory appellation law.<\/li><li>Narrowed rhum agricole claims: Martinique AOC is definitively cane-juice agricole; global usage is more complex.<\/li><li>Made tequila 'mixto' wording more precise and treated it as common shorthand for the non-100%-agave category.<\/li><li>Recast London Dry/London gin and vermouth wording to distinguish bartender shorthand from formal EU definitions.<\/li><li>Removed the duplicated second half of Lesson 4 from the supplied manuscript while preserving every unique concept.<\/li><li>Removed checkpoint quizzes from the textbook body and replaced them with summaries, callouts, comparison tables and integration examples.<\/li><\/ul>","pro":[["A guest asks, 'How do I taste whiskey like a pro?'","Sequence: look, nose gently from a distance, small sip, note body and flavor, finish, then add a few drops of water and repeat.","'Smell it gently first, take a small sip and hold it, notice what lingers, then add a few drops of water and taste again.'"],["A guest describes a whiskey as 'smooth.' You want to help them find words.","Translate 'smooth' into something specific: low heat, soft texture, sweet aromas. Offer descriptors to choose from.","'Do you mean soft and creamy, or sweet like vanilla and caramel? This one has both, with a little baking spice at the end.'"],["You taste a whiskey blind with malt, smoke and vanilla.","Infer, don't claim: malted barley (malt), peat-dried malt (smoke), ex-bourbon cask (vanilla). Possibly Islay single malt, but tasting can't prove it.","'Malt, peat smoke and vanilla from ex-bourbon casks. I'd guess a peated single malt, maybe Islay.'"]]},{"id":"b1","track":"Beer","title":"Beer Ingredients","k":["Four core ingredients: malt, hops, yeast, water. Germany's 1516 Reinheitsgebot (purity law) originally allowed only barley, hops and water; yeast was added later once it was understood.","Malt: grain (usually barley) that is steeped, germinated, then dried in a kiln. Malting develops the enzymes that turn starch into sugar.","Kilning level sets color and flavor: pale malts give bread and cracker; caramel/crystal malts give caramel and toffee; roasted malts give coffee and chocolate.","Adjuncts like corn and rice lighten body and flavor (American lager). Wheat and oats add haze, protein and silky body.","Hops: flowers of the hop plant. Alpha acids give bitterness when boiled; the oils give aroma (citrus, pine, floral, herbal, tropical). They also help preserve beer.","Late-boil or dry hops = more aroma, less bitterness. Early-boil hops = more bitterness.","Yeast: ale yeast (Saccharomyces cerevisiae) ferments warmer and makes fruity esters. Lager yeast (Saccharomyces pastorianus) ferments cold and tastes cleaner.","Water is about 90%+ of beer. Its minerals shape style: soft Pilsen water suits delicate Pilsner; sulfate-rich Burton-on-Trent water sharpens hoppy pale ales."],"c":[["Four core beer ingredients?","Malt, hops, yeast, water."],["What is malting?","Steeping, germinating, then kiln-drying grain to develop starch-converting enzymes and flavor."],["Flavors of roasted malt?","Coffee, chocolate, roast — think stouts and porters."],["Flavors of caramel/crystal malt?","Caramel, toffee, raisin; adds color and sweetness."],["What do hop alpha acids do?","Give bitterness when boiled."],["What do hop oils give?","Aroma: citrus, pine, floral, herbal, tropical fruit."],["Ale vs lager yeast?","Ale: S. cerevisiae, warmer, fruity esters. Lager: S. pastorianus, colder, cleaner."],["Why are corn and rice used in American lagers?","They lighten body and flavor (adjuncts)."],["What is the Reinheitsgebot?","German beer purity law of 1516: originally barley, hops, water only."]],"q":[["A stout tastes of coffee and dark chocolate. The source:","Roasted malt","Coffee added in the boil","Dark hops","Black yeast","Kilning level sets color and flavor."],["A brewer wants more hop aroma with little extra bitterness:","Add hops late in the boil or dry hop","Add hops at the start of the boil","Use more roasted malt","Use lager yeast","Boiling makes bitterness."],["Which grain adds haze and a silky body (think hazy IPA)?","Oats or wheat","Corn","Rice","Roasted barley","Protein and texture."],["A beer is clean and crisp with no fruity notes. The yeast was most likely:","Lager yeast, fermented cold","Ale yeast, fermented warm","Wild yeast","Belgian yeast","Ale yeast makes esters."],["Sulfate-rich Burton-on-Trent water is famous for:","Hoppy pale ales","Delicate Pilsner","Stout","Lambic","Soft Pilsen water suits Pilsner."],["Corn and rice in American lager mainly:","Lighten body and flavor","Add bitterness","Add haze","Add sweetness and caramel","Adjuncts."],["Hop oils mainly contribute:","Aroma: citrus, pine, floral, tropical","Bitterness","Color","Alcohol","Alpha acids give bitterness."],["Caramel/crystal malts give:","Caramel and toffee","Coffee","Banana","Citrus","Pale = bread; roasted = coffee."]],"pro":[["A guest asks why their hazy IPA is cloudy.","Wheat and oats add protein and haze; heavy dry hopping adds more. It's the style, not a fault.","'It's brewed with oats and wheat and a lot of late hops, which makes it hazy and soft. That's the style.'"],["A guest wants a dark beer that isn't heavy.","Color comes from roasted malt, not strength. Schwarzbier, Dunkel or a dry Irish stout are dark but light-bodied.","'Dark doesn't mean heavy. Guinness is only about 4.2%, or try a Schwarzbier: black but crisp.'"],["A guest asks what makes a beer bitter vs. aromatic.","Hops boiled long give bitterness (alpha acids); hops added late or dry-hopped give aroma (oils).","'Hops boiled early make it bitter; hops added at the end give the citrus and pine aroma.'"]]},{"id":"b2","track":"Beer","title":"The Brewing Process","k":["Milling: malt is crushed to expose the starch.","Mashing: crushed malt soaks in hot water; enzymes turn starch into fermentable sugar. The sweet liquid is called wort.","Lautering: wort is separated from the spent grain.","Boil: about 60–90 minutes; hops are added, the wort is sterilized, and flavors are set.","Cooling, then fermentation: yeast turns sugar into alcohol and CO2. Ales ferment at roughly 60–72°F, lagers at roughly 45–55°F.","Conditioning: beer matures. Lagering means cold storage for weeks, which makes the beer smoother and cleaner.","Packaging: keg, can or bottle. Carbonation is forced (CO2 added) or natural (bottle-conditioned with a little sugar and yeast).","Key numbers: ABV = strength; IBU = bitterness units; SRM = color (low = pale straw, high = black)."],"c":[["What is wort?","The sweet sugary liquid made by mashing malt, before fermentation."],["What happens in the mash?","Enzymes convert malt starch into fermentable sugars in hot water."],["What is lautering?","Separating the wort from spent grain."],["Why boil wort?","Extract hop bitterness, sterilize, set flavors."],["What does lagering mean?","Cold storage/conditioning for weeks for a clean, smooth beer."],["What is bottle conditioning?","Natural carbonation in the bottle from added sugar and live yeast."],["IBU measures?","Bitterness (International Bitterness Units)."],["SRM measures?","Beer color."]],"q":[["A guest asks why an IPA tastes so bitter. Simplest true answer:","Lots of hops boiled in the wort","It's aged in oak","It's made with roasted grain","It has added salt","Alpha acids become bitter in the boil."],["Why does a lager taste 'cleaner' than many ales?","Cold fermentation with lager yeast makes fewer fruity esters","It has no hops","It's charcoal filtered","It's lower in alcohol by law","Yeast plus temperature."],["A beer at 100 IBU is likely:","Very bitter","Very sweet","Very strong","Very dark","IBU = bitterness units."],["A beer with a high SRM is:","Dark","Bitter","Strong","Hazy","SRM = color."],["Starch becomes sugar during:","Mashing","Boiling","Fermentation","Lagering","Enzymes at work."],["Lagering is:","Cold storage for weeks to smooth and clean the beer","Adding hops","Boiling","Bottle conditioning","Conditioning step."],["A bottle-conditioned beer gets its bubbles from:","A little sugar and yeast fermenting in the bottle","CO2 injection","Nitrogen","Shaking","Natural carbonation."],["Ales ferment at roughly:","60–72°F","45–55°F","32–40°F","90–100°F","Lagers ferment cooler."]],"pro":[["A guest asks what IBU means on your menu.","International Bitterness Units: a measure of bitterness, but perceived bitterness also depends on malt sweetness.","'It measures bitterness. Higher is more bitter, though a sweeter malt base can balance it.'"],["A guest asks why lagers 'take longer to make.'","Lager yeast ferments cold and slow, then the beer is lagered (cold-conditioned) for weeks to smooth out.","'Lager ferments cold and then rests cold for weeks, which is what makes it so clean and crisp.'"],["A guest asks if bottle-conditioned beer is 'flat.'","Bottle conditioning creates natural carbonation with a little yeast and sugar; there may be yeast sediment. Pour gently to leave it behind if they prefer.","'It's naturally carbonated in the bottle, so there's a little yeast at the bottom. I'll pour gently.'"]]},{"id":"b3","track":"Beer","title":"Keeping Beer Fresh","k":["Beer's three enemies: heat, light, and time (oxygen).","Keep beer cold. Warm storage speeds up staling and oxidation. Draft beer should be kept cold at all times, about 34–38°F.","Light: UV and blue light react with hop compounds and make 'lightstruck' (skunky) beer. Brown bottles protect best, green and clear bottles barely protect, and cans block light completely.","Oxidation: over time beer tastes like wet cardboard or paper, and hop aroma fades. Hoppy beers like IPAs are best fresh.","Most draft beer isn't pasteurized and is best within about 45–60 days. Pasteurized kegs last longer, roughly 90–120 days.","Rotate stock: first in, first out. Check the date codes.","Some strong, dark or sour beers (barleywine, imperial stout, lambic) can be cellared, but most beer is meant to be drunk fresh."],"c":[["Three enemies of beer?","Heat, light, time/oxygen."],["What causes skunky beer?","Light (UV/blue) reacting with hop compounds — lightstruck."],["Best packaging against light?","Cans, then brown bottles. Green/clear give little protection."],["Taste of oxidized beer?","Wet cardboard, papery; faded hops."],["Unpasteurized draft freshness window?","About 45–60 days, kept cold."],["Ideal draft beer storage temperature?","About 34–38°F, always cold."],["Stock rotation rule?","First in, first out (FIFO); check date codes."],["Which beers can age well?","Some strong, dark or sour beers: barleywine, imperial stout, lambic."]],"q":[["A six-pack in clear bottles sat in a sunny window. Likely fault:","Lightstruck (skunky)","Oxidized (cardboard)","Diacetyl (butter)","DMS (corn)","Light reacts with hop compounds."],["Draft beer should stay cold mainly because:","Warm beer stales faster and pours foamy","It's the law","Cold kills hops","Warm beer turns sour instantly","Keep it at about 34–38°F."],["An old IPA tastes like wet cardboard with faded hops:","Oxidation","Lightstruck","Infection","Diacetyl","Hoppy beers are best fresh."],["Best package for protecting beer from light:","Can","Clear bottle","Green bottle","Brown bottle","Cans block light completely."],["An unpasteurized draft keg is generally best within about:","45–60 days, kept cold","1 year","7 days","6 months","Pasteurized: roughly 90–120 days."],["Which beer could you reasonably cellar?","An imperial stout or barleywine","A hazy IPA","A light lager","A Kölsch","Most beer should be drunk fresh."],["Stock rotation for beer:","First in, first out; check date codes","Newest first","Random","Darkest first","FIFO."],["Beer's three enemies:","Heat, light and time (oxygen)","Cold, dark and carbonation","Glass, cans and kegs","Hops, malt and yeast","Keep it cold, dark and fresh."]],"pro":[["A guest says their bottled beer smells 'like a skunk.'","Lightstruck: light reacted with hop compounds, especially in clear or green bottles. Replace it and store beer dark.","Apologize, bring a fresh one from the back (or a can), and move clear bottles away from light."],["Your IPA keg is 4 months old.","Hoppy draft beer fades fast; unpasteurized draft is best within 45–60 days. Taste it; if the hops have faded and it tastes papery, talk to the manager about pulling it.","Taste it, check the date, and recommend rotating it off."],["A guest asks why the IPA tastes better at the brewery.","Freshness: hoppy beers lose aroma and oxidize quickly. Cold chain and time matter.","'IPAs are best super fresh. Hop aroma fades fast once it leaves the brewery.'"]]},{"id":"b4","track":"Beer","title":"Draft, Glassware & Pouring","k":["Basic draft system: keg → coupler → beer line → faucet, pushed by CO2 (or a CO2/nitrogen blend for long runs and nitro beers).","Clean draft lines at least every 2 weeks (the Brewers Association standard). Dirty lines make beer taste sour, buttery or off.","A 'beer clean' glass has no oil, residue or detergent left on it. Test it three ways: water sheets evenly (sheeting test), salt sticks evenly to the wet glass (salt test), and foam leaves rings as you drink (lacing).","Signs of a dirty glass: bubbles stuck to the sides, and foam that falls apart quickly.","Rinse the glass in cold water just before you pour.","How to pour: hold the glass at 45°, open the faucet fully and quickly, never let the faucet touch the beer, then straighten the glass to build about 1–1.5 inches of head.","The head carries aroma and releases CO2, so don't pour flat.","Glassware: shaker pint, nonic, Pilsner glass, Weizen glass (wheat beer), tulip (Belgian ales, IPA), snifter (strong beer), chalice/goblet (Belgian), stange (Kölsch), mug/stein."],"c":[["How often clean draft lines?","At least every 2 weeks."],["Three beer-clean glass tests?","Sheeting, salt test, lacing."],["Sign of a dirty glass?","Bubbles clinging to the sides; foam that collapses fast."],["Why rinse a glass before pouring?","Cools, removes dust/sanitizer, helps a clean pour."],["Proper pour technique?","45° angle, open faucet fully, faucet never touches beer, straighten to build 1–1.5 inch head."],["Why have a head on beer?","Releases aroma and CO2; better texture and presentation."],["What gas pushes nitro stouts?","Nitrogen/CO2 blend (nitro)."],["Glass for Kölsch?","Stange (tall, narrow cylinder)."],["Glass for Hefeweizen?","Weizen glass — tall vase shape."]],"q":[["Bubbles cling to the inside of a freshly poured glass. This means:","The glass isn't beer clean","The beer is fresh","The beer is over-carbonated","Normal for lagers","Residue gives bubbles a place to stick."],["When pouring a draft, the faucet should:","Open fully and quickly, and never touch the beer or glass","Open halfway for control","Rest in the foam","Be wiped with a towel mid-pour","Partial opening causes foam."],["Draft lines should be cleaned at least:","Every 2 weeks","Every 6 months","Once a year","Only when the beer tastes off","Brewers Association standard."],["A properly poured beer has about:","1–1.5 inches of head","No head","Half the glass in foam","A thin film only","Head carries aroma."],["The salt test for a beer-clean glass:","Salt sticks evenly to the wet glass","Salt slides off","Salt dissolves instantly","Salt turns cloudy","Plus sheeting and lacing."],["Before pouring, rinse the glass with:","Cold water","Hot water","Sanitizer, then serve wet","Nothing","Cools and cleans the glass."],["A Kölsch is traditionally served in a:","Stange","Snifter","Weizen glass","Stein","Narrow, tall cylinder."],["Nitro stouts use:","A nitrogen/CO2 blend and a stout faucet","Pure CO2","Pure oxygen","No gas","Creamy, cascading head."]],"pro":[["Your draft beers keep pouring foamy.","Common causes: beer too warm, dirty lines, wrong gas pressure, partially opened faucet. Start with temperature, then lines.","Check keg temperature (34–38°F), open the faucet fully, check when lines were cleaned, tell the manager about pressure."],["A guest's beer has bubbles stuck all over the glass.","Not beer clean: residue or oil. Replace the glass, and check the dish setup.","Re-pour into a properly cleaned, cold-rinsed glass, and flag the glass washer."],["A guest asks for 'no head, please.'","Some head carries aroma and releases CO2, but you can honor it: pour with a smaller head.","Pour with a thin head and mention, 'A little foam keeps the aroma in, but I kept it small for you.'"]]},{"id":"b5","track":"Beer","title":"Tasting & Off-Flavors","k":["How to taste: Appearance (color, clarity, head) → Aroma (malt, hops, yeast) → Flavor → Mouthfeel (body, carbonation) → Finish.","Diacetyl: butter or butterscotch flavor. Caused by poor fermentation or dirty draft lines.","DMS: cooked corn or canned vegetables. Usually from a short or covered boil, or pale malt.","Acetaldehyde: green apple. The beer is too young or fermentation was rushed.","Lightstruck: skunk. Caused by light reacting with hops.","Oxidation: wet cardboard or paper, and sometimes sherry notes. The beer is old or got air.","Acetic or lactic sourness where it doesn't belong: infection, often from dirty lines.","Some 'faults' are part of the style. Banana esters and clove phenols are normal in Hefeweizen, and sourness is normal in Gose or lambic."],"c":[["Butter/butterscotch in beer?","Diacetyl — fermentation issue or dirty draft lines."],["Cooked corn / creamed corn?","DMS (dimethyl sulfide)."],["Green apple?","Acetaldehyde — beer too young/rushed."],["Skunk?","Lightstruck."],["Wet cardboard?","Oxidation — stale beer."],["Unwanted vinegar/sour in a lager?","Infection, often dirty draft lines."],["Banana in Hefeweizen — fault?","No. Banana esters (and clove) are expected in the style."],["Tasting order?","Appearance → aroma → flavor → mouthfeel → finish."]],"q":[["A guest says their draft pilsner tastes like movie-theater butter:","Diacetyl, often from dirty lines","Oxidation","Lightstruck","Correct for the style","Check line cleaning."],["Cooked corn or canned vegetables:","DMS","Diacetyl","Acetaldehyde","Oxidation","Often a short or covered boil."],["Green apple in a young lager:","Acetaldehyde","DMS","Diacetyl","Lightstruck","Too young or rushed."],["Clove and banana in a German wheat beer:","Correct for the style","Infection","Oxidation","Dirty lines","Hefeweizen yeast character."],["An IPA tastes sour and vinegary on draft:","Likely infection from dirty lines","Correct for the style","Lightstruck","Fresh hops","Unless it's a sour style."],["Sherry-like notes in an old pale ale suggest:","Oxidation","Diacetyl","Fresh hops","Wild yeast","Age and air."],["The beer tasting sequence:","Appearance → aroma → flavor → mouthfeel → finish","Flavor → aroma → finish","Aroma → flavor only","Finish → mouthfeel → flavor","Like wine and spirits."],["Butterscotch in a draft lager is most often fixed by:","Cleaning the draft lines","Pouring colder","Adding CO2","Using a new glass","Diacetyl from lines."]],"pro":[["A guest says the house lager tastes like butter popcorn.","Diacetyl, often from dirty draft lines. Swap the beer, and alert the manager that lines may need cleaning.","Apologize, offer a different beer, and tell the manager the lager line may need cleaning."],["A guest sends back a Hefeweizen for tasting 'like bananas.'","Banana and clove are correct for the style. Explain kindly and offer another if they don't like it.","'That banana and clove is the yeast, it's how this style should taste. If it's not your thing, I can get you a crisp Pilsner.'"],["A guest says a stout tastes like wet cardboard.","Oxidation: old or exposed to air. Check the date and rotate.","Apologize, check the date code, pour a fresher beer, and pull old stock."]]},{"id":"b6","track":"Beer","title":"Lager Styles","k":["German Pilsner: pale, crisp, dry, with spicy/floral noble hops and firm bitterness.","Czech (Bohemian) Pilsner: the original Pilsner (Pilsen, 1842). Richer malt, soft bitterness from Saaz hops.","Munich Helles: pale and malty-bready with gentle hops. Softer than Pilsner.","Märzen / Oktoberfest: amber, toasty malt, clean, medium body.","Dunkel: a dark Munich lager. Bread crust and light chocolate, not roasty. Schwarzbier is a black lager that's light-bodied with gentle roast.","Bock: strong, malty, amber to brown. Doppelbock is stronger and richer, often with names ending in '-ator'. Maibock is pale and a little hoppier.","American lager: very pale, light-bodied, often brewed with corn or rice, very cold and crisp. Light lager is lower in calories.","Vienna lager: amber, toasty, and a bit drier (many Mexican amber lagers trace back to it)."],"c":[["Original Pilsner comes from?","Pilsen, Czech Republic (1842)."],["Czech vs German Pilsner?","Czech: richer malt, soft Saaz bitterness. German: drier, crisper, firmer bitterness."],["Munich Helles?","Pale, bready-malty, gentle hops — softer than Pilsner."],["Märzen/Oktoberfest?","Amber, toasty malt, clean lager."],["Doppelbock?","Strong, rich, malty lager; names often end in '-ator'."],["Schwarzbier?","Black lager — light body, gentle roast."],["American lager adjuncts?","Corn or rice."],["Vienna lager?","Amber, toasty, drier lager; ancestor of many Mexican ambers."]],"q":[["A guest finds Pilsners too bitter but wants crisp and light:","Munich Helles","German Pilsner","West Coast IPA","Doppelbock","Soft, bready, gentle hops."],["Malty, toasty, amber German lager for fall:","Märzen/Oktoberfest","Helles","Schwarzbier","Czech Pilsner","Clean, medium body."],["Black but light-bodied lager:","Schwarzbier","Imperial stout","Doppelbock","Porter","Gentle roast."],["Saaz hops and a soft, rich malt base:","Czech Pilsner","German Pilsner","American lager","Helles","The original Pilsner style."],["A strong lager named something like 'Celebrator':","Doppelbock","Maibock","Dunkel","Vienna lager","'-ator' names."],["Many Mexican amber lagers trace back to:","Vienna lager","Dunkel","Bock","Pilsner","Amber, toasty, a bit dry."],["Dark Munich lager with bread crust, not roasty:","Dunkel","Schwarzbier","Porter","Märzen","Light chocolate."],["A pale, slightly hoppier bock:","Maibock","Doppelbock","Eisbock","Dunkel","Spring bock."]],"pro":[["A guest wants 'a beer like Modelo Negra.'","That's in the Vienna/Munich dunkel family: amber to dark, toasty, clean lager.","'Try a Vienna lager or a Märzen: toasty, malty and clean.'"],["A guest wants the 'crispest, lightest' beer you have.","Light American lager or a German Pilsner (crisper and more bitter) or Helles (softer).","'For crisp and light, a Pilsner; if you want it softer and less bitter, a Helles.'"],["A guest asks what a Doppelbock is.","A strong, rich, malty lager, often with '-ator' names. Historically brewed by monks as 'liquid bread.'","'A strong, malty German lager: bread, caramel, a little dark fruit. Around 7–8% or more.'"]]},{"id":"b7","track":"Beer","title":"Ale Styles: British & American","k":["Ales are fermented warmer and are often fruitier than lagers.","English Bitter / ESB: amber, balanced, with earthy English hops and caramel malt. Often low ABV and served on cask.","Pale Ale: American pale ale is citrusy and piney from American hops (Cascade). English pale ale is more earthy and malty.","IPA: hoppy and bitter. West Coast IPA is dry, clear and bitter. Hazy/New England IPA is juicy, soft and low in bitterness. Double/Imperial IPA is stronger.","Brown Ale: nutty and caramel. Porter: chocolate and roast, but softer than stout.","Stout: Dry Irish stout (Guinness) is roasty, dry and often served on nitro. Milk stout has lactose for sweetness. Oatmeal stout is silky. Imperial stout is strong and intense.","Barleywine: very strong, malty and warming. Can age well.","Hybrids: Kölsch (Cologne) and California Common/steam beer use ale or lager yeast in a non-standard way. Cream ale is another example."],"c":[["West Coast vs Hazy IPA?","West Coast: clear, dry, bitter, pine/citrus. Hazy: juicy, soft, low bitterness, opaque."],["Double/Imperial IPA?","Stronger, more intense IPA (often 8%+)."],["American Pale Ale signature hop?","Cascade — citrus/grapefruit."],["Porter vs Stout?","Both dark; porter generally softer chocolate, stout more roasty."],["Dry Irish Stout?","Roasty, dry, light-to-medium body, often nitro (Guinness)."],["Milk stout?","Stout sweetened with lactose."],["Kölsch?","Pale, delicate hybrid from Cologne; ale yeast, lager-like cold conditioning; served in a stange."],["Barleywine?","Very strong, malty ale; can age."]],"q":[["Guest loves juicy, tropical, low-bitterness beer:","Hazy/New England IPA","West Coast IPA","English Bitter","Barleywine","Soft and juicy."],["Clear, dry, bitter IPA with pine and citrus:","West Coast IPA","Hazy IPA","Milk stout","Brown ale","Classic American IPA."],["Guinness is classically a:","Dry Irish stout on nitro","Milk stout","Imperial stout","Porter","Roasty and dry."],["A stout sweetened with lactose:","Milk stout","Oatmeal stout","Dry stout","Imperial stout","Lactose isn't fermented by yeast."],["The hop that defined American pale ale's grapefruit character:","Cascade","Saaz","Fuggle","Hallertau","Citrusy American hop."],["Pale, delicate ale from Cologne served in a stange:","Kölsch","Helles","Pilsner","Cream ale","A hybrid."],["Porter vs. stout, broadly:","Porter is softer, chocolatey; stout is more roasty","Porter is a lager","Stout is always sweet","They're unrelated","Overlap is real."],["Very strong, malty, warming ale that can age:","Barleywine","ESB","Kölsch","Hazy IPA","Cellar-worthy."]],"pro":[["A guest says IPAs are too bitter but likes fruity flavors.","Hazy/New England IPAs are juicy and low in bitterness. A pale ale is also gentler.","'Try a hazy IPA: it's all tropical fruit and soft, with much less bitterness.'"],["A guest wants a stout but 'not heavy.'","Dry Irish stout is low in alcohol and light-bodied, especially on nitro.","'Try a dry Irish stout: roasty and creamy, but only about 4%.'"],["A guest asks what a Kölsch is.","A pale, delicate hybrid from Cologne: ale yeast, cold conditioned like a lager. Served in a stange.","'It's from Cologne: brewed with ale yeast but conditioned cold like a lager, so it's crisp with a little fruit.'"]]},{"id":"b8","track":"Beer","title":"Belgian, Wheat & Sour Beers","k":["German Hefeweizen: hazy, at least 50% wheat, with banana and clove from the yeast. Served in a Weizen glass.","Belgian Witbier: wheat beer spiced with coriander and orange peel. Hazy and refreshing.","Belgian ales get spicy, fruity notes and high carbonation from their yeast. Trappist beers are brewed by or under Trappist monks (e.g., Chimay, Westmalle, Rochefort, Orval).","Dubbel: brown, dark fruit (raisin, plum). Tripel: golden, strong, dry, spicy. Quad / Belgian Dark Strong: very rich and strong.","Saison: farmhouse ale. Dry, peppery, fruity, highly carbonated.","Berliner Weisse: low ABV, tart wheat beer. Gose: tart, with salt and coriander.","Lambic: Belgian beer fermented by wild yeast and bacteria (spontaneous fermentation). Gueuze is a blend of young and old lambic. Kriek is lambic with cherries.","Flanders Red / Oud Bruin: sour, aged in oak, with cherry and vinegar-like tang."],"c":[["Hefeweizen signature flavors?","Banana and clove (from yeast)."],["Witbier spices?","Coriander and orange peel."],["Dubbel vs Tripel?","Dubbel: brown, dark fruit. Tripel: golden, strong, dry, spicy."],["What is a Trappist beer?","Brewed by/under Trappist monks (Chimay, Westmalle, Orval…)."],["Saison?","Dry, peppery, fruity farmhouse ale, high carbonation."],["Gose?","Tart wheat beer with salt and coriander."],["Lambic?","Spontaneously fermented Belgian wild beer."],["Gueuze?","Blend of young and old lambic."],["Kriek?","Lambic with cherries."]],"q":[["Coriander and orange peel, hazy, Belgian:","Witbier","Hefeweizen","Saison","Tripel","Great with mussels."],["Tart, slightly salty with coriander:","Gose","Berliner Weisse","Lambic","Flanders Red","Salt and coriander."],["Golden, strong, dry and spicy Belgian:","Tripel","Dubbel","Quad","Witbier","Dubbel is brown, dark fruit."],["A blend of young and old lambic:","Gueuze","Kriek","Faro","Oud Bruin","Kriek is lambic with cherries."],["Spontaneous fermentation with wild microbes:","Lambic","Saison","Tripel","Hefeweizen","Belgium's wild beer."],["A Trappist beer must be brewed:","By or under the supervision of Trappist monks","In Belgium only","At over 9% ABV","With wild yeast","Chimay, Westmalle, Orval."],["Dry, peppery, fruity, highly carbonated farmhouse ale:","Saison","Dubbel","Kölsch","Gose","Great with cheese."],["Sour, oak-aged, cherry and vinegar tang:","Flanders Red","Witbier","Tripel","Hefeweizen","Oud Bruin is its cousin."]],"pro":[["A guest is curious about sour beer but nervous.","Start gentle: Berliner Weisse (low ABV, lightly tart) or a fruited Gose, then Gueuze or Flanders Red.","'Try a Berliner Weisse: light and only gently tart. If you like it, the Gueuze is the deep end.'"],["A guest asks why Belgian beers taste spicy without spices.","Belgian yeast strains produce peppery phenols and fruity esters, plus high carbonation.","'It's the yeast. Belgian strains make peppery, fruity flavors on their own.'"],["A guest orders a Trappist beer and asks what that means.","Brewed by or under the supervision of Trappist monks at a recognized abbey (e.g., Westmalle, Chimay, Orval, Rochefort).","'It's brewed at a monastery under the monks' supervision. Only a handful in the world can use the name.'"]]},{"id":"b9","track":"Beer","title":"Beer & Food Pairing","k":["Three C's: Cut, Complement, Contrast.","Cut: carbonation and bitterness scrub fat. An IPA with fried chicken or a Pilsner with fries.","Complement: match similar flavors. Roasty stout with chocolate cake or grilled meat; caramel malt with roast pork.","Contrast: opposites that balance. Salty oysters with dry stout; rich cheese with tart Gueuze.","Match intensity: a delicate beer goes with delicate food, and a big beer goes with big food.","Hop bitterness and alcohol make chili heat feel hotter. For spicy food, choose a malty, lower-bitterness beer, or a crisp, low-ABV lager.","Classic matches: Witbier + mussels; Hefeweizen + brunch; Porter + barbecue; Imperial stout + dessert; Saison + cheese."],"c":[["Three C's of beer pairing?","Cut, Complement, Contrast."],["How does beer 'cut' fat?","Carbonation and bitterness scrub the palate."],["Hops with spicy food?","Bitterness amplifies chili heat — choose malty or low-bitterness beer."],["Classic stout + seafood pairing?","Dry stout with oysters."],["Witbier pairing?","Mussels, salads, light seafood."],["Imperial stout pairing?","Chocolate desserts — complement."],["Golden pairing rule?","Match intensity."]],"q":[["Spicy wings; guest wants a beer that won't make it hotter:","Malty, low-bitterness beer (e.g., Märzen)","Double IPA","Imperial stout","Barleywine","Bitterness and alcohol amplify heat."],["IPA with fried chicken is mainly an example of:","Cut","Complement","Contrast","Clash","Carbonation and bitterness scrub fat."],["Imperial stout with chocolate cake:","Complement","Cut","Contrast","Clash","Similar flavors."],["Dry stout with oysters is a classic:","Contrast","Complement","Cut","Clash","Salty and roasty."],["A big barleywine with a delicate salad breaks which rule?","Match intensity","Cut","Contrast","Complement","Big with big."],["Witbier is a classic match for:","Mussels","Chocolate cake","Barbecue brisket","Blue cheese","Citrus and spice with shellfish."],["Porter is a classic match for:","Barbecue","Oysters only","Sushi","Fruit salad","Roast meets roast."],["Rich cheese with tart Gueuze is:","Contrast","Complement","Cut only","Clash","Opposites balance."]],"pro":[["A guest wants a beer with fried chicken.","Cut: carbonation and bitterness scrub fat. An IPA or a crisp Pilsner.","'A crisp Pilsner or an IPA. The bubbles and bitterness cut right through the fried crust.'"],["A guest wants a beer with chocolate dessert.","Complement: imperial stout or porter; or contrast with a Kriek (cherry and chocolate).","'An imperial stout matches the chocolate, or a Kriek gives you cherry and chocolate.'"],["A guest wants a beer with very spicy curry.","Avoid high bitterness and high alcohol. Malty, low-bitterness, lower-ABV: Märzen, Helles, a crisp lager.","'A Helles or Märzen: malty and soft, so it won't make the heat worse.'"]]},{"id":"k1","track":"Sake","title":"What Is Sake?","k":["Sake (nihonshu) is a Japanese brewed drink made from rice, water, koji and yeast. It isn't distilled and it isn't rice wine (it's brewed more like beer).","ABV is usually around 15–16%. Undiluted genshu runs about 17–20%.","Sake rice (sakamai) has large grains with a starchy core called shinpaku. Famous varieties: Yamada Nishiki ('king of sake rice'), Omachi, Gohyakumangoku and Miyama Nishiki.","Water: hard water (Nada region) gives firm, dry sake. Soft water (Fushimi) gives softer sake.","Koji is the mold Aspergillus oryzae grown on steamed rice. It makes the enzymes that turn rice starch into sugar.","Polishing (seimai): the outer layers of the grain hold fats and proteins that cause rough flavors. The polishing ratio (seimaibuai) is how much of the grain remains. 60% means 40% was polished away.","Brewery = kura (sakagura). Master brewer = tōji."],"c":[["Four sake ingredients?","Rice, water, koji, yeast."],["Is sake rice wine?","No — it's brewed (starch converted like beer), not fermented from fruit."],["Typical sake ABV?","About 15–16% (genshu 17–20%)."],["What is koji?","Aspergillus oryzae mold grown on steamed rice; makes starch-converting enzymes."],["'King of sake rice'?","Yamada Nishiki."],["What is seimaibuai?","Polishing ratio — % of the rice grain remaining. 50% = half polished away."],["Why polish rice?","Remove outer fats/proteins that give rougher flavors; cleaner, more aromatic sake."],["What is a tōji?","Master sake brewer."],["What is a kura?","A sake brewery."]],"q":[["A guest calls sake 'rice wine.' The most accurate correction:","It's brewed more like beer: koji converts starch to sugar, then yeast ferments it","It's distilled like shochu","It's correct; sake is wine","It's a rice liqueur","Starch-based, brewed."],["A sake label says seimaibuai 35%. That means:","35% of each grain remains; 65% was polished away","35% was polished away","35% ABV","35% rice, 65% water","Lower number = more polished."],["A guest wants a firm, dry sake. Which water region fits?","Nada (hard water)","Fushimi (soft water)","Any; water doesn't matter","Okinawa","Hard water ferments vigorously; dry, firm style."],["Koji's job in sake:","Make enzymes that convert rice starch into sugar","Ferment sugar into alcohol","Add color","Filter the sake","Like malting in beer."],["Why is premium sake rice polished?","The outer layers hold fats and proteins that cause rough flavors","To make it white for color","To speed up fermentation only","To add sweetness","The starchy core (shinpaku) is what brewers want."],["The 'king of sake rice':","Yamada Nishiki","Omachi","Gohyakumangoku","Koshihikari","Omachi is the earthy heirloom."],["Typical sake ABV after dilution:","About 15–16%","About 25%","About 5–7%","About 40%","Genshu (undiluted) runs about 17–20%."],["The tōji is:","The master brewer","The rice farmer","The sake cup","The brewery building","The kura is the brewery."]],"pro":[["A guest asks, 'Is sake just rice vodka?'","Sake is brewed, not distilled: koji converts starch to sugar and yeast ferments it, like beer. It's about 15–16% ABV.","'It's actually brewed, a bit like beer, not distilled. It's about the strength of a big wine.'"],["A guest asks why one sake costs four times another.","Polishing ratio, rice variety, brewing method and labor. Heavily polished daiginjo uses far more rice per bottle and slow, cold fermentation.","'This one is polished down to 40% of each grain, so it takes much more rice and a slow, cold brew. That's why it's so delicate and fruity.'"],["A guest asks what 'Yamada Nishiki' on the label means.","It's the rice variety, the 'king of sake rice,' prized for its big starchy core. It signals a premium bottle.","'That's the rice, the most famous sake rice in Japan. It makes elegant, balanced sake.'"]]},{"id":"k2","track":"Sake","title":"How Sake Is Brewed","k":["Polish rice → wash and soak → steam → make koji → make the yeast starter → mash → press → filter → pasteurize → age → bottle.","Shubo / moto (yeast starter): a small batch that grows a large, healthy yeast population.","Multiple parallel fermentation: koji turns starch into sugar while yeast turns sugar into alcohol, both in the same tank. That's how sake reaches about 20% ABV naturally before it's diluted.","Sandan shikomi: rice, koji and water are added to the main mash (moromi) in three steps over four days.","Kimoto and yamahai are traditional slow starters that use natural lactic bacteria. They give richer, gamier, more acidic sake. Sokujō (quick method) uses added lactic acid and is cleaner and more modern.","Pressing separates the sake from the lees (sake kasu).","Pasteurization (hi-ire) is usually done twice. Unpasteurized sake is called namazake."],"c":[["What is multiple parallel fermentation?","Koji converting starch to sugar while yeast converts sugar to alcohol, simultaneously in one tank."],["What is the shubo/moto?","Yeast starter."],["What is moromi?","The main fermenting mash."],["What is sandan shikomi?","Three-step addition of rice, koji, water to the mash over four days."],["Kimoto/yamahai style?","Traditional natural-lactic starters; richer, gamey, higher acidity."],["Sokujō?","Modern quick starter with added lactic acid; cleaner."],["Sake kasu?","Lees left after pressing; used in cooking."],["Hi-ire?","Pasteurization, usually done twice."]],"q":[["Sake can reach about 20% ABV naturally because:","Multiple parallel fermentation: koji makes sugar while yeast makes alcohol, in the same tank","Spirit is always added","It's distilled once","It ferments for a year","Sugar is fed gradually, so yeast keeps working."],["A sake labeled yamahai will likely taste:","Richer, gamier and more acidic","Light and floral","Sweet and cloudy","Sparkling","Traditional slow starter with natural lactic bacteria."],["Sokujō (the modern quick starter) uses:","Added lactic acid, giving a cleaner style","Pole-ramming","Wild yeast only","No yeast","Kimoto and yamahai rely on natural lactic bacteria."],["Sandan shikomi means:","Adding rice, koji and water to the mash in three steps over four days","Pasteurizing three times","Polishing in three stages","Pressing three times","Builds a healthy, controlled fermentation."],["Namazake means the sake is:","Unpasteurized","Undiluted","Unfiltered","Aged","Must stay refrigerated."],["Sake kasu is:","The lees left after pressing","A type of sake cup","The yeast starter","A sweet sake","Used in cooking."],["Most sake is pasteurized:","Twice","Never","Once","Three times","Hi-ire. Namazake skips it."],["Kimoto vs. yamahai:","Yamahai skips kimoto's pole-ramming step","They're unrelated","Kimoto uses added lactic acid","Yamahai is sparkling","Both are traditional slow starters."]],"pro":[["A guest asks why this sake tastes 'funky, almost like yogurt.'","Kimoto and yamahai use natural lactic bacteria in the starter: richer, gamier, more acidic, sometimes dairy-like.","'It's a yamahai, a traditional method that uses natural lactic bacteria. That gives it that rich, tangy, savory flavor.'"],["A guest asks how sake gets so strong without distillation.","Multiple parallel fermentation: starch is converted to sugar and sugar to alcohol in the same tank at the same time, so yeast keeps working up to about 20%.","'The rice is turned into sugar and alcohol at the same time in one tank, so it ferments all the way to about 20% before it's diluted.'"],["A guest wants something 'fresh and lively.'","Namazake (unpasteurized) is bright and zippy; must be kept cold.","'Try this namazake. It's unpasteurized, so it's super fresh and lively.'"]]},{"id":"k3","track":"Sake","title":"Sake Grades","k":["Premium sake (tokutei meishōshu) is classified by two things: polishing ratio, and whether distilled alcohol was added.","Junmai means pure rice: no added alcohol. It has no legal minimum polishing ratio, though many are 70% or lower. Usually fuller, richer, with more umami and acidity.","Honjozo: no more than 70% of the grain remains, plus a small amount of added brewer's alcohol. Lighter and drier, often good warm.","Ginjo / Junmai Ginjo: no more than 60% remains. Fruity and floral (apple, melon, pear, banana), made with cold, slow fermentation.","Daiginjo / Junmai Daiginjo: no more than 50% remains. The most refined and aromatic grade.","Tokubetsu ('special'): used on Junmai or Honjozo made with extra polishing (60% or lower) or a special method.","Futsūshu: table sake, which is most sake made. No premium requirements.","A small amount of added alcohol isn't 'cheating'. It brings out aroma and lightens the body."],"c":[["What does junmai mean?","Pure rice — no added distilled alcohol."],["Honjozo polishing requirement?","≤70% remaining, with a small amount of added alcohol."],["Ginjo polishing?","≤60% remaining."],["Daiginjo polishing?","≤50% remaining."],["Ginjo aroma profile?","Fruity, floral: apple, melon, pear, banana."],["Tokubetsu?","'Special' — extra polishing (≤60%) or special method."],["Futsūshu?","Table sake; no premium classification."],["Why add a little alcohol in honjozo/ginjo?","Lifts aroma and lightens body — not a shortcut."]],"q":[["A label says Junmai Daiginjo. You know:","No added alcohol, and no more than 50% of the grain remains","Added alcohol, 60% remaining","No added alcohol, 70% remaining","It's undiluted","The top grade by polishing."],["A guest assumes added alcohol means cheap sake. Best reply:","A small amount of brewer's alcohol is a style choice that lifts aroma and lightens body","They're right","Only futsūshu has added alcohol","It's illegal in premium sake","Many great ginjo and daiginjo use it."],["Junmai has a legal minimum polishing ratio of:","None (many are 70% or lower)","70%","60%","50%","Pure rice is the defining rule."],["Honjozo requires:","No more than 70% remaining, plus a little added alcohol","No more than 50%, no alcohol","No more than 60%, no alcohol","Any polish, no alcohol","Lighter and drier."],["Ginjo-grade fruity aromas (melon, apple, banana) come from:","Cold, slow fermentation","Aging in cedar","Added fruit","Hot fermentation","Plus high polishing."],["Tokubetsu ('special') on a Junmai means:","Extra polishing (60% or lower) or a special method","Aged 10 years","Sparkling","Sweet","A step above standard."],["Which grade is most likely full, rich and savory with umami?","Junmai","Daiginjo","Futsūshu","Sparkling sake","Less polishing, more character."],["Most sake made is:","Futsūshu (table sake)","Daiginjo","Junmai Ginjo","Namazake","No premium requirements."]],"pro":[["A guest says, 'I only drink junmai because added alcohol is cheating.'","Junmai is great, but a small addition of brewer's alcohol is a traditional technique to lift aroma and lighten body, used in many top ginjo and daiginjo.","'Junmai is great. But many of the best daiginjo add a little alcohol to lift the aroma. Want to taste one side by side?'"],["A guest wants the 'best' sake on the list.","Grade isn't the same as preference. Daiginjo is the most refined and aromatic; junmai is richer and savory. Ask what they like.","'Do you want something light, fruity and elegant, or richer and savory?' Then match daiginjo or junmai."],["A guest asks what 'Junmai Ginjo' means.","Junmai = no added alcohol. Ginjo = at least 40% polished away (60% or less remains), brewed cold and slow for fruity aromas.","'No added alcohol, and the rice is polished to 60% or less, so it's fruity and floral.'"]]},{"id":"k4","track":"Sake","title":"Sake Styles & Labels","k":["Nigori: cloudy and coarsely filtered, with rice sediment. Usually sweeter and creamier. Gently mix it before pouring.","Namazake: unpasteurized, fresh and lively. Must be kept refrigerated.","Genshu: undiluted, about 17–20% ABV, bold.","Koshu / jukusei: aged sake. Amber color, with nutty, caramel, soy notes.","Taruzake: aged in cedar casks, with a woody, cedar aroma.","Sparkling sake (happō-sei): bubbly and often lower in alcohol. (Don't confuse it with happōshu, a Japanese low-malt beer.)","Nihonshu-do / SMV (Sake Meter Value): positive (+) usually means drier, negative (−) usually means sweeter. Higher acidity makes sake taste drier.","Useful label words: amakuchi = sweet, karakuchi = dry, kimoto/yamahai = traditional starter."],"c":[["Nigori?","Cloudy, coarsely filtered sake with rice sediment; usually sweeter, creamy."],["Namazake storage?","Always refrigerated — unpasteurized."],["Genshu?","Undiluted sake, about 17–20% ABV."],["Koshu?","Aged sake: amber, nutty, caramel, soy."],["Taruzake?","Cedar-cask aged sake."],["SMV +5 vs −5?","+5 tends drier; −5 tends sweeter."],["Karakuchi vs amakuchi?","Karakuchi = dry; amakuchi = sweet."],["How to serve nigori?","Gently invert/swirl to mix sediment; serve chilled."]],"q":[["A guest wants sweet, creamy, cloudy sake:","Nigori","Genshu","Koshu","Taruzake","Gently mix before pouring."],["Positive SMV (nihonshu-do) generally means:","Drier","Sweeter","Higher alcohol","More acidic","Higher acidity also reads drier."],["Sake aged in cedar casks:","Taruzake","Koshu","Nigori","Kijōshu","Woody, cedar aroma."],["Karakuchi on a label means:","Dry","Sweet","Cloudy","Aged","Amakuchi = sweet."],["Koshu (jukusei) shows:","Amber color with nutty, caramel and soy notes","Clear and floral","Cloudy and sweet","Sparkling and light","Aged sake."],["A sake with SMV +2 but very high acidity will likely taste:","Drier than the SMV alone suggests","Very sweet","Flat","Sparkling","Acid reads as dryness."],["Happō-sei vs. happōshu:","Sparkling sake vs. a Japanese low-malt beer","Both are sparkling sake","Both are beer","Unfiltered vs. filtered sake","Easy to confuse."],["Which must always be refrigerated?","Namazake","Koshu","Taruzake","Futsūshu","Unpasteurized."]],"pro":[["A guest wants a sweet sake for dessert.","Nigori (creamy, sweet), umeshu-style or a negative-SMV sake. Mention SMV if they want to read labels.","'Try the nigori: creamy and sweet, with rice texture. Great with dessert.'"],["A guest reads 'SMV +8' and asks what it means.","Sake Meter Value: positive usually means drier. Acidity also changes perception.","'Plus numbers usually mean drier; minus means sweeter. Plus eight is pretty dry.'"],["A bottle of namazake was left out on the backbar overnight.","Unpasteurized sake must stay refrigerated; warm storage can spoil it. Taste it before serving and tell the manager.","Taste it; if it's off, pull it, log it, and keep all nama in the fridge."]]},{"id":"k5","track":"Sake","title":"Serving & Pairing Sake","k":["Temperature matters a lot. Chilled (reishu, about 41–50°F) suits aromatic ginjo and daiginjo, namazake and sparkling sake.","Room temperature (hiya) or warm (kan): junmai, honjozo, kimoto/yamahai and aged sake often open up when warmed. Atsukan (hot) is about 122°F/50°C. Don't heat premium aromatic sake.","Vessels: the tokkuri is the serving flask; the ochoko or guinomi is the cup. The masu (wooden box) is traditional, but its cedar can mask delicate aromas. A wine glass shows off ginjo aromas well.","Etiquette: pour for others, not yourself. Hold the tokkuri with two hands when pouring for someone senior.","Storage: keep it cold and dark, and drink most sake within about a year of bottling. Once opened, refrigerate and finish within about a week or two.","Pairing: sake's umami and low acidity work with sushi, sashimi, tempura, miso, soy, cheese, even fried chicken. Ginjo goes with delicate dishes; junmai and yamahai go with richer, savory food.","Sake has no tannin, so it's a great match for seafood that would make red wine taste metallic."],"c":[["Best temp for daiginjo?","Chilled (reishu)."],["Sake styles good warmed?","Junmai, honjozo, kimoto/yamahai, aged."],["Atsukan?","Hot sake, about 50°C / 122°F."],["Tokkuri?","Ceramic serving flask."],["Ochoko?","Small sake cup."],["Masu drawback?","Cedar wood can mask delicate aromas."],["Sake etiquette?","Pour for others, not yourself."],["How long after opening?","Refrigerate; best within about 1–2 weeks."],["Why sake with seafood?","No tannin and gentle acidity, with umami that complements fish."]],"q":[["A guest orders an expensive Junmai Daiginjo 'hot.' Best response:","Suggest it chilled; heat hides its delicate aromas, and offer a warmable sake","Heat it to 50°C","Refuse to serve it","Serve it over ice","Steer kindly."],["Atsukan is about:","122°F / 50°C","86°F / 30°C","41°F / 5°C","176°F / 80°C","Hot sake."],["Which sake styles often improve warm?","Junmai, honjozo, kimoto/yamahai and aged sake","Daiginjo and namazake","Sparkling sake","Nigori only","Richer styles open up."],["A masu can mask a delicate ginjo because:","Its cedar aroma competes with the sake","It's too small","It's plastic","It warms the sake","A wine glass shows off aromas."],["Etiquette: who pours the sake?","You pour for others, not yourself","Each guest pours their own","Only the host pours","The youngest pours for everyone","Two hands when pouring for someone senior."],["Opened sake should be:","Refrigerated and finished within about 1–2 weeks","Kept at room temperature for months","Frozen","Finished within an hour","Keep it cold and dark."],["Why can sake beat red wine with seafood?","No tannin, so no metallic clash","More alcohol","More sweetness","Bubbles","Umami-friendly too."],["Pairing: rich, savory grilled pork belly. Best sake:","A yamahai or kimoto junmai","A delicate daiginjo","A sparkling sake","A nigori","Richer sake with richer food."]],"pro":[["A table orders sushi and a big California Cabernet.","Tannic reds and raw fish can taste metallic. Offer sake (no tannin) or a crisp white, but respect the choice.","'With sushi, sake or a crisp white really shines. Red can taste a little metallic with fish. Want a taste of the junmai ginjo?'"],["A guest wants warm sake in winter.","Warm suits junmai, honjozo, kimoto/yamahai, aged sake. Warm gently in a water bath, never microwave premium sake.","'This yamahai is great warm: it gets rounder and more savory. I'll warm it gently for you.'"],["You're pouring sake for a group including the restaurant's owner.","Pour for others, not yourself; two hands on the tokkuri for someone senior; refill before cups are empty.","Pour for each guest with two hands for the owner, keep cups topped, never let them pour for themselves."]]},{"id":"c1","track":"Cocktails","title":"Cocktail Fundamentals","k":["Shake drinks that have citrus, juice, dairy or egg. Shaking chills, dilutes, aerates and gives texture. Shake hard for about 10–15 seconds.","Stir drinks that are all spirits (Martini, Manhattan, Negroni). Stirring chills and dilutes while keeping the drink silky and clear. About 20–30 seconds.","Build drinks with carbonation in the glass (highballs). Never shake soda.","Dry shake: shake egg white without ice first to build foam, then shake again with ice. A reverse dry shake (ice first, then without) works too.","Dilution is an ingredient. Water from ice is a large part of every finished drink: Dave Arnold (Liquid Intelligence) measured hard-shaken drinks gaining water equal to about 50–60% of their starting volume. Large, dense ice melts slower.","Balance: strong (spirit) + sweet (syrup, liqueur) + sour (citrus) + bitter/aromatic (bitters, vermouth).","Basic syrups: simple syrup 1:1 sugar:water; rich simple 2:1; honey syrup; agave syrup; grenadine (pomegranate); orgeat (almond). Use fresh citrus only.","Tools: jigger, Boston shaker (tin on tin) or cobbler shaker, Hawthorne strainer, julep strainer, fine-mesh strainer (double strain), bar spoon, muddler. Glassware: coupe, Nick & Nora, martini, rocks (old fashioned), double rocks, highball, Collins, copper mug, flute."],"c":[["Never shake what?","Carbonated ingredients — build or top them."],["What is a dry shake?","Shaking egg white without ice first to build foam, then with ice."],["Simple syrup ratio?","1:1 sugar:water (rich = 2:1)."],["What is orgeat?","Almond syrup (Mai Tai)."],["Why double strain?","Fine strainer removes ice chips and pulp for a smooth texture."],["Why is dilution important?","Water from ice balances strength and opens flavor; ~20–30%."]],"q":[["A Whiskey Sour with egg comes out thin with no foam. Most likely mistake:","It skipped the dry shake (or the reverse dry shake)","It was shaken too long","It used fresh lemon","It was double strained","Shaking without ice first is what builds the foam."],["Your Daiquiri is too tart. The smallest fix that keeps it a Daiquiri:","Add about ¼ oz simple","Add ½ oz Cointreau","Swap lime for lemon","Stir it instead","Small adjustments to the sweetener keep the template."],["Which of these drinks should be stirred?","A Hanky Panky","A Clover Club","A Corpse Reviver #2","A Bee's Knees","All spirit and fortified wine: gin, sweet vermouth, Fernet. No citrus or egg."],["Rich simple (2:1) in place of 1:1 simple, same ¾ oz pour. The drink will be:","Sweeter and silkier, so you'd pour less","Exactly the same","Less sweet","More diluted","2:1 carries more sugar per ounce, so recipes using it call for less."],["A shaken Martini tastes fine but looks cloudy with ice chips. Why?","Shaking aerates and breaks ice into the drink","The vermouth went bad","The gin was cold","Too much vermouth","Stirring keeps it clear and silky; shaking clouds it."],["Why does a stirred drink finish stronger than a shaken sour?","Stirring adds less water","Stirred drinks use more spirit by law","Shaken drinks lose alcohol to air","Ice in a mixing glass melts slower than air","Shaking dilutes more and faster."],["Classic Manhattan spec:","2 oz rye · 1 oz sweet vermouth · 2 dashes Angostura","1½ oz rye · 1½ oz sweet vermouth · 2 dashes Angostura","2 oz rye · 1 oz dry vermouth · 2 dashes orange bitters","2 oz bourbon · ½ oz sweet vermouth · 1 dash Peychaud's","2 : 1 with Angostura is the classic."],["A guest sends back a Margarita as 'watery.' Most likely cause:","Wet, half-melted ice or an over-long shake","Too much Cointreau","Fresh lime instead of bottled","A salted rim","Fresh, dry ice and a firm 10–15 second shake."]],"pro":[["Your Whiskey Sour with egg white comes out thin, with a sad layer of bubbles.","Foam needs the egg proteins unfolded and whipped before ice gets cold and diluted. Either the dry shake was skipped or too short, or the egg was old. A reverse dry shake (ice first, strain, shake again without ice) gives an even denser foam.","Remake it: dry shake hard for 10 seconds, add ice, shake 10–12 more, strain, let it settle 20 seconds, then dot Angostura on the foam."],["A guest asks why your Manhattan tastes 'smoother' than the one they had last week.","The likely differences: fresh refrigerated vermouth, the right dilution (stirred about 20–30 seconds on dry ice) and a chilled glass. Under-stirred drinks taste hot; oxidized vermouth tastes flat.","'We keep our vermouth cold and fresh, and we stir it until it's properly diluted. That's what takes the edge off.'"],["A new bartender asks, 'Why do we use fresh citrus every day? Bottled is easier.'","Fresh lime and lemon lose bright aromatics within hours and go flat or bitter within a day or two. Bottled juice is pasteurized and tastes cooked. Since citrus is up to a third of a sour, it changes the whole drink.","'Juice is a third of a sour. Bottled tastes cooked and fresh fades fast, so we squeeze daily and toss what's left.'"]]},{"id":"c2","track":"Cocktails","title":"Old Fashioned Family","k":["Template: spirit + sugar + bitters (+ water/ice). This is the original definition of a 'cocktail' from the early 1800s.","Old Fashioned: 2 oz bourbon or rye, 1 sugar cube or ¼ oz simple syrup, 2–3 dashes Angostura bitters. Stir with ice, serve in a rocks glass over a large cube, garnish with an expressed orange peel.","Sazerac (New Orleans): 2 oz rye (often said to have been made with Cognac originally, though drink historians debate it), 1 sugar cube or ¼ oz simple, 3–4 dashes Peychaud's bitters. Rinse the glass with absinthe, stir, serve up with no ice in a chilled rocks glass. Express a lemon peel and discard it (or garnish).","Oaxaca Old Fashioned: reposado tequila + mezcal, agave syrup, Angostura, flamed orange peel.","Rum Old Fashioned and other variations swap the base spirit and sweetener: aged rum, demerara syrup, maple, honey.","Expressing a peel means squeezing the citrus oils over the drink's surface for aroma.","Wisconsin-style 'Brandy Old Fashioned' is muddled with fruit and topped with soda. Know that regional versions exist."],"c":[["Old Fashioned template?","Spirit + sugar + bitters."],["Old Fashioned spec?","2 oz bourbon/rye, ¼ oz simple (or sugar cube), 2–3 dashes Angostura, stirred, rocks, orange peel."],["Sazerac spec?","2 oz rye, ¼ oz simple/sugar cube, 3–4 dashes Peychaud's, absinthe rinse, stirred, served up in rocks glass, lemon peel."],["Sazerac's city?","New Orleans."],["Sazerac's bitters?","Peychaud's."],["Oaxaca Old Fashioned?","Reposado tequila + mezcal, agave, Angostura, flamed orange peel."],["What does expressing a peel do?","Sprays citrus oils over the drink for aroma."]],"q":[["Spec me a Sazerac.","2 oz rye · ¼ oz simple · 3–4 Peychaud's · absinthe rinse · stirred, no ice, lemon peel","2 oz rye · ¼ oz simple · 2 Angostura · absinthe float · over a big cube, orange peel","2 oz Cognac · ½ oz simple · 2 Peychaud's · shaken, coupe, lemon twist","2 oz bourbon · ¼ oz simple · 3 Peychaud's · absinthe rinse · over ice, cherry","Rinsed, chilled rocks glass, no ice, Peychaud's, lemon oils."],["A guest wants an Old Fashioned 'like it's made in Wisconsin.' You:","Make a brandy Old Fashioned muddled with fruit and topped with soda","Use rye and a big cube","Use Scotch and honey","Serve it up in a coupe","Wisconsin-style is brandy, muddled fruit, soda top (sweet or sour)."],["An Oaxaca Old Fashioned's base:","Reposado tequila with a little mezcal","Mezcal with a little blanco tequila","Añejo tequila only","Blanco tequila with Islay Scotch","1½ oz reposado, ½ oz mezcal, agave, Angostura, flamed orange."],["A guest wants a rum Old Fashioned. The best sweetener choice:","Demerara syrup","Honey-ginger syrup","Orgeat","Grenadine","Demerara's molasses notes suit aged rum."],["An Old Fashioned tastes sharp and hot. The bartender used 2 oz overproof bourbon and 1 dash of bitters. Best fix:","Stir longer for more dilution and add a dash of bitters","Add ½ oz lemon","Shake it","Top with soda","More dilution tames heat; bitters knit the flavors."],["What separates a Sazerac from an Old Fashioned?","Absinthe rinse, Peychaud's, served with no ice","A sugar cube and an orange peel","Cognac and a cherry","Shaken, not stirred","Same template, different execution."],["A Toronto is an Old Fashioned built with:","Rye and Fernet-Branca","Bourbon and Campari","Rye and Bénédictine","Canadian whisky and maple","2 oz rye, ¼ oz Fernet, ¼ oz simple, Angostura."],["Express the lemon over a Sazerac, then:","Discard it or garnish; both are accepted","Drop it in and muddle","Flame it","Always keep it out of sight and never mention it","Classic practice discards it; many bars garnish."]],"pro":[["A guest orders an Old Fashioned and asks you to 'muddle the fruit like my grandpa did.'","That's the Wisconsin or mid-century style: muddled orange and cherry, sugar, bitters, often brandy, sometimes topped with soda. It's a real regional tradition, not a mistake. Make what they asked for, well.","Muddle orange and a cherry with sugar and bitters, build with their spirit, top with a splash of soda if they want it 'sweet' or 'sour' style. No lecture."],["You're asked why a Sazerac is served without ice.","It's built to be sipped cold and strong from a chilled, absinthe-rinsed glass. Ice would keep diluting it and dull the absinthe aroma that hits the nose first.","'It's stirred cold and served neat so the absinthe and lemon oils hit you first, and it doesn't keep watering down.'"],["A guest wants an Old Fashioned 'with tequila.'","Use the Old Fashioned template: spirit, sugar, bitters. The best-known version is the Oaxaca Old Fashioned: reposado plus a little mezcal, agave syrup instead of simple, Angostura, flamed orange peel.","'Let me make you an Oaxaca Old Fashioned: reposado tequila with a touch of mezcal, agave and bitters. It's a modern classic from Death & Co.'"]]},{"id":"c3","track":"Cocktails","title":"Martini & Manhattan Family","k":["Template: spirit + aromatized wine (vermouth) ± bitters or liqueur. Always stirred.","Martini: 2½ oz gin, ½ oz dry vermouth, optional dash of orange bitters. Stir, serve up, garnish with a lemon twist or olive. 'Dry' means less vermouth, 'wet' means more, 'dirty' adds olive brine. A 50/50 Martini is equal parts. A vodka martini uses vodka.","Gibson: a Martini garnished with a cocktail onion. Vesper: gin, vodka and Lillet Blanc, shaken (made famous by James Bond).","Manhattan: 2 oz rye (or bourbon), 1 oz sweet vermouth, 2 dashes Angostura. Stir, serve up, garnish with a cherry. Perfect Manhattan splits the vermouth: ½ sweet and ½ dry.","Rob Roy: a Manhattan made with Scotch.","Negroni: 1 oz gin, 1 oz Campari, 1 oz sweet vermouth. Stir, serve over ice in a rocks glass, garnish with an orange peel.","Boulevardier: a Negroni with bourbon or rye instead of gin (often 1¼–1½ oz whiskey). Americano: Campari + sweet vermouth topped with soda. Negroni Sbagliato: Campari + sweet vermouth + prosecco.","Martinez: an ancestor of the Martini. Old Tom gin, sweet vermouth, maraschino liqueur, bitters."],"c":[["Classic Martini spec?","2½ oz gin, ½ oz dry vermouth, (orange bitters), stirred, up, lemon twist or olive."],["Dirty Martini?","Adds olive brine."],["Gibson?","Martini with a cocktail onion."],["Manhattan spec?","2 oz rye, 1 oz sweet vermouth, 2 dashes Angostura, stirred, up, cherry."],["Perfect Manhattan?","Splits vermouth: half sweet, half dry."],["Rob Roy?","Manhattan with Scotch."],["Negroni spec?","1:1:1 gin, Campari, sweet vermouth; stirred, rocks, orange peel."],["Boulevardier?","Negroni with bourbon/rye instead of gin."],["Americano?","Campari + sweet vermouth + soda."],["Vesper?","Gin, vodka, Lillet Blanc — shaken."]],"q":[["A guest orders a 'Perfect Rob Roy.' You make:","Scotch with half sweet, half dry vermouth, Angostura","Scotch with sweet vermouth and an extra dash of bitters","Rye with half sweet, half dry vermouth","Scotch with dry vermouth only","Rob Roy = Scotch Manhattan; perfect = split vermouth."],["A guest wants a 'reverse Martini.' You make:","More vermouth than gin","A Martini shaken","A vodka Martini","A Martini with no vermouth","Reverse = vermouth-heavy, often 2:1 vermouth to gin."],["Spec me a Boulevardier.","1¼–1½ oz bourbon · 1 oz Campari · 1 oz sweet vermouth · stirred","1 oz bourbon · 1 oz Aperol · 1 oz sweet vermouth · stirred","1½ oz rye · ¾ oz Campari · ¾ oz dry vermouth · stirred","1 oz bourbon · 1 oz Campari · 1 oz sweet vermouth · shaken","The whiskey Negroni; the Old Pal is the rye/dry vermouth cousin."],["The Old Pal differs from a Boulevardier by:","Dry vermouth instead of sweet (with rye)","Aperol instead of Campari","Gin instead of whiskey","Being shaken","Rye, dry vermouth, Campari."],["A Vesper calls for:","Gin, vodka and Lillet Blanc","Gin, dry vermouth and orange bitters","Vodka, Lillet Rouge and Campari","Gin, Cocchi Americano and absinthe","3 oz gin, 1 oz vodka, ½ oz Lillet Blanc."],["A guest wants a Negroni 'but bubbly and lighter.' You suggest:","A Negroni Sbagliato","An Old Pal","A Boulevardier","A Kingston Negroni","Campari, sweet vermouth, topped with prosecco instead of gin."],["A Martinez is closest to:","A sweeter Martini ancestor with Old Tom gin, sweet vermouth and maraschino","A Manhattan with gin and dry vermouth","A shaken Martini with lemon","A Negroni with maraschino","It sits between the Manhattan and the Martini historically."],["A 'dirty, extra dry' vodka Martini means:","Vodka, very little vermouth, olive brine","Vodka, extra vermouth, olive brine","Gin, no vermouth, olive","Vodka, dry vermouth, onion","Dirty adds brine; extra dry means barely any vermouth."]],"pro":[["A guest orders a Martini and says nothing else.","A Martini has variables: gin or vodka, dry to wet, olive or twist, up or rocks. At a craft bar, ask one or two quick questions rather than guess.","'Gin or vodka? And olive or a twist?' If they shrug, make the house spec: 2½ oz gin, ½ oz dry vermouth, orange bitters, lemon twist."],["Your Negroni tastes flat and syrupy.","Two suspects: old, warm sweet vermouth that's oxidized, or under-dilution. Taste the vermouth on its own. If it's stale, replace it and remake.","Taste the vermouth. If it's dull, open a fresh bottle, remake, and put the open one in the fridge."],["A guest likes Negronis but wants 'something new in the same world.'","Use the family: Boulevardier (whiskey), Old Pal (rye, dry vermouth), Negroni Sbagliato (prosecco), Mezcal Negroni, or a White Negroni (gin, Suze, Lillet).","'If you like the bitterness, try a Boulevardier with bourbon for something richer, or a Mezcal Negroni for smoke.'"]]},{"id":"c4","track":"Cocktails","title":"The Sour Family","k":["Template: spirit + citrus + sweetener. A reliable starting ratio is 2 : ¾–1 : ¾ (spirit : citrus : syrup). Always shaken.","Daiquiri: 2 oz white rum, 1 oz lime, ¾ oz simple. Shake, serve up in a coupe.","Margarita: 2 oz blanco tequila, 1 oz lime, ¾ oz orange liqueur (Cointreau). Shake, salt rim optional, served up or on the rocks. Tommy's Margarita: agave syrup instead of orange liqueur.","Whiskey Sour: 2 oz bourbon, ¾ oz lemon, ¾ oz simple, optional egg white (dry shake). Angostura drops on top.","Pisco Sour: 2 oz pisco, 1 oz lime, ¾ oz simple, egg white, Angostura drops on the foam.","Gimlet: 2 oz gin, ¾ oz lime, ¾ oz simple (or lime cordial).","Sidecar: 2 oz Cognac, ¾ oz Cointreau, ¾ oz lemon, optional sugar rim. Its 'daisy' cousins (spirit + citrus + orange liqueur) include the Margarita and Cosmopolitan.","Cosmopolitan: 1½ oz citrus vodka, ½ oz Cointreau, ½ oz lime, 1 oz cranberry. Lemon Drop: vodka, lemon, simple or triple sec, sugar rim. Clover Club: gin, lemon, raspberry syrup, egg white. Amaretto Sour, Bee's Knees (gin, lemon, honey), Gold Rush (bourbon, lemon, honey), Penicillin (Scotch, lemon, honey-ginger, Islay float)."],"c":[["Sour template and ratio?","Spirit + citrus + sweet; ~2 : ¾–1 : ¾."],["Daiquiri spec?","2 oz white rum, 1 oz lime, ¾ oz simple, shaken, coupe."],["Margarita spec?","2 oz tequila, 1 oz lime, ¾ oz Cointreau, shaken."],["Tommy's Margarita?","Tequila, lime, agave syrup — no orange liqueur."],["Whiskey Sour spec?","2 oz bourbon, ¾ lemon, ¾ simple, optional egg white."],["Pisco Sour?","2 oz pisco, 1 lime, ¾ simple, egg white, Angostura drops."],["Sidecar?","2 oz Cognac, ¾ Cointreau, ¾ lemon, sugar rim optional."],["Cosmopolitan?","1½ oz citrus vodka, ½ Cointreau, ½ lime, 1 oz cranberry."],["Bee's Knees?","Gin, lemon, honey syrup."],["Penicillin?","Blended Scotch, lemon, honey-ginger syrup, Islay Scotch float."]],"q":[["Spec me a Pisco Sour.","2 oz pisco · 1 oz lime · ¾ oz simple · egg white · Angostura drops","2 oz pisco · ¾ oz lemon · ¾ oz simple · no egg · orange twist","2 oz pisco · 1 oz lime · ¾ oz orgeat · egg white · nutmeg","1½ oz pisco · ½ oz lime · ½ oz Cointreau · egg white · Peychaud's","Dry shake, shake, coupe, bitters on the foam."],["A guest wants a Margarita with no orange liqueur. You make:","A Tommy's: tequila, lime, agave","A Paloma","A Margarita with extra lime only","A Daisy","Tommy's swaps Cointreau for agave syrup."],["Cognac, Cointreau, lemon. What family, and which drinks share it?","Daisy: also the Margarita and Cosmopolitan","Collins: also the Tom Collins and Paloma","Fizz: also the Ramos and Gin Fizz","Flip: also the Brandy Alexander","Spirit + citrus + orange liqueur = the Daisy/Sidecar line."],["A Clover Club is:","Gin, lemon, raspberry syrup, egg white","Gin, lime, grenadine, egg white","Vodka, lemon, raspberry liqueur, cream","Gin, lemon, crème de mûre over crushed ice","Many modern specs add a little dry vermouth."],["The difference between a Bee's Knees and a Gold Rush:","Gin vs. bourbon (both lemon and honey)","Lemon vs. lime","Honey vs. maple","Shaken vs. stirred","Same structure, different base."],["A Gimlet with Rose's-style cordial instead of lime and simple will taste:","Sweeter and more candied, so drop the extra syrup","Exactly the same","More sour","Diluted","Cordial is already sweet and tart; adjust."],["Your house Daiquiri is 2 : 1 : ¾. A guest says 'too sour.' Best adjusted spec:","2 oz rum · ¾ oz lime · ¾ oz simple","2 oz rum · 1 oz lime · ½ oz simple","1½ oz rum · 1 oz lime · ¾ oz simple","2 oz rum · 1¼ oz lime · ¾ oz simple","Pull the citrus to balance against the same sugar."],["A Cosmopolitan's spec:","1½ oz citrus vodka · ½ oz Cointreau · ½ oz lime · 1 oz cranberry","2 oz vodka · 1 oz lime · ¾ oz simple · splash cranberry","1½ oz vodka · 1 oz triple sec · 1 oz lemon · ½ oz cranberry","1 oz citrus vodka · 1 oz Cointreau · 1 oz lime · 1 oz cranberry","A Daisy with cranberry for color and fruit."]],"pro":[["A guest says your Margarita is 'too strong.'","Check the build first: 2 oz tequila, 1 oz lime, ¾ oz Cointreau. If it's right, they want it softer. Add a touch more sweetener and dilution, or offer it on the rocks or as a Tommy's.","'Let me adjust it for you,' then remake with a little more sweetness and a slightly longer shake, served on fresh ice."],["You're out of Cointreau mid-service and a ticket calls for a Sidecar.","A Sidecar is a Daisy: spirit, citrus, orange liqueur. Another orange liqueur (dry curaçao or Grand Marnier) keeps the template. Grand Marnier is richer and Cognac-based, so taste and adjust the lemon.","Swap in dry curaçao or Grand Marnier, taste, and tell the guest if your bar's policy calls for it."],["A guest asks the difference between a Gimlet and a Daiquiri.","Same template (spirit, lime, sugar). The base changes: gin vs. rum. The classic Gimlet was made with lime cordial, which is sweeter and more candied.","'Same structure, different spirit: a Gimlet is gin, lime and sugar, a Daiquiri is rum. Old-school Gimlets used lime cordial.'"]]},{"id":"c5","track":"Cocktails","title":"Highballs, Collins & Fizzes","k":["Highball template: spirit + a larger amount of carbonated mixer, built over ice in a tall glass. Usually about 1½–2 oz spirit to 4–6 oz mixer.","Classics: Gin & Tonic; Whisky Highball (Japanese style is very cold, with lots of carbonation); Cuba Lib
